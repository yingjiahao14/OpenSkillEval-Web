<link rel="stylesheet" href="../css/style.css?v=33">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">OpenSkillEval</a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../leaderboard.html">Leaderboard</a>
      <a href="index.html">Showcase</a>
      <a href="../about.html">About</a>

    <button class="nav-hamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>
</nav>
<main class="container" style="padding-top:100px;padding-bottom:80px">
  <a href="index.html" class="back-btn" id="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back
  </a>
  <h1 class="page-title" id="page-title">Loading...</h1>
  <div id="case-content">
    <p class="loading">Loading case data...</p>
  </div>
</main>
<div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
  <img id="lightbox-img" src="" alt="Full size">
</div>
<script src="../js/main.js?v=12"></script>
<script src="js/trajectory-viewer.js?v=1"></script>
<script>
// Read query params and set data attributes for showcase-case.js
(function() {
  var params = new URLSearchParams(window.location.search);
  var task = params.get("task");
  var caseId = params.get("case");
  if (!task || !caseId) {
    document.getElementById("case-content").innerHTML = '<p style="color:red">Missing URL parameters. Required: ?task=...&case=...</p>';
    return;
  }
  var container = document.getElementById("case-content");
  container.dataset.task = task;
  container.dataset.case = caseId;
  container.dataset.src = "data/" + task + "/" + caseId + ".json";

  var backBtn = document.getElementById("back-btn");
  backBtn.href = "index.html?filter=" + task;
  backBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to ' + task.replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });

  // GA: case-aware page_view with case in title for cleaner reports
  if (typeof gtag === "function") {
    gtag('event', 'page_view', {
      page_title: 'Case · ' + caseId + ' (' + task + ') | OpenSkillEval',
      page_path: '/showcase/' + task + '/' + caseId
    });
  }

  var s = document.createElement("script");
  s.src = "js/showcase-case.js?v=" + Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
