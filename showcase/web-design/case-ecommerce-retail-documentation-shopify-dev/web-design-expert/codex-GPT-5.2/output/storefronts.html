<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storefronts · CommerceForge Dev Docs</title>
    <meta name="description" content="Build storefronts with themes, headless APIs, Hydrogen/Oxygen tooling, mobile SDKs, and platform extension points." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="storefronts">
    <div id="app"></div>

                <div>
                  <div class="badge"><span class="dot" style="background: var(--accent);"></span> Storefronts</div>

                  <p class="lead">Choose managed themes for speed, or go headless with composable APIs and Hydrogen. Build mobile experiences with SDKs and embed commerce anywhere.</p>
                  <div class="cta-row">
                    <a class="btn btn-primary" href="#headless-apis">Explore headless APIs →</a>
                    <a class="btn" href="index.html#cli-setup">CLI quick-start</a>

                </div>

                <div class="panel">
                  <div class="meta">
                    <h2>Paths to ship</h2>
                    <span class="kbd">Themes / Headless</span>
                  </div>
                  <div class="panel-inner">
                    <div class="subgrid">
                      <div class="mini"><strong>Themes</strong><p>Liquid + sections + blocks. Great for rapid iteration and distribution.</p></div>
                      <div class="mini"><strong>Headless</strong><p>Hydrogen + Storefront API for full control and performance.</p></div>
                      <div class="mini"><strong>Mobile</strong><p>SDKs + Checkout Kit for native conversion.</p></div>
                      <div class="mini"><strong>Extensions</strong><p>Customize customer accounts and checkout with UI extensions.</p></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

            <div class="container">
              <h2>Themes</h2>
              <p class="subtitle">A managed path to production storefronts with a familiar workflow: Liquid templates, composable sections, and merchant-friendly customization.</p>
              <div class="subgrid">
                <div class="callout">
                  <h3>Theme development</h3>
                  <p>Build with HTML/CSS/JS and a templating language that keeps content editable. Define blocks/sections so merchants can iterate safely.</p>
                  <div class="note">Ideal for: Theme Store distribution, fast merchant adoption.</div>
                </div>
                <div class="callout">
                  <h3>Theme app extensions</h3>
                  <p>Augment storefronts with app-powered components that merchants can add without touching code.</p>
                  <div class="note">Ship upgrades without theme merges.</div>
                </div>
              </div>
            </div>
          </section>

            <div class="container">
              <h2>Theming system</h2>
              <p class="subtitle">Composable sections and blocks let merchants change layout and content without redeploying code. Keep defaults polished, and make customization safe.</p>

                <div class="meta">
                  <h2>Example: section schema shape</h2>
                  <span class="kbd">JSON</span>
                </div>
                <div class="code">
                  <pre><code>{
  "name": "Hero",
  "settings": [
    { "type": "text", "id": "title", "label": "Title" },
    { "type": "url", "id": "cta_link", "label": "CTA link" }
  ],
  "blocks": [
    { "type": "badge", "name": "Badge" }
  ]
}</code></pre>
                </div>
                <div class="panel-inner">
                  <div class="muted">Use a simple schema to make customization safe and predictable.</div>
                </div>
              </div>

              <p class="subtitle">Full-stack control with advanced commerce APIs. Go headless with composable APIs or use Hydrogen, the official headless framework.</p>

                  <div class="badge"><span class="dot"></span> API</div>

                  <p>Build native shopping experiences with SDKs for Android and iOS.</p>

                </div>
              </div>
            </div>
          </section>

          <section class="section" id="platform-extensions">
            <div class="container">
              <h2>Platform extensions</h2>
              <p class="subtitle">Extend key customer flows with UI extensions for accounts and checkout.</p>
              <div class="subgrid">
                <div class="mini"><strong>Customer Account extensions</strong><p>Add custom functionality to the customer account experience.</p></div>
                <div class="mini"><strong>Checkout UI extensions</strong><p>Customize the world's best-performing checkout.</p></div>
              </div>
            </div>
          </section>
        </main>
