<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps · CommerceForge Dev Docs</title>
    <meta name="description" content="Build apps for CommerceForge: dev tools, surfaces, building blocks, use cases, and best practices." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="apps-build">
    <div id="app"></div>

    <script src="assets/shared.js"></script>
    <script src="assets/components.js"></script>
    <script>
      const side = [
        { id: 'hero', label: 'Overview', href: '#hero', icon: '▣' },
        { id: 'dev-tools', label: 'Dev tools', href: '#dev-tools', icon: '⌁' },
        { id: 'surfaces-grid', label: 'App surfaces', href: '#surfaces-grid', icon: '◫' },
        { id: 'building-blocks', label: 'Building blocks', href: '#building-blocks', icon: '⧉' },
        { id: 'use-cases', label: 'Use cases', href: '#use-cases', icon: '✦' },
        { id: 'best-practices', label: 'Best practices', href: '#best-practices', icon: '✓' },
      ];

      function sidebarLinks() {
        return side
          .map(
            (s) => `
              <a class="side-link" href="${s.href}" data-side-link>
                <span style="display:flex; gap:10px; align-items:center;">
                  <span class="kbd" aria-hidden="true">${s.icon}</span>
                  <span class="side-label">${s.label}</span>
                </span>
              </a>
            `,
          )
          .join('');
      }

      document.getElementById('app').innerHTML = `
        ${cfTopbar('apps-build')}

        <main id="content" class="container" style="padding-top: var(--space-5);">
          <div class="docs-wrap" data-docs-wrap data-sidebar="expanded">
            <div class="docs">
              <aside class="sidebar" aria-label="On this page">
                <div class="sidebar-head">
                  <strong>Apps</strong>
                  <button class="btn btn-ghost" type="button" data-sidebar-toggle aria-pressed="false">Collapse sidebar</button>
                </div>
                <nav>${sidebarLinks()}</nav>
              </aside>

              <article class="doc-main">
                <div class="doc-inner">
                  <section id="hero">
                    <div class="badge"><span class="dot" style="background: var(--accent-2);"></span> Apps</div>
                    <h1>Build apps for CommerceForge</h1>
                    <p>Build across every surface from a single app. All UI surfaces share Polaris, CommerceForge's unified design system. Use APIs, webhooks, and Functions to customize backend behavior and deliver fast, native-feeling experiences.</p>
                    <div class="pill-row" style="margin-top: 14px;">
                      <a class="btn btn-primary" href="#building-blocks">Jump to building blocks</a>
                      <a class="btn" href="index.html#cli-setup">CLI quick-start</a>
                    </div>
                  </section>

                  <section class="section" id="dev-tools">
                    <h2>Dev tools</h2>
                    <p class="subtitle">Start fast with the CLI, then iterate with an extension-first workflow that keeps UI, backend logic, and auth in sync.</p>
                    <div class="subgrid">
                      <div class="mini">
                        <strong>CommerceForge CLI</strong>
                        <p>Scaffold projects, run local dev, and manage extension environments.</p>
                      </div>
                      <div class="mini">
                        <strong>Polaris + App Bridge</strong>
                        <p>Build UI that matches native admin patterns and navigation.</p>
                      </div>
                      <div class="mini">
                        <strong>Functions</strong>
                        <p>Move business logic closer to checkout with high-performance primitives.</p>
                      </div>
                      <div class="mini">
                        <strong>Webhooks</strong>
                        <p>React to store events and keep your systems synchronized.</p>
                      </div>
                    </div>
                    <div class="note" style="margin-top:12px;">Tip: keep your auth scopes minimal and expand only when needed.</div>
                  </section>

                  <section class="section" id="surfaces-grid">
                    <h2>App surfaces</h2>
                    <p class="subtitle">Ship once, extend everywhere. Pick the surfaces that match your workflow and distribution strategy.</p>
                    <div class="list-grid" aria-label="App Surfaces">
                      <div class="mini"><strong>App Home</strong><p>Build your app's main interface in the admin with Polaris web components and App Bridge.</p></div>
                      <div class="mini"><strong>Admin</strong><p>Add actions, blocks, and print functionality to resource pages in the admin.</p></div>
                      <div class="mini"><strong>Checkout</strong><p>Customize the checkout experience with UI extensions and backend logic.</p></div>
                      <div class="mini"><strong>Customer accounts</strong><p>Extend order status pages and the logged-in customer experience.</p></div>
                      <div class="mini"><strong>Flow</strong><p>Integrate triggers, actions, and templates into the automation platform.</p></div>
                      <div class="mini"><strong>Online store</strong><p>Add dynamic functionality to merchants' storefront themes.</p></div>
                    </div>
                  </section>

                  <section class="section" id="building-blocks">
                    <h2>Building blocks</h2>
                    <p class="subtitle">Read and write store data with APIs, react to events with webhooks, and customize backend behavior with Functions.</p>
                    <div class="list-grid" aria-label="Building Blocks">
                      <div class="mini"><strong>GraphQL</strong><p>Query and mutate products, customers, orders, inventory, and more.</p></div>
                      <div class="mini"><strong>Extensions</strong><p>Add your app's functionality to user interfaces with app extensions.</p></div>
                      <div class="mini"><strong>Functions</strong><p>Customize backend logic for discounts, payments, delivery, and cart validation.</p></div>
                      <div class="mini"><strong>Webhooks</strong><p>Subscribe to store events and trigger your own logic in real time.</p></div>
                      <div class="mini"><strong>Metafields</strong><p>Extend resources with custom fields and validation rules.</p></div>
                      <div class="mini"><strong>Authentication</strong><p>Authenticate with CommerceForge and manage access scopes for your app.</p></div>
                    </div>

                    <div class="panel" style="margin-top: var(--space-4);">
                      <div class="meta">
                        <h2>Example: GraphQL query shape</h2>
                        <span class="kbd">copy/paste</span>
                      </div>
                      <div class="code">
                        <pre><code>query Products($first: Int!) {
  products(first: $first) {
    edges {
      node {
        id
        title
        handle
      }
    }
  }
}</code></pre>
                      </div>
                      <div class="panel-inner">
                        <div class="muted">Use GraphQL to fetch and mutate commerce primitives with predictable schemas.</div>
                      </div>
                    </div>
                  </section>

                  <section class="section" id="use-cases">
                    <h2>Use cases</h2>
                    <p class="subtitle">Integrate with dedicated APIs for specific commerce workflows.</p>
                    <div class="list-grid" aria-label="Use Cases">
                      <div class="mini"><strong>Marketing and analytics</strong><p>Track customer behavior with web pixels and manage marketing activities.</p></div>
                      <div class="mini"><strong>Discounts</strong><p>Customize promotions with discount primitives and validation.</p></div>
                      <div class="mini"><strong>Product merchandising</strong><p>Create upsells, bundles, and recommendations with catalog access.</p></div>
                      <div class="mini"><strong>Orders and fulfillment</strong><p>Automate lifecycle updates, tracking, and post-purchase flows.</p></div>
                      <div class="mini"><strong>Payments</strong><p>Build payment experiences and connect payment providers.</p></div>
                      <div class="mini"><strong>B2B</strong><p>Support company profiles, purchasing rules, and negotiated pricing.</p></div>
                    </div>
                  </section>

                  <section class="section" id="best-practices">
                    <h2>Best practices</h2>
                    <p class="subtitle">A few principles that keep apps fast, safe, and easy to maintain.</p>
                    <div class="subgrid">
                      <div class="callout">
                        <h3>Design for scannability</h3>
                        <p>Prefer small modules, named operations, and clear error boundaries. Developers should understand behavior in under a minute.</p>
                        <div class="note">Keep examples runnable and focused: one concept per snippet.</div>
                      </div>
                      <div class="callout">
                        <h3>Least-privilege auth</h3>
                        <p>Start with minimal scopes. Add capabilities only when your app needs them, and document exactly why.</p>
                        <div class="note">Treat tokens as secrets; rotate regularly.</div>
                      </div>
                      <div class="callout">
                        <h3>Event-driven sync</h3>
                        <p>Use webhooks for state changes. Build idempotent handlers and replay-safe processing.</p>
                        <div class="note">Persist webhook delivery IDs to dedupe.</div>
                      </div>
                      <div class="callout">
                        <h3>Performance where it matters</h3>
                        <p>Move critical checkout logic into Functions. Optimize network calls with batching and caching.</p>
                        <div class="note">Measure latency in real stores, not just locally.</div>
                      </div>
                    </div>
                  </section>
                </div>
              </article>
            </div>
          </div>
        </main>

        ${cfFooter()}
        ${cfAssistantModal()}
      `;
    </script>
    <script src="assets/main.js"></script>
  </body>
</html>
