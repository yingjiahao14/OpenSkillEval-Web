<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents · CommerceForge Dev Docs</title>
    <meta name="description" content="Build agentic commerce experiences with Universal Commerce Protocol (UCP) and CommerceForge MCP servers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="agents">
    <div id="app"></div>

    <script src="assets/shared.js"></script>
    <script src="assets/components.js"></script>
    <script>
      const side = [
        { id: 'hero', label: 'Overview', href: '#hero', icon: '▣' },
        { id: 'protocol-overview', label: 'UCP overview', href: '#protocol-overview', icon: '⟡' },
        { id: 'how-it-works', label: 'How it works', href: '#how-it-works', icon: '⇄' },
        { id: 'product-discovery', label: 'Discovery', href: '#product-discovery', icon: '⌕' },
        { id: 'checkout-flow', label: 'Checkout', href: '#checkout-flow', icon: '$' },
      ];

      function sidebarLinks() {
        return side
          .map(
            (s) => `
              <a class="side-link" href="${s.href}" data-side-link>
                <span style="display:flex; gap:10px; align-items:center;">
                  <span class="kbd" aria-hidden="true">${s.icon}</span>
                  <span class="side-label">${s.label}</span>
                </span>
              </a>
            `,
          )
          .join('');
      }

      document.getElementById('app').innerHTML = `
        ${cfTopbar('agents')}

        <main id="content" class="container" style="padding-top: var(--space-5);">
          <div class="docs-wrap" data-docs-wrap data-sidebar="expanded">
            <div class="docs">
              <aside class="sidebar" aria-label="On this page">
                <div class="sidebar-head">
                  <strong>Agents</strong>
                  <button class="btn btn-ghost" type="button" data-sidebar-toggle aria-pressed="false">Collapse sidebar</button>
                </div>
                <nav>${sidebarLinks()}</nav>
              </aside>

              <article class="doc-main">
                <div class="doc-inner">
                  <section id="hero">
                    <div class="badge"><span class="dot" style="background: oklch(76% 0.18 145);"></span> Agentic commerce</div>
                    <h1>Agentic commerce has arrived</h1>
                    <p>Build unified agentic experiences that securely act on behalf of users by leveraging Universal Commerce Protocol (UCP) with CommerceForge MCP servers.</p>
                    <div class="pill-row" style="margin-top: 14px;">
                      <a class="btn btn-primary" href="#protocol-overview">Start building</a>
                      <a class="btn" href="index.html#cli-setup">Install CLI</a>
                    </div>
                    <div class="note" style="margin-top: 14px;">CTA: Authenticate, search the Catalog, and refer buyers to checkout for attribution.</div>
                  </section>

                  <section class="section" id="protocol-overview">
                    <h2>Protocol overview</h2>
                    <p class="subtitle">The Universal Commerce Protocol (UCP) is an open standard that establishes a common language and a set of primitives that allow agents, merchants, Payment Service Providers (PSPs), and Credential Providers (CPs) to communicate consistently and securely across the web. CommerceForge provides MCP tools that are UCP-compliant to build with this interoperable and extensible protocol.</p>

                    <div class="panel">
                      <div class="meta">
                        <h2>Protocol actors</h2>
                        <span class="kbd">UCP</span>
                      </div>
                      <div class="panel-inner">
                        <div class="list-grid" aria-label="Protocol Actors">
                          <div class="mini"><strong>agent</strong><p>Platforms, agents, and applications acting on behalf of buyers</p></div>
                          <div class="mini"><strong>merchant</strong><p>Sellers providing products and fulfillment</p></div>
                          <div class="mini"><strong>CP</strong><p>Credential Providers managing buyer identity and authentication</p></div>
                          <div class="mini"><strong>PSP</strong><p>Payment Service Providers handling payment processing</p></div>
                        </div>
                        <div class="note" style="margin-top: 12px;">Design note: treat these as “roles” in every integration diagram and log event.</div>
                      </div>
                    </div>
                  </section>

                  <section class="section" id="how-it-works">
                    <h2>How it works</h2>
                    <p class="subtitle">CommerceForge provides MCP tools that implement UCP's core capabilities.</p>
                    <div class="subgrid">
                      <div class="callout">
                        <h3>Discovery</h3>
                        <p>Search products across the platform, retrieve details, and help buyers find what they're looking for.</p>
                        <div class="note">Primary tool: Catalog MCP server.</div>
                      </div>
                      <div class="callout">
                        <h3>Checkout</h3>
                        <p>Create checkout sessions, collect buyer information, attach payment information, and direct buyers to finish purchases on merchant storefronts.</p>
                        <div class="note">Goal: secure attribution + a low-friction handoff.</div>
                      </div>
                    </div>
                  </section>

                  <section class="section" id="product-discovery">
                    <h2>Product discovery</h2>
                    <p class="subtitle">Agents can query all merchants across the CommerceForge platform, apply relevant filters, and display results buyers can interact with using the Catalog MCP server. Once buyers select a product, agentic apps can retrieve variant details needed to create checkout sessions.</p>
                    <div class="panel">
                      <div class="meta">
                        <h2>Example: discovery flow</h2>
                        <span class="kbd">pseudo</span>
                      </div>
                      <div class="code">
                        <pre><code>// 1) authenticate (CP)
// 2) query catalog
catalog.search({ query: "running shoes", filters: { size: "10" } })

// 3) hydrate product + variants
catalog.product({ handle: "air-runner" })</code></pre>
                      </div>
                    </div>
                  </section>

                  <section class="section" id="checkout-flow">
                    <h2>Checkout flow</h2>
                    <p class="subtitle">As buyers select items from the Catalog, agentic apps can create and update carts and checkouts. Apps can refer buyers directly to merchant storefronts to complete checkout. All developers with Catalog access can direct buyers through Checkout, building referral applications and advertising models by controlling marketing attribution on top of UCP.</p>
                    <div class="note">Status: Coming soon</div>
                    <div class="panel" style="margin-top: 12px;">
                      <div class="meta">
                        <h2>Example: checkout handoff</h2>
                        <span class="kbd">URL</span>
                      </div>
                      <div class="code">
                        <pre><code>// After creating a checkout session...
return {
  redirect: "https://merchant-storefront.example/checkout?ref=agent" 
}</code></pre>
                      </div>
                    </div>
                  </section>
                </div>
              </article>
            </div>
          </div>
        </main>

        ${cfFooter()}
        ${cfAssistantModal()}
      `;
    </script>
    <script src="assets/main.js"></script>
  </body>
</html>
