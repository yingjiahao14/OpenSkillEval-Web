<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CommerceForge Dev Docs</title>
    <meta name="description" content="A developer documentation hub for building apps, storefronts, and AI-powered shopping agents on CommerceForge." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="home">
    <div id="app"></div>

    <script src="assets/shared.js"></script>
    <script src="assets/components.js"></script>
    <script>
      document.getElementById('app').innerHTML = `
        ${cfTopbar('home')}

        <main id="content">
          <section class="hero">
            <div class="container">
              <div class="hero-grid">
                <div>
                  <div class="badge"><span class="dot" aria-hidden="true"></span> Docs for apps, storefronts, and agents</div>
                  <h1 class="h1">CommerceForge Dev Docs</h1>
                  <p class="lead">Learn how to build an app, or customize your storefront. Whether you're just getting started, deep in the development process, or ready to distribute and monetize your work, CommerceForge's docs, dev tools and frameworks make building easy and efficient.</p>
                  <div class="cta-row">
                    <a class="btn btn-primary" href="apps-build.html">Build your first app →</a>
                    <a class="btn" href="storefronts.html">Build a storefront →</a>
                    <a class="btn" href="agents.html">Build agents with UCP →</a>
                  </div>
                </div>

                <div class="panel" aria-label="Quick overview">
                  <div class="meta">
                    <h2>Platform overview</h2>
                    <span class="kbd">Fast navigation</span>
                  </div>
                  <div class="panel-inner">
                    <div class="subgrid">
                      <div class="mini">
                        <strong>Apps</strong>
                        <p>Admin + checkout + storefront extensions with APIs and Functions.</p>
                      </div>
                      <div class="mini">
                        <strong>Storefronts</strong>
                        <p>Themes, Hydrogen headless, mobile SDKs, and platform extensions.</p>
                      </div>
                      <div class="mini">
                        <strong>Agents</strong>
                        <p>Build UCP-ready experiences from discovery to checkout.</p>
                      </div>
                      <div class="mini">
                        <strong>Community</strong>
                        <p>Changelog, dev community, videos, and partner resources.</p>
                      </div>
                    </div>
                    <div class="note" style="margin-top:16px;">
                      Tip: Press <span class="kbd">Ctrl K</span> to open “Ask assistant”.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="section" id="product-cards">
            <div class="container">
              <h2>Product areas</h2>
              <p class="subtitle">Three pillars, purpose-built. Pick a track and ship confidently with clean docs and crisp examples.</p>
              <div class="grid3" aria-label="Product Areas">
                <article class="card">
                  <div class="badge"><span class="dot" style="background: var(--accent-2);"></span> Apps</div>
                  <h3>Apps</h3>
                  <p>Extend CommerceForge's core functionality with apps that integrate into the admin, online store, checkout and more.</p>
                  <a class="btn btn-primary" href="apps-build.html">Build your first app →</a>
                </article>
                <article class="card">
                  <div class="badge"><span class="dot" style="background: var(--accent);"></span> Storefronts</div>
                  <h3>Storefronts</h3>
                  <p>Help merchants express their unique brand by building a custom theme or Hydrogen storefront.</p>
                  <a class="btn btn-primary" href="storefronts.html">Build a storefront →</a>
                </article>
                <article class="card">
                  <div class="badge"><span class="dot" style="background: oklch(76% 0.18 145);"></span> Agents</div>
                  <h3>Agents</h3>
                  <p>Build agentic shopping experiences powered by CommerceForge merchants, from product discovery to checkout.</p>
                  <a class="btn btn-primary" href="agents.html">Build agents with UCP →</a>
                </article>
              </div>
            </div>
          </section>

          <section class="section" id="cli-setup">
            <div class="container">
              <h2>Accelerate development with CommerceForge CLI 3.0</h2>
              <p class="subtitle">Initialize new apps, themes, and headless storefronts in an instant with the latest CommerceForge CLI. A single command installs all the dependencies you need, including the CLI itself, so you can dive straight into development.</p>

              <div class="cli">
                <div class="accordion" data-accordion="cli" aria-label="CLI Setup">
                  <div class="acc-item" data-acc-item id="accordion-cli-apps">
                    <button class="acc-btn" type="button" data-acc-btn aria-expanded="true">
                      <span class="acc-title">
                        <strong>Apps</strong>
                        <span>Create and iterate on admin + checkout experiences.</span>
                      </span>
                      <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <div class="acc-panel" data-acc-panel>
                      <div class="acc-panel-inner">
                        <ol class="steps">
                          <li>Install CommerceForge CLI globally.</li>
                          <li>Navigate to the directory where you want to create your app.</li>
                          <li>Run the second command to create a new app. Your app will be added as a new subdirectory.</li>
                        </ol>
                        <div class="note" style="margin-top:12px;">Init command: <span class="kbd">commerceforge app init</span></div>
                      </div>
                    </div>
                  </div>
                  <div class="acc-item" data-acc-item id="accordion-cli-themes">
                    <button class="acc-btn" type="button" data-acc-btn aria-expanded="false">
                      <span class="acc-title">
                        <strong>Themes</strong>
                        <span>Clone a starter theme and customize blocks/sections.</span>
                      </span>
                      <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <div class="acc-panel" data-acc-panel>
                      <div class="acc-panel-inner">
                        <ol class="steps">
                          <li>Install CommerceForge CLI globally.</li>
                          <li>Navigate to the directory where you want to create your theme.</li>
                          <li>Run the second command to clone a starter theme. Your theme will be created in a new subdirectory.</li>
                        </ol>
                        <div class="note" style="margin-top:12px;">Init command: <span class="kbd">commerceforge theme init</span></div>
                      </div>
                    </div>
                  </div>
                  <div class="acc-item" data-acc-item id="accordion-cli-headless">
                    <button class="acc-btn" type="button" data-acc-btn aria-expanded="false">
                      <span class="acc-title">
                        <strong>Headless storefronts</strong>
                        <span>Initialize a Hydrogen storefront with a single command.</span>
                      </span>
                      <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <div class="acc-panel" data-acc-panel>
                      <div class="acc-panel-inner">
                        <ol class="steps">
                          <li>Install CommerceForge CLI globally.</li>
                          <li>Navigate to the directory where you want to create your Hydrogen storefront.</li>
                          <li>Run the second command to initialize a Hydrogen storefront in a new subdirectory.</li>
                        </ol>
                        <div class="note" style="margin-top:12px;">Init command: <span class="kbd">commerceforge hydrogen init</span></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="panel" data-cli-tabs>
                  <div class="meta">
                    <h2>Install the CLI</h2>
                    <span class="kbd">tabbed</span>
                  </div>
                  <div class="tabs" role="tablist" aria-label="Package manager">
                    <button class="tab" role="tab" id="tab-npm" data-tab="npm" aria-selected="true">npm</button>
                    <button class="tab" role="tab" id="tab-yarn" data-tab="yarn" aria-selected="false">yarn</button>
                    <button class="tab" role="tab" id="tab-pnpm" data-tab="pnpm" aria-selected="false">pnpm</button>
                  </div>
                  <div class="code">
                    <button class="btn copy" type="button" data-copy-btn>Copy</button>
                    <pre><code data-cli-install>npm i -g @commerceforge/cli@latest</code></pre>
                  </div>
                  <div class="panel-inner">
                    <div class="note">After installing, pick an accordion on the left to see the init command.</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="section" id="launch-cta">
            <div class="container">
              <h2>Launch and monetize</h2>
              <p class="subtitle">When you're ready, ship through official channels so merchants can find and buy your work.</p>
              <div class="subgrid">
                <div class="callout">
                  <h3>App Marketplace</h3>
                  <p>Submit your app to the CommerceForge App Marketplace so merchants can find and buy your app through search or personalized recommendations.</p>
                  <a class="btn btn-primary" href="#">See App Marketplace requirements →</a>
                </div>
                <div class="callout">
                  <h3>Theme Store</h3>
                  <p>Promote and sell your custom theme to merchants building their brands on the CommerceForge Theme Store.</p>
                  <a class="btn btn-primary" href="#">See Theme Store requirements →</a>
                </div>
              </div>
            </div>
          </section>

          <section class="section" id="community">
            <div class="container">
              <h2>Community resources</h2>
              <p class="subtitle">Get answers quickly, follow platform updates, and learn from shipping teams.</p>
              <div class="grid3" aria-label="Community Resources">
                <article class="card">
                  <h3>Dev Community →</h3>
                  <p>Q&A and advice from CommerceForge community experts</p>
                  <a class="btn" href="#">Open forum</a>
                </article>
                <article class="card">
                  <h3>Developer Changelog →</h3>
                  <p>The latest CommerceForge ecosystem updates</p>
                  <a class="btn" href="#">View updates</a>
                </article>
                <article class="card">
                  <h3>YouTube channel →</h3>
                  <p>Tips and insights in dev and design</p>
                  <a class="btn" href="#">Watch videos</a>
                </article>
                <article class="card">
                  <h3>Partners blog →</h3>
                  <p>Educational resources and product previews</p>
                  <a class="btn" href="#">Read posts</a>
                </article>
              </div>
            </div>
          </section>
        </main>

        ${cfFooter()}
        ${cfAssistantModal()}
      `;
    </script>
    <script src="assets/main.js"></script>
  </body>
</html>
