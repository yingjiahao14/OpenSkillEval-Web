<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Request A Demo | WellStream Platform</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark"></span>WellStream Platform</a><nav class="nav"><a class="nav-link" data-nav href="index.html">Home</a><div class="dropdown"><button class="dropdown-toggle">Platform ▾</button><div class="dropdown-menu"><a class="dropdown-item" data-nav href="platform-overview.html">Overview</a><a class="dropdown-item" data-nav href="security.html">Security</a><a class="dropdown-item" data-nav href="integration.html">Integration</a></div></div><a class="nav-link" data-nav href="request-demo.html">Contact</a></nav><a class="btn btn-primary" href="request-demo.html">Request A Demo</a></div></header>
<main>
<section class="section"><div class="container"><h1>Request A Demo</h1><p>See how WellStream improves data reliability, governance, and operational visibility.</p></div></section>
<section class="section"><div class="container card" style="padding:1.2rem;"><form id="demo-form" novalidate><div class="form-grid"><div class="form-field"><label for="name">Full Name</label><input id="name" name="name" data-required /><div class="error" data-error-for="name"></div></div><div class="form-field"><label for="email">Work Email</label><input id="email" name="email" type="email" data-required /><div class="error" data-error-for="email"></div></div><div class="form-field"><label for="company">Company</label><input id="company" name="company" data-required /><div class="error" data-error-for="company"></div></div><div class="form-field"><label for="role">Role</label><input id="role" name="role" data-required /><div class="error" data-error-for="role"></div></div><div class="form-field"><label for="industry">Industry</label><select id="industry" name="industry" data-required><option value="">Select an option</option><option>E&P</option><option>Midstream</option><option>Downstream</option><option>Utilities</option><option>Solar/Wind</option><option>Mining</option></select><div class="error" data-error-for="industry"></div></div><div class="form-field"><label for="timeline">Implementation Timeline</label><select id="timeline" name="timeline" data-required><option value="">Select timeline</option><option>0-3 months</option><option>3-6 months</option><option>6-12 months</option><option>12+ months</option></select><div class="error" data-error-for="timeline"></div></div></div><div class="form-field"><label for="message">What would you like to solve?</label><textarea id="message" name="message" data-required></textarea><div class="error" data-error-for="message"></div></div><button class="btn btn-primary" type="submit">Submit</button><p id="form-status" aria-live="polite"></p></form></div></section>
</main>

</body></html>
