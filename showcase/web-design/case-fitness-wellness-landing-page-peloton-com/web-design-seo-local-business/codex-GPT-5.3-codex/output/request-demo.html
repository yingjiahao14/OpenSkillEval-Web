<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Request a Demo | WellStream Platform</title><meta name="description" content="Request a live WellStream demo tailored to your operations, data architecture, and integration landscape."><link rel="stylesheet" href="styles.css"></head>
<body><header class="header"><div class="container nav"><a href="index.html" class="brand"><span class="brand-badge">W</span>WellStream Platform</a><nav class="nav-links"><a class="nav-link" href="index.html">Home</a><div class="dropdown"><a class="nav-link dropdown-toggle" href="platform-overview.html">Platform ▾</a><div class="dropdown-menu"><a href="platform-overview.html">Overview</a><a href="security.html">Security</a><a href="integration.html">Integration</a></div></div><a class="btn btn-primary" href="request-demo.html">Request A Demo</a></nav></div></header>
<main class="container section"><h1 class="h1">Request a Demo</h1><p class="subhead">Tell us about your organization and priorities. We'll tailor a walkthrough to your operational and technical goals.</p>
<section class="card p-24"><form id="demoForm" novalidate><div class="form-grid"><div class="field"><label for="firstName">First Name *</label><input id="firstName" name="firstName"/><span class="error" data-error="firstName"></span></div><div class="field"><label for="lastName">Last Name *</label><input id="lastName" name="lastName"/><span class="error" data-error="lastName"></span></div><div class="field"><label for="email">Business Email *</label><input id="email" name="email" type="email"/><span class="error" data-error="email"></span></div><div class="field"><label for="company">Company *</label><input id="company" name="company"/><span class="error" data-error="company"></span></div><div class="field"><label for="jobTitle">Job Title *</label><input id="jobTitle" name="jobTitle"/><span class="error" data-error="jobTitle"></span></div><div class="field"><label for="industry">Industry *</label><select id="industry" name="industry"><option value="">Select industry</option><option>Oil & Gas - Upstream</option><option>Oil & Gas - Midstream</option><option>Oil & Gas - Downstream</option><option>Utilities</option><option>Renewables</option><option>Mining</option></select><span class="error" data-error="industry"></span></div><div class="field"><label for="country">Country *</label><input id="country" name="country"/><span class="error" data-error="country"></span></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone"/></div></div><div class="field" style="margin-top:.6rem;"><label for="message">What would you like to evaluate?</label><textarea id="message" name="message" placeholder="Use cases, integration stack, deployment timeline, and security priorities..."></textarea></div><div style="margin-top:.8rem; display:flex; gap:.6rem; align-items:center;"><button class="btn btn-primary" type="submit">Submit Demo Request</button><span id="formSuccess" class="success-msg"></span></div></form></section>
