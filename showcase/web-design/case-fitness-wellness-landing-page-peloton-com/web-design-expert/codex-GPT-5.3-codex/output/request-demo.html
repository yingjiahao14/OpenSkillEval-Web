<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Request A Demo | WellStream</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="header"><div class="container nav"><a href="index.html" class="brand"><span class="logo-dot"></span>WellStream Platform</a><button class="btn btn-ghost mobile-toggle" id="mobileMenuToggle">Menu</button><nav class="menu" id="mainMenu"><a href="index.html">Home</a><div class="dropdown"><a href="#">Platform ▾</a><div class="dropdown-menu"><a href="platform-overview.html">Overview</a><a href="security.html">Security</a><a href="integration.html">Integration</a></div></div><a href="request-demo.html" class="btn btn-primary">Request A Demo</a></nav></div></header>
<main class="section"><div class="container" style="max-width:860px;">
  <h1>Request A Demo</h1>
  <p class="lead">See how WellStream accelerates trusted data operations across your assets.</p>
  <form id="demoForm" class="card form" novalidate>
    <div class="form-grid">
      <div><label>First Name*</label><input name="firstName" data-required="true" /><div class="error" data-for="firstName"></div></div>
      <div><label>Last Name*</label><input name="lastName" data-required="true" /><div class="error" data-for="lastName"></div></div>
      <div><label>Work Email*</label><input name="email" type="email" data-required="true" /><div class="error" data-for="email"></div></div>
      <div><label>Company*</label><input name="company" data-required="true" /><div class="error" data-for="company"></div></div>
      <div><label>Role*</label><input name="role" data-required="true" /><div class="error" data-for="role"></div></div>
      <div><label>Industry*</label><select name="industry" data-required="true"><option value="">Select...</option><option>Oil & Gas</option><option>Utilities</option><option>Renewables</option><option>Mining</option></select><div class="error" data-for="industry"></div></div>
    </div>
    <div style="margin-top:12px;"><label>What are you hoping to improve?*</label><textarea name="message" rows="4" data-required="true"></textarea><div class="error" data-for="message"></div></div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; flex-wrap:wrap;">
      <small class="muted">By submitting, you agree to be contacted about WellStream products.</small>
      <button class="btn btn-primary" type="submit">Submit</button>
    </div>
    <div id="formSuccess" class="success-msg"></div>
  </form>
</div></main>
<footer class="footer"><div class="container">© 2026 WellStream Platform</div></footer>
<script src="main.js"></script></body></html>
