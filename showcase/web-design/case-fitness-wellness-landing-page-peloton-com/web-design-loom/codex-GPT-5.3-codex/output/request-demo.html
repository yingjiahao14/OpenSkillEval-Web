<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>WellStream Platform | Request Demo</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WellStream Platform</span></a><nav class="nav-links"><a class="nav-link" href="index.html">Home</a><div class="dropdown"><button class="dropdown-toggle nav-link">Platform ▾</button><div class="dropdown-menu"><a href="platform-overview.html">Overview</a><a href="security.html">Security</a><a href="integration.html">Integration</a></div></div><a class="btn btn-primary" aria-current="page" href="request-demo.html">Request A Demo</a></nav></div></header>
<main>
<section class="section"><div class="container"><h1>Request A Demo</h1><p class="section-intro">Tell us about your operation. A WellStream specialist will reach out with a tailored walkthrough.</p><form id="demo-form" class="card" novalidate><div class="form-grid"><div><label for="firstName">First Name *</label><input id="firstName" name="firstName" /><div class="error" data-error="firstName"></div></div><div><label for="lastName">Last Name *</label><input id="lastName" name="lastName" /><div class="error" data-error="lastName"></div></div><div><label for="email">Business Email *</label><input id="email" name="email" type="email" /><div class="error" data-error="email"></div></div><div><label for="company">Company *</label><input id="company" name="company" /><div class="error" data-error="company"></div></div><div><label for="industry">Industry *</label><select id="industry" name="industry"><option value="">Select industry</option><option>E&P</option><option>Midstream</option><option>Downstream</option><option>Utilities</option><option>Solar/Wind</option><option>Mining</option></select><div class="error" data-error="industry"></div></div><div><label for="title">Job Title</label><input id="title" name="title" /></div></div><div style="margin-top:14px"><label for="notes">Current data management challenges</label><textarea id="notes" name="notes" placeholder="Share your goals, current stack, and timeline."></textarea></div><div style="margin-top:16px"><button class="btn btn-primary" type="submit">Submit Demo Request</button></div></form></div></section>
</main>
