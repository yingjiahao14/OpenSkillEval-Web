<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - ClipCast</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-layout">
    <div class="auth-form-side">
      <div class="auth-brand">
        <a href="index.html" class="nav-brand">
          <i class="ri-record-circle-line"></i> ClipCast
        </a>
      </div>
      
      <div class="auth-form-container">
        <h2>Log in to ClipCast</h2>
        <p>Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:600">Sign up for free</a></p>

        <div class="social-auth">
          <button class="btn btn-social"><i class="ri-google-fill" style="color:#DB4437"></i> Continue with Google</button>
          <button class="btn btn-social"><i class="ri-slack-fill" style="color:#4A154B"></i> Continue with Slack</button>
          <button class="btn btn-social"><i class="ri-apple-fill" style="color:#000"></i> Continue with Apple</button>
          <button class="btn btn-social"><i class="ri-mail-line" style="color:#0078D4"></i> Continue with Outlook</button>
          <button class="btn btn-social"><i class="ri-shield-keyhole-line" style="color:var(--text-dark)"></i> Continue with SSO</button>
        </div>

        <div class="divider">or</div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Work email</label>
            <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Continue</button>
        </form>

        <div class="mt-8 text-center" style="font-size:0.875rem; color:var(--text-muted)">
          By signing in, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#" style="text-decoration:underline">Terms</a> and <a href="#" style="text-decoration:underline">Privacy Policy</a>.
        </div>
      </div>
    </div>
    
    <div class="auth-sidebar" style="background:var(--bg-offwhite)">
      <div style="text-align:center">
        <i class="ri-record-circle-line" style="font-size:120px; color:var(--primary); opacity:0.1"></i>
        <h3 style="margin-top:24px">One video is worth a thousand words.</h3>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
