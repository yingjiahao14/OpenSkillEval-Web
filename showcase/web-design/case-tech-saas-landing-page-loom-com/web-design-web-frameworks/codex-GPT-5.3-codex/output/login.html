<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipCast Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">C</span>ClipCast</a>
      <nav class="nav-links">
        <a href="enterprise.html">Enterprise</a>
        <a href="pricing.html">Pricing</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Signup</a>
      </nav>
      <div class="nav-ctas"><a class="btn btn-primary" href="signup.html">Get Started for free</a></div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card" style="grid-template-columns:1fr; max-width:500px;">
      <section class="auth-form">
        <h1 class="section-title" style="font-size:1.8rem; margin-top:0;">Welcome back</h1>
        <p class="small">Log in with SSO provider or continue with work email.</p>
        <div class="social-list">
          <button class="social-btn">Continue with Google</button>
          <button class="social-btn">Continue with Slack</button>
          <button class="social-btn">Continue with Apple</button>
          <button class="social-btn">Continue with Outlook</button>
          <button class="social-btn">Continue with SSO</button>
        </div>
        <form data-auth-form>
          <label for="loginEmail">Work email</label>
          <input id="loginEmail" class="input" type="email" placeholder="you@company.com" required />
          <button class="btn btn-primary" style="width:100%; margin-top:.8rem;">Continue</button>
          <p data-status class="small" style="margin-top:.5rem;"></p>
        </form>
        <p class="small">New to ClipCast? <a href="signup.html" style="color:var(--primary); font-weight:700;">Sign up for free</a></p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
