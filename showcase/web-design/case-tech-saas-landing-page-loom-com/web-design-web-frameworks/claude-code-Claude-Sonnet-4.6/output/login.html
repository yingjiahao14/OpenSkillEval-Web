<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to ClipCast</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1868DB; --dark: #292A2E;
      --gray: #6B7280; --light-gray: #F9FAFB; --border: #E5E7EB;
      --radius: 12px; --radius-lg: 20px;
    }
    body { font-family: 'Inter', sans-serif; color: var(--dark); background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    header { padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; color: var(--dark); }
    .nav-logo .logo-icon { width: 32px; height: 32px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .nav-logo .logo-icon i { color: #fff; font-size: 18px; }
    .header-link { font-size: 14px; color: var(--gray); }
    .header-link a { color: var(--blue); font-weight: 600; }
    .header-link a:hover { text-decoration: underline; }

    /* MAIN */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; background: var(--light-gray); }
    .login-box { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .login-box h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 28px; text-align: center; }

    /* SOCIAL BUTTONS */
    .social-buttons { display: flex; flex-direction: column; gap: 10px; }
    .social-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-radius: var(--radius);
      border: 1.5px solid var(--border); background: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all .2s; color: var(--dark); width: 100%;
    }
    .social-btn:hover { background: var(--light-gray); border-color: #D1D5DB; }
    .social-btn i { font-size: 20px; flex-shrink: 0; }
    .social-btn .social-label { flex: 1; text-align: center; }

    .google-btn i { color: #EA4335; }
    .slack-btn i { color: #4A154B; }
    .apple-btn i { color: #000; }
    .outlook-btn i { color: #0078D4; }
    .sso-btn i { color: var(--blue); }

    /* DIVIDER */
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
    .divider span { font-size: 13px; color: var(--gray); font-weight: 500; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--dark); }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: var(--radius);
      border: 1.5px solid var(--border); font-size: 15px;
      font-family: inherit; color: var(--dark); background: #fff;
      transition: border-color .2s; outline: none;
    }
    .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,104,219,.1); }
    .form-group input::placeholder { color: #D1D5DB; }

    .btn-continue {
      width: 100%; padding: 13px; border-radius: var(--radius);
      background: var(--blue); color: #fff; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer; transition: all .2s;
      margin-top: 4px;
    }
    .btn-continue:hover { background: #1558c0; box-shadow: 0 4px 12px rgba(24,104,219,.3); }

    /* FOOTER TEXT */
    .form-footer { margin-top: 20px; text-align: center; }
    .form-footer p { font-size: 12px; color: var(--gray); line-height: 1.6; }
    .form-footer p a { color: var(--blue); }
    .form-footer p a:hover { text-decoration: underline; }
    .signup-link { margin-top: 16px; font-size: 14px; color: var(--gray); text-align: center; }
    .signup-link a { color: var(--blue); font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }

    /* PAGE FOOTER */
    footer { padding: 20px 40px; border-top: 1px solid var(--border); text-align: center; }
    footer p { font-size: 12px; color: var(--gray); }

    @media (max-width: 500px) {
      header { padding: 16px 20px; }
      .login-box { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="nav-logo">
    <div class="logo-icon"><i class="ri-video-line"></i></div>
    ClipCast
  </a>
  <div class="header-link">Don't have an account? <a href="signup.html">Sign up for free</a></div>
</header>

<main>
  <div class="login-box">
    <h1>Log in to ClipCast</h1>

    <div class="social-buttons">
      <button class="social-btn google-btn">
        <i class="ri-google-line"></i>
        <span class="social-label">Continue with Google</span>
      </button>
      <button class="social-btn slack-btn">
        <i class="ri-slack-line"></i>
        <span class="social-label">Continue with Slack</span>
      </button>
      <button class="social-btn apple-btn">
        <i class="ri-apple-line"></i>
        <span class="social-label">Continue with Apple</span>
      </button>
      <button class="social-btn outlook-btn">
        <i class="ri-mail-line"></i>
        <span class="social-label">Continue with Outlook</span>
      </button>
      <button class="social-btn sso-btn">
        <i class="ri-shield-keyhole-line"></i>
        <span class="social-label">Continue with SSO</span>
      </button>
    </div>

    <div class="divider"><span>or</span></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" placeholder="you@company.com" required />
      </div>
      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="form-footer">
      <p>By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
    <div class="signup-link">
      <a href="signup.html">Sign up for free</a>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 ClipCast, Inc. · <a href="#" style="color: #9CA3AF;">Privacy Policy</a> · <a href="#" style="color: #9CA3AF;">Terms of Service</a></p>
</footer>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (email) {
      alert('Proceeding with email authentication for: ' + email);
    }
  }
</script>
</body>
</html>
