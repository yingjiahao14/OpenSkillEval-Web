<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#F5F3FF',100:'#EDE9FE',200:'#DDD6FE',300:'#C4B5FD',400:'#A78BFA',500:'#8B5CF6',600:'#7C3AED',700:'#6D28D9',800:'#5B21B6',900:'#4C1D95' },
            accent: '#FF613D',
            dark: '#292A2E',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full py-6 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-primary-600 flex items-center gap-1">
        <i class="ri-play-circle-fill text-3xl"></i>ClipCast
      </a>
      <a href="signup.html" class="text-primary-600 font-semibold hover:text-primary-700 transition">Sign up for free</a>
    </div>
  </header>

  <!-- Login Form -->
  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 md:p-10">
        <h1 class="text-3xl font-bold text-dark text-center mb-8">Log in to ClipCast</h1>

        <!-- Social Login Buttons -->
        <div class="space-y-3 mb-6">
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5.042 15.165a8.84 8.84 0 01-.045-.945 8.955 8.955 0 011.393-4.773L2.575 6.15A14.89 14.89 0 00.96 14.22c.007 2.764.68 5.369 1.875 7.688l3.888-3.283a8.89 8.89 0 01-1.681-3.46z" fill="#E01E5A"/><path d="M14.22.96A14.89 14.89 0 006.15 2.575l3.297 3.815a8.955 8.955 0 014.773-1.393c.32 0 .635.015.945.045a8.89 8.89 0 013.46 1.681l3.283-3.888A14.834 14.834 0 0014.22.96z" fill="#36C5F0"/><path d="M23.04 14.22a14.89 14.89 0 00-1.615-8.07l-3.815 3.297a8.955 8.955 0 011.393 4.773c0 .32-.015.635-.045.945a8.89 8.89 0 01-1.681 3.46l3.888 3.283a14.834 14.834 0 001.875-7.688z" fill="#2EB67D"/><path d="M6.15 21.425a14.89 14.89 0 008.07 1.615 14.834 14.834 0 007.688-1.875l-3.283-3.888a8.89 8.89 0 01-3.46 1.681 8.84 8.84 0 01-.945.045 8.955 8.955 0 01-4.773-1.393l-3.297 3.815z" fill="#ECB22E"/></svg>
            Continue with Slack
          </button>
          <button class="social-btn">
            <i class="ri-apple-fill text-xl text-dark"></i>
            Continue with Apple
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M3 3h8.5v8.5H3V3zm9.5 0H21v8.5h-8.5V3zM3 12.5h8.5V21H3v-8.5zm9.5 0H21V21h-8.5v-8.5z"/></svg>
            Continue with Outlook
          </button>
          <button class="social-btn">
            <i class="ri-shield-keyhole-line text-xl text-gray-600"></i>
            Continue with SSO
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-4 mb-6">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-sm text-gray-400 font-medium">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Email Form -->
        <form onsubmit="event.preventDefault();">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Work email</label>
          <input type="email" id="email" placeholder="you@company.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-100 outline-none transition text-base mb-4" />
          <button type="submit"
            class="w-full bg-primary-600 text-white py-3 rounded-xl font-semibold text-base hover:bg-primary-700 transition shadow-sm">
            Continue
          </button>
        </form>

        <!-- Footer -->
        <p class="text-xs text-gray-400 text-center mt-6 leading-relaxed">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's
          <a href="#" class="text-primary-600 hover:underline">Terms</a> and
          <a href="#" class="text-primary-600 hover:underline">Privacy Policy</a>.
        </p>
      </div>

      <!-- Sign up link -->
      <p class="text-center mt-6 text-gray-500 text-sm">
        Don't have an account? <a href="signup.html" class="text-primary-600 font-semibold hover:underline">Sign up for free</a>
      </p>
    </div>
  </main>

</body>
</html>
