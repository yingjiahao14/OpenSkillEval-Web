<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1868DB; --orange: #FF613D; --dark: #292A2E;
      --gray: #6B7280; --light-gray: #F3F4F6; --border: #E5E7EB; --white: #FFFFFF;
    }
    body { font-family: 'Inter', sans-serif; color: var(--dark); background: var(--light-gray); min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    header {
      background: white; border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 1.4rem; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
    .nav-logo span { color: var(--orange); }
    header a.signup-link { font-size: 0.875rem; font-weight: 600; color: var(--blue); }
    header a.signup-link:hover { text-decoration: underline; }

    /* MAIN */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }

    .login-card {
      background: white; border-radius: 20px; padding: 2.5rem;
      width: 100%; max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }
    .login-card h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
    .login-card .subtitle { font-size: 0.9rem; color: var(--gray); margin-bottom: 2rem; }

    /* SOCIAL BUTTONS */
    .social-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      padding: 0.75rem 1rem; border-radius: 10px;
      border: 1.5px solid var(--border); background: white;
      font-size: 0.9rem; font-weight: 600; color: var(--dark);
      cursor: pointer; transition: all 0.2s; margin-bottom: 0.75rem;
    }
    .social-btn:hover { background: var(--light-gray); border-color: #9CA3AF; }
    .social-icon { width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }

    /* DIVIDER */
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 0.8rem; color: var(--gray); white-space: nowrap; }

    /* FORM */
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--dark); margin-bottom: 0.4rem; }
    input[type=email], input[type=text] {
      width: 100%; padding: 0.8rem 1rem; border-radius: 10px;
      border: 1.5px solid var(--border); font-family: inherit; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s; color: var(--dark); background: white;
    }
    input[type=email]:focus, input[type=text]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,104,219,0.1); }
    .btn-submit {
      width: 100%; padding: 0.85rem; border-radius: 10px;
      background: var(--blue); color: white; font-size: 0.95rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-submit:hover { background: #1559c0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(24,104,219,0.3); }

    /* FOOTER TEXT */
    .form-footer { font-size: 0.78rem; color: var(--gray); text-align: center; margin-top: 1.25rem; line-height: 1.6; }
    .form-footer a { color: var(--blue); }
    .form-footer a:hover { text-decoration: underline; }
    .signup-cta { text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--gray); }
    .signup-cta a { color: var(--blue); font-weight: 600; }
    .signup-cta a:hover { text-decoration: underline; }

    /* SSO special button */
    .sso-btn { border-color: var(--blue); color: var(--blue); }
    .sso-btn:hover { background: #EEF4FF; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="nav-logo">Clip<span>Cast</span></a>
  <a href="signup.html" class="signup-link">Sign up for free →</a>
</header>

<!-- MAIN -->
<main>
  <div class="login-card">
    <h1>Log in to ClipCast</h1>
    <p class="subtitle">Welcome back. Choose your sign-in method.</p>

    <!-- SOCIAL AUTH -->
    <button class="social-btn" onclick="handleSocialLogin('Google')">
      <span class="social-icon">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/><path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.01c-.72.48-1.63.77-2.7.77-2.08 0-3.84-1.4-4.47-3.29H1.83v2.07A8 8 0 0 0 8.98 17z" fill="#34A853"/><path d="M4.51 10.53A4.8 4.8 0 0 1 4.26 9c0-.53.09-1.04.25-1.53V5.4H1.83A8 8 0 0 0 .98 9c0 1.29.31 2.51.85 3.6l2.68-2.07z" fill="#FBBC05"/><path d="M8.98 3.58c1.16 0 2.2.4 3.02 1.19l2.26-2.26A8 8 0 0 0 8.98 1a8 8 0 0 0-7.15 4.4l2.68 2.07c.63-1.89 2.39-3.29 4.47-3.29z" fill="#EA4335"/></svg>
      </span>
      Continue with Google
    </button>

    <button class="social-btn" onclick="handleSocialLogin('Slack')">
      <span class="social-icon">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6.527 14.514a1.963 1.963 0 0 1-1.964 1.963 1.963 1.963 0 0 1-1.963-1.963 1.963 1.963 0 0 1 1.963-1.963h1.964v1.963zm.992 0a1.963 1.963 0 0 1 1.963-1.963 1.963 1.963 0 0 1 1.964 1.963v4.91a1.963 1.963 0 0 1-1.964 1.963 1.963 1.963 0 0 1-1.963-1.963v-4.91z" fill="#E01E5A"/><path d="M9.482 6.527a1.963 1.963 0 0 1-1.963-1.964A1.963 1.963 0 0 1 9.482 2.6a1.963 1.963 0 0 1 1.963 1.963v1.964H9.482zm0 .992a1.963 1.963 0 0 1 1.963 1.963 1.963 1.963 0 0 1-1.963 1.964H4.573a1.963 1.963 0 0 1-1.963-1.964 1.963 1.963 0 0 1 1.963-1.963h4.91z" fill="#36C5F0"/><path d="M17.473 9.482a1.963 1.963 0 0 1 1.963-1.963 1.963 1.963 0 0 1 1.964 1.963 1.963 1.963 0 0 1-1.964 1.963h-1.963V9.482zm-.991 0a1.963 1.963 0 0 1-1.964 1.963 1.963 1.963 0 0 1-1.963-1.963V4.573a1.963 1.963 0 0 1 1.963-1.963 1.963 1.963 0 0 1 1.964 1.963v4.91z" fill="#2EB67D"/><path d="M14.518 17.473a1.963 1.963 0 0 1 1.963 1.963 1.963 1.963 0 0 1-1.963 1.964 1.963 1.963 0 0 1-1.964-1.964v-1.963h1.964zm0-.991a1.963 1.963 0 0 1-1.964-1.964 1.963 1.963 0 0 1 1.964-1.963h4.909a1.963 1.963 0 0 1 1.963 1.963 1.963 1.963 0 0 1-1.963 1.964h-4.91z" fill="#ECB22E"/></svg>
      </span>
      Continue with Slack
    </button>

    <button class="social-btn" onclick="handleSocialLogin('Apple')">
      <span class="social-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z"/></svg>
      </span>
      Continue with Apple
    </button>

    <button class="social-btn" onclick="handleSocialLogin('Outlook')">
      <span class="social-icon">
        <svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="3" fill="#0078D4"/><text x="4" y="17" font-size="13" font-weight="700" fill="white" font-family="Arial">O</text></svg>
      </span>
      Continue with Outlook
    </button>

    <button class="social-btn sso-btn" onclick="handleSocialLogin('SSO')">
      <span class="social-icon">🔑</span>
      Continue with SSO
    </button>

    <div class="divider"><span>or</span></div>

    <!-- EMAIL FORM -->
    <form onsubmit="handleEmailLogin(event)">
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required />
      </div>
      <button type="submit" class="btn-submit">Continue</button>
    </form>

    <p class="form-footer">
      By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </p>

    <div class="signup-cta">
      Don't have an account? <a href="signup.html">Sign up for free</a>
    </div>
  </div>
</main>

<script>
  function handleSocialLogin(provider) {
    alert('Redirecting to ' + provider + ' authentication...');
  }
  function handleEmailLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (email) {
      alert('Proceeding with email authentication for: ' + email);
    }
  }
</script>
</body>
</html>
