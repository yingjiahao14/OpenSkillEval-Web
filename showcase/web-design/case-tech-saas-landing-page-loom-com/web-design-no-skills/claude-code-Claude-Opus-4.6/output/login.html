<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-form-container">
    <!-- Header / Logo -->
    <a href="index.html" class="nav-logo" style="margin-bottom:48px;">
      <svg viewBox="0 0 32 32" fill="none" style="width:32px;height:32px;"><rect width="32" height="32" rx="8" fill="#1868DB"/><polygon points="13,9 13,23 24,16" fill="white"/></svg>
      ClipCast
    </a>

    <div class="auth-form">
      <h1>Log in to ClipCast</h1>

      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5.042 15.165a2.528 2.528 0 01-2.52 2.523A2.528 2.528 0 010 15.165a2.527 2.527 0 012.522-2.52h2.52v2.52zm1.268 0a2.527 2.527 0 012.521-2.52 2.527 2.527 0 012.521 2.52v6.313A2.528 2.528 0 018.831 24a2.528 2.528 0 01-2.52-2.522v-6.313zM8.831 5.042a2.528 2.528 0 01-2.52-2.52A2.528 2.528 0 018.83 0a2.528 2.528 0 012.521 2.522v2.52H8.831zm0 1.268a2.528 2.528 0 012.521 2.521 2.527 2.527 0 01-2.52 2.521H2.522A2.527 2.527 0 010 8.831a2.527 2.527 0 012.522-2.52h6.309zm6.292 2.521a2.528 2.528 0 012.522-2.52A2.527 2.527 0 0120.165 8.83a2.527 2.527 0 01-2.52 2.521h-2.522V8.831zm-1.268 0a2.528 2.528 0 01-2.523 2.521 2.527 2.527 0 01-2.52-2.52V2.522A2.527 2.527 0 0111.333 0a2.528 2.528 0 012.522 2.522v6.309zm-2.522 6.292a2.528 2.528 0 012.522 2.522 2.527 2.527 0 01-2.522 2.52 2.527 2.527 0 01-2.52-2.52v-2.522h2.52zm0-1.268a2.528 2.528 0 01-2.52-2.523 2.527 2.527 0 012.52-2.52h6.313A2.527 2.527 0 0124 15.165a2.528 2.528 0 01-2.522 2.522h-6.313z" fill="#E01E5A"/></svg>
        Continue with Slack
      </button>
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-2.12 4.51-3.74 4.25z" fill="#000"/></svg>
        Continue with Apple
      </button>
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0z" fill="#0078D4"/><path d="M7.5 7.5h4v4h-4v-4zm5 0h4v4h-4v-4zm-5 5h4v4h-4v-4zm5 0h4v4h-4v-4z" fill="white"/></svg>
        Continue with Outlook
      </button>
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-3H9V7h2v6zm4 3h-2v-2h2v2zm0-3h-2V7h2v6z" fill="#6B7280"/></svg>
        Continue with SSO
      </button>

      <div class="auth-divider">or</div>

      <form onsubmit="event.preventDefault();">
        <input type="email" class="auth-input" placeholder="Work email" required>
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>

      <div class="auth-footer">
        By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </div>

      <div style="margin-top:24px;text-align:center;">
        <a href="signup.html" style="color:var(--primary);font-weight:500;font-size:0.9375rem;">Sign up for free</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
