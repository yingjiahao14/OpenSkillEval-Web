<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-layout { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-header { padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--border-color); }
    .auth-content { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg-light); padding: 2rem; }
    .auth-box { background: white; padding: 2.5rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); width: 100%; max-width: 440px; }
  </style>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="logo" style="justify-content: center;">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M15 10l4.55-2.27A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14v2a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h8a2 2 0 012 2v2z"/></svg>
      </div>
      ClipCast
    </a>
  </header>

  <main class="auth-content">
    <div class="auth-box">
      <h2 class="text-center" style="margin-bottom: 1.5rem;">Log in to ClipCast</h2>
      
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522v-2.521zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.521-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.523-2.522v-2.522h2.523zM15.165 17.688a2.527 2.527 0 0 1-2.523-2.523 2.526 2.526 0 0 1 2.523-2.521h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
        Continue with Slack
      </button>
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.36 12.3c-1.4.08-2.61-.83-3.23-1.01-.61-.17-1.74-1.04-3.14-1.04-1.91 0-3.66 1.4-3.66 3.93 0 2.26 1.22 4.17 2.61 5.66 1.04 1.13 1.91 1.74 3.05 1.74 1.04 0 1.57-.7 2.87-.7 1.3 0 1.74.7 2.87.7 1.22 0 1.91-.7 2.78-1.57 1.04-1.3 1.48-2.52 1.48-2.61 0-.08-2.35-.95-2.35-3.56 0-2.09 1.74-3.05 1.83-3.14-1.04-1.48-2.61-1.65-3.13-1.74zM14.9 6.27c-.61.78-1.57 1.22-2.52 1.22-.08-1.04.43-2.09 1.04-2.78.61-.7 1.65-1.22 2.61-1.22.08.96-.35 2.09-1.13 2.78z"/></svg>
        Continue with Apple
      </button>
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.38 5.76v12.48l9.28-2.69v-7.1L2.38 5.76zM12.72 8.01v7.98l8.9 2.5V5.5l-8.9 2.5z"/></svg>
        Continue with Outlook
      </button>
      <button class="social-btn">Continue with SSO</button>

      <div class="divider">or</div>

      <form action="#" onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="form-group">
          <input type="email" class="form-input" placeholder="Work email" required>
        </div>
        <button type="submit" class="btn btn-primary w-full">Continue</button>
      </form>

      <p class="small-text text-center mt-4" style="color: var(--text-light);">
        By signing up, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
      </p>

      <div class="text-center mt-4">
        <p class="small-text">New to ClipCast? <a href="signup.html" style="font-weight: 600;">Sign up for free</a></p>
      </div>
    </div>
  </main>

</body>
</html>
