<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-main">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <svg viewBox="0 0 32 32" fill="none" width="32" height="32"><circle cx="16" cy="16" r="16" fill="#1868DB"/><path d="M12 10l10 6-10 6V10z" fill="white"/></svg>
            ClipCast
          </a>
          <h1 class="auth-title">Log in to ClipCast</h1>
          <p class="auth-subtitle">Welcome back! Enter your details below.</p>
        </div>

        <div class="auth-socials">
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
              <path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M5.192 15.36c.285.195.633.285.99.285a1.8 1.8 0 001.62-.945l.855-1.86-1.8-1.17.585-1.275-1.17-.585-.585 1.275-1.26.675c-.36-.285-.855-.315-1.26-.15l-2.04-1.26a.45.45 0 01-.15-.585l3.765-3.765a.45.45 0 01.585-.15l2.04 1.26c.15.045.285.15.36.285l.765 1.8c.09.225.015.48-.195.615L5.7 12.81l1.62 1.17c.315.225.42.585.285.99l-.99 1.26a.45.45 0 01-.585.15l-2.04-1.26a.45.45 0 01-.15-.585l.99-1.26z" fill="#E01E5A"/>
            </svg>
            Continue with Slack
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9.305 1.688c4.8 0 8.7 3.9 8.7 8.7s-3.9 8.7-8.7 8.7-8.7-3.9-8.7-8.7 3.9-8.7 8.7-8.7zm0 2.1c-3.645 0-6.6 2.955-6.6 6.6s2.955 6.6 6.6 6.6 6.6-2.955 6.6-6.6-2.955-6.6-6.6-6.6z" fill="currentColor"/>
              <path d="M9.305 5.887a3.42 3.42 0 100 6.84 3.42 3.42 0 000-6.84zm0 1.05a2.37 2.37 0 110 4.74 2.37 2.37 0 010-4.74z" fill="currentColor"/>
            </svg>
            Continue with Apple
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M6.21 2.163C3.35 2.163 1 4.513 1 7.373c0 1.89 1.013 3.55 2.565 4.523-.06.21-.13.53-.13.84 0 .6.31 1.26.62 1.68.31.42.62.84.93 1.26.31.42.62.78.93 1.11.62.63 1.24 1.05 1.86 1.26.31.11.62.11.93.11.62 0 1.24-.11 1.86-.32.31-.11.62-.32.93-.53l1.24-.84c.31-.21.52-.42.62-.53.31-.32.52-.63.62-1.05.11-.42.11-.84.11-1.26 0-.84-.21-1.68-.52-2.53-.31-.84-.73-1.68-1.24-2.52l-.84-1.47c-.31-.53-.62-1.05-.93-1.58-.31-.53-.62-.95-.93-1.37-.31-.42-.62-.74-.93-1.05C7.82 3.51 7.02 3.11 6.21 2.76V2.163zm.52 1.58c.62 0 1.24.32 1.55.84.31.53.42 1.16.31 1.79-.11.63-.42 1.26-.83 1.68-.42.42-.93.63-1.55.63-.62 0-1.24-.21-1.65-.63-.42-.42-.63-.95-.63-1.58 0-.63.21-1.26.73-1.68.52-.42 1.24-.63 2.07-.63V4.24z" fill="#0078D4"/>
            </svg>
            Continue with Outlook
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 1a8 8 0 100 16A8 8 0 009 1zm3.28 10.48l-4.24 2.42a.5.5 0 01-.52-.02L5.26 11.4a.5.5 0 01-.12-.56l2.52-4.12a.5.5 0 01.78-.06l2.6 3.12 2.94-1.68a.5.5 0 01.6.08l1.62 2.08a.5.5 0 01-.02.64l-3.5 2.56z" fill="currentColor"/>
            </svg>
            Continue with SSO
          </button>
        </div>

        <div class="auth-divider">or</div>

        <form class="auth-form" onsubmit="event.preventDefault(); alert('Proceeding to email authentication...');">
          <div class="form-group">
            <label for="email">Work email</label>
            <input type="email" id="email" placeholder="name@company.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Continue</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up for free</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
