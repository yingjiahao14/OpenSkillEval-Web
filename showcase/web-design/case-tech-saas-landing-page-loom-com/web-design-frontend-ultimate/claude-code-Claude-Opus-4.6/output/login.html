<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to ClipCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1868DB;--blue-dark:#1255B8;--orange:#FF613D;
  --dark:#292A2E;--gray-900:#1a1a1f;--gray-800:#2d2e33;--gray-700:#44454a;
  --gray-600:#5e5f65;--gray-500:#7a7b82;--gray-400:#9d9ea5;--gray-300:#c2c3c8;
  --gray-200:#e2e3e6;--gray-100:#f3f4f6;--gray-50:#f9fafb;--white:#ffffff;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 2px 8px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.1);
  --transition:all .25s cubic-bezier(.4,0,.2,1);
}
html{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--dark);background:var(--gray-50);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{padding:24px;text-align:center}
.header .logo{font-size:22px;font-weight:800;color:var(--dark);display:inline-flex;align-items:center;gap:8px}
.header .logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.header .logo-icon svg{width:18px;height:18px;fill:white}

/* LOGIN FORM */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px 64px}
.login-card{background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--gray-200);padding:48px 40px;width:100%;max-width:440px}
.login-card h1{font-size:28px;font-weight:800;text-align:center;margin-bottom:32px;color:var(--dark)}

.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:white;font-family:inherit;font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;transition:var(--transition);margin-bottom:10px}
.social-btn:hover{border-color:var(--gray-400);background:var(--gray-50);transform:translateY(-1px)}
.social-btn svg{width:20px;height:20px;flex-shrink:0}
.social-btn .sso-icon{width:20px;height:20px;background:var(--gray-700);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.social-btn .sso-icon svg{width:12px;height:12px;fill:white}

.divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:var(--gray-400);font-size:13px;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gray-200)}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;color:var(--dark);margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;color:var(--dark);transition:var(--transition);outline:none;background:white}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,104,219,.1)}
.form-group input::placeholder{color:var(--gray-400)}

.submit-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--blue);color:white;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:var(--transition);margin-top:8px}
.submit-btn:hover{background:var(--blue-dark);transform:translateY(-1px);box-shadow:var(--shadow-md)}

.form-footer{text-align:center;margin-top:24px;font-size:13px;color:var(--gray-500);line-height:1.5}
.form-footer a{color:var(--blue);font-weight:600}
.form-footer a:hover{text-decoration:underline}

.signup-link{text-align:center;margin-top:20px;font-size:14px;color:var(--gray-600)}
.signup-link a{color:var(--blue);font-weight:600}
.signup-link a:hover{text-decoration:underline}

@media(max-width:480px){
  .login-card{padding:32px 24px}
  .login-card h1{font-size:24px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <a href="index.html" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><polygon points="9.5,7 9.5,17 18,12"/></svg></div>
    ClipCast
  </a>
</header>

<!-- LOGIN FORM -->
<main class="login-wrap">
  <div class="login-card">
    <h1>Log in to ClipCast</h1>

    <button class="social-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z" fill="#E01E5A"/></svg>
      Continue with Slack
    </button>
    <button class="social-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-2.12 4.53-3.74 4.25z" fill="#000"/></svg>
      Continue with Apple
    </button>
    <button class="social-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M7.88 12.04q0 .45-.11.87-.11.41-.31.75-.2.34-.49.6-.3.27-.68.42-.38.16-.84.16-.45 0-.83-.16-.38-.16-.68-.42-.29-.26-.49-.6-.2-.34-.31-.75-.11-.42-.11-.87t.11-.87q.11-.41.31-.75.2-.34.49-.6.3-.27.68-.42.38-.16.83-.16.46 0 .84.16.38.15.68.42.29.26.49.6.2.34.31.75.11.42.11.87zm-2.27-6.95H3.72l8.42 14.54h1.89z" fill="#0072C6"/><path d="M21.39 12c0-5.52-4.48-10-10-10S1.39 6.48 1.39 12s4.48 10 10 10 10-4.48 10-10z" fill="none" stroke="#0072C6" stroke-width="1.5"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0072C6">O</text></svg>
      Continue with Outlook
    </button>
    <button class="social-btn" type="button">
      <div class="sso-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      Continue with SSO
    </button>

    <div class="divider">or</div>

    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" placeholder="name@company.com" required>
      </div>
      <button class="submit-btn" type="submit">Continue</button>
    </form>

    <p class="form-footer">By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>

    <p class="signup-link"><a href="signup.html">Sign up for free</a></p>
  </div>
</main>

</body>
</html>
