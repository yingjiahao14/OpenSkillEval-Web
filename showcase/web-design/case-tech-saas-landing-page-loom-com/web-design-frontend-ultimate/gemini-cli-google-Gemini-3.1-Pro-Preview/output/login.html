<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in to ClipCast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { blue: '#1868DB', orange: '#FF613D', dark: '#292A2E' } } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-brand-dark min-h-screen flex flex-col font-sans">
  <header class="p-6">
    <a href="index.html" class="flex items-center gap-2 font-bold text-2xl tracking-tight text-brand-blue hover:opacity-80 transition-opacity">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h10v16H4z" opacity=".3"/><path d="M14 4H4v16h10V4zm-2 14H6V6h6v12zM22 6.5l-6 4v3l6 4v-11z"/></svg>
      ClipCast
    </a>
  </header>
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-gray-100">
      <h1 class="text-2xl font-bold mb-6 text-center">Log in to ClipCast</h1>
      <div class="space-y-3 mb-6">
        <button class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition-colors font-medium">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5"> Google
        </button>
        <button class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition-colors font-medium">
          <img src="https://www.svgrepo.com/show/448248/slack.svg" alt="Slack" class="w-5 h-5"> Slack
        </button>
        <div class="flex gap-3">
          <button class="flex-1 flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition-colors font-medium">Apple</button>
          <button class="flex-1 flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition-colors font-medium">Outlook</button>
        </div>
        <button class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition-colors font-medium">
          SSO
        </button>
      </div>
      <div class="relative flex items-center py-2 mb-6">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">or</span>
        <div class="flex-grow border-t border-gray-200"></div>
      </div>
      <form>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1" for="email">Work email</label>
          <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-blue" placeholder="name@company.com" required>
        </div>
        <button type="submit" class="w-full bg-brand-blue text-white rounded-lg py-3 font-semibold hover:bg-blue-700 transition-colors">Continue</button>
      </form>
      <p class="text-xs text-gray-500 text-center mt-6">
        By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#" class="underline">Terms</a> and <a href="#" class="underline">Privacy Policy</a>.
      </p>
      <p class="text-center mt-8 text-sm">
        Don't have an account? <a href="signup.html" class="text-brand-blue font-semibold hover:underline">Sign up for free</a>
      </p>
    </div>
  </main>
</body>
</html>
