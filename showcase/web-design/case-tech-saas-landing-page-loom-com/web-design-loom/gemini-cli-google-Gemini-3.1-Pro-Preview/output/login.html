<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCast | Log In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="auth-wrapper">
    <div class="auth-main">
      <div class="auth-box">
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand" style="font-size: 2rem; margin-bottom: 24px; display: inline-block;">ClipCast</a>
          <h2>Log in to ClipCast</h2>
        </div>

        <div class="flex-col gap-2 mb-2">
          <button class="btn btn-social">Continue with Google</button>
          <button class="btn btn-social">Continue with Slack</button>
          <button class="btn btn-social">Continue with Apple</button>
          <button class="btn btn-social">Continue with Outlook</button>
          <button class="btn btn-social">Continue with SSO</button>
        </div>

        <div class="divider">or</div>

        <form>
          <div class="form-group">
            <label class="form-label" for="workEmail">Work email</label>
            <input type="email" id="workEmail" class="form-input" placeholder="name@company.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block mb-2">Continue</button>
        </form>

        <p class="text-center text-light" style="font-size: 0.875rem;">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
        </p>

        <p class="text-center mt-4" style="margin-top: 32px;">
          Don't have an account? <a href="signup.html">Sign up for free</a>
        </p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
