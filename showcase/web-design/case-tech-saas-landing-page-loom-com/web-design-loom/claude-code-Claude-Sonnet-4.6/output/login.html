<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to ClipCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1868DB;
  --orange: #FF613D;
  --dark: #292A2E;
  --gray: #6B7280;
  --light-gray: #F3F4F6;
  --border: #E5E7EB;
  --white: #FFFFFF;
  --radius: 12px;
  --radius-lg: 20px;
}
body {
  font-family: 'Inter', sans-serif; color: var(--dark);
  background: var(--light-gray); min-height: 100vh;
  display: flex; flex-direction: column;
}
a { text-decoration: none; color: inherit; }

/* HEADER */
header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.nav-logo { font-size: 22px; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
.nav-logo span { color: var(--orange); }
.header-right { font-size: 14px; color: var(--gray); }
.header-right a { color: var(--blue); font-weight: 600; }

/* MAIN */
main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 40px 24px;
}
.login-card {
  background: var(--white); border-radius: var(--radius-lg);
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  padding: 48px 40px; width: 100%; max-width: 440px;
}
.login-card h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; text-align: center; }
.login-subtitle { font-size: 15px; color: var(--gray); text-align: center; margin-bottom: 32px; }

/* SOCIAL BUTTONS */
.social-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.social-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-radius: 10px; font-size: 15px; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--white); cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .15s;
  color: var(--dark); width: 100%;
}
.social-btn:hover {
  border-color: #9CA3AF;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  transform: translateY(-1px);
}
.social-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.social-btn-text { flex: 1; text-align: center; margin-right: 24px; }

/* DIVIDER */
.divider { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { font-size: 13px; color: var(--gray); font-weight: 500; }

/* FORM */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.form-group input {
  width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 15px; font-family: inherit;
  outline: none; transition: border-color .2s, box-shadow .2s;
  color: var(--dark); background: var(--white);
}
.form-group input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(24,104,219,.12);
}
.form-group input::placeholder { color: #9CA3AF; }

.btn-submit {
  width: 100%; padding: 14px; background: var(--blue); color: white;
  border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .2s, transform .15s, box-shadow .2s;
  margin-top: 8px;
}
.btn-submit:hover { background: #1558c0; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(24,104,219,.3); }

/* FOOTER TEXT */
.form-footer {
  margin-top: 24px; font-size: 12px; color: var(--gray);
  text-align: center; line-height: 1.6;
}
.form-footer a { color: var(--blue); font-weight: 500; }
.signup-link {
  margin-top: 20px; text-align: center; font-size: 14px; color: var(--gray);
  padding-top: 20px; border-top: 1px solid var(--border);
}
.signup-link a { color: var(--blue); font-weight: 600; }

/* Google SVG */
.g-logo { width: 20px; height: 20px; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="nav-logo">Clip<span>Cast</span></a>
  <div class="header-right">New to ClipCast? <a href="signup.html">Sign up for free</a></div>
</header>

<main>
  <div class="login-card">
    <h1>Log in to ClipCast</h1>
    <p class="login-subtitle">Welcome back! Choose a login method.</p>

    <div class="social-buttons">
      <button class="social-btn">
        <div class="social-icon">
          <svg class="g-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </div>
        <span class="social-btn-text">Continue with Google</span>
      </button>

      <button class="social-btn">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z" fill="#E01E5A"/>
          </svg>
        </div>
        <span class="social-btn-text">Continue with Slack</span>
      </button>

      <button class="social-btn">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="#000"/>
          </svg>
        </div>
        <span class="social-btn-text">Continue with Apple</span>
      </button>

      <button class="social-btn">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 3.75C0 2.784.784 2 1.75 2h20.5c.966 0 1.75.784 1.75 1.75v2.5A1.75 1.75 0 0 1 22.25 8H1.75A1.75 1.75 0 0 1 0 6.25v-2.5Zm0 7.5C0 10.284.784 9.5 1.75 9.5h20.5c.966 0 1.75.784 1.75 1.75v2.5A1.75 1.75 0 0 1 22.25 15.5H1.75A1.75 1.75 0 0 1 0 13.75v-2.5Zm1.75 6.25A1.75 1.75 0 0 0 0 19.25v2.5C0 22.716.784 23.5 1.75 23.5h20.5A1.75 1.75 0 0 0 24 21.75v-2.5a1.75 1.75 0 0 0-1.75-1.75H1.75Z" fill="#0078D4"/>
          </svg>
        </div>
        <span class="social-btn-text">Continue with Outlook</span>
      </button>

      <button class="social-btn">
        <div class="social-icon" style="font-size:18px;color:var(--gray)">🔑</div>
        <span class="social-btn-text">Continue with SSO</span>
      </button>
    </div>

    <div class="divider"><span>or</span></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" placeholder="you@company.com" required>
      </div>
      <button type="submit" class="btn-submit">Continue</button>
    </form>

    <div class="form-footer">
      By signing up, you acknowledge that you have read and understood, and agree to ClipCast's
      <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </div>

    <div class="signup-link">
      Don't have an account? <a href="signup.html">Sign up for free</a>
    </div>
  </div>
</main>

<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  if (email) {
    alert('Continuing with: ' + email);
  }
}
</script>
</body>
</html>
