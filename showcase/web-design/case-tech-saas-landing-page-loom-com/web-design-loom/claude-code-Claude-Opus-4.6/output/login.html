<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="index.html" class="nav-logo" style="margin-bottom: 40px; display: inline-flex;">
        <svg viewBox="0 0 28 28" fill="none" width="28" height="28"><rect width="28" height="28" rx="6" fill="#1868DB"/><path d="M10 8v12l10-6z" fill="#fff"/></svg>
        ClipCast
      </a>

      <h1>Log in to ClipCast</h1>

      <!-- Social Login -->
      <button class="auth-social-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="auth-social-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M5.042 15.165a.994.994 0 01-.354-.063C2.47 14.151 1 12.209 1 10c0-2.757 2.243-5 5-5h4c2.757 0 5 2.243 5 5 0 2.21-1.47 4.151-3.688 5.102a1 1 0 01-.756-1.852C12.062 12.705 13 11.42 13 10c0-1.654-1.346-3-3-3H6c-1.654 0-3 1.346-3 3s1.346 3 3 3a1 1 0 110 2h-.958z" fill="#E01E5A"/><path d="M10 22c-2.757 0-5-2.243-5-5 0-2.21 1.47-4.151 3.688-5.102a1 1 0 01.756 1.852C7.938 14.295 7 15.58 7 17c0 1.654 1.346 3 3 3h4c1.654 0 3-1.346 3-3s-1.346-3-3-3a1 1 0 110-2h.958a.994.994 0 01.354.063C17.53 12.849 19 14.791 19 17c0 2.757-2.243 5-5 5h-4z" fill="#36C5F0"/></svg>
        Continue with Slack
      </button>
      <button class="auth-social-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-2.14 4.52-3.74 4.25z" fill="#000"/></svg>
        Continue with Apple
      </button>
      <button class="auth-social-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 6a2 2 0 012-2h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" fill="#0078D4"/><path d="M22 6l-10 7L2 6" stroke="#fff" stroke-width="1.5" fill="none"/></svg>
        Continue with Outlook
      </button>
      <button class="auth-social-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#666" stroke-width="1.5"/><path d="M7 8h4v4H7zM13 8h4v4h-4zM7 14h4v2H7zM13 14h4v2h-4z" fill="#666"/></svg>
        Continue with SSO
      </button>

      <div class="auth-divider">or</div>

      <form onsubmit="event.preventDefault();">
        <div class="auth-input-group">
          <label for="loginEmail">Work email</label>
          <input type="email" id="loginEmail" placeholder="you@company.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Continue</button>
      </form>

      <p class="auth-footer">By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up for free</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
