<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            accent: '#FF613D',
            dark: '#292A2E',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    .btn-primary {
      transition: all 150ms ease-out;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px -4px rgba(124, 58, 237, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .social-btn {
      transition: all 150ms ease-out;
    }
    .social-btn:hover {
      background-color: #f5f3ff;
      border-color: #c4b5fd;
    }
  </style>
</head>
<body class="font-sans text-dark bg-gray-50/50 antialiased min-h-screen flex flex-col" style="background-color: #f8f7ff;">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 md:px-8 py-4">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
          <i data-lucide="clapperboard" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-xl font-bold text-dark">ClipCast</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-dark mb-2">Log in to ClipCast</h1>
          <p class="text-gray-600 text-sm">Welcome back! Enter your work email to continue.</p>
        </div>

        <!-- Social Login Buttons -->
        <div class="space-y-3 mb-6">
          <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 border-2 border-gray-200 rounded-xl bg-white hover:border-primary-300 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span class="font-medium text-dark">Continue with Google</span>
          </button>
          <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 border-2 border-gray-200 rounded-xl bg-white hover:border-primary-300 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4A154B" d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>
            </svg>
            <span class="font-medium text-dark">Continue with Slack</span>
          </button>
          <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 border-2 border-gray-200 rounded-xl bg-white hover:border-primary-300 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#000" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.96-3.03-1.53-.35-.2-.6-.31-.92-.29-.32.02-.57.17-.74.46-1.34 2.3-2.85 4.43-4.44 6.4-.4.5-.87.75-1.45.75-.66 0-1.13-.25-1.54-.75-.67-1.8-1.2-3.33-1.57-4.53-.14-.44-.1-.85.14-1.25.24-.4.62-.65 1.1-.73.28-.04.54.01.78.17 1.03.67 2.08 1.3 3.15 1.87.35.18.55.29.86.27.32-.02.54-.15.72-.4.82-1.12 1.6-2.2 2.33-3.23.29-.4.58-.6 1.02-.6.44 0 .75.2 1.03.6.65 1.07 1.24 2.06 1.74 2.97.5.9.8 1.65.87 2.3.07.65-.12 1.17-.58 1.58-.42.38-.9.57-1.42.55-.52-.01-.95-.23-1.33-.66l-.22.32zm.4-3.33c-.3-.9-.63-1.82-1-2.75-.17-.43-.42-.66-.83-.64-.4.02-.65.27-.8.7-.6 1.73-1.25 3.46-1.96 5.2-.17.43-.04.75.3 1.01.35.25.75.3 1.11.13.55-.27 1.05-.6 1.5-.98.48-.4.8-.8 1.03-1.27.23-.47.26-.97.05-1.37l.6-.03zM21.96 6.41c-.35-1.05-.78-1.9-1.27-2.55-.5-.65-1.05-1.05-1.65-1.2-.6-.15-1.25.03-1.95.55-.7.52-1.18 1.28-1.44 2.28-.26 1-.22 2.03.12 3.08.35 1.05.78 1.9 1.27 2.55.5.65 1.05 1.05 1.65 1.2.6.15 1.25-.03 1.95-.55s1.18-1.28 1.44-2.28c.26-1 .22-2.03-.12-3.08zM19.97 10c-.14-.45-.31-.85-.5-1.18-.2-.33-.4-.57-.62-.7-.22-.13-.45-.15-.7-.06-.25.09-.42.29-.52.6-.1.31-.08.7.06 1.17.14.47.32.88.52 1.24.2.36.41.62.62.77.21.15.42.18.63.1.21-.08.36-.27.44-.55.08-.28.05-.6-.1-.98l.17-.14z"/>
            </svg>
            <span class="font-medium text-dark">Continue with Apple</span>
          </button>
          <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 border-2 border-gray-200 rounded-xl bg-white hover:border-primary-300 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#0078D4" d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zm12.6 0H12.6V0H24v11.4z"/>
            </svg>
            <span class="font-medium text-dark">Continue with Outlook</span>
          </button>
          <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 border-2 border-gray-200 rounded-xl bg-white hover:border-primary-300 transition-colors">
            <i data-lucide="building-2" class="w-5 h-5 text-gray-600"></i>
            <span class="font-medium text-dark">Continue with SSO</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-4 mb-6">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-sm text-gray-500">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Email Form -->
        <form onsubmit="handleEmailLogin(event)">
          <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Work email</label>
            <input type="email" id="email" name="email" required placeholder="you@company.com" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all" />
          </div>
          <button type="submit" class="w-full py-3 px-4 font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-xl transition-colors btn-primary">
            Continue
          </button>
        </form>

        <!-- Footer -->
        <p class="text-xs text-gray-500 text-center mt-6">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#" class="text-primary-600 hover:underline">Terms</a> and <a href="#" class="text-primary-600 hover:underline">Privacy Policy</a>.
        </p>

        <!-- Sign up link -->
        <p class="text-sm text-gray-600 text-center mt-6">
          Don't have an account? <a href="signup.html" class="text-primary-600 font-semibold hover:text-primary-700">Sign up for free</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function handleEmailLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      // In production, this would redirect to an authentication flow
      alert('Email login flow would proceed for: ' + email);
    }
  </script>
</body>
</html>
