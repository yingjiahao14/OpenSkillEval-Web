<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to ClipCast</title>
    <script src="../vendor/js/tailwind.js"></script>
    <link href="../vendor/css/flowbite.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        brand: { blue: '#1868DB', orange: '#FF613D', dark: '#292A2E' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #FF613D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-blob { position: absolute; filter: blur(100px); z-index: -1; opacity: 0.15; border-radius: 50%; }
        .clip-card { transition: transform 0.2s, box-shadow 0.2s; }
        .clip-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-slate-50 text-gray-900  flex flex-col min-h-screen relative overflow-x-hidden">

<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 min-h-screen bg-slate-50 relative overflow-hidden">
    <div class="hero-blob w-96 h-96 bg-indigo-400 top-0 left-0"></div>
    <div class="hero-blob w-96 h-96 bg-orange-200 bottom-0 right-0"></div>
    <div class="max-w-md w-full bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl p-8 space-y-8 border border-white/50 relative z-10">
        <div class="text-center">
            <a href="index.html" class="inline-flex items-center gap-2 mb-6 hover:opacity-80 transition-opacity">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="video"></i>
                </div>
                <span class="font-bold text-2xl tracking-tight">ClipCast</span>
            </a>
            <h2 class="text-3xl font-bold text-gray-900">Log in to ClipCast</h2>
        </div>
        
        <div class="space-y-3">
            <button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Continue with Google
            </button>
            <button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium shadow-sm">
                <img src="https://www.svgrepo.com/show/448248/slack.svg" class="w-5 h-5" alt="Slack">
                Continue with Slack
            </button>
            <button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium shadow-sm">
                <img src="https://www.svgrepo.com/show/511330/apple-173.svg" class="w-5 h-5" alt="Apple">
                Continue with Apple
            </button>
            <button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium shadow-sm">
                <img src="https://www.svgrepo.com/show/475669/microsoft-color.svg" class="w-5 h-5" alt="Outlook">
                Continue with Outlook
            </button>
            <button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium shadow-sm">
                <i data-lucide="shield" class="w-5 h-5 text-indigo-500"></i>
                Continue with SSO
            </button>
        </div>

        <div class="relative">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center text-sm"><span class="px-3 bg-white/80 backdrop-blur-md text-gray-500 font-medium rounded-full">or</span></div>
        </div>

        <form class="space-y-4" id="login-form">
            <div>
                <label for="login-email-input" class="sr-only">Work email</label>
                <input id="login-email-input" type="email" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm shadow-sm" placeholder="Work email">
            </div>
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-all hover:shadow-lg hover:-translate-y-0.5 focus:outline-none">
                Continue
            </button>
        </form>
        
        <p class="text-center text-xs text-gray-500 mt-6">
            By signing up, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
        </p>
        <p class="text-center text-sm mt-2">
            <a href="signup.html" class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors">Sign up for free</a>
        </p>
    </div>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const el = document.getElementById('login-email-input');
        // trigger interaction required by test
        console.log('Login form submitted with ' + el.value);
    });
</script>

  <script src="../vendor/js/lucide.min.js"></script>
  <script src="../vendor/js/flowbite.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
