<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1868DB', 50: '#EBF2FD', 100: '#D6E4FB', 200: '#ADC9F7', 400: '#5C93EF', 600: '#1357B8', 700: '#0E4695' },
            accent: '#FF613D',
            dark: '#292A2E',
          },
          fontFamily: { sans: ['"Inter"', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .social-btn { transition: all 0.2s ease; }
    .social-btn:hover { background-color: #f3f4f6; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .continue-btn { transition: all 0.2s ease; }
    .continue-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(24,104,219,0.35); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="w-full py-6 px-6">
    <a href="index.html" class="flex items-center gap-2 w-fit">
      <svg viewBox="0 0 36 36" fill="none" class="w-9 h-9">
        <rect width="36" height="36" rx="10" fill="#1868DB"/>
        <path d="M14.5 11v14l11-7-11-7z" fill="white"/>
      </svg>
      <span class="text-xl font-bold text-dark">ClipCast</span>
    </a>
  </header>

  <!-- Login Form -->
  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg shadow-gray-200/60 border border-gray-100 p-8 sm:p-10">
        <h1 class="text-2xl font-bold text-dark text-center mb-8">Log in to ClipCast</h1>

        <!-- Social Login Buttons -->
        <div class="space-y-3">
          <button class="social-btn w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-sm font-medium text-dark bg-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>

          <button class="social-btn w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-sm font-medium text-dark bg-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M5.042 15.165a2.528 2.528 0 01-2.52 2.523A2.528 2.528 0 010 15.165a2.527 2.527 0 012.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 012.521-2.52 2.527 2.527 0 012.521 2.52v6.313A2.528 2.528 0 018.834 24a2.528 2.528 0 01-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 01-2.521-2.52A2.528 2.528 0 018.834 0a2.528 2.528 0 012.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 012.521 2.521 2.528 2.528 0 01-2.521 2.521H2.522A2.528 2.528 0 010 8.834a2.528 2.528 0 012.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 012.522-2.521A2.528 2.528 0 0124 8.834a2.528 2.528 0 01-2.522 2.521h-2.522V8.834zm-1.27 0a2.528 2.528 0 01-2.523 2.521 2.527 2.527 0 01-2.52-2.521V2.522A2.527 2.527 0 0115.163 0a2.528 2.528 0 012.523 2.522v6.312zM15.163 18.956a2.528 2.528 0 012.523 2.522A2.528 2.528 0 0115.163 24a2.527 2.527 0 01-2.52-2.522v-2.522h2.52zm0-1.27a2.527 2.527 0 01-2.52-2.523 2.526 2.526 0 012.52-2.52h6.315A2.528 2.528 0 0124 15.163a2.528 2.528 0 01-2.522 2.523h-6.315z" fill="#E01E5A"/></svg>
            Continue with Slack
          </button>

          <button class="social-btn w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-sm font-medium text-dark bg-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Continue with Apple
          </button>

          <button class="social-btn w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-sm font-medium text-dark bg-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#0078d4" d="M2 3h9.5v9.5H2V3zm10.5 0H22v9.5h-9.5V3zM2 13.5h9.5V23H2v-9.5zm10.5 0H22V23h-9.5v-9.5z"/></svg>
            Continue with Outlook
          </button>

          <button class="social-btn w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-sm font-medium text-dark bg-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#292A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Continue with SSO
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-sm text-gray-400 font-medium">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Email Input -->
        <form onsubmit="event.preventDefault();">
          <label for="email" class="block text-sm font-medium text-dark mb-2">Work email</label>
          <input type="email" id="email" placeholder="you@company.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all" />
          <button type="submit" class="continue-btn w-full mt-4 px-4 py-3 bg-primary text-white font-semibold rounded-xl text-sm">
            Continue
          </button>
        </form>

        <!-- Terms -->
        <p class="text-xs text-gray-400 text-center mt-6 leading-relaxed">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's
          <a href="#" class="text-primary hover:underline">Terms</a> and
          <a href="#" class="text-primary hover:underline">Privacy Policy</a>.
        </p>
      </div>

      <!-- Sign up link -->
      <p class="text-sm text-gray-500 text-center mt-6">
        Don't have an account? <a href="signup.html" class="text-primary font-semibold hover:underline">Sign up for free</a>
      </p>
    </div>
  </main>
</body>
</html>
