<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1868DB; --primary-dark: #1255b8; --accent: #FF613D;
      --text-dark: #292A2E; --text-body: #4B5563; --text-muted: #6B7280;
      --bg: #FFFFFF; --bg-light: #F8FAFC; --border: #E2E8F0;
      --radius: 12px; --radius-sm: 8px;
      --shadow: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 20px 40px rgba(0,0,0,0.10);
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-dark); background: var(--bg-light); min-height: 100dvh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }

    /* HEADER */
    header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.2rem; color: var(--text-dark); }
    .logo svg { color: var(--primary); }
    .header-link { font-size: 0.88rem; color: var(--text-muted); }
    .header-link a { color: var(--primary); font-weight: 600; }
    .header-link a:hover { text-decoration: underline; }

    /* MAIN CONTENT */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .login-card { background: var(--bg); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 48px 44px; width: 100%; max-width: 440px; }
    @media (max-width: 480px) { .login-card { padding: 32px 24px; } }

    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 28px; text-align: center; }

    /* SOCIAL BUTTONS */
    .social-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .social-btn { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); font-weight: 600; font-size: 0.9rem; color: var(--text-dark); display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 150ms; cursor: pointer; }
    .social-btn:hover { border-color: #9CA3AF; background: var(--bg-light); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .social-btn:active { transform: translateY(0); }
    .social-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .social-icon-google { font-size: 0.9rem; font-weight: 800; }
    .social-icon-slack { font-size: 0.8rem; font-weight: 800; color: #4A154B; }
    .social-icon-apple { font-size: 1.1rem; }
    .social-icon-outlook { font-size: 0.8rem; font-weight: 800; color: #0078D4; }
    .social-icon-sso { font-size: 0.7rem; font-weight: 800; color: #6B7280; }

    /* DIVIDER */
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }

    /* EMAIL FORM */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; }
    input[type="email"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 0.95rem; color: var(--text-dark); background: var(--bg); transition: border-color 150ms, box-shadow 150ms; outline: none; }
    input[type="email"]::placeholder { color: var(--text-muted); }
    input[type="email"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24,104,219,0.1); }
    input[type="email"]:invalid:not(:placeholder-shown) { border-color: #EF4444; }
    .field-error { font-size: 0.8rem; color: #EF4444; margin-top: 5px; display: none; }
    input:invalid:not(:placeholder-shown) + .field-error { display: block; }

    .btn-continue { width: 100%; padding: 13px; border-radius: var(--radius-sm); font-weight: 700; font-size: 1rem; background: var(--primary); color: #fff; transition: all 150ms; box-shadow: 0 2px 8px rgba(24,104,219,0.25); margin-top: 4px; }
    .btn-continue:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(24,104,219,0.3); }
    .btn-continue:active { transform: translateY(0); }
    .btn-continue:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* FOOTER TEXT */
    .legal-text { font-size: 0.78rem; color: var(--text-muted); text-align: center; margin-top: 20px; line-height: 1.6; }
    .legal-text a { color: var(--primary); }
    .legal-text a:hover { text-decoration: underline; }
    .signup-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-muted); }
    .signup-link a { color: var(--primary); font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="logo" aria-label="ClipCast home">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <rect width="28" height="28" rx="8" fill="currentColor"/>
      <path d="M10 9l9 5-9 5V9z" fill="#fff"/>
    </svg>
    ClipCast
  </a>
  <div class="header-link">
    Don't have an account? <a href="signup.html">Sign up for free</a>
  </div>
</header>

<!-- MAIN -->
<main>
  <div class="login-card">
    <h1>Log in to ClipCast</h1>

    <!-- SOCIAL LOGINS -->
    <div class="social-grid" role="list">
      <button class="social-btn" role="listitem" type="button" aria-label="Continue with Google">
        <span class="social-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </span>
        Continue with Google
      </button>
      <button class="social-btn" role="listitem" type="button" aria-label="Continue with Slack">
        <span class="social-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5.042 15.165a2.528 2.528 0 01-2.52 2.523A2.528 2.528 0 010 15.165a2.527 2.527 0 012.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 012.521-2.52 2.527 2.527 0 012.521 2.52v6.313A2.528 2.528 0 018.834 24a2.528 2.528 0 01-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 01-2.521-2.52A2.528 2.528 0 018.834 0a2.527 2.527 0 012.521 2.522v2.52H8.834zM8.834 6.313a2.527 2.527 0 012.521 2.521 2.527 2.527 0 01-2.521 2.521H2.522A2.528 2.528 0 010 8.834a2.528 2.528 0 012.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 012.522-2.521A2.528 2.528 0 0124 8.834a2.527 2.527 0 01-2.522 2.521h-2.522V8.834zM17.688 8.834a2.527 2.527 0 01-2.523 2.521 2.526 2.526 0 01-2.52-2.521V2.522A2.527 2.527 0 0115.165 0a2.528 2.528 0 012.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 012.523 2.522A2.528 2.528 0 0115.165 24a2.527 2.527 0 01-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 01-2.52-2.523 2.526 2.526 0 012.52-2.52h6.313A2.527 2.527 0 0124 15.165a2.528 2.528 0 01-2.522 2.523h-6.313z" fill="#E01E5A"/>
          </svg>
        </span>
        Continue with Slack
      </button>
      <button class="social-btn" role="listitem" type="button" aria-label="Continue with Apple">
        <span class="social-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.701"/>
          </svg>
        </span>
        Continue with Apple
      </button>
      <button class="social-btn" role="listitem" type="button" aria-label="Continue with Outlook">
        <span class="social-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0078D4">
            <path d="M24 7.387v13.176A1.44 1.44 0 0122.562 22H9.44A1.44 1.44 0 018 20.563V18H16.5A2.5 2.5 0 0019 15.5V8h3.563A1.437 1.437 0 0124 7.387zM16 2H2.5A2.5 2.5 0 000 4.5v11A2.5 2.5 0 002.5 18H16a2.5 2.5 0 002.5-2.5v-11A2.5 2.5 0 0016 2zm-6 12.5c-3.038 0-5-1.972-5-4.5S6.962 5.5 10 5.5c3.038 0 5 1.972 5 4.5s-1.962 4.5-5 4.5z"/>
          </svg>
        </span>
        Continue with Outlook
      </button>
      <button class="social-btn" role="listitem" type="button" aria-label="Continue with SSO">
        <span class="social-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </span>
        Continue with SSO
      </button>
    </div>

    <!-- DIVIDER -->
    <div class="divider" role="separator" aria-hidden="true">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <!-- EMAIL FORM -->
    <form id="login-form" novalidate onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label for="email">Work email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
          aria-required="true"
          aria-describedby="email-error"
        >
        <span class="field-error" id="email-error" role="alert">Please enter a valid work email address.</span>
      </div>
      <button type="submit" class="btn-continue" id="continue-btn">Continue</button>
    </form>

    <!-- LEGAL -->
    <p class="legal-text">
      By signing up, you acknowledge that you have read and understood, and agree to ClipCast's
      <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </p>

    <!-- SIGNUP LINK -->
    <p class="signup-link">
      Don't have an account? <a href="signup.html">Sign up for free</a>
    </p>
  </div>
</main>

<script>
  function handleLoginSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('email');
    const btn = document.getElementById('continue-btn');

    if (!email.validity.valid || !email.value.trim()) {
      email.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    // Simulate async flow
    setTimeout(() => {
      btn.textContent = 'Check your email';
      btn.style.background = '#10B981';
    }, 1200);
  }
</script>
</body>
</html>
