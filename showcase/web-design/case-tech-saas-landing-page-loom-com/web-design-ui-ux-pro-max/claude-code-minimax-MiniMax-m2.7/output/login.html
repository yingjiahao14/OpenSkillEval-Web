<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #7C3AED;
      --primary-dark: #6D28D9;
      --primary-light: #A78BFA;
      --accent: #FF613D;
      --text: #292A2E;
      --text-secondary: #6B7280;
      --bg: #FFFFFF;
      --bg-secondary: #F9FAFB;
      --border: #E5E7EB;
      --white: #FFFFFF;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; line-height: 1.2; }
    a { color: inherit; text-decoration: none; }

    .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    .nav-logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .nav-logo svg { width: 32px; height: 32px; }
    .nav-link { font-weight: 500; font-size: 15px; color: var(--text-secondary); }
    .nav-link:hover { color: var(--primary); }

    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .login-card { background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 48px; width: 100%; max-width: 440px; border: 1px solid var(--border); }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header h1 { font-size: 28px; margin-bottom: 8px; }
    .login-header p { font-size: 15px; color: var(--text-secondary); }

    .social-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .social-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 20px; border-radius: var(--radius); font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); background: var(--white); color: var(--text); }
    .social-btn:hover { background: var(--bg-secondary); border-color: var(--text-secondary); }
    .social-btn svg { width: 20px; height: 20px; }
    .social-btn.google svg { color: #4285F4; }
    .social-btn.slack svg { color: #4A154B; }
    .social-btn.apple svg { color: #000000; }
    .social-btn.outlook svg { color: #0078D4; }
    .social-btn.sso { background: var(--primary); color: white; border-color: var(--primary); }
    .social-btn.sso:hover { background: var(--primary-dark); }

    .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }
    .form-group input::placeholder { color: var(--text-secondary); }

    .submit-btn { width: 100%; padding: 14px 24px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .submit-btn:hover { background: var(--primary-dark); }

    .login-footer { margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary); }
    .login-footer a { color: var(--primary); font-weight: 500; }
    .login-footer a:hover { text-decoration: underline; }

    .footer { padding: 24px 40px; text-align: center; font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--border); }
    .footer a { color: var(--text-secondary); margin: 0 12px; }
    .footer a:hover { color: var(--primary); }

    @media (max-width: 768px) {
      .nav { padding: 16px 24px; }
      .main { padding: 24px; }
      .login-card { padding: 32px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M10 8L22 16L10 24V8Z" fill="white"/></svg>
      ClipCast
    </a>
    <a href="signup.html" class="nav-link">Sign up for free</a>
  </nav>

  <main class="main">
    <div class="login-card">
      <div class="login-header">
        <h1>Log in to ClipCast</h1>
        <p>Welcome back! Enter your work email to continue.</p>
      </div>

      <div class="social-buttons">
        <button class="social-btn google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <button class="social-btn slack">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
          Continue with Slack
        </button>
        <button class="social-btn apple">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continue with Apple
        </button>
        <button class="social-btn outlook">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 18.5V5.5C1 4.12 2.12 3 3.5 3H12.09C12.76 3 13.38 3.34 13.73 3.88L21.83 15.79C22.22 16.39 22.22 17.17 21.83 17.77L13.73 29.12C13.38 29.66 12.76 30 12.09 30H3.5C2.12 30 1 28.88 1 27.5V18.5Z"/></svg>
          Continue with Outlook
        </button>
        <button class="social-btn sso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Continue with SSO
        </button>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Work email</label>
          <input type="email" id="email" placeholder="you@company.com" required>
        </div>
        <button type="submit" class="submit-btn">Continue</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="signup.html">Sign up for free</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <a href="#">Terms</a>
    <a href="#">Privacy</a>
    <a href="#">Cookies</a>
    <a href="#">Help</a>
  </footer>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert('Login flow would proceed with: ' + email);
    }
  </script>
</body>
</html>
