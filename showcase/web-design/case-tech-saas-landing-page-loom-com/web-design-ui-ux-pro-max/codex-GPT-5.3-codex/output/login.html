<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ClipCast</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <header class="site-header"><div class="container nav-wrap">
    <a class="brand" href="index.html"><span class="brand-mark"></span>ClipCast</a>
    <nav class="nav-links" aria-label="Main">
      <a href="enterprise.html">Enterprise</a>
      <a href="pricing.html">Pricing</a>
      <a href="login.html">Login</a>
      <a href="signup.html" class="btn btn-primary">Get Started for free</a>
    </nav>
  </div></header>

  <main class="auth-wrap">
    <section class="auth-grid">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p>Continue with your workspace credentials.</p>
        <div class="social-list">
          <button class="btn btn-ghost social-btn">Continue with Google</button>
          <button class="btn btn-ghost social-btn">Continue with Slack</button>
          <button class="btn btn-ghost social-btn">Continue with Apple</button>
          <button class="btn btn-ghost social-btn">Continue with Outlook</button>
          <button class="btn btn-ghost social-btn">Continue with SSO</button>
        </div>
        <label for="work-email">Work email</label>
        <input id="work-email" class="input" type="email" placeholder="you@company.com" />
        <button id="continue-email-btn" class="btn btn-primary" style="width:100%;">Continue</button>
        <p id="email-flow-message" aria-live="polite"></p>
        <p>New to ClipCast? <a href="signup.html" style="color:#5b3df5;font-weight:700;">Sign up for free</a></p>
      </div>
      <div class="auth-card">
        <h3>Why teams choose ClipCast</h3>
        <p>Record, share, and collaborate without meeting overload.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
