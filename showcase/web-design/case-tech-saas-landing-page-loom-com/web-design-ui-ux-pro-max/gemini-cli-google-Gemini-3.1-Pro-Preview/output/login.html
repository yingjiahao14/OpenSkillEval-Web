<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>

  <div class="auth-layout">
    <div class="auth-form-container">
      <div class="auth-form-inner">
        <a href="index.html" class="nav-logo" style="margin-bottom: 40px; display: inline-flex; justify-content: center; width: 100%;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </a>
        
        <h2 class="text-center mb-8">Log in to ClipCast</h2>
        
        <div class="social-logins">
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12s4.48 10 10 10 10-4.48 10-10z"></path></svg>
            Continue with Google
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Continue with Slack
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path><path d="M10 2c1 .5 2 2 2 5h-2c0-3-1-4-2-5Z"></path></svg>
            Continue with Apple
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            Continue with Outlook
          </button>
          <button class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Continue with SSO
          </button>
        </div>

        <div class="divider">or</div>

        <form class="auth-form">
          <div class="form-group">
            <label class="form-label">Work email</label>
            <input type="email" class="form-input" placeholder="name@company.com" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Continue</button>
        </form>

        <p class="text-center mt-8 text-sm text-light">
          No account? <a href="signup.html">Sign up for free</a>
        </p>
        
        <p class="text-center mt-8 text-sm text-light" style="font-size: 0.75rem;">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
