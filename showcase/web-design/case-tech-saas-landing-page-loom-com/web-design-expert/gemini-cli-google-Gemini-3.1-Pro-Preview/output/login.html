<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header minimal -->
  <header class="header" style="position: absolute; width: 100%; border: none; background: transparent;">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon"></span>
        ClipCast
      </a>
      <div class="nav-actions">
        <span class="text-small" style="font-weight:500;">New to ClipCast?</span>
        <a href="signup.html" class="text-small" style="font-weight:600; color:var(--primary);">Sign up for free</a>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-form-wrapper">
      <div class="auth-form text-center">
        <h2 style="margin-bottom:32px;">Log in to ClipCast</h2>
        
        <button class="social-btn">
          <span style="margin-right:8px;">G</span> Continue with Google
        </button>
        <button class="social-btn">
          <span style="margin-right:8px;">#</span> Continue with Slack
        </button>
        <button class="social-btn">
          <span style="margin-right:8px;">A</span> Continue with Apple
        </button>
        <button class="social-btn">
          <span style="margin-right:8px;">O</span> Continue with Outlook
        </button>
        <button class="social-btn">
          Continue with SSO
        </button>

        <div class="divider">or</div>

        <form id="loginForm">
          <div class="form-group text-left">
            <label for="email" class="visually-hidden">Work email</label>
            <input type="email" id="email" class="form-control" placeholder="Work email" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Continue</button>
        </form>

        <p class="text-small mt-8" style="color:var(--text-muted);">
          By logging in, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Proceeds to email-based auth flow
      console.log('Login form submitted');
    });
  </script>
</body>
</html>
