<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCast — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-main">
    <div class="auth-form">
      <a href="index.html" class="nav-logo" style="margin-bottom:40px;display:inline-flex">
        <svg viewBox="0 0 32 32" fill="none" width="32" height="32"><rect width="32" height="32" rx="8" fill="#1868DB"/><polygon points="12,8 26,16 12,24" fill="white"/></svg>
        ClipCast
      </a>

      <h1>Log in to ClipCast</h1>

      <div class="auth-social-buttons">
        <button class="auth-social-btn">
          <svg viewBox="0 0 20 20" fill="none"><path d="M18.17 8.37H10v3.45h4.59C14.07 13.8 12.24 15 10 15a5 5 0 1 1 3.17-8.87l2.56-2.56A8.97 8.97 0 0 0 10 1 9 9 0 1 0 19 10c0-.56-.05-1.1-.15-1.63h-8.68Z" fill="#4285F4"/><path d="M2.18 6.12A9 9 0 0 0 10 19a8.6 8.6 0 0 0 5.73-2.13l-2.56-2.56A5.4 5.4 0 0 1 10 15a5 5 0 0 1-4.69-3.25L2.18 6.12Z" fill="#34A853"/></svg>
          Continue with Google
        </button>
        <button class="auth-social-btn">
          <svg viewBox="0 0 20 20" fill="none"><path d="M7.5 2h5l5 5.5v5l-5 5.5h-5l-5-5.5v-5L7.5 2Z" fill="#4A154B"/><path d="M8 8h4v4H8V8Z" fill="white"/></svg>
          Continue with Slack
        </button>
        <button class="auth-social-btn">
          <svg viewBox="0 0 20 20" fill="none"><path d="M14.5 1.5c1.54 0 3 .8 3.88 2.09A5.5 5.5 0 0 1 15.8 14H4.2a5.5 5.5 0 0 1-2.58-10.41A4.5 4.5 0 0 1 5.5 1.5h.1A4.5 4.5 0 0 1 10 4.08 4.5 4.5 0 0 1 14.5 1.5Z" stroke="#333" stroke-width="1.2"/><path d="M10 10V16M7 13l3 3 3-3" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Continue with Apple
        </button>
        <button class="auth-social-btn">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="16" height="16" rx="2" stroke="#0078D4" stroke-width="1.2"/><path d="M2 10H10V18H4C2.9 18 2 17.1 2 16V10Z" fill="#0078D4"/><path d="M10 2H16C17.1 2 18 2.9 18 4V10H10V2Z" fill="#0078D4" opacity="0.7"/></svg>
          Continue with Outlook
        </button>
        <button class="auth-social-btn">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 2L2 7V17L10 12L18 17V7L10 2Z" stroke="#666" stroke-width="1.2" stroke-linejoin="round"/></svg>
          Continue with SSO
        </button>
      </div>

      <div class="auth-divider"><span>or</span></div>

      <form onsubmit="event.preventDefault()">
        <div class="auth-input-group">
          <label for="email">Work email</label>
          <input type="email" id="email" placeholder="you@company.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Continue</button>
      </form>

      <p class="auth-footer">By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>

      <div class="auth-link">
        <a href="signup.html">Sign up for free</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
