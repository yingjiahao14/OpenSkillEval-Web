<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .login-panel { display: flex; flex-direction: column; justify-content: center; padding: 48px; max-width: 440px; margin: 0 auto; width: 100%; }
    .login-panel .nav-logo { margin-bottom: 40px; font-size: 1.5rem; }
    .login-panel h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 24px; }
    .login-visual {
      background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .login-visual::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 50%);
    }
    .login-visual-inner {
      text-align: center; color: #fff; position: relative; z-index: 1; padding: 48px;
    }
    .login-visual-inner .big-icon { font-size: 6rem; margin-bottom: 24px; }
    .login-visual-inner h2 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
    .login-visual-inner p { font-size: 1.0625rem; opacity: 0.9; }
    @media (max-width: 768px) {
      .login-page { grid-template-columns: 1fr; }
      .login-visual { display: none; }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-panel">
      <a href="index.html" class="nav-logo"><span class="dot"></span>ClipCast</a>
      <h1>Log in to ClipCast</h1>

      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 127 127"><path fill="#E01E5A" d="M27.2 80c0 7.3-5.9 13.2-13.2 13.2S.8 87.3.8 80s5.9-13.2 13.2-13.2h13.2V80zm6.6 0c0-7.3 5.9-13.2 13.2-13.2s13.2 5.9 13.2 13.2v33c0 7.3-5.9 13.2-13.2 13.2s-13.2-5.9-13.2-13.2V80z"/><path fill="#36C5F0" d="M47 27c-7.3 0-13.2-5.9-13.2-13.2S39.7.6 47 .6s13.2 5.9 13.2 13.2V27H47zm0 6.7c7.3 0 13.2 5.9 13.2 13.2s-5.9 13.2-13.2 13.2H13.9C6.6 60.1.7 54.2.7 46.9s5.9-13.2 13.2-13.2H47z"/><path fill="#2EB67D" d="M99.9 46.9c0-7.3 5.9-13.2 13.2-13.2s13.2 5.9 13.2 13.2-5.9 13.2-13.2 13.2H99.9V46.9zm-6.6 0c0 7.3-5.9 13.2-13.2 13.2s-13.2-5.9-13.2-13.2V13.8C66.9 6.5 72.8.6 80.1.6s13.2 5.9 13.2 13.2v33.1z"/><path fill="#ECB22E" d="M80.1 99.8c7.3 0 13.2 5.9 13.2 13.2s-5.9 13.2-13.2 13.2-13.2-5.9-13.2-13.2V99.8h13.2zm0-6.6c-7.3 0-13.2-5.9-13.2-13.2s5.9-13.2 13.2-13.2h33.1c7.3 0 13.2 5.9 13.2 13.2s-5.9 13.2-13.2 13.2H80.1z"/></svg>
        Continue with Slack
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Continue with Apple
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#0078D4" d="M21.17 3.25Q21.5 3.25 21.76 3.5 22 3.74 22 4.08V19.92Q22 20.26 21.76 20.5 21.5 20.75 21.17 20.75H7.83Q7.5 20.75 7.24 20.5 7 20.26 7 19.92V17H2.83Q2.5 17 2.24 16.76 2 16.5 2 16.17V7.83Q2 7.5 2.24 7.24 2.5 7 2.83 7H7V4.08Q7 3.74 7.24 3.5 7.5 3.25 7.83 3.25M7 13.06L8.18 15.28H9.97L8 12.06L9.93 8.89H8.22L7.13 10.9L7.09 10.96L7.06 10.9L5.96 8.89H4.26L6.18 12.06L4.21 15.28H6L7 13.06M20.25 19.5V8.25H14.75V19.5H20.25M13.25 19.5V8.25H7.75V19.5H13.25M17.36 15.3V13.96H15.5V12.38H17.36V11.04H15.5V9.66H17.36V8.32H14.25V16.64H17.36V15.3M11.86 15.3V13.96H10V12.38H11.86V11.04H10V9.66H11.86V8.32H8.75V16.64H11.86V15.3Z"/></svg>
        Continue with Outlook
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#555" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4a3 3 0 013 3 3 3 0 01-3 3 3 3 0 01-3-3 3 3 0 013-3zm0 14c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08C16.71 17.72 14.5 19 12 19z"/></svg>
        Continue with SSO
      </button>

      <div class="divider">or</div>

      <form onsubmit="event.preventDefault(); alert('Proceeding to email authentication...');">
        <input type="email" class="input" placeholder="Work email" required>
        <button type="submit" class="btn btn-primary" style="width:100%;">Continue</button>
      </form>

      <p class="form-footer">
        By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </p>
      <p class="form-footer" style="margin-top:12px;">
        Don't have an account? <a href="signup.html">Sign up for free</a>
      </p>
    </div>

    <div class="login-visual">
      <div class="login-visual-inner">
        <div class="big-icon">🎬</div>
        <h2>Welcome back</h2>
        <p>Log in to continue creating and sharing powerful video messages with your team.</p>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
</body>
</html>
