<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top nav -->
  <nav class="nav">
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="logo">
          <div class="logo-mark"></div>
          ClipCast
        </a>
      </div>
    </div>
  </nav>

  <!-- Auth shell -->
  <div class="auth-shell">
    <div class="auth-main">
      <div class="auth-card">

        <h1>Log in to ClipCast</h1>

        <!-- Social login buttons -->
        <div class="social-btns">
          <button class="social-btn">
            <span class="ico">G</span>
            Log in with Google
          </button>
          <button class="social-btn">
            <span class="ico">S</span>
            Log in with Slack
          </button>
          <button class="social-btn">
            <span class="ico">🍎</span>
            Log in with Apple
          </button>
          <button class="social-btn">
            <span class="ico">📧</span>
            Log in with Outlook
          </button>
          <button class="social-btn">
            <span class="ico">🔐</span>
            Log in with SSO
          </button>
        </div>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Email form -->
        <form class="auth-form">
          <input type="email" class="input-field" placeholder="Work email">
          <button type="submit" style="background: var(--dark); color: white;">Continue</button>
        </form>

        <!-- Footer text -->
        <p class="auth-foot">
          By signing up, you acknowledge that you have read and understood, and agree to ClipCast's Terms and Privacy Policy.
        </p>

        <!-- Sign up link -->
        <p class="auth-foot">
          <a href="signup.html" class="auth-link">Sign up for free</a>
        </p>

      </div>
    </div>
  </div>

</body>
</html>
