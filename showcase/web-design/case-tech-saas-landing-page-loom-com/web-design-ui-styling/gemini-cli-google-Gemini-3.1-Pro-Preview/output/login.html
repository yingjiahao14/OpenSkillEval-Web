<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to ClipCast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { blue: '#1868DB', orange: '#FF613D', dark: '#292A2E', light: '#F7F9FC' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: #292A2E; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

<div class="mb-8 flex items-center justify-center gap-3">
  <a href="index.html" class="flex items-center gap-2">
    <div class="w-10 h-10 bg-brand-blue rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-sm">C</div>
    <span class="font-extrabold text-2xl tracking-tight text-brand-dark">ClipCast</span>
  </a>
</div>

<main class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8 sm:p-10 relative overflow-hidden">
  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-blue via-purple-500 to-brand-orange"></div>
  
  <h1 class="text-2xl font-bold text-center mb-8 text-gray-900">Log in to ClipCast</h1>

  <div class="space-y-3 mb-8">
    <button class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
      Continue with Google
    </button>
    <button class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition">
      <img src="https://www.svgrepo.com/show/448248/slack.svg" alt="Slack" class="w-5 h-5">
      Continue with Slack
    </button>
    <button class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition">
      <img src="https://www.svgrepo.com/show/511330/apple-173.svg" alt="Apple" class="w-5 h-5">
      Continue with Apple
    </button>
    <button class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition">
      <img src="https://www.svgrepo.com/show/355152/outlook.svg" alt="Outlook" class="w-5 h-5">
      Continue with Outlook
    </button>
    <button class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition">
      <span class="w-5 h-5 text-center leading-5 text-gray-500 font-bold"> SSO </span>
      Continue with SSO
    </button>
  </div>

  <div class="relative flex items-center justify-center mb-8">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-gray-200"></div>
    </div>
    <span class="relative px-4 text-sm text-gray-500 bg-white">or</span>
  </div>

  <form id="login-form" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Work email</label>
      <input type="email" id="email" required placeholder="name@company.com" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent transition text-gray-900">
    </div>
    <button type="submit" class="w-full bg-brand-blue text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
      Continue
    </button>
  </form>

  <p class="text-xs text-center text-gray-500 mt-8 leading-relaxed">
    By signing up, you acknowledge that you have read and understood, and agree to ClipCast's <a href="#" class="underline hover:text-brand-blue">Terms</a> and <a href="#" class="underline hover:text-brand-blue">Privacy Policy</a>.
  </p>
</main>

<div class="mt-8 text-sm text-gray-600">
  New to ClipCast? <a href="signup.html" class="font-bold text-brand-blue hover:underline">Sign up for free</a>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if(email) {
      alert(`Proceeding to email-based authentication flow for: ${email}`);
      // In a real app, this would navigate to the next step
    }
  });
</script>

</body>
</html>
