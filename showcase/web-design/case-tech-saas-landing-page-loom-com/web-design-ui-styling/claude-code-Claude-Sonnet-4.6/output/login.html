<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to ClipCast</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }

    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .auth-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--gray-200);
    }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; border-radius: var(--radius-lg); }
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--dark);
      margin-bottom: 32px;
      text-decoration: none;
    }

    .auth-logo .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1rem;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .auth-sub {
      font-size: 0.9rem;
      color: var(--gray-500);
      text-align: center;
      margin-bottom: 28px;
    }

    .sso-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .social-btn-compact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-200);
      background: var(--white);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--dark);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .social-btn-compact:hover { border-color: var(--gray-400); background: var(--gray-50); }

    .social-icon {
      width: 18px; height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      flex-shrink: 0;
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--gray-400);
      text-align: center;
      line-height: 1.6;
    }
    .auth-footer a { color: var(--primary); }
    .auth-footer a:hover { text-decoration: underline; }

    .auth-switch {
      margin-top: 20px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--gray-600);
    }
    .auth-switch a { color: var(--primary); font-weight: 600; }
    .auth-switch a:hover { text-decoration: underline; }

    /* SSO full width */
    .sso-full {
      grid-column: 1 / -1;
    }

    /* Minimal header */
    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
    }

    .header-links { display: flex; gap: 16px; font-size: 0.875rem; }
    .header-links a { color: var(--gray-600); }
    .header-links a:hover { color: var(--dark); }
  </style>
</head>
<body>

<!-- Minimal header -->
<header class="auth-header">
  <a href="index.html" class="auth-logo" style="margin-bottom:0;">
    <div class="logo-icon" style="width:28px;height:28px;font-size:0.875rem;border-radius:8px;background:linear-gradient(135deg,var(--primary),#6366f1);display:flex;align-items:center;justify-content:center;color:white;">▶</div>
    <span style="font-weight:800;font-size:1.0625rem;">ClipCast</span>
  </a>
  <div class="header-links">
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="signup.html">Sign up free</a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Log in to ClipCast</h1>
    <p class="auth-sub">Welcome back! Choose your login method.</p>

    <!-- Google (full width, primary) -->
    <button class="social-btn" style="margin-bottom:8px;" onclick="handleSocialLogin('Google')">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- 2x2 grid of social options -->
    <div class="sso-row">
      <button class="social-btn-compact" onclick="handleSocialLogin('Slack')">
        <span class="social-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 10.4a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0-3.9a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill="#E01E5A"/><path d="M9.9 8a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0-4a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill="#2EB67D"/><path d="M6.6 8a1.5 1.5 0 010 3 1.5 1.5 0 010-3zm3.9 0a1.5 1.5 0 010 3 1.5 1.5 0 010-3z" fill="#ECB22E"/><path d="M3.5 4.1a1.5 1.5 0 010 3 1.5 1.5 0 010-3zm3.1 0a1.5 1.5 0 010 3 1.5 1.5 0 010-3z" fill="#36C5F0"/></svg>
        </span>
        Slack
      </button>
      <button class="social-btn-compact" onclick="handleSocialLogin('Apple')">
        <span class="social-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.182 0c.057.57-.145 1.384-.644 2.024-.492.63-1.29 1.12-2.086 1.054-.077-.607.168-1.315.63-1.967.506-.7 1.37-1.18 2.1-1.111zM14 11.46c-.207.63-.47 1.19-.8 1.683a7.99 7.99 0 01-.822 1.027c-.298.296-.603.445-.916.445-.25 0-.617-.087-1.1-.26a2.914 2.914 0 00-1.13-.263c-.32 0-.655.088-.996.263-.344.176-.624.264-.839.264-.295 0-.604-.144-.923-.432a8.126 8.126 0 01-.899-1.112c-.64-1.007-1.15-2.194-1.35-3.264C4.074 8.603 4 7.78 4 7c0-1.162.257-2.11.77-2.84.514-.73 1.215-1.13 2.103-1.168.348-.012.71.086 1.094.295.383.208.71.313.982.313.22 0 .548-.106.98-.317.435-.21.82-.317 1.157-.317.648 0 1.2.202 1.657.605.253.224.48.532.68.924a3.944 3.944 0 00-.853 1.182c-.18.41-.27.853-.27 1.33 0 .515.093.984.28 1.408.187.424.426.765.718 1.023-.215.607-.467 1.13-.755 1.573l-.363-.352z"/></svg>
        </span>
        Apple
      </button>
      <button class="social-btn-compact" onclick="handleSocialLogin('Outlook')">
        <span class="social-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect width="16" height="16" rx="3" fill="#0072C6"/><path d="M2 4l6 4 6-4v8a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" fill="white" opacity=".9"/><path d="M2 4l6 4 6-4" stroke="white" stroke-width="1" fill="none"/></svg>
        </span>
        Outlook
      </button>
      <button class="social-btn-compact sso-full" onclick="handleSocialLogin('SSO')" style="grid-column:1/-1;">
        <span class="social-icon">🔑</span>
        Sign in with SSO
      </button>
    </div>

    <!-- Divider -->
    <div class="divider" style="margin:20px 0;">or</div>

    <!-- Email form -->
    <form onsubmit="handleEmailLogin(event)">
      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label" for="loginEmail">Work email</label>
        <input
          class="form-input"
          type="email"
          id="loginEmail"
          name="email"
          placeholder="you@company.com"
          required
          autocomplete="email"
        />
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">
        Continue
      </button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="signup.html">Sign up for free</a>
    </div>

    <div class="auth-footer">
      By signing up, you acknowledge that you have read and understood, and agree to ClipCast's
      <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>
</main>

<script>
  function handleSocialLogin(provider) {
    // In a real app, this would initiate OAuth flow
    console.log('Login with', provider);
  }

  function handleEmailLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    if (email) {
      // In a real app, this would proceed to auth
      console.log('Email login:', email);
    }
  }
</script>
</body>
</html>
