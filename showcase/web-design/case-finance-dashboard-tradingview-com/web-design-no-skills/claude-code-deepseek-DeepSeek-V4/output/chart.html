<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart — ChartPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .chart-workspace-wrap {
    display: grid;
    grid-template-columns: 260px 1fr 310px;
    height: calc(100vh - 56px);
    overflow: hidden;
  }
  .chart-center {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chart-toolbar-row {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 40px;
  }
  .tool-btn {
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active-tool { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
  .tool-sep { width: 1px; height: 18px; background: var(--border-color); margin: 0 2px; }
  .tf-group { display: flex; gap: 1px; margin-left: 4px; }
  .tf-btn {
    padding: 4px 9px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
  }
  .tf-btn:first-child { border-radius: 4px 0 0 4px; }
  .tf-btn:last-child { border-radius: 0 4px 4px 0; }
  .tf-btn + .tf-btn { border-left: none; }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active-tf { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
  .chart-canvas-container {
    flex: 1;
    position: relative;
    background: #0a0a14;
    cursor: crosshair;
    min-height: 0;
  }
  .chart-canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .chart-price-axis {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 30px;
    width: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px 6px;
    font-size: 10px;
    color: var(--text-muted);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .chart-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 72px;
    font-weight: 800;
    color: rgba(255,255,255,0.02);
    pointer-events: none;
    white-space: nowrap;
  }
  .detail-ticker-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .detail-ticker-header .sym { font-size: 22px; font-weight: 800; }
  .detail-ticker-header .co { font-size: 11px; color: var(--text-secondary); }
  .detail-ticker-header .px { font-size: 30px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .detail-ticker-header .ch { font-size: 13px; margin-top: 1px; }
  .detail-tabs-row {
    display: flex;
    border-bottom: 1px solid var(--border-color);
  }
  .detail-tab {
    flex: 1;
    padding: 8px;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    color: var(--text-secondary);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font);
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .detail-tab:hover { color: var(--text-primary); }
  .detail-tab.active-detail { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
  .detail-subtabs {
    display: flex;
    padding: 8px 16px;
    gap: 16px;
  }
  .detail-subtab {
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 2px 0;
    border: none;
    background: none;
    font-family: var(--font);
    font-weight: 500;
  }
  .detail-subtab.active-sub { color: var(--accent-blue); font-weight: 600; }
  @media (max-width: 1100px) {
    .chart-workspace-wrap { grid-template-columns: 220px 1fr 270px; }
  }
  @media (max-width: 850px) {
    .chart-workspace-wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .detail-panel { max-height: 280px; }
    .watchlist { max-height: 180px; }
  }
</style>
</head>

<script>

function renderWatchlist() {
  const el = document.getElementById('watchlist-content');
  el.innerHTML = Object.entries(watchlistData).map(([cat, items]) => `
    <div class="wl-category">
      <div class="wl-cat-header" data-cat="${cat}">
        <span>${cat}</span>
        <span class="arrow open">&#9654;</span>
      </div>
      <div class="wl-items open" data-cat-items="${cat}">
        ${items.map(r => {
          const isNeg = r.chgp.startsWith('−');
          const cls = isNeg ? 'down' : 'up';
          return `<div class="wl-row" data-sym="${r.sym}">
            <span class="sym">${r.sym}</span>
            <span class="price">${r.last}</span>
            <span class="chg ${cls}">${r.chgp}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

// ===== Watchlist Accordion =====
document.getElementById('watchlist').addEventListener('click', function(e) {
  const header = e.target.closest('.wl-cat-header');
  if (header) {
    const items = header.parentElement.querySelector('.wl-items');
    const arrow = header.querySelector('.arrow');
    const isOpen = items.classList.contains('open');
    items.classList.toggle('open');
    arrow.classList.toggle('open');
    if (isOpen) {
      items.style.display = 'none';
    } else {
      items.style.display = 'block';
    }
  }
});

// ===== Detail Panel Content =====
function renderDetailStats() {

      <div class="detail-row"><span class="dl">1 year price target</span><span class="dv" style="color:var(--positive-green)">300.40 (+14.05%)</span></div>
      <div class="detail-row"><span class="dl">Technicals</span><span class="dv">Neutral</span></div>

      Apple's iPhone shipments in China rose 20% in Q1, the strongest growth among major smartphone vendors.

function renderDetailFinancials(view) {

    { label: 'Dividend yield TTM', value: '0.39%' },

function renderDetailNews() {

    { title: 'Services revenue hits all-time high, margins expand', time: '2 days ago' }

let currentDetailTab = 'stats';
let financialView = 'annual';

function updateDetailPanel() {
  const el = document.getElementById('detail-content');
  if (currentDetailTab === 'stats') el.innerHTML = renderDetailStats();
  else if (currentDetailTab === 'financials') el.innerHTML = renderDetailFinancials(financialView);
  else if (currentDetailTab === 'news') el.innerHTML = renderDetailNews();
}

document.getElementById('detail-tabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('detail-tab')) {
    this.querySelectorAll('.detail-tab').forEach(b => b.classList.remove('active-detail'));
    e.target.classList.add('active-detail');
    currentDetailTab = e.target.dataset.dtab;
    updateDetailPanel();
  }
});

document.getElementById('detail-panel').addEventListener('click', function(e) {
  if (e.target.classList.contains('detail-subtab')) {
    document.querySelectorAll('.detail-subtab').forEach(b => b.classList.remove('active-sub'));
    e.target.classList.add('active-sub');
    financialView = e.target.dataset.fs;
    updateDetailPanel();
  }
});

// ===== Toolbar =====
document.getElementById('toolbar').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.tool) {
    this.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active-tool'));
    btn.classList.add('active-tool');
  }
  if (btn.dataset.tf) {
    this.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active-tf'));
    btn.classList.add('active-tf');
    const periods = { '1D': 1, '5D': 5, '1M': 22, '3M': 66, '6M': 132, 'YTD': 88, '1Y': 252, '5Y': 1260, 'All': 0 };
    generateData(periods[btn.dataset.tf] || 252);
    drawChart();
  }
  if (btn.dataset.ind) {
    btn.classList.toggle('active-tool');
  }
});

// ===== Candlestick Chart =====
const canvas = document.getElementById('chart-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('chart-container');

let ohlcData = [];
let visibleData = [];
let chartMin = 0, chartMax = 0;

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function generateData(numBars) {
  let price = 263.40;
  ohlcData = [];
  const total = numBars || 252;
  for (let i = 0; i < total; i++) {
    const volatility = price * 0.015;
    const open = price;
    const close = open + (Math.random() - 0.48) * volatility;
    const high = Math.max(open, close) + Math.random() * volatility * 0.5;
    const low = Math.min(open, close) - Math.random() * volatility * 0.5;
    const volume = Math.floor(Math.random() * 20000000 + 20000000);
    ohlcData.push({ open, high, low, close, volume });
    price = close;
  }
  visibleData = ohlcData.slice(-Math.min(ohlcData.length, 120));
}

function drawChart() {
  const rect = container.getBoundingClientRect();
  const W = rect.width - 65;
  const H = rect.height - 30;
  const pad = { top: 10, right: 65, bottom: 30, left: 5 };
  const pw = W - pad.left - pad.right;
  const ph = H - pad.top - pad.bottom;

  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

  // Clear
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, W, H);

  if (visibleData.length === 0) return;

  // Compute range
  const prices = visibleData.flatMap(d => [d.high, d.low]);
  chartMin = Math.min(...prices);
  chartMax = Math.max(...prices);
  const range = chartMax - chartMin || 1;
  const padY = range * 0.05;
  const yMin = chartMin - padY;
  const yMax = chartMax + padY;
  const yRange = yMax - yMin;

  const toX = i => pad.left + (i / (visibleData.length - 1 || 1)) * pw;
  const toY = p => pad.top + (1 - (p - yMin) / yRange) * ph;
  const candleW = Math.max(1, Math.min(pw / visibleData.length * 0.7, 12));

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridLines = 6;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (i / gridLines) * ph;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
    // Price labels
    const price = yMax - (i / gridLines) * yRange;
    ctx.fillStyle = '#5a6080';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price.toFixed(2), W - 6, y + 3);
  }

  // Volume bars (bottom)
  const volMax = Math.max(...visibleData.map(d => d.volume));
  const volH = 40;
  const volY = H - pad.bottom - volH;
  visibleData.forEach((d, i) => {
    const x = toX(i);
    const bw = Math.max(1, candleW * 0.8);
    const h = (d.volume / volMax) * volH;
    ctx.fillStyle = d.close >= d.open ? 'rgba(0,200,83,0.3)' : 'rgba(247,82,95,0.3)';
    ctx.fillRect(x - bw / 2, volY + volH - h, bw, h);
  });

  // Candles
  visibleData.forEach((d, i) => {
    const x = toX(i);
    const isUp = d.close >= d.open;
    const color = isUp ? '#00c853' : '#F7525F';
    const bodyTop = toY(Math.max(d.open, d.close));
    const bodyBot = toY(Math.min(d.open, d.close));
    const bodyH = Math.max(1, bodyBot - bodyTop);

    // Wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, toY(d.high));
    ctx.lineTo(x, toY(d.low));
    ctx.stroke();

    // Body
    ctx.fillStyle = isUp ? color : color;
    ctx.fillRect(x - candleW / 2, bodyTop, candleW, bodyH);
    if (!isUp) {
      ctx.strokeStyle = color;
      ctx.strokeRect(x - candleW / 2, bodyTop, candleW, bodyH);
    }
  });

  // MA line (50 period SMA)
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  let firstPoint = true;
  for (let i = 49; i < visibleData.length; i++) {
    let sum = 0;
    for (let j = i - 49; j <= i; j++) sum += visibleData[j].close;
    const ma = sum / 50;
    const x = toX(i);
    const y = toY(ma);
    if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // MA label
  if (visibleData.length > 50) {
    let sum = 0;
    const last50 = visibleData.slice(-50);
    last50.forEach(d => sum += d.close);
    const lastMA = sum / 50;
    ctx.fillStyle = '#ff9800';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('MA(50)', pad.left + 4, toY(lastMA) - 4);
  }

  // Price axis
  const axisEl = document.getElementById('price-axis');
  const axisPrices = [];
  for (let i = 0; i <= 5; i++) {
    axisPrices.push(yMax - (i / 5) * yRange);
  }
  axisEl.innerHTML = axisPrices.map(p => `<span>${p.toFixed(2)}</span>`).join('');
}

// ===== Init =====
renderWatchlist();
updateDetailPanel();
resizeCanvas();
generateData(252);
drawChart();

window.addEventListener('resize', () => {
  resizeCanvas();
  drawChart();
});

// Watchlist click selects symbol
document.getElementById('watchlist').addEventListener('click', function(e) {
  const row = e.target.closest('.wl-row');
  if (row && row.dataset.sym) {
    document.getElementById('symbol-display').textContent =
      row.dataset.sym + ' · ChartPulse';
    generateData(252);
    drawChart();
  }
});

// Keyboard: arrow keys scroll chart
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' && visibleData.length > 0 && ohlcData.length > visibleData.length) {
    const idx = ohlcData.indexOf(visibleData[0]);
    const newStart = Math.min(idx + 5, ohlcData.length - visibleData.length);
    visibleData = ohlcData.slice(newStart, newStart + visibleData.length);
    drawChart();
  } else if (e.key === 'ArrowLeft') {
    const idx = ohlcData.indexOf(visibleData[0]);
    const newStart = Math.max(0, idx - 5);
    visibleData = ohlcData.slice(newStart, newStart + visibleData.length);
    drawChart();
  }
});
</script>
