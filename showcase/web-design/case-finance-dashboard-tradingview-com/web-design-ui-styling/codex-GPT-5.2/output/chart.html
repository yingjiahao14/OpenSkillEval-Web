<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Supercharts — ChartPulse</title>
    <meta name="description" content="Interactive charting workspace with watchlists, toolbars, and detailed stock panels." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="assets/partials.js"></script>
    <script>
      document.getElementById('app').innerHTML = `
        ${chartPulseHeader('chart')}
        <main class="container-wide workspace" data-chart-workspace>
          <div class="toolbar" aria-label="Chart toolbar">
            <div class="toolgroup" aria-label="Symbol and tools">
              <span class="badge" style="border-color: rgba(41,98,255,.28); background: rgba(41,98,255,.10)">Supercharts</span>
              <span class="pill">Candles</span>
              <button class="toolchip" aria-pressed="true">Crosshair</button>
              <button class="toolchip" aria-pressed="false">Trend line</button>
              <button class="toolchip" aria-pressed="false">Fib</button>
              <button class="toolchip" aria-pressed="false">Text</button>
              <button class="toolchip" aria-pressed="false">Measure</button>
              <span class="pill" style="border-color: rgba(34,199,184,.22); background: rgba(34,199,184,.09); color:#b6fff6">Indicators</span>
              <button class="toolchip" aria-pressed="false">RSI</button>
              <button class="toolchip" aria-pressed="false">MACD</button>
              <button class="toolchip" aria-pressed="false">VWAP</button>
            </div>
            <div class="toolgroup" aria-label="Actions">
              <span class="pill" data-chart-status>Timeframe: 3M</span>
              <a class="btn btn-compact" href="ideas.html">Publish idea</a>
              <a class="btn btn-compact btn-primary" href="brokers.html">Trade</a>
            </div>
          </div>

          <div class="workspace-grid" style="margin-top:12px">
            <!-- Left: Watchlist -->
            <aside class="panel" aria-label="Watchlist sidebar">
              <div class="panel-header">
                <h3>Watchlist</h3>
                <span class="pill">Live</span>
              </div>
              <div class="panel-body">
                <div class="accordion" data-accordion>
                  <div class="acc-item" data-open="true">
                    <button class="acc-header" aria-expanded="true" type="button">
                      <span>Indices <small>4</small></span>
                      <span class="muted">▾</span>
                    </button>
                    <div class="acc-body">
                      <table class="watch-table" aria-label="Indices watchlist">
                        <thead><tr><th>Symbol</th><th class="right">Last</th><th class="right">Chg</th><th class="right">Chg%</th></tr></thead>
                        <tbody>
                          <tr class="rowlink" data-watch-symbol="SPX"><td><strong>SPX</strong></td><td class="right mono">7,041.29</td><td class="right mono pos">+18.33</td><td class="right mono pos">+0.26%</td></tr>
                          <tr class="rowlink" data-watch-symbol="NDQ"><td><strong>NDQ</strong></td><td class="right mono">26,333.00</td><td class="right mono pos">+128.42</td><td class="right mono pos">+0.49%</td></tr>
                          <tr class="rowlink" data-watch-symbol="DJI"><td><strong>DJI</strong></td><td class="right mono">48,578.72</td><td class="right mono pos">+115.00</td><td class="right mono pos">+0.24%</td></tr>
                          <tr class="rowlink" data-watch-symbol="VIX"><td><strong>VIX</strong></td><td class="right mono">17.86</td><td class="right mono neg">−0.08</td><td class="right mono neg">−0.45%</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="acc-item" data-open="true">
                    <button class="acc-header" aria-expanded="true" type="button">
                      <span>Stocks <small>3</small></span>
                      <span class="muted">▾</span>
                    </button>
                    <div class="acc-body">
                      <table class="watch-table" aria-label="Stocks watchlist">
                        <thead><tr><th>Symbol</th><th class="right">Last</th><th class="right">Chg</th><th class="right">Chg%</th></tr></thead>
                        <tbody>
                          <tr class="rowlink" data-watch-symbol="AAPL"><td><strong>AAPL</strong></td><td class="right mono">263.40</td><td class="right mono neg">−3.03</td><td class="right mono neg">−1.14%</td></tr>
                          <tr class="rowlink" data-watch-symbol="TSLA"><td><strong>TSLA</strong></td><td class="right mono">388.90</td><td class="right mono neg">−3.05</td><td class="right mono neg">−0.78%</td></tr>
                          <tr class="rowlink" data-watch-symbol="NFLX"><td><strong>NFLX</strong></td><td class="right mono">107.79</td><td class="right mono pos">+0.08</td><td class="right mono pos">+0.07%</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="acc-item" data-open="false">
                    <button class="acc-header" aria-expanded="false" type="button">
                      <span>Futures <small>2</small></span>
                      <span class="muted">▸</span>
                    </button>
                    <div class="acc-body">
                      <table class="watch-table" aria-label="Futures watchlist">
                        <thead><tr><th>Symbol</th><th class="right">Last</th><th class="right">Chg</th><th class="right">Chg%</th></tr></thead>
                        <tbody>
                          <tr class="rowlink" data-watch-symbol="USOIL"><td><strong>USOIL</strong></td><td class="right mono">87.53</td><td class="right mono neg">−5.65</td><td class="right mono neg">−6.06%</td></tr>
                          <tr class="rowlink" data-watch-symbol="GOLD"><td><strong>GOLD</strong></td><td class="right mono">4,801.92</td><td class="right mono pos">+14.50</td><td class="right mono pos">+0.30%</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="acc-item" data-open="false">
                    <button class="acc-header" aria-expanded="false" type="button">
                      <span>Forex <small>2</small></span>
                      <span class="muted">▸</span>
                    </button>
                    <div class="acc-body">
                      <table class="watch-table" aria-label="Forex watchlist">
                        <thead><tr><th>Symbol</th><th class="right">Last</th><th class="right">Chg</th><th class="right">Chg%</th></tr></thead>
                        <tbody>
                          <tr class="rowlink" data-watch-symbol="EURUSD"><td><strong>EURUSD</strong></td><td class="right mono">1.17949</td><td class="right mono pos">+0.00138</td><td class="right mono pos">+0.12%</td></tr>
                          <tr class="rowlink" data-watch-symbol="GBPUSD"><td><strong>GBPUSD</strong></td><td class="right mono">1.35335</td><td class="right mono pos">+0.00080</td><td class="right mono pos">+0.06%</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="acc-item" data-open="false">
                    <button class="acc-header" aria-expanded="false" type="button">
                      <span>Crypto <small>2</small></span>
                      <span class="muted">▸</span>
                    </button>
                    <div class="acc-body">
                      <table class="watch-table" aria-label="Crypto watchlist">
                        <thead><tr><th>Symbol</th><th class="right">Last</th><th class="right">Chg</th><th class="right">Chg%</th></tr></thead>
                        <tbody>
                          <tr class="rowlink" data-watch-symbol="BTCUSD"><td><strong>BTCUSD</strong></td><td class="right mono">75,585</td><td class="right mono pos">+407</td><td class="right mono pos">+0.54%</td></tr>
                          <tr class="rowlink" data-watch-symbol="ETHUSD"><td><strong>ETHUSD</strong></td><td class="right mono">2,355.1</td><td class="right mono pos">+5.9</td><td class="right mono pos">+0.25%</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </aside>

            <!-- Center: Chart -->
            <section class="chart-stage" aria-label="Candlestick chart">
              <div class="chart-top">
                <div>
                  <div class="sym" data-chart-symbol>AAPL</div>
                  <div class="desc">Apple Inc · NASDAQ · USD</div>
                </div>
                <div class="timeframes" role="tablist" aria-label="Date range">
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="1D">1D</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="5D">5D</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="1M">1M</button>
                  <button class="tf" role="tab" aria-selected="true" data-timeframe="3M">3M</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="6M">6M</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="YTD">YTD</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="1Y">1Y</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="5Y">5Y</button>
                  <button class="tf" role="tab" aria-selected="false" data-timeframe="All">All</button>
                </div>
              </div>
              <div class="chart-canvas-wrap">
                <canvas data-candles style="width:100%; height:420px" aria-label="Candlestick chart canvas"></canvas>
              </div>
            </section>

            <!-- Right: Details -->
            <aside class="panel right-rail" aria-label="Stock detail panel">
              <div class="panel-header">
                <h3>Stock detail</h3>
                <span class="badge neu">AAPL</span>
              </div>
              <div class="panel-body">
                <div class="metric-grid">
                  <div class="metric"><div class="k">Price</div><div class="v mono">263.40 USD</div><div class="muted" style="margin-top:6px">Pre-market: <span class="mono">267.14</span> <span class="badge pos mono" style="margin-left:6px">+1.42%</span></div></div>
                  <div class="metric"><div class="k">Change</div><div class="v mono neg">−3.03 (−1.14%)</div><div class="muted" style="margin-top:6px">Volume 43.32 M · Avg <span class="mono">40.70 M</span></div></div>
                  <div class="metric"><div class="k">Market capitalization</div><div class="v mono">Market capitalization 3.87 T</div><div class="muted" style="margin-top:6px">Next earnings report In 14 days</div></div>
                  <div class="metric"><div class="k">Headline</div><div class="v" style="font-weight:800">Apple's iPhone shipments in China rose 20% in Q1</div></div>
                </div>

                <div style="height:12px"></div>

                <div class="panel" style="box-shadow:none; border-radius: 16px">
                  <div class="panel-header">
                    <h3>Key stats</h3>
                    <span class="pill">Realtime</span>
                  </div>
                  <div class="panel-body">
                    <div class="metric-grid">
                      <div class="metric"><div class="k">Ticker</div><div class="v">AAPL — Apple Inc — NASDAQ</div></div>
                      <div class="metric"><div class="k">Technicals</div><div class="v">Neutral</div></div>
                      <div class="metric"><div class="k">Performance 1W</div><div class="v mono pos">+1.70%</div></div>
                      <div class="metric"><div class="k">Performance 1M</div><div class="v mono pos">+4.13%</div></div>
                      <div class="metric"><div class="k">Performance 1Y</div><div class="v mono pos">+32.79%</div></div>
                      <div class="metric"><div class="k">1 year price target</div><div class="v mono">300.40 <span class="badge pos mono" style="margin-left:6px">(+14.05%)</span></div></div>
                    </div>
                  </div>
                </div>

                <div style="height:12px"></div>

                <div class="panel" style="box-shadow:none; border-radius: 16px">
                  <div class="panel-header">
                    <h3>Financials</h3>
                    <span class="badge neu">Income statement</span>
                  </div>
                  <div class="panel-body" data-tabs>
                    <div class="tabs" role="tablist" aria-label="Financial detail tabs">
                      <button class="tab" role="tab" aria-selected="true" data-tab="annual">Annual</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="quarterly">Quarterly</button>
                    </div>
                    <div role="tabpanel" data-panel="annual">
                      <div style="margin-top:10px" class="metric-grid">
                        <div class="metric"><div class="k">Dividend yield TTM</div><div class="v mono">0.39%</div></div>
                        <div class="metric"><div class="k">Payout ratio (TTM)</div><div class="v mono">13.03%</div></div>
                        <div class="metric"><div class="k">Last dividend payment</div><div class="v mono">0.26</div></div>
                        <div class="metric"><div class="k">Last ex-dividend date</div><div class="v mono">Feb 9, 2026</div></div>
                        <div class="metric"><div class="k">Analyst rating</div><div class="v">Neutral</div></div>
                        <div class="metric"><div class="k">Technicals</div><div class="v">Neutral</div></div>
                      </div>
                    </div>
                    <div role="tabpanel" data-panel="quarterly" hidden>
                      <table class="table" style="margin-top:10px">
                        <thead><tr><th>Quarter</th><th class="right">Dividend yield</th><th class="right">Payout</th><th class="right">Rating</th></tr></thead>
                        <tbody>
                          <tr><td>Q1</td><td class="right mono">0.39%</td><td class="right mono">13.03%</td><td class="right">Neutral</td></tr>
                          <tr><td>Q2</td><td class="right mono">0.39%</td><td class="right mono">13.03%</td><td class="right">Neutral</td></tr>
                          <tr><td>Q3</td><td class="right mono">0.39%</td><td class="right mono">13.03%</td><td class="right">Neutral</td></tr>
                          <tr><td>Q4</td><td class="right mono">0.39%</td><td class="right mono">13.03%</td><td class="right">Neutral</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </main>
        ${chartPulseFooter()}
      `;
    </script>
    <script src="assets/app.js"></script>
  </body>
</html>
