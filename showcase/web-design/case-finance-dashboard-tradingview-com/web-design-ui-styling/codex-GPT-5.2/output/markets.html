      function row(d){
        var cls = d.dir==='pos' ? 'pos' : (d.dir==='neg' ? 'neg' : 'muted');
        return `
          <tr>
            <td>${d.name}</td>
            <td class="muted">${d.ticker}</td>
            <td class="right mono">${d.price}</td>
            <td class="muted">${d.cur}</td>
            <td class="right mono ${cls}">${d.chg}</td>
            <td class="right"><svg class="spark" viewBox="0 0 110 28" preserveAspectRatio="none" data-spark="${d.spark}" data-direction="${d.sparkDir}"></svg></td>
          </tr>`;
      }

      function miniControls(){
        return `
          <span class="badge" style="border-color: rgba(41,98,255,.24); background: rgba(41,98,255,.10)">Mini charts</span>
          <span class="pill">Toggle: 1D / 1M / 3M / 1Y / 5Y / All</span>
          <span class="pill">Type: Area / Candles</span>`;
      }

      (function initAssetNav(){
        var tabs = document.getElementById('assetTabs');
        if(!tabs) return;
        tabs.querySelectorAll('[data-scroll]').forEach(function(btn){
          btn.addEventListener('click', function(){
            tabs.querySelectorAll('[role="tab"]').forEach(function(b){ b.setAttribute('aria-selected', b===btn ? 'true':'false'); });
            var sel = btn.getAttribute('data-scroll');
            var target = document.querySelector(sel);
            if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
          });
        });
      })();

      (function initMiniChartToggles(){
        var tf = document.getElementById('miniTf');
        var ty = document.getElementById('miniType');
        var out = document.getElementById('miniMode');
        function activeValue(root, attr){
          if(!root) return null;
          var a = root.querySelector('.tab[aria-selected="true"]');
          return a ? a.getAttribute(attr) : null;
        }
        function setActive(root, attr, val){
          if(!root) return;
          root.querySelectorAll('.tab').forEach(function(b){
            b.setAttribute('aria-selected', b.getAttribute(attr)===val ? 'true':'false');
          });
        }
        function reSeedAll(){
          var tfv = activeValue(tf,'data-mini-tf') || '1M';
          var tyv = activeValue(ty,'data-mini-type') || 'Area';
          if(out) out.textContent = tfv + ' · ' + tyv;
          // re-seed sparks deterministically by appending selection to data-spark
          document.querySelectorAll('svg[data-spark]').forEach(function(svg){
            var base = svg.getAttribute('data-spark-base') || svg.getAttribute('data-spark');
            if(!svg.getAttribute('data-spark-base')) svg.setAttribute('data-spark-base', base);
            svg.setAttribute('data-spark', base + '|' + tfv + '|' + tyv);
          });
          if(window.__chartpulse_reinit_sparks) window.__chartpulse_reinit_sparks();
        }

        function hook(root, attr){
          if(!root) return;
          root.querySelectorAll('.tab').forEach(function(btn){
            btn.addEventListener('click', function(){
              setActive(root, attr, btn.getAttribute(attr));
              reSeedAll();
            });
          });
        }
        hook(tf, 'data-mini-tf');
        hook(ty, 'data-mini-type');
        reSeedAll();
      })();
    </script>

      window.__chartpulse_reinit_sparks = function(){
