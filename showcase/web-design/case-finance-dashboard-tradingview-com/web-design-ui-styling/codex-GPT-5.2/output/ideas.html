<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ideas — ChartPulse</title>
    <meta name="description" content="Community-driven feed of trading ideas with filters and editor picks." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="assets/partials.js"></script>
    <script>
      document.getElementById('app').innerHTML = `
        ${chartPulseHeader('ideas')}
        <main class="container-wide">
          <section class="section">
            <div class="card">
              <div class="card-header">
                <div>
                  <h3 class="card-title">Ideas feed</h3>
                  <p class="card-subtitle">Community-driven analysis — filter by popularity, picks, and format</p>
                </div>
                <div class="kpi-row">
                  <a class="btn btn-compact" href="chart.html">Open chart</a>
                  <a class="btn btn-compact btn-primary" href="chart.html">Create idea</a>
                </div>
              </div>
              <div class="card-body" data-tabs>
                <div class="grid" style="grid-template-columns: 1fr 320px; gap:12px">
                  <div>
                    <div class="tabs" role="tablist" aria-label="Ideas filter tabs">
                      <button class="tab" role="tab" aria-selected="true" data-tab="popular">Popular</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="editors">Editors' picks</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="stocks">Stocks</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="crypto">Crypto</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="forex">Forex</button>
                      <button class="tab" role="tab" aria-selected="false" data-tab="futures">Futures</button>
                    </div>

                    <div role="tabpanel" data-panel="popular">
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:'Popular', sym:'AMD', title:'AMD — momentum continuation (+7.80%)', blurb:'Strong bid; watch pullback entries and reclaim of intraday VWAP.', badge:'+7.80%', dir:'pos', meta:['Stocks','NASDAQ'], sparkDir:'pos'})}
                        ${ideaCard({tag:'Popular', sym:'USOIL', title:'USOIL — volatility trend (−6.06%)', blurb:'Large sell pressure; levels near 87.53 critical for next bounce.', badge:'−6.06%', dir:'neg', meta:['Futures'], sparkDir:'neg'})}
                        ${ideaCard({tag:'Popular', sym:'RKLB', title:'RKLB — breakout watch (+12.68%)', blurb:'Momentum names in focus; confirm with higher highs.', badge:'+12.68%', dir:'pos', meta:['Stocks'], sparkDir:'pos'})}
                        ${ideaCard({tag:'Popular', sym:'BTCUSD', title:'BTCUSD — structure break (+0.54%)', blurb:'Continuation setup with risk defined below local lows.', badge:'+0.54%', dir:'pos', meta:['Crypto'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div role="tabpanel" data-panel="editors" hidden>
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:"Editors' picks", sym:'AAPL', title:'AAPL — mean reversion at 263.40', blurb:'Neutral bias; watch volume and reaction around key support.', badge:'−1.14%', dir:'neg', meta:['Stocks','NASDAQ'], sparkDir:'neg'})}
                        ${ideaCard({tag:"Editors' picks", sym:'ETHUSD', title:'ETHUSD — range continuation (+0.25%)', blurb:'ETH holds 2,355.1 with slow grind; look for confirmation candle.', badge:'+0.25%', dir:'pos', meta:['Crypto'], sparkDir:'pos'})}
                        ${ideaCard({tag:"Editors' picks", sym:'EURUSD', title:'EURUSD — trend channel (+0.12%)', blurb:'Continuation with tight risk below session lows.', badge:'+0.12%', dir:'pos', meta:['Forex'], sparkDir:'pos'})}
                        ${ideaCard({tag:"Editors' picks", sym:'GOLD', title:'GOLD — accumulation zone (+0.30%)', blurb:'Watch 4,801.92 level; spot/flows remain supportive.', badge:'+0.30%', dir:'pos', meta:['Futures'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div role="tabpanel" data-panel="stocks" hidden>
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:'Stocks', sym:'AAPL', title:'AAPL — fade after earnings run-up', blurb:'Monitor 43.32M volume days and reclaim levels.', badge:'−1.14%', dir:'neg', meta:['NASDAQ'], sparkDir:'neg'})}
                        ${ideaCard({tag:'Stocks', sym:'MSFT', title:'MSFT — trend strength (+2.20%)', blurb:'Higher highs; wait for pullback into support.', badge:'+2.20%', dir:'pos', meta:['NASDAQ'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div role="tabpanel" data-panel="crypto" hidden>
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:'Crypto', sym:'BTCUSD', title:'BTCUSD — continuation above 75,585', blurb:'Momentum strengthening; manage risk under local pivot.', badge:'+0.54%', dir:'pos', meta:['USD'], sparkDir:'pos'})}
                        ${ideaCard({tag:'Crypto', sym:'ETHUSD', title:'ETHUSD — slow grind at 2,355.1', blurb:'Look for clean break with volume confirmation.', badge:'+0.25%', dir:'pos', meta:['USD'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div role="tabpanel" data-panel="forex" hidden>
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:'Forex', sym:'EURUSD', title:'EURUSD — breakout hold', blurb:'Rate 1.17949 keeps bid; watch retest.', badge:'+0.12%', dir:'pos', meta:['FX'], sparkDir:'pos'})}
                        ${ideaCard({tag:'Forex', sym:'GBPUSD', title:'GBPUSD — tight range', blurb:'Rate 1.35335; wait for expansion candle.', badge:'+0.06%', dir:'pos', meta:['FX'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div role="tabpanel" data-panel="futures" hidden>
                      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:12px">
                        ${ideaCard({tag:'Futures', sym:'CL1!', title:'Light crude oil — sharp move (−7.36%)', blurb:'87.72 level in focus; volatility elevated.', badge:'−7.36%', dir:'neg', meta:['Energy'], sparkDir:'neg'})}
                        ${ideaCard({tag:'Futures', sym:'GC1!', title:'Gold — grind higher (+0.21%)', blurb:'4,818.6 spot; monitor breakouts on volume.', badge:'+0.21%', dir:'pos', meta:['Metals'], sparkDir:'pos'})}
                      </div>
                    </div>

                    <div class="card" style="margin-top:12px; box-shadow:none">
                      <div class="card-body" style="display:flex; align-items:center; justify-content:space-between; gap:12px">
                        <div class="muted">Pagination</div>
                        <div class="kpi-row">
                          <button class="btn btn-compact" disabled style="opacity:.6">Prev</button>
                          <span class="pill">Page 1 of 8</span>
                          <button class="btn btn-compact">Next</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <aside class="panel" style="box-shadow:none">
                    <div class="panel-header">
                      <h3>Filters</h3>
                      <span class="pill">Realtime</span>
                    </div>
                    <div class="panel-body">
                      <label style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px; border-radius:14px; border:1px solid rgba(148,163,184,.12); background: rgba(9,14,28,.50)">
                        <span style="font-weight:900">Videos only</span>
                        <input type="checkbox" id="videosOnly" style="width:18px; height:18px" />
                      </label>
                      <div class="muted" style="margin-top:10px; font-size:12px">Toggling this hides non-video ideas in the current tab (demo behavior).</div>
                      <div style="height:12px"></div>
                      <div class="metric"><div class="k">Hint</div><div class="v" style="font-weight:800">Use the chart watchlist for symbol context.</div><div style="margin-top:10px"><a class="btn btn-compact btn-primary" href="chart.html">Open Supercharts</a></div></div>
                    </div>
                  </aside>
                </div>
              </div>
            </div>
          </section>
        </main>
        ${chartPulseFooter()}
      `;

      function ideaCard(d){
        return `
        <article class="card" style="box-shadow:none" data-idea-card data-is-video="${d.isVideo ? 'true' : 'false'}">
          <div class="card-body">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
              <span class="badge neu">${d.tag}</span>
              <span class="badge ${d.dir==='pos'?'pos':'neg'} mono">${d.badge}</span>
            </div>
            <div style="margin-top:10px; font-weight:950">${d.title}</div>
            <div class="muted" style="margin-top:6px; font-size:12px; line-height:1.55">${d.blurb}</div>
            <div style="margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px">
              <div class="kpi-row">
                <span class="pill">${d.sym}</span>
                ${d.meta.map(m=>`<span class="badge neu">${m}</span>`).join('')}
                ${d.isVideo ? '<span class="badge" style="border-color: rgba(34,199,184,.26); background: rgba(34,199,184,.10); color:#b6fff6">Video</span>' : ''}
              </div>
              <svg class="spark" viewBox="0 0 110 28" preserveAspectRatio="none" data-spark="${d.sym}" data-direction="${d.sparkDir}"></svg>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end">
              <a class="btn btn-compact" href="chart.html">Open chart</a>
              <a class="btn btn-compact btn-primary" href="brokers.html">Trade</a>
            </div>
          </div>
        </article>`;
      }

      (function initVideoToggle(){
        var box = document.getElementById('videosOnly');
        if(!box) return;
        function apply(){
          var on = box.checked;
          document.querySelectorAll('[data-idea-card]').forEach(function(card){
            var isVideo = card.getAttribute('data-is-video') === 'true';
            card.style.display = (!on || isVideo) ? '' : 'none';
          });
        }
        box.addEventListener('change', apply);
      })();
    </script>
    <script src="assets/app.js"></script>
  </body>
</html>
