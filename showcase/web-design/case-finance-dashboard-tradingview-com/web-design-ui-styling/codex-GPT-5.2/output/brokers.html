<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Brokers — ChartPulse</title>
    <meta name="description" content="Verified broker listings with tiers, ratings, reviews, and promotions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="assets/partials.js"></script>
    <script>
      document.getElementById('app').innerHTML = `
        ${chartPulseHeader('brokers')}
        <main class="container-wide">
          <section class="section">
            <div class="hero-inner" style="grid-template-columns: 1.15fr .85fr">
              <div class="hero-copy" style="padding:18px">
                <span class="badge" style="border-color: rgba(34,199,184,.26); background: rgba(34,199,184,.10); color:#b6fff6">Verified brokers</span>
                <h1 style="font-size:30px">Trade with confidence across all markets.</h1>
                <p>Compare tiers, ratings, reviews, and promotions. Find the broker that matches your strategy — stocks, crypto, forex, futures, and options.</p>
                <div class="hero-ctas">
                  <a class="btn btn-primary" href="#list">Browse brokers</a>
                  <a class="btn btn-ghost" href="markets.html">Explore markets</a>
                </div>
              </div>
              <aside class="hero-side" style="padding:18px">
                <div class="section-title" style="padding:0">
                  <div>
                    <h2 style="margin:0">Platform statistics</h2>
                    <p>Scale that powers ChartPulse</p>
                  </div>
                  <span class="pill">Live</span>
                </div>
                <div class="metric"><div class="k">Traders connected through us</div><div class="v mono">100M+</div></div>
                <div class="metric"><div class="k">Successfully executed live orders</div><div class="v">Millions daily</div></div>
                <div class="metric"><div class="k">Tagline</div><div class="v">Every trade a <span class="badge" style="border-color: rgba(41,98,255,.26); background: rgba(41,98,255,.10)">#ChartPulse</span> trade</div></div>
              </aside>
            </div>
          </section>

          <section class="section" id="list">
            <div class="grid grid-2">
              <div class="card">
                <div class="card-header">
                  <div>
                    <h3 class="card-title">Broker listings</h3>
                    <p class="card-subtitle">Filter by category and sort by rating</p>
                  </div>
                </div>
                <div class="card-body">
                  <div class="grid" style="gap:12px">
                    <div class="card" style="box-shadow:none" data-tabs>
                      <div class="card-body">
                        <div class="tabs" role="tablist" aria-label="Broker category tabs">
                          <button class="tab" role="tab" aria-selected="true" data-tab="all">All brokers</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="stocks">Stocks</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="crypto">Crypto</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="forex">Forex</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="futures">Futures</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="etfs">ETFs</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="options">Options</button>
                        </div>
                        <div style="height:10px"></div>
                        <div class="tabs" role="tablist" aria-label="Broker rating tabs">
                          <button class="tab" role="tab" aria-selected="true" data-tab="best">Best rated</button>
                          <button class="tab" role="tab" aria-selected="false" data-tab="allSort">All brokers</button>
                        </div>
                        <div class="muted" style="margin-top:10px; font-size:12px">Both tab rows are interactive (demo). Listings below update by category + sort.</div>
                      </div>
                    </div>

                    <div id="brokerList" class="grid" style="gap:10px"></div>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header">
                  <div>
                    <h3 class="card-title">How we verify</h3>
                    <p class="card-subtitle">What power users care about</p>
                  </div>
                </div>
                <div class="card-body">
                  <div class="metric-grid">
                    <div class="metric"><div class="k">Tier badges</div><div class="v">Platinum / Gold signal breadth, support, and pricing.</div></div>
                    <div class="metric"><div class="k">Review integrity</div><div class="v">Ratings include review counts (e.g. <span class="mono">13.7K</span> Reviews).</div></div>
                    <div class="metric"><div class="k">Account scale</div><div class="v">Account counts surfaced (e.g. <span class="mono">175.7K</span> Accounts).</div></div>
                    <div class="metric"><div class="k">Promotions</div><div class="v">Clear offers like “Unlock ChartPulse Plus!”</div></div>
                  </div>
                  <div style="height:12px"></div>
                  <div class="metric"><div class="k">Next</div><div class="v" style="font-weight:800">Open Supercharts for execution-ready context.</div><div style="margin-top:10px"><a class="btn btn-compact btn-primary" href="chart.html">Open chart</a></div></div>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="card">
              <div class="card-header">
                <div>
                  <h3 class="card-title">Stats banner</h3>
                  <p class="card-subtitle">Platform-wide proof points</p>
                </div>
                <span class="pill">Always-on</span>
              </div>
              <div class="card-body">
                <div class="kpi-row">
                  <div class="kpi" style="min-width: 320px"><div><div class="label">Traders connected through us</div><div class="value mono">100M+</div></div><span class="badge neu">Global</span></div>
                  <div class="kpi" style="min-width: 360px"><div><div class="label">Successfully executed live orders</div><div class="value">Millions daily</div></div><span class="badge" style="border-color: rgba(34,199,184,.26); background: rgba(34,199,184,.10); color:#b6fff6">Scale</span></div>
                  <div class="kpi" style="min-width: 320px"><div><div class="label">Tagline</div><div class="value">#ChartPulse</div></div><span class="badge" style="border-color: rgba(41,98,255,.26); background: rgba(41,98,255,.10)">Brand</span></div>
                </div>
              </div>
            </div>
          </section>
        </main>
        ${chartPulseFooter()}
      `;

      // Data from source brief.
      var brokers = [
        {name:'FOREX.com', tier:'Platinum', rating:'4.5 Great', reviews:'13.7K Reviews', accounts:'175.7K Accounts', promo:'—', tags:['forex','all','best']},
        {name:'OKX', tier:'Platinum', rating:'4.9 Excellent', reviews:'22.5K Reviews', accounts:'239.9K Accounts', promo:'Unlock ChartPulse Plus!', tags:['crypto','all','best']},
        {name:'AMP Futures', tier:'Platinum', rating:'4.6 Excellent', reviews:'8.5K Reviews', accounts:'33.9K Accounts', promo:'—', tags:['futures','all','best']},
        {name:'moomoo', tier:'Gold', rating:'4.6 Excellent', reviews:'4K Reviews', accounts:'81.7K Accounts', promo:'8.1% APY + Free Premium', tags:['stocks','etfs','options','all']},
        {name:'OANDA', tier:'Platinum', rating:'4.5 Great', reviews:'31.3K Reviews', accounts:'296.7K Accounts', promo:'Free ChartPulse plan', tags:['forex','all','best']},
        {name:'Interactive Brokers', tier:'Platinum', rating:'4.2 Good', reviews:'36.4K Reviews', accounts:'343.2K Accounts', promo:'—', tags:['stocks','etfs','options','all']},
        {name:'TradeStation', tier:'Platinum', rating:'4.3 Good', reviews:'16.6K Reviews', accounts:'131.4K Accounts', promo:'$150 + $0 Options Fees', tags:['stocks','options','all']}
      ];

      function parseScore(s){
        var m = (s||'').match(/(\d+\.\d+)/);
        return m ? parseFloat(m[1]) : 0;
      }

      function card(b){
        var tierClass = b.tier==='Platinum' ? 'badge' : 'badge neu';
        var promo = b.promo && b.promo !== '—' ? `<div class="muted" style="margin-top:6px">${b.promo}</div>` : '';
        return `
          <article class="card" style="box-shadow:none">
            <div class="card-body">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
                <div style="font-weight:950">${b.name}</div>
                <div class="kpi-row">
                  <span class="${tierClass}" style="${b.tier==='Platinum' ? 'border-color: rgba(41,98,255,.28); background: rgba(41,98,255,.10)' : ''}">${b.tier}</span>
                  <span class="badge neu">${b.rating}</span>
                </div>
              </div>
              <div style="margin-top:10px" class="metric-grid">
                <div class="metric"><div class="k">Reviews</div><div class="v mono">${b.reviews}</div></div>
                <div class="metric"><div class="k">Accounts</div><div class="v mono">${b.accounts}</div></div>
              </div>
              ${promo}
              <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end">
                <a class="btn btn-compact" href="markets.html">Markets</a>
                <a class="btn btn-compact btn-primary" href="chart.html">Open chart</a>
              </div>
            </div>
          </article>`;
      }

      function render(){
        var cat = window.__brokerCategory || 'all';
        var sort = window.__brokerSort || 'best';
        var list = brokers.slice().filter(function(b){ return b.tags.indexOf(cat) !== -1; });
        if(sort === 'best') list.sort(function(a,b){ return parseScore(b.rating) - parseScore(a.rating); });
        var el = document.getElementById('brokerList');
        if(el) el.innerHTML = list.map(card).join('');
      }

      // Hook category + sort tabs (brokers-category-tabs, brokers-rating-tabs).
      (function hook(){
        window.__brokerCategory = 'all';
        window.__brokerSort = 'best';

        document.querySelectorAll('[aria-label="Broker category tabs"] .tab').forEach(function(btn){
          btn.addEventListener('click', function(){
            document.querySelectorAll('[aria-label="Broker category tabs"] .tab').forEach(function(b){ b.setAttribute('aria-selected', b===btn?'true':'false'); });
            var id = btn.getAttribute('data-tab');
            window.__brokerCategory = id;
            render();
          });
        });
        document.querySelectorAll('[aria-label="Broker rating tabs"] .tab').forEach(function(btn){
          btn.addEventListener('click', function(){
            document.querySelectorAll('[aria-label="Broker rating tabs"] .tab').forEach(function(b){ b.setAttribute('aria-selected', b===btn?'true':'false'); });
            var id = btn.getAttribute('data-tab');
            window.__brokerSort = (id === 'best') ? 'best' : 'all';
            render();
          });
        });
        render();
      })();
    </script>
    <script src="assets/app.js"></script>
  </body>
</html>
