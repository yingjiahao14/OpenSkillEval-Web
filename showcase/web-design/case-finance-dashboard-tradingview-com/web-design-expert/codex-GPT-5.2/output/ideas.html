<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartPulse Ideas</title>
  <meta name="description" content="Community-driven trading ideas with filters, cards, and pagination." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    body{font-family:Inter, var(--sans)}
    .chip{padding:7px 10px; border-radius:999px; border:1px solid color-mix(in oklch, var(--stroke) 55%, transparent); background: transparent; color:var(--muted); cursor:pointer; font-size:12px}
    .chip[aria-selected="true"]{background: color-mix(in oklch, var(--surface) 70%, transparent); color:var(--text); border-color: color-mix(in oklch, var(--brand) 25%, var(--stroke))}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="assets/partials.js"></script>
  <script>document.getElementById('app').insertAdjacentHTML('beforeend', ChartPulsePartials.nav('ideas'));</script>

  <main class="container" style="padding-top:18px">
    <section class="card" data-tabs="ideas-feed">
      <div class="hd">
        <div>
          <h2>Trading Ideas</h2>
          <p>Community analysis with tab-driven feed + asset chips.</p>
        </div>
        <div class="tabs" role="tablist" aria-label="Feed tabs">
          <button class="tab" data-tab="popular" role="tab">Popular</button>
          <button class="tab" data-tab="editors" role="tab">Editors’ picks</button>
          <button class="tab" data-tab="new" role="tab">New</button>
        </div>
      </div>
      <div class="bd">
        <!-- header-filters -->
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap">
          <div style="display:flex; gap:8px; flex-wrap:wrap" role="tablist" aria-label="Asset filters" data-tabs="ideas-asset">
            <button class="chip" data-tab="all" role="tab">All</button>
            <button class="chip" data-tab="stocks" role="tab">Stocks</button>
            <button class="chip" data-tab="crypto" role="tab">Crypto</button>
            <button class="chip" data-tab="forex" role="tab">Forex</button>
            <button class="chip" data-tab="futures" role="tab">Futures</button>
          </div>
          <div class="pill"><span class="muted">Tip:</span> open <a href="chart.html" class="btn" style="padding:7px 10px; border-radius:10px; margin-left:8px">Supercharts</a></div>
        </div>

        <div style="height:12px"></div>

        <!-- idea-feed -->
        <div data-panel="popular">
          ${feed('Popular')}
        </div>
        <div data-panel="editors" hidden>
          ${feed('Editors')}
        </div>
        <div data-panel="new" hidden>
          ${feed('New')}
        </div>

        <!-- pagination -->
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px">
          <div class="pill"><span class="muted">Page</span> <span class="num">1</span> <span class="muted">of</span> <span class="num">12</span></div>
          <div style="display:flex; gap:8px">
            <button class="btn" type="button" disabled style="opacity:.6">Prev</button>
            <button class="btn" type="button">Next</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function card({symbol, title, body, bias, asset, stats}){
      const cls = bias==='Bullish' ? 'good' : (bias==='Bearish' ? 'bad' : 'neutral');
      return `
        <div class="card" style="box-shadow:none">
          <div class="bd" style="padding:12px">
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px">
              <div>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
                  <span class="badge neutral">${asset}</span>
                  <span class="num">${symbol}</span>
                  <span class="badge ${cls}">${bias}</span>
                </div>
                <div style="margin-top:8px; font-weight:700">${title}</div>
                <div style="margin-top:6px; color:var(--muted); font-size:12px; line-height:1.55">${body}</div>
              </div>
              <div style="text-align:right">
                <div class="pill"><span class="muted">Views</span> <span class="num">${stats.views}</span></div>
                <div style="height:8px"></div>
                <div class="pill"><span class="muted">Likes</span> <span class="num">${stats.likes}</span></div>
              </div>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
              <button class="btn" type="button">Save</button>
              <button class="btn" type="button">Discuss</button>
              <a class="btn primary" href="chart.html">Open chart</a>
            </div>
          </div>
        </div>
      `;
    }

    function feed(kind){
      const base = [
        {symbol:'AAPL', asset:'Stocks', bias:'Neutral', title:'AAPL: support retest into earnings window', body:"Price 263.40 USD, down −1.14%. Earnings in 14 days — plan for volatility and watch key levels.", stats:{views:'92.1K', likes:'4.8K'}},
        {symbol:'BTCUSD', asset:'Crypto', bias:'Bullish', title:'BTCUSD: dominance steady, majors lead', body:"Bitcoin 75,593 USD (+0.55%). Market cap 2.54T USD (+1.37%). Look for continuation after consolidation.", stats:{views:'141.0K', likes:'10.2K'}},
        {symbol:'CL1!', asset:'Futures', bias:'Bearish', title:'WTI: breakdown after −7.36%', body:"Crude at 87.72 USD/barrel (−7.36%). Consider trend-following shorts or hedges; respect squeezes.", stats:{views:'66.4K', likes:'3.1K'}},
        {symbol:'EURUSD', asset:'Forex', bias:'Bullish', title:'EURUSD: slow grind higher', body:"EUR to USD 1.17932 (+0.13%). Favor pullbacks while holding higher lows.", stats:{views:'38.6K', likes:'1.7K'}},
      ];
      const tweak = (k) => k==='Editors' ? base.slice(0,3) : (k==='New' ? base.slice(1).concat([base[0]]) : base);
      const rows = tweak(kind);

      return `
        <div class="grid" style="gap:10px">
          ${rows.map(card).join('')}
        </div>
      `;
    }
  </script>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById('app').insertAdjacentHTML('beforeend', ChartPulsePartials.footer());
  </script>
</body>
</html>
