<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>#Web Scraping — OpenLearnHub</title>
    <meta name="description" content="Browse OpenLearnHub posts tagged Web Scraping." />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="partials.js" defer></script>
    <div id="site-header"></div>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        document.getElementById('site-header').innerHTML = olhHeader('tag-web-scraping.html') + olhBanner();
      });
    </script>

    <main id="main">
      <div class="container">
        <div class="tag-head">
          <div>
            <h1 class="page-title" id="tag-title" style="margin-bottom:6px">#WEB SCRAPING</h1>
            <div class="tag-count" id="tag-count"></div>
          </div>
          <a class="btn" href="index.html">Back to latest</a>
        </div>

        <section class="section" aria-label="Popular tags">
          <h2>Popular Tags</h2>
          <div class="popular-tags" id="popular"></div>
        </section>

        <section class="section" aria-label="Web scraping articles">
          <h2>Articles</h2>
          <p class="lede">Filtered to web scraping-related posts.</p>
          <div class="grid" id="grid"></div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        document.getElementById('site-footer').innerHTML = olhFooter();
      });
    </script>

    <template id="article-card-template">
      <article class="card">
        <div class="thumb">
          <img alt="" />
          <a class="tag" data-tag-link href="#"><span class="dot" aria-hidden="true"></span><span data-tag-text>#Tag</span></a>
        </div>
        <div class="card-body">
          <h3 class="card-title"><a data-title-link href="#"><span data-title></span></a></h3>
          <div class="meta">
            <div class="author">
              <div class="avatar" aria-hidden="true"></div>
              <div class="author-name" data-author></div>
            </div>
            <div data-time></div>
          </div>
        </div>
      </article>
    </template>

    <script>
      (function(){
        const d = window.OPENLEARNHUB_DATA;
        const tag = d.articles.byTag.scraping;
        document.getElementById('tag-title').textContent = tag.label;
        document.getElementById('tag-count').textContent = tag.countLabel;

        const popular = document.getElementById('popular');
        d.popularTags.slice(0, 5).forEach(t => {
          const el = document.createElement('div');
          el.className = 'chip';
          el.innerHTML = `<strong>${t.tag}</strong><span>${t.count}</span>`;
          popular.appendChild(el);
        });

        const grid = document.getElementById('grid');
        const tmpl = document.getElementById('article-card-template');
        tag.posts.forEach(item => {
          const node = tmpl.content.firstElementChild.cloneNode(true);
          node.querySelector('img').src = item.thumbnail;
          node.querySelector('img').alt = item.title;
          node.querySelector('[data-tag-text]').textContent = item.tag;
          node.querySelector('[data-tag-link]').href = item.tagHref;
          node.querySelector('[data-title]').textContent = item.title;
          node.querySelector('[data-author]').textContent = item.author;
          node.querySelector('[data-time]').textContent = item.time;
          grid.appendChild(node);
        });
      })();
    </script>

    <script src="assets/app.js"></script>
  </body>
</html>
