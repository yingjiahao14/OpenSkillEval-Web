<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Curriculum — OpenLearnHub</title>
    <meta name="description" content="A structured, syllabus-like curriculum with certification paths, daily challenges, and interview prep." />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="partials.js" defer></script>
    <div id="site-header"></div>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        document.getElementById('site-header').innerHTML = olhHeader('learn.html') + olhBanner();
      });
    </script>

    <main id="main">
      <div class="container">
        <h1 class="page-title">Curriculum</h1>
        <p class="page-subtitle" id="welcome"></p>

        <section class="section" aria-label="Recommended curriculum">
          <h2>Recommended Curriculum</h2>
          <p class="lede">Treat this like a syllabus: pick a path, go deep, track progress at your own pace.</p>
          <div class="syllabus" id="paths"></div>
        </section>

        <section class="section" aria-label="Daily challenge">
          <div class="panel">
            <h2 id="daily-cta"></h2>
            <p class="subtle">Build consistency — 15 minutes a day compounds fast.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <a class="btn primary" href="#" id="daily-1"></a>
              <a class="btn" href="#" id="daily-2"></a>
            </div>
          </div>
        </section>

        <section class="section" aria-label="Language and interview prep">
          <div class="two-col">
            <div class="panel">
              <h2 id="lang-head"></h2>
              <ul class="list" id="lang-list"></ul>
            </div>
            <div class="panel">
              <h2 id="int-head"></h2>
              <ul class="list" id="int-list"></ul>
            </div>
          </div>
        </section>

        <section class="section" aria-label="Professional certifications">
          <div class="panel">
            <h2 id="pro-head"></h2>
            <ul class="list" id="pro-list"></ul>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        document.getElementById('site-footer').innerHTML = olhFooter();
      });
    </script>

    <script>
      (function(){
        const d = window.OPENLEARNHUB_DATA;
        document.getElementById('welcome').textContent = d.curriculum.welcome;

        const paths = document.getElementById('paths');
        d.curriculum.paths.forEach(p => {
          const el = document.createElement('div');
          el.className = 'path';
          el.innerHTML = `
            <div class="icon" aria-hidden="true">${p.icon}</div>
            <div>
              <h3>${p.title}</h3>
              <p>${p.desc}</p>
            </div>`;
          paths.appendChild(el);
        });

        document.getElementById('daily-cta').textContent = d.curriculum.daily.cta;
        document.getElementById('daily-1').textContent = d.curriculum.daily.links[0];
        document.getElementById('daily-2').textContent = d.curriculum.daily.links[1];

        document.getElementById('lang-head').textContent = d.curriculum.language.heading;
        document.getElementById('int-head').textContent = d.curriculum.interview.heading;
        document.getElementById('pro-head').textContent = d.curriculum.professional.heading;

        const addItems = (ul, items) => items.forEach(x => {
          const li = document.createElement('li');
          li.textContent = x;
          ul.appendChild(li);
        });
        addItems(document.getElementById('lang-list'), d.curriculum.language.items);
        addItems(document.getElementById('int-list'), d.curriculum.interview.items);
        addItems(document.getElementById('pro-list'), d.curriculum.professional.items);
      })();
    </script>

    <script src="assets/app.js"></script>
  </body>
</html>
