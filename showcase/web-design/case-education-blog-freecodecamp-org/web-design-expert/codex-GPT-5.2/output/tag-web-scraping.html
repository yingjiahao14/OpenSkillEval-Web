<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Browse OpenLearnHub posts tagged Web Scraping." />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="tag-web-scraping">
    <script>
      (async function () {
        const host = document.createElement('div');
        const res = await fetch('partials/header.html').catch(() => null);
        if (res && res.ok) {
          host.innerHTML = await res.text();
          document.body.insertBefore(host, document.body.firstChild);
        }
      })();
    </script>

    <noscript>
      <div class="container" style="padding-top: 16px">
        <div class="card" style="padding: 16px">Tag lists are rendered with JavaScript.</div>
      </div>
    </noscript>

    <div class="banner">
      <div class="container">
        <div class="inner">
          <div class="title">Learn to code — free 3,000-hour curriculum</div>
          <a href="learn.html">Explore the curriculum</a>
        </div>
      </div>
    </div>

    <main id="main">
      <div class="container">
        <section aria-label="Tag header">
          <div class="section-head">
            <div>
              <div class="kicker">Tag</div>
              <h1>#WEB SCRAPING</h1>
              <p class="lede">A collection of 33 posts</p>
            </div>
          </div>
        </section>

        <section aria-label="Popular tags">
          <div class="section-head" style="margin-bottom: 12px">
            <div>
              <div class="kicker">Popular tags</div>
              <h2>Browse by topic</h2>
            </div>
          </div>
          <div class="tag-row" data-popular-tags></div>
        </section>

        <section class="mt-6" aria-label="Web scraping articles">
          <div class="section-head">
            <div>
              <div class="kicker">Articles</div>
              <h2>Web scraping guides</h2>
            </div>
          </div>
          <div class="grid cards" data-article-grid></div>
        </section>
      </div>
    </main>

    <script>
      (async function () {
        const host = document.createElement('div');
        const res = await fetch('partials/footer.html').catch(() => null);
        if (res && res.ok) {
          host.innerHTML = await res.text();
          document.body.appendChild(host);
        }
      })();
    </script>

    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/site.js"></script>
