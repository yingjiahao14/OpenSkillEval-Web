<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenLearnHub — Free Coding Tutorials</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">OpenLearnHub [A]</a>
      <div class="search-wrap"><input class="search-input" placeholder="Search 12,000+ tutorials, articles, and books" aria-label="Search" /></div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Forum</a><a href="learn.html">Curriculum</a><a class="cta" href="donate.html">Donate</a>
      </nav>
      <button class="menu-toggle" data-menu-toggle aria-expanded="false" aria-label="Open menu">☰</button>
    </div>
    <div class="container mobile-menu" data-mobile-menu>
      <a href="index.html">Forum</a><a href="learn.html">Curriculum</a><a href="donate.html">Donate</a>
    </div>
  </header>
  <main>
    <div class="container">
      <section class="hero">
        <h1>Read, build, and level up — for free.</h1>
        <p>OpenLearnHub publishes practical coding tutorials and structured learning paths for developers, data scientists, and lifelong learners.</p>
      </section>
      <div class="section-head"><h2>Latest Tutorials</h2></div>
      <section class="article-grid" data-article-grid>
      </section>
      <div class="load-wrap"><button class="button" data-load-more>Load More Articles</button></div>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    (function seedInitialCards() {
      const grid = document.querySelector('[data-article-grid]');
      if (!grid || !window.articles) return;
    })();
  </script>
</body>
</html>
