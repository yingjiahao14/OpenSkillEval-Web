<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="r1" cx="20%" cy="10%" r="70%">
      <stop offset="0" stop-color="#E7F7F5" stop-opacity="1"/>
      <stop offset="1" stop-color="#E7F7F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="85%" cy="15%" r="70%">
      <stop offset="0" stop-color="#FFE5E2" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFE5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02838D"/>
      <stop offset="1" stop-color="#27B3A5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B2B2D" flood-opacity="0.14"/>
    </filter>
    <style>
      .t1{font: 800 78px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; letter-spacing:-0.03em; fill:#1E2324;}
      .t2{font: 650 34px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; letter-spacing:-0.02em; fill:#02838D;}
      .t3{font: 600 24px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#526165;}
      .pill{font: 700 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="260" cy="110" r="330" fill="url(#r1)"/>
  <circle cx="980" cy="130" r="360" fill="url(#r2)"/>
  <circle cx="860" cy="560" r="430" fill="url(#r1)" opacity="0.85"/>

  <g filter="url(#shadow)">
    <rect x="110" y="106" width="124" height="124" rx="34" fill="url(#mark)"/>
    <path d="M165 128h14v36h36v14h-36v36h-14v-36h-36v-14h36z" fill="#FFFFFF" fill-opacity="0.94"/>
  </g>

  <text x="260" y="165" class="t1">WellSource</text>
  <text x="260" y="232" class="t2">Expert health guidance you can trust</text>
  <text x="260" y="278" class="t3">Medically reviewed content • Tools • Trusted resources</text>

  <g>
    <rect x="260" y="520" width="290" height="58" rx="28" fill="#E7F7F5" stroke="#27B3A5" stroke-opacity="0.65"/>
    <text x="286" y="558" class="pill" fill="#02838D">145 medical reviewers</text>

    <rect x="564" y="520" width="156" height="58" rx="28" fill="#FFF0DC" stroke="#F3A536" stroke-opacity="0.65"/>
    <text x="592" y="558" class="pill" fill="#965000">21 years</text>

    <rect x="736" y="520" width="254" height="58" rx="28" fill="#FFE5E2" stroke="#F46F61" stroke-opacity="0.6"/>
    <text x="764" y="558" class="pill" fill="#A0372D">55M monthly readers</text>
  </g>
</svg>