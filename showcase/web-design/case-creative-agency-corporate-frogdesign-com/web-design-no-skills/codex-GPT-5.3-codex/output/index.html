<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leap Studio — Your Reinvention and Experience Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --panel-2: #151515;
      --text: #ffffff;
      --muted: #a5a5a5;
      --line: #262626;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --max: 1240px;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
    }

    img { display: block; width: 100%; height: auto; }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(100% - 2.5rem, var(--max));
      margin-inline: auto;
    }

    .section { padding: 5.5rem 0; }

    .kicker {
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .78rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin: 0; }

    .title-xl {
      font-size: clamp(2rem, 5vw, 5rem);
      line-height: 1.02;
      letter-spacing: -.02em;
      font-weight: 800;
    }

    .title-lg {
      font-size: clamp(1.7rem, 3vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.015em;
      font-weight: 750;
    }

    .lead {
      margin-top: 1.25rem;
      color: #d2d2d2;
      max-width: 72ch;
      line-height: 1.65;
      font-size: 1.05rem;
    }

    .spacer-24 { margin-top: 1.5rem; }
    .spacer-32 { margin-top: 2rem; }
    .spacer-40 { margin-top: 2.5rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .8rem 1.15rem;
      border-radius: 999px;
      border: 1px solid #303030;
      color: #fff;
      background: transparent;
      font-weight: 600;
      transition: .25s ease;
      cursor: pointer;
    }

    .btn:hover,
    .btn:focus-visible {
      border-color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
      outline: none;
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #2f71d6;
      border-color: #2f71d6;
    }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #161616;
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo { font-weight: 800; letter-spacing: -.02em; font-size: 1.1rem; }

    .logo span { color: var(--blue); }

    .nav-links {
      display: flex;
      gap: 1.2rem;
      color: #d4d4d4;
      font-weight: 500;
      align-items: center;
    }

    .nav-links a { font-size: .95rem; }

    .nav-links a:hover { color: #fff; }

    .menu-toggle {
      display: none;
      border: 1px solid #333;
      background: #121212;
      color: #fff;
      border-radius: 10px;
      padding: .5rem .75rem;
    }

    .lang-wrap { position: relative; }

    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1px solid #2f2f2f;
      border-radius: 999px;
      background: #121212;
      color: #e8e8e8;
      padding: .5rem .8rem;
      font-size: .84rem;
      cursor: pointer;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + .55rem);
      right: 0;
      min-width: 190px;
      background: #141414;
      border: 1px solid #2f2f2f;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .lang-dropdown.open { display: block; }

    .lang-option {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: #ddd;
      padding: .75rem .9rem;
      cursor: pointer;
    }

    .lang-option:hover { background: #1f1f1f; color: #fff; }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 2rem;
      align-items: center;
      min-height: min(84vh, 820px);
      padding: 3rem 0 2rem;
    }

    .hero-card-wrap {
      position: relative;
      background: linear-gradient(170deg, #141414, #0f0f0f);
      border: 1px solid #262626;
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 460px;
      box-shadow: var(--shadow);
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(14px);
      transition: .55s ease;
      display: grid;
      grid-template-rows: 220px 1fr;
      pointer-events: none;
    }

    .hero-slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .hero-media {
      background-size: cover;
      background-position: center;
      filter: saturate(.7) contrast(1.04) brightness(.85);
    }

    .hero-content { padding: 1.3rem 1.25rem 1.4rem; }
    .hero-content h3 { font-size: 1.35rem; letter-spacing: -.01em; }
    .hero-content p { margin-top: .7rem; color: #cfcfcf; line-height: 1.5; }

    .carousel-controls {
      position: absolute;
      bottom: .85rem;
      right: .9rem;
      display: flex;
      gap: .5rem;
      z-index: 3;
    }

    .control-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #333;
      background: rgba(21,21,21,.9);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .dots {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
    }

    .dot {
      width: 34px;
      height: 4px;
      border: 0;
      border-radius: 999px;
      background: #353535;
      cursor: pointer;
    }

    .dot.active { background: var(--blue); }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-top: 1.5rem;
    }

    .tab {
      border: 1px solid #2d2d2d;
      background: #131313;
      color: #d0d0d0;
      border-radius: 999px;
      padding: .6rem 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: rgba(59, 130, 246, 0.13);
      border-color: var(--blue);
      color: #fff;
    }

    .team-carousel { position: relative; margin-top: 1.7rem; }

    .cards-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(270px, 1fr);
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: .35rem;
      scrollbar-width: thin;
    }

    .cards-track::-webkit-scrollbar { height: 8px; }
    .cards-track::-webkit-scrollbar-thumb { background: #2f2f2f; border-radius: 999px; }

    .team-card {
      scroll-snap-align: start;
      border: 1px solid #252525;
      border-radius: 16px;
      background: #121212;
      overflow: hidden;
      min-height: 420px;
      display: grid;
      grid-template-rows: 180px auto;
    }

    .team-photo {
      background-size: cover;
      background-position: center;
      filter: grayscale(.18) brightness(.9) contrast(1.1);
    }

    .team-body { padding: 1rem 1rem 1.1rem; }
    .team-name { font-size: 1.08rem; font-weight: 700; }
    .team-meta { color: #adadad; margin-top: .35rem; font-size: .92rem; line-height: 1.4; }
    .team-quote { margin-top: .8rem; color: #d4d4d4; line-height: 1.55; font-size: .95rem; }
    .team-link { margin-top: 1rem; display: inline-block; color: #8db7ff; font-size: .9rem; font-weight: 600; }

    .work-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(300px, 1fr);
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: .5rem;
      margin-top: 1.8rem;
      scrollbar-width: thin;
    }

    .work-card {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 16px;
      overflow: hidden;
      scroll-snap-align: start;
      min-height: 420px;
      display: grid;
      grid-template-rows: 180px auto;
    }

    .work-media { background-size: cover; background-position: center; filter: saturate(.76) brightness(.86); }

    .work-body { padding: 1rem 1rem 1.2rem; }
    .work-body h3 { font-size: 1.1rem; }
    .work-sub { margin-top: .35rem; color: #b8b8b8; font-size: .94rem; }
    .work-quote { margin-top: .8rem; color: #d8d8d8; line-height: 1.5; font-size: .93rem; }

    .cta-banner {
      background: linear-gradient(140deg, rgba(59,130,246,.15), rgba(245,158,11,.09));
      border: 1px solid #2d2d2d;
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      gap: 1.2rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .insight-grid,
    .principles-grid {
      margin-top: 1.8rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .insight-card,
    .principle {
      border: 1px solid #272727;
      border-radius: 14px;
      padding: 1rem;
      background: #121212;
    }

    .insight-type { color: var(--amber); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .insight-title { margin-top: .55rem; font-size: 1.02rem; line-height: 1.35; }
    .insight-link { margin-top: .9rem; display: inline-block; color: #93b9ff; font-size: .9rem; font-weight: 600; }

    .principle h3 { font-size: 1.02rem; }
    .principle p { margin-top: .6rem; color: #cbcbcb; line-height: 1.5; font-size: .94rem; }

    footer {
      border-top: 1px solid #1e1e1e;
      padding: 3rem 0 2rem;
      color: #c4c4c4;
    }

    .footer-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1.4fr 1fr 1fr;
    }

    .footer-links a { display: block; margin: .4rem 0; color: #e0e0e0; }

    .legal {
      border-top: 1px solid #212121;
      margin-top: 2rem;
      padding-top: 1rem;
      font-size: .86rem;
      color: #8f8f8f;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .cookie-banner {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      background: #151515;
      border: 1px solid #2f2f2f;
      border-radius: 14px;
      padding: 1rem;
      z-index: 120;
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .cookie-actions { display: flex; gap: .55rem; flex-wrap: wrap; }

    @media (max-width: 1024px) {
      .hero-grid { grid-template-columns: 1fr; min-height: auto; }
      .insight-grid, .principles-grid, .footer-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 760px) {
      .section { padding: 4.2rem 0; }
      .nav-links {
        display: none;
        position: absolute;
        top: 76px;
        left: 0;
        right: 0;
        background: #111;
        border-bottom: 1px solid #222;
        padding: 1rem 1.25rem;
        flex-direction: column;
        align-items: flex-start;
      }
      .nav-links.open { display: flex; }
      .menu-toggle { display: inline-block; }
      .insight-grid, .principles-grid, .footer-grid { grid-template-columns: 1fr; }
      .container { width: min(100% - 1.4rem, var(--max)); }
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="container nav-inner">
      <a class="logo" href="#hero">Leap<span>Studio</span></a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav class="nav-links" id="main-nav">
        <a href="#insights">Insights</a>
        <a href="#work">Work</a>
        <a href="#services">Services</a>
        <a href="#culture">Culture</a>
        <a href="#mark">Make Your Mark</a>
        <a href="#contact">Contact Us</a>
      </nav>
      <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" aria-expanded="false">Global EN ▾</button>
        <div class="lang-dropdown" id="langMenu" role="menu">
          <button class="lang-option" data-lang="Global EN">Global EN</button>
          <button class="lang-option" data-lang="France FR">France FR</button>
          <button class="lang-option" data-lang="China CN">China CN</button>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
