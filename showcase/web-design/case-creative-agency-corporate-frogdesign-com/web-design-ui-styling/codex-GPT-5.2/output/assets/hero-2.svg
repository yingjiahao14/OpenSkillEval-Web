    </filter>
  </defs>
  <rect width='100%' height='100%' fill='url(#g)'/>
  <rect width='100%' height='100%' filter='url(#n)' opacity='.35'/>
  <rect x='72' y='72' width='420' height='64' rx='18' fill='rgba(0,0,0,.35)' stroke='rgba(255,255,255,.18)'/>
  <text x='104' y='116' font-family='Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto' font-size='22' letter-spacing='.18em' fill='rgba(255,255,255,.9)'>LEAP STUDIO</text>
