<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayQuest — Attractions</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="partials.js"></script>
    <script src="shared.js"></script>
    <script>
      const app = document.getElementById('app');
      app.innerHTML = `
        ${stayQuestHeader('attractions')}
        <main>
          <section class="hero">
            <div class="container hero-grid">
              <div>
                <div class="kicker"><span class="dot"></span><span>Book experiences</span></div>
                <h1 class="h1">Attractions, activities, and experiences</h1>
                <p class="lead">Discover new attractions and experiences to match your interests and travel style — with free cancellation on many tickets.</p>
                <div class="inline" style="margin-top:16px">
                  <span class="badge"><span aria-hidden="true">⚡</span> Book in minutes</span>
                  <span class="badge"><span aria-hidden="true">📞</span> 24/7 support</span>
                </div>
              </div>

              <div class="hero-card">
                <div class="topbar">
                  <div class="pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-7-4.35-7-11a7 7 0 1 1 14 0c0 6.65-7 11-7 11Z" stroke="currentColor" stroke-width="2"/><path d="M12 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="2"/></svg>
                    Attractions search
                  </div>
                  <span class="chip small">Free cancellation on many</span>
                </div>
                <div class="content">
                  <div class="field-grid">
                    <input class="input" placeholder="Destination" aria-label="Destination" />
                    <input class="input" type="date" aria-label="Dates" />
                    <div class="inline" style="justify-content:flex-end">
                      <button class="btn btn-primary" type="button">Search</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- RECOMMENDED ATTRACTIONS -->
          <section class="section">
            <div class="container">
              <h2 class="h2">Recommended in your area</h2>
              <p class="lead">Our top picks to get you started.</p>
              <div class="grid-3" style="margin-top:14px">
                ${[
                  'One-day General Admission to Universal Studios Hollywood',
                  'Warner Bros. Studio Tour Hollywood',
                  'Hollywood, Beverly Hills & Celebrity Homes Tour by Open Air Bus',
                  'Long Beach Harbor 45-Minute Boat Tour',
                  'Swan Boat Rental in Echo Park'
                ].map((t)=>`
                  <div class="offer" style="padding:16px">
                    <div class="kicker"><span class="dot"></span><span>${t}</span></div>
                    <p class="muted" style="margin:10px 0 0">Instant confirmation · Mobile ticket · Flexible options</p>
                    <div class="inline" style="justify-content:space-between; margin-top:12px">
                      <span class="chip small">Top rated</span>
                      <a class="btn btn-ghost" href="#">View details</a>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- NEARBY DESTINATIONS (data_display: attractions-nearby) -->
          <section class="section" id="nearby">
            <div class="container">
              <h2 class="h2">Nearby destinations</h2>
              <p class="lead">Explore what’s popular around you.</p>
              <div class="grid-3" style="margin-top:14px">
                ${[
                  ['New York','2201 things to do','https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1200&q=70'],
                  ['Las Vegas','1063 things to do','https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1200&q=70'],
                  ['Key West','309 things to do','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=70'],
                  ['San Diego','472 things to do','https://images.unsplash.com/photo-1519817650390-64a93db511aa?auto=format&fit=crop&w=1200&q=70'],
                  ['Miami','928 things to do','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=70'],
                  ['New Orleans','611 things to do','https://images.unsplash.com/photo-1501117716987-c8e1ecb210d4?auto=format&fit=crop&w=1200&q=70']
                ].map(([city,count,img])=>`
                  <div class="card dest-card">
                    <div class="img" style="background-image:linear-gradient(135deg, rgba(0,59,149,.18), rgba(255,183,0,.12)), url('${img}');"></div>
                    <div class="dest-body">
                      <div class="h3">${city}</div>
                      <div class="muted small">${count}</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- ACCOUNT CTA -->
          <section class="section compact">
            <div class="container">
              <div class="offer">
                <div class="grid-2" style="align-items:center">
                  <div>
                    <div class="kicker"><span class="dot"></span><span>Your account, your travel</span></div>
                    <p class="title">All your trip details in one place</p>
                    <p class="muted" style="margin:0">Sign in to book faster and manage your trip with ease.</p>
                  </div>
                  <div class="inline" style="justify-content:flex-end">
                    <a class="btn btn-secondary" href="#">Register</a>
                    <a class="btn btn-primary" href="#">Sign in</a>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- TRUST BADGES (data_display: attractions-trust-badges) -->
          <section class="section compact">
            <div class="container">
              <div class="trust">
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l2.4 7.4H22l-6 4.2 2.3 7.2L12 16.7 5.7 20.8 8 13.6 2 9.4h7.6L12 2Z" stroke="currentColor" stroke-width="2"/></svg>
                    Explore top attractions
                  </div>
                  <p>Experience the best of your destination with tours, tickets, and activities.</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Fast and flexible
                  </div>
                  <p>Book online in minutes, with free cancellation on many attractions.</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z" stroke="currentColor" stroke-width="2"/></svg>
                    Support when you need it
                  </div>
                  <p>StayQuest’s global Customer Service team is here to help 24/7.</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10" stroke="currentColor" stroke-width="2"/><path d="M22 2v8h-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    24/7
                  </div>
                  <p>Round-the-clock help for booking changes and ticket questions.</p>
                </div>
              </div>
            </div>
          </section>

          <!-- REGION TABS (interaction: attractions-region-tabs, data_display: attractions-explore-cities) -->
          <section class="section" id="regions">
            <div class="container">
              <h2 class="h2">Find things to do in cities around the world</h2>
              <p class="lead">Switch regions to explore top cities and activity counts.</p>
              <div class="card" style="padding:16px; margin-top:14px">
                <div id="region-tabs" class="pill-tabs" role="tablist" aria-label="Regions">
                  ${['Europe','North America','Asia','Africa','Oceania','Middle East','Caribbean','South America','Central America'].map((t)=>`<button class="pill-tab" data-tab="${t}" role="tab" aria-selected="false">${t}</button>`).join('')}
                </div>

                <div data-panel="Europe">
                  <div class="grid-4">
                    ${[
                      ['London','3943 things to do'],
                      ['Istanbul','2602 things to do'],
                      ['Paris','3898 things to do'],
                      ['Hamburg','369 things to do'],
                      ['Amsterdam','2092 things to do'],
                      ['Lisbon','3727 things to do'],
                      ['Rome','6726 things to do'],
                      ['Athens','3415 things to do'],
                      ['Berlin','865 things to do'],
                      ['Barcelona','2565 things to do'],
                      ['Venice','1785 things to do'],
                      ['Málaga','812 things to do']
                    ].map(([city,count])=>`
                      <div class="card dest-card">
                        <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.18), rgba(255,183,0,.12)), url('https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1200&q=70');"></div>
                        <div class="dest-body">
                          <div class="h3">${city}</div>
                          <div class="muted small">${count}</div>
                        </div>
                      </div>`).join('')}
                  </div>
                </div>

                ${['North America','Asia','Africa','Oceania','Middle East','Caribbean','South America','Central America'].map((name)=>`
                  <div data-panel="${name}" style="display:none">
                    <div class="grid-3">
                      ${[
                        ['New York','2201 things to do'],
                        ['Toronto','984 things to do'],
                        ['Mexico City','1102 things to do'],
                        ['Tokyo','2401 things to do'],
                        ['Bangkok','1872 things to do'],
                        ['Cape Town','604 things to do']
                      ].map(([city,count])=>`
                        <div class="offer" style="padding:16px">
                          <div class="kicker"><span class="dot"></span><span>${city}</span></div>
                          <p class="muted" style="margin:10px 0 0">${count}</p>
                          <div class="inline" style="justify-content:space-between; margin-top:12px">
                            <span class="chip small">Popular</span>
                            <a class="btn btn-ghost" href="#">Explore</a>
                          </div>
                        </div>`).join('')}
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- THINGS TO DO TABS (interaction: attractions-things-to-do-tabs) -->
          <section class="section" id="things">
            <div class="container">
              <h2 class="h2">Explore more things to do</h2>
              <p class="lead">Pick a category to update popular activity clusters.</p>
              <div class="card" style="padding:16px; margin-top:14px">
                <div id="things-tabs" class="pill-tabs" role="tablist" aria-label="Things to do">
                  ${['Tours','City tours','Museums','Entertainment and tickets','Activities and games','Travel and transportation services','Food and drinks','Outdoor activities','Water and amusement parks','Nightlife'].map((t)=>`<button class="pill-tab" data-tab="${t}" role="tab" aria-selected="false">${t}</button>`).join('')}
                </div>
                <div data-panel="Tours">
                  <div class="chip" style="width:100%; justify-content:space-between; padding:14px; border-radius:16px">
                    <div style="max-width:90ch; line-height:1.6">
                      Cultural tours New York · Walking tours New York · Bus tours New York · Boat tours New York · Bike tours New York · Bus tours Las Vegas · Adventure tours Las Vegas · Boat tours Miami
                    </div>
                    <a class="btn btn-ghost" href="#">See all</a>
                  </div>
                </div>
                <div data-panel="Museums" style="display:none">
                  <div class="chip" style="width:100%; justify-content:space-between; padding:14px; border-radius:16px">
                    <div style="max-width:90ch; line-height:1.6">
                      Art museums New York · History museums New York · Science museums New York · Art galleries New York · Museum tickets Las Vegas · Art museums Los Angeles
                    </div>
                    <a class="btn btn-ghost" href="#">See all</a>
                  </div>
                </div>
                ${['City tours','Entertainment and tickets','Activities and games','Travel and transportation services','Food and drinks','Outdoor activities','Water and amusement parks','Nightlife'].map((name)=>`
                  <div data-panel="${name}" style="display:none">
                    <div class="chip" style="width:100%; justify-content:space-between; padding:14px; border-radius:16px">
                      <div style="max-width:90ch; line-height:1.6">
                        Top picks: ${name} · Family-friendly · Bestseller · Free cancellation · Local guides
                      </div>
                      <a class="btn btn-ghost" href="#">See all</a>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>
        </main>

        ${stayQuestFooter()}
      `;

      StayQuest.initTabs('#region-tabs');
      StayQuest.initTabs('#things-tabs');
    </script>
  </body>
</html>
