<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayQuest — Vacation Packages</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="partials.js"></script>
    <script src="shared.js"></script>
    <script>
      const app = document.getElementById('app');
      app.innerHTML = `
        ${stayQuestHeader('packages')}
        <main>
          <section class="hero">
            <div class="container hero-grid">
              <div>
                <div class="kicker"><span class="dot"></span><span>Bundle and save</span></div>
                <h1 class="h1">Search for vacation packages</h1>
                <p class="lead">Book your flights and accommodation together — more convenience, more value, fewer tabs.</p>
                <div class="inline" style="margin-top:16px">
                  <span class="badge"><span aria-hidden="true">💸</span> Package discounts</span>
                  <span class="badge"><span aria-hidden="true">🧾</span> No hidden fees</span>
                </div>
              </div>

              <div class="hero-card">
                <div class="topbar">
                  <div class="pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 16l20-8-8 20-2-9-10-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    Package search
                  </div>
                  <span class="chip small">Hotels + flights + cars</span>
                </div>
                <div class="content">
                  <form data-packages-form>
                    <div class="field-grid">
                      <div class="card" style="padding:12px; border-radius:16px; background:rgba(0,59,149,.04); border-color:rgba(0,59,149,.12)">
                        <div class="small" style="font-weight:900; color:var(--navy); margin-bottom:8px">Package type</div>
                        <div class="field-grid" style="gap:10px">
                          ${[
                            'Hotel + Flight',
                            'Hotel + Flight + Car',
                            'Flight + Car',
                            'Hotel + Car'
                          ].map((label,idx)=>`
                            <label class="check small" style="justify-content:space-between">
                              <span>${label}</span>
                              <input type="radio" name="package_type" value="${label}" ${idx===0?'checked':''} />
                            </label>`).join('')}
                        </div>
                      </div>

                      <div data-package-summary class="check small" style="border-color:rgba(0,108,228,.20)"></div>

                      <div data-field="hotel">
                        <input class="input" placeholder="Hotel destination" aria-label="Hotel destination" />
                      </div>
                      <div data-field="flight">
                        <div class="field-row">
                          <input class="input" placeholder="Flying from" aria-label="Flying from" />
                          <input class="input" placeholder="Flying to" aria-label="Flying to" />
                        </div>
                      </div>
                      <div data-field="car" style="display:none">
                        <input class="input" placeholder="Car pick-up location" aria-label="Car pick-up location" />
                      </div>

                      <div class="field-row">
                        <input class="input" type="date" aria-label="Start date" />
                        <input class="input" type="date" aria-label="End date" />
                      </div>

                      <div class="inline" style="justify-content:flex-end">
                        <button class="btn btn-primary" type="button">Search</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          <!-- PACKAGE BENEFITS (data_display: packages-benefits) -->
          <section class="section">
            <div class="container">
              <h2 class="h2">Package benefits</h2>
              <p class="lead">Everything you need in one booking — simple, transparent, and designed for momentum.</p>
              <div class="grid-3" style="margin-top:14px">
                ${[
                  ['Package discounts','Save more when you bundle your flight + stay.','💸'],
                  ['Round-trip flights included','Compare routes and pick the schedule that fits.','✈️'],
                  ['No hidden fees','Clear totals upfront so you can book confidently.','🧾']
                ].map(([t,desc,icon])=>`
                  <div class="offer" style="padding:18px">
                    <div class="kicker"><span class="dot"></span><span>${icon} ${t}</span></div>
                    <p class="muted" style="margin:10px 0 0">${desc}</p>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- DESTINATIONS (data_display: packages-destinations) -->
          <section class="section" id="destinations">
            <div class="container">
              <h2 class="h2">Vacation package destinations</h2>
              <p class="lead">Beach energy, resort comfort, city breaks — pick your style and go.</p>
              <div class="grid-4" style="margin-top:14px">
                ${[
                  ['Playa del Carmen','Mexico','1604 properties','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=70'],
                  ['Cancun','Mexico','697 properties','https://images.unsplash.com/photo-1506929562872-bb421503ef21?auto=format&fit=crop&w=1200&q=70'],
                  ['Punta Cana','Dominican Republic','537 properties','https://images.unsplash.com/photo-1526481280695-3c687fd5432c?auto=format&fit=crop&w=1200&q=70'],
                  ['Phuket','Thailand','1731 properties','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=70'],
                  ['Honolulu','United States','782 properties','https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=1200&q=70'],
                  ['San Juan','Puerto Rico','412 properties','https://images.unsplash.com/photo-1501117716987-c8e1ecb210d4?auto=format&fit=crop&w=1200&q=70']
                ].map(([city,country,count,img])=>`
                  <div class="card dest-card">
                    <div class="img tall" style="background-image:linear-gradient(135deg, rgba(0,59,149,.18), rgba(255,183,0,.12)), url('${img}');"></div>
                    <div class="dest-body">
                      <div class="h3">${city}</div>
                      <div class="muted small">${country}</div>
                      <div class="muted small" style="margin-top:6px">${count}</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>
        </main>
        ${stayQuestFooter()}
      `;
    </script>
  </body>
</html>
