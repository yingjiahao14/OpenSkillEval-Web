<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayQuest — Find deals for any season</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="partials.js"></script>
    <script src="shared.js"></script>
    <script>
      const app = document.getElementById('app');
      app.innerHTML = `
        ${stayQuestHeader('home')}

        <main>
          <!-- HERO -->
          <section class="hero">
            <div class="container hero-grid">
              <div>
                <div class="kicker"><span class="dot"></span><span>Trusted travel companion</span></div>
                <h1 class="h1">Find deals for any season</h1>
                <p class="lead">From cozy bed & breakfasts to luxury hotels — compare options fast and book with confidence.</p>
                <div class="inline" style="margin-top:16px">
                  <span class="badge">
                    <span aria-hidden="true">🛡️</span>
                    Free cancellation options
                  </span>
                  <span class="badge">
                    <span aria-hidden="true">⭐</span>
                    Verified traveler reviews
                  </span>
                </div>
              </div>

              <div class="hero-card">
                <div class="topbar">
                  <div class="pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M12 21s-7-4.35-7-11a7 7 0 1 1 14 0c0 6.65-7 11-7 11Z" stroke="currentColor" stroke-width="2"/>
                      <path d="M12 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    Stays search
                  </div>
                  <span class="chip small">Best-price confidence</span>
                </div>
                <div class="content">
                  <form data-search-form>
                    <div class="field-grid">
                      <input class="input" name="destination" placeholder="Destination" aria-label="Destination" />
                      <div class="field-row">
                        <input class="input" type="date" name="checkin" aria-label="Check-in date" />
                        <input class="input" type="date" name="checkout" aria-label="Check-out date" />
                      </div>
                      <input class="input" name="guests" value="2 adults · 0 children · 1 room" aria-label="Guests" />
                      <div class="inline" style="justify-content:space-between">
                        <label class="check small">
                          <input type="checkbox" />
                          Add flights to my search
                        </label>
                        <button class="btn btn-primary" type="submit">Search</button>
                      </div>
                      <div data-search-msg class="check small" style="display:none; border-color:var(--border)"></div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          <!-- TRUST BADGES (data_display: home-trust-stats) -->
          <section class="section compact">
            <div class="container">
              <div class="trust">
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s8-4 8-10V6l-8-4-8 4v6c0 6 8 10 8 10Z" stroke="currentColor" stroke-width="2"/></svg>
                    Book now, pay at the property
                  </div>
                  <p>FREE cancellation on most rooms</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 21h10M9 17h6M8 13h8M6 3h12v10a6 6 0 0 1-12 0V3Z" stroke="currentColor" stroke-width="2"/></svg>
                    300M+ reviews from fellow travelers
                  </div>
                  <p>Get trusted information from guests like you</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3" stroke="currentColor" stroke-width="2"/><path d="M6 10h12v10H6V10Z" stroke="currentColor" stroke-width="2"/></svg>
                    2+ million properties worldwide
                  </div>
                  <p>Hotels, guest houses, apartments, and more</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7v4a5 5 0 0 0 5 5h1v4h2v-4h1a5 5 0 0 0 5-5V9a7 7 0 0 0-7-7Z" stroke="currentColor" stroke-width="2"/></svg>
                    Trusted 24/7 customer service
                  </div>
                  <p>We’re always here to help</p>
                </div>
              </div>
            </div>
          </section>

          <!-- OFFERS -->
          <section class="section">
            <div class="container">
              <h2 class="h2">Offers that feel like upgrades</h2>
              <p class="lead">Two quick ways to save right now — deals for this weekend, and rewards that add up.</p>
              <div class="grid-2" style="margin-top:16px">
                <div class="offer">
                  <div class="kicker"><span class="dot"></span><span>Getaway Deals</span></div>
                  <p class="title">No catch. Just getaways.</p>
                  <p class="muted" style="margin:0">At least 15% off select stays worldwide – just book and go.</p>
                  <div class="cta"><a class="btn btn-primary" href="#weekend">Save with a Getaway Deal</a></div>
                </div>
                <div class="offer">
                  <div class="kicker"><span class="dot"></span><span>Rewards Credit Card</span></div>
                  <p class="title">Earn 6% in Travel Credits on stays with the StayQuest Rewards Visa®</p>
                  <p class="muted" style="margin:0">Plus get $150 in Credits after qualifying purchases, an upgrade to Genius Level 3, and more. Terms apply.</p>
                  <div class="cta"><a class="btn btn-secondary" href="#">Learn more</a></div>
                </div>
              </div>
            </div>
          </section>

          <!-- PROPERTY TYPES -->
          <section class="section compact">
            <div class="container">
              <h2 class="h2">Browse by property type</h2>
              <p class="lead">Quick filters to match your travel style — from cabins to city apartments.</p>
              <div class="pill-tabs" aria-label="Property types" style="margin-top:14px">
                ${[
                  'Hotels','Apartments','Resorts','Villas','Cabins','Cottages','Glamping Sites','Serviced Apartments','Vacation Homes','Guest Houses','Hostels','Motels','B&Bs','Ryokans','Riads','Resort Villages','Homestays','Campgrounds','Country Houses','Farm Stays','Boats','Luxury Tents','Self-Catering Accommodations','Tiny Houses'
                ].map(t=>`<span class="pill-tab" style="cursor:default">${t}</span>`).join('')}
              </div>
            </div>
          </section>

          <!-- TRIP PLANNER TABS (interaction: home-trip-planner-tabs) -->
          <section class="section" id="planner">
            <div class="container">
              <h2 class="h2">Quick and easy trip planner</h2>
              <p class="lead">Pick a vibe and explore the top destinations in the United States.</p>
              <div class="card" style="padding:16px; margin-top:14px">
                <div id="trip-tabs" class="pill-tabs" role="tablist" aria-label="Trip planner">
                  ${[
                    'Festivals & Events','Theme Parks','Beaches & Relaxation','Cultural Trips','Food & Cooking','City Exploration','Wine Tastings','Outdoor Adventures','Nature Adventures','Historical Tours'
                  ].map((t,i)=>`<button class="pill-tab" role="tab" aria-selected="false" data-tab="${t}">${t}</button>`).join('')}
                </div>
                <div>
                  <div data-panel="Festivals & Events">
                    <div class="grid-3">
                      ${[
                        ['Pasadena','6 mi away'],['Los Angeles','12 mi away'],['Long Beach','26 mi away'],['Palm Springs','89 mi away'],['Santa Barbara','97 mi away'],['San Francisco','351 mi away']
                      ].map(([city,dist])=>`
                        <div class="card dest-card">
                          <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('https://images.unsplash.com/photo-1500534314209-a26db0f5cfe9?auto=format&fit=crop&w=1200&q=70');"></div>
                          <div class="dest-body">
                            <div class="h3">${city}</div>
                            <div class="muted small">${dist}</div>
                          </div>
                        </div>`).join('')}
                    </div>
                  </div>
                  ${[
                    'Theme Parks','Beaches & Relaxation','Cultural Trips','Food & Cooking','City Exploration','Wine Tastings','Outdoor Adventures','Nature Adventures','Historical Tours'
                  ].map((t,idx)=>`
                    <div data-panel="${t}" style="display:none">
                      <div class="grid-3">
                        ${[
                          ['Orlando','Family-friendly'],['Anaheim','Iconic parks'],['San Diego','Coastal adventures'],['Las Vegas','Big nights'],['New York','Skyline days'],['Chicago','Weekend classics']
                        ].slice(0,6).map(([city,dist])=>`
                          <div class="card dest-card">
                            <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1200&q=70');"></div>
                            <div class="dest-body">
                              <div class="h3">${city}</div>
                              <div class="muted small">${dist}</div>
                            </div>
                          </div>`).join('')}
                      </div>
                    </div>`).join('')}
                </div>
              </div>
            </div>
          </section>

          <!-- UNIQUE PROPERTIES CAROUSEL (data_display: home-unique-properties, interaction: home-unique-properties-carousel) -->
          <section class="section" id="unique">
            <div class="container">
              <h2 class="h2">Stay at our top unique properties</h2>
              <p class="lead">From castles and villas to boats and igloos, we have it all.</p>
              <div class="scroller-wrap" id="unique-carousel" style="margin-top:14px">
                <button class="carousel-btn left" data-left aria-label="Scroll left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="scroller" data-carousel>
                  ${[
                    ['Quality Inn near Bryce Canyon','Panguitch, US','7.6 Good','2,071','$81',"https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=1200&q=70"],
                    ['Paris Resort & Casino','Las Vegas, US','7.9 Good','20,969','$134',"https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1200&q=70"],
                    ['Cambria Pines Lodge','Cambria, US','8.6 Excellent','1,525','$169',"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1200&q=70"],
                    ['The Hotel Chalet at The Choo Choo','Chattanooga, US','9.2 Wonderful','1,931','$149',"https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1200&q=70"],
                    ['Boro Hotel','Queens, US','8.5 Very Good','906','$153',"https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?auto=format&fit=crop&w=1200&q=70"],
                    ['Anaheim Majestic Garden Hotel','Anaheim, US','8.1 Very Good','5,216','$164',"https://images.unsplash.com/photo-1501117716987-c8e1ecb210d4?auto=format&fit=crop&w=1200&q=70"]
                  ].map(([name,loc,rating,reviews,price,img])=>`
                    <article class="card dest-card" style="min-width:300px">
                      <div class="img" style="background-image:linear-gradient(135deg, rgba(0,59,149,.20), rgba(255,183,0,.12)), url('${img}');"></div>
                      <div class="dest-body">
                        <div class="h3" style="font-weight:950">${name}</div>
                        <div class="muted small">${loc}</div>
                        <div class="meta" style="margin-top:10px">
                          <div class="rating">
                            <span class="score">${rating.split(' ')[0]}</span>
                            <span class="label">${rating.replace(rating.split(' ')[0], '').trim()} · ${reviews} reviews</span>
                          </div>
                          <div class="price">${price}</div>
                        </div>
                      </div>
                    </article>`).join('')}
                </div>
                <button class="carousel-btn right" data-right aria-label="Scroll right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </section>

          <!-- TRENDING DESTINATIONS -->
          <section class="section compact">
            <div class="container">
              <h2 class="h2">Trending destinations</h2>
              <p class="lead">Fresh favorites travelers are clicking right now.</p>
              <div class="grid-4" style="margin-top:14px">
                ${[
                  ['London','https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1200&q=70'],
                  ['Paris','https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1200&q=70'],
                  ['Tokyo','https://images.unsplash.com/photo-1549692520-acc6669e2f0c?auto=format&fit=crop&w=1200&q=70'],
                  ['Anaheim','https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1200&q=70'],
                  ['Rome','https://images.unsplash.com/photo-1526481280695-3c687fd5432c?auto=format&fit=crop&w=1200&q=70']
                ].map(([city,img])=>`
                  <div class="card dest-card">
                    <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('${img}');"></div>
                    <div class="dest-body">
                      <div class="h3">${city}</div>
                      <div class="muted small">Explore stays, flights, cars & experiences</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- EXPLORE DESTINATIONS (data_display: home-explore-destinations) -->
          <section class="section" id="explore">
            <div class="container">
              <h2 class="h2">Explore United States</h2>
              <p class="lead">These popular destinations have a lot to offer.</p>
              <div class="grid-4" style="margin-top:14px">
                ${[
                  ['Las Vegas','1,854 properties','https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1200&q=70'],
                  ['Orlando','5,181 properties','https://images.unsplash.com/photo-1523365280197-f1783db9fe62?auto=format&fit=crop&w=1200&q=70'],
                  ['New York','3,122 properties','https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1200&q=70'],
                  ['Atlanta','2,082 properties','https://images.unsplash.com/photo-1586481204353-4b1b55b95749?auto=format&fit=crop&w=1200&q=70'],
                  ['Los Angeles','4,443 properties','https://images.unsplash.com/photo-1539804811311-261f1d85e00c?auto=format&fit=crop&w=1200&q=70'],
                  ['Chicago','1,726 properties','https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1200&q=70'],
                  ['Houston','2,641 properties','https://images.unsplash.com/photo-1544928147-79a2dbc1f389?auto=format&fit=crop&w=1200&q=70'],
                  ['San Antonio','1,596 properties','https://images.unsplash.com/photo-1544703406-6e7e0b77c8d1?auto=format&fit=crop&w=1200&q=70'],
                  ['Miami','4,020 properties','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=70'],
                  ['San Diego','2,479 properties','https://images.unsplash.com/photo-1519817650390-64a93db511aa?auto=format&fit=crop&w=1200&q=70']
                ].map(([city,count,img])=>`
                  <div class="card dest-card">
                    <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('${img}');"></div>
                    <div class="dest-body">
                      <div class="h3">${city}</div>
                      <div class="muted small">${count}</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- WEEKEND DEALS (data_display: home-weekend-deals) -->
          <section class="section" id="weekend">
            <div class="container">
              <h2 class="h2">Deals for the weekend</h2>
              <p class="lead">Save on stays for this weekend.</p>
              <div class="grid-3" style="margin-top:14px">
                ${[
                  ['Masquerade Tower at Rio Hotel & Casino','Las Vegas, US','6.9','529','2 nights','$765','$421',"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1200&q=70"],
                  ['The Hoxton, Downtown LA','Los Angeles, US','8.2 Very Good','507','2 nights','$464','$384',"https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1200&q=70"],
                  ['Holiday Inn Express Downtown San Diego','San Diego, US','8.0 Very Good','1,223','2 nights','$479','$407',"https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?auto=format&fit=crop&w=1200&q=70"],
                  ['The Grandview at Las Vegas','Las Vegas, US','8.5 Very Good','3,569','2 nights','$550','$430',"https://images.unsplash.com/photo-1501117716987-c8e1ecb210d4?auto=format&fit=crop&w=1200&q=70"],
                  ['Handlery Hotel San Diego','San Diego, US','7.7 Good','2,549','2 nights','$378','$278',"https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=1200&q=70"]
                ].map(([name,loc,score,rev,dur,orig,sale,img])=>`
                  <article class="card dest-card">
                    <div class="img" style="background-image:linear-gradient(135deg, rgba(0,59,149,.18), rgba(255,183,0,.12)), url('${img}');"></div>
                    <div class="dest-body">
                      <div class="h3" style="font-weight:950">${name}</div>
                      <div class="muted small">${loc}</div>
                      <div class="meta" style="margin-top:10px">
                        <div class="rating"><span class="score">${score}</span><span class="label">${rev} reviews</span></div>
                        <div style="text-align:right">
                          <div class="muted small">${dur}</div>
                          <div class="price"><span class="strike">${orig}</span> <span style="color:var(--navy)">${sale}</span></div>
                        </div>
                      </div>
                    </div>
                  </article>`).join('')}
              </div>
            </div>
          </section>

          <!-- HOMES GUESTS LOVE (data_display: home-homes-guests-love) -->
          <section class="section">
            <div class="container">
              <div class="inline" style="justify-content:space-between; align-items:flex-end">
                <div>
                  <h2 class="h2" style="margin-bottom:6px">Homes guests love</h2>
                  <p class="lead">Highly-rated apartments and homes — great for families and longer stays.</p>
                </div>
                <a class="btn btn-secondary" href="#">Discover homes</a>
              </div>

              <div class="scroller" style="margin-top:12px">
                ${[
                  ['Aparthotel Stare Miasto','Old Town, Krakow, Poland','8.8 Excellent','3,193','$213'],
                  ['7Seasons Apartments','Terézváros, Budapest, Hungary','8.8 Excellent','10,071','$172'],
                  ['Leman Locke','Tower Hamlets, London, UK','8.3 Very Good','925','$198'],
                  ['New Sugar Loft Apartments','Santa Teresa, Rio de Janeiro, Brazil','7.6 Good','798','$76'],
                  ['Casa Portuguesa Prata','Santa Maria Maior, Lisbon, Portugal','8.4 Very Good','160','$529'],
                  ['Cheval Three Quays','City of London, London, UK','9.5 Exceptional','821','$317']
                ].map(([name,loc,rating,rev,price])=>`
                  <article class="card dest-card" style="min-width:280px">
                    <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=1200&q=70');"></div>
                    <div class="dest-body">
                      <div class="h3" style="font-weight:950">${name}</div>
                      <div class="muted small">${loc}</div>
                      <div class="meta" style="margin-top:10px">
                        <div class="rating">
                          <span class="score">${rating.split(' ')[0]}</span>
                          <span class="label">${rating.replace(rating.split(' ')[0], '').trim()} · ${rev}</span>
                        </div>
                        <div class="price">From ${price}</div>
                      </div>
                    </div>
                  </article>`).join('')}
              </div>
            </div>
          </section>

          <!-- LOYALTY CTA -->
          <section class="section compact">
            <div class="container">
              <div class="offer">
                <div class="grid-2" style="align-items:center">
                  <div>
                    <div class="kicker"><span class="dot"></span><span>Genius Loyalty</span></div>
                    <p class="title">Travel more, spend less</p>
                    <p class="muted" style="margin:0">Sign in, save money — save 10% or more at participating properties. Just look for the blue Genius label.</p>
                  </div>
                  <div class="inline" style="justify-content:flex-end">
                    <a class="btn btn-secondary" href="#">Register</a>
                    <a class="btn btn-primary" href="#">Sign in</a>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- POPULAR LINKS TABS (interaction: home-popular-tabs) -->
          <section class="section" id="popular">
            <div class="container">
              <h2 class="h2">Popular with travelers from the United States</h2>
              <p class="lead">Quick links people use when planning — switch tabs to explore.</p>
              <div class="card" style="padding:16px; margin-top:14px">
                <div id="popular-tabs" class="pill-tabs" role="tablist" aria-label="Popular tabs">
                  ${['Domestic cities','International cities','Regions','Countries','Places to stay'].map(t=>`<button class="pill-tab" data-tab="${t}" role="tab" aria-selected="false">${t}</button>`).join('')}
                </div>
                ${[
                  ['Domestic cities', 'Las Vegas hotels · New York hotels · Los Angeles hotels · Orlando hotels · San Diego hotels · San Francisco hotels · Fort Lauderdale hotels · Miami hotels · Chicago hotels · Houston hotels'],
                  ['International cities', 'Malé hotels · Tokyo hotels · Bangkok hotels · Amsterdam hotels · Paris hotels · Barcelona hotels · Rome hotels · Tulum hotels'],
                  ['Regions', 'Kyoto · Santorini · Oahu · Yosemite National Park · Lake Tahoe · Caribbean Islands · Florida Keys'],
                  ['Countries', 'United States · Japan · Italy · Mexico · Canada · United Kingdom · Spain · France · Thailand'],
                  ['Places to stay', 'Cheap hotels · Pet-Friendly Hotels · Resorts · Hostels · Beach Hotels · 5-Star Hotels · Boutique Hotels · Luxury Hotels']
                ].map(([name,items])=>`
                  <div data-panel="${name}" style="display:none">
                    <div class="chip" style="width:100%; justify-content:space-between; padding:14px; border-radius:16px">
                      <div style="max-width: 84ch; line-height:1.6">
                        ${items}
                      </div>
                      <a class="btn btn-ghost" href="#">See all</a>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>
        </main>

        ${stayQuestFooter()}
      `;

      // Interactions
      StayQuest.initTabs('#trip-tabs');
      StayQuest.initCarousel('#unique-carousel');
      StayQuest.initTabs('#popular-tabs');
    </script>
  </body>
</html>
