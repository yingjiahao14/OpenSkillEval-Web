<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayQuest — Car Rental</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="partials.js"></script>
    <script src="shared.js"></script>
    <script>
      const app = document.getElementById('app');
      app.innerHTML = `
        ${stayQuestHeader('car-rental')}

        <main>
          <section class="hero">
            <div class="container hero-grid">
              <div>
                <div class="kicker"><span class="dot"></span><span>Hit the road</span></div>
                <h1 class="h1">Car rentals for any kind of trip</h1>
                <p class="lead">Great cars at great prices from the biggest rental companies — with flexible cancellation and multilingual support.</p>
                <div class="inline" style="margin-top:16px">
                  <span class="badge"><span aria-hidden="true">🌍</span> Customer support in over 30 languages</span>
                  <span class="badge"><span aria-hidden="true">✅</span> Free cancellation up to 48 hours</span>
                </div>
              </div>

              <div class="hero-card">
                <div class="topbar">
                  <div class="pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 13l2-6h14l2 6v6H3v-6Z" stroke="currentColor" stroke-width="2"/><path d="M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" stroke="currentColor" stroke-width="2"/></svg>
                    Car rental search
                  </div>
                  <span class="chip small">No surprise fees</span>
                </div>
                <div class="content">
                  <div class="field-grid">
                    <input class="input" placeholder="Pick-up location" aria-label="Pick-up location" />
                    <div class="field-row">
                      <input class="input" type="datetime-local" aria-label="Pick-up date & time" />
                      <input class="input" type="datetime-local" aria-label="Drop-off date & time" />
                    </div>
                    <div class="inline" style="justify-content:space-between">
                      <label class="check small"><input type="checkbox" /> Drop car off at different location</label>
                      <label class="check small"><input type="checkbox" checked /> Driver aged 30–65?</label>
                    </div>
                    <div class="inline" style="justify-content:flex-end">
                      <button class="btn btn-primary" type="button">Search</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- RENTAL CAR COMPANIES (data_display: car-rental-companies) -->
          <section class="section">
            <div class="container">
              <h2 class="h2">Rental car companies</h2>
              <p class="lead">Partners you know and trust — compare options fast.</p>
              <div class="grid-3" style="margin-top:14px">
                ${['Avis','Budget','Alamo','Sixt','Hertz','Enterprise'].map((name)=>`
                  <div class="card" style="padding:18px; border-radius:18px">
                    <div class="inline" style="justify-content:space-between">
                      <div class="h3" style="font-weight:950">${name}</div>
                      <span class="chip small">Partner</span>
                    </div>
                    <div class="muted small" style="margin-top:8px">Flexible options · Transparent pricing</div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- CAR RENTAL TRUST BADGES (data_display: car-rental-trust-badges) -->
          <section class="section compact">
            <div class="container">
              <div class="trust">
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7v4a5 5 0 0 0 5 5h1v4h2v-4h1a5 5 0 0 0 5-5V9a7 7 0 0 0-7-7Z" stroke="currentColor" stroke-width="2"/></svg>
                    Customer support in over 30 languages
                  </div>
                  <p>Help when you need it — before, during, and after pick-up.</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 22s8-4 8-10V6l-8-4-8 4v6c0 6 8 10 8 10Z" stroke="currentColor" stroke-width="2"/></svg>
                    Free cancellation
                  </div>
                  <p>Up to 48 hours before pick-up (on most bookings).</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z" stroke="currentColor" stroke-width="2"/></svg>
                    5 million+ reviews
                  </div>
                  <p>By real, verified customers.</p>
                </div>
                <div class="item">
                  <div class="top">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2"/></svg>
                    Fast pickup flow
                  </div>
                  <p>Designed to reduce counter-time friction.</p>
                </div>
              </div>
            </div>
          </section>

          <!-- CREDIT CARD PROMO -->
          <section class="section">
            <div class="container">
              <div class="offer">
                <div class="grid-2" style="align-items:center">
                  <div>
                    <div class="kicker"><span class="dot"></span><span>Rewards Visa®</span></div>
                    <p class="title">Earn 5% in Travel Credits on car rentals</p>
                    <p class="muted" style="margin:0">Spend on your StayQuest Rewards Visa® to earn Credits. Terms apply.</p>
                  </div>
                  <div class="inline" style="justify-content:flex-end">
                    <a class="btn btn-secondary" href="#">Learn more</a>
                    <a class="btn btn-primary" href="#destinations">Browse destinations</a>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- FAQ (interaction: car-rental-faq-accordion) -->
          <section class="section" id="faq">
            <div class="container">
              <h2 class="h2">Car rental FAQ</h2>
              <p class="lead">Clear answers up front — one open at a time.</p>
              <div id="car-faq" class="faq" style="margin-top:14px">
                ${[
                  ['How much does it cost to rent a car in the United States for a week?','Based on the average daily cost of $49, a week will cost about $346.'],
                  ['How much does it cost to rent a car in the United States for a month?','Based on the average daily cost of $49, a month will cost about $1,483.'],
                  ['What car do people usually book in the United States?','Premium is the most popular car group, followed by SUV and medium.'],
                  ['How much does it cost to rent a premium car?','On average, $55 a day.'],
                  ['How much does it cost to rent a SUV?','On average, $54 a day.'],
                  ['What car rental companies are available?','55 companies including Avis, Budget, and Alamo.'],
                  ['Can I return the car to a different location?','Usually possible but depends on company policy and may cost extra.'],
                  ['How far in advance should I book?','The cheapest time is within the same week for an average of $34/day.'],
                  ['What do I need to rent a car?','Debit or credit card to book; passport, voucher, driver\'s license, and main driver\'s credit card at the counter.']
                ].map(([q,a])=>`
                  <div class="faq-item">
                    <div class="faq-q" role="button" tabindex="0">
                      <span>${q}</span>
                      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <div class="faq-a">${a}</div>
                  </div>`).join('')}
              </div>
            </div>
          </section>

          <!-- DESTINATIONS TABS (interaction: car-rental-destination-tabs) -->
          <section class="section" id="destinations">
            <div class="container">
              <h2 class="h2">Popular car rental destinations</h2>
              <p class="lead">Explore more options to rent a car for cheap.</p>
              <div class="card" style="padding:16px; margin-top:14px">
                <div id="car-dest-tabs" class="pill-tabs" role="tablist" aria-label="Car rental destination tabs">
                  ${['Cities in the US','Airports in the US','Regions','Cities worldwide','Airports worldwide'].map((t)=>`<button class="pill-tab" data-tab="${t}" role="tab" aria-selected="false">${t}</button>`).join('')}
                </div>

                <div data-panel="Cities in the US">
                  <div class="grid-4">
                    ${[
                      ['New York','235 car rental locations','$69.73 per day'],
                      ['Atlanta','74 car rental locations','$39.76 per day'],
                      ['San Francisco','124 car rental locations','$58.18 per day'],
                      ['Las Vegas','136 car rental locations','$50.45 per day'],
                      ['Los Angeles','220 car rental locations','$57.09 per day'],
                      ['Miami','105 car rental locations','$68.77 per day'],
                      ['Orlando','206 car rental locations','$58.41 per day'],
                      ['Houston','140 car rental locations','$34.03 per day'],
                      ['Chicago','86 car rental locations','$57.22 per day'],
                      ['San Diego','86 car rental locations','$49.68 per day']
                    ].map(([city,locs,price])=>`
                      <div class="card dest-card">
                        <div class="img small" style="background-image:linear-gradient(135deg, rgba(0,59,149,.22), rgba(255,183,0,.12)), url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1200&q=70');"></div>
                        <div class="dest-body">
                          <div class="h3">${city}</div>
                          <div class="muted small">${locs}</div>
                          <div class="muted small" style="margin-top:6px">Avg: <span style="font-weight:900; color:var(--navy)">${price}</span></div>
                        </div>
                      </div>`).join('')}
                  </div>
                </div>

                ${['Airports in the US','Regions','Cities worldwide','Airports worldwide'].map((name)=>`
                  <div data-panel="${name}" style="display:none">
                    <div class="grid-3">
                      ${[
                        ['Los Angeles (LAX)','Top airport pick','$59/day'],
                        ['New York (JFK)','High availability','$72/day'],
                        ['Chicago (ORD)','Best weekend deals','$55/day'],
                        ['Miami (MIA)','Family travel','$66/day'],
                        ['San Francisco (SFO)','Business trips','$61/day'],
                        ['Orlando (MCO)','Theme park runs','$57/day']
                      ].map(([t,sub,p])=>`
                        <div class="offer" style="padding:16px">
                          <div class="kicker"><span class="dot"></span><span>${t}</span></div>
                          <p class="muted" style="margin:10px 0 0">${sub}</p>
                          <p class="price" style="margin:12px 0 0; font-size:20px">${p}</p>
                        </div>`).join('')}
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </section>
        </main>

        ${stayQuestFooter()}
      `;

      StayQuest.initAccordion('#car-faq');
      StayQuest.initTabs('#car-dest-tabs');
    </script>
  </body>
</html>
