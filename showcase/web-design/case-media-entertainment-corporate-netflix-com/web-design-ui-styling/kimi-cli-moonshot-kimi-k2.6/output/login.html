<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#000000',
              dark: '#141414',
              red: '#E50914',
              redHover: '#B20710',
              gray: '#2D2D2D',
              grayLight: '#757575',
              grayDark: '#1A1A1A',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .login-bg {
      background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 50%, #000000 100%),
                  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
    }
    .help-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }
    .help-answer.open {
      max-height: 300px;
    }
    .input-field:focus + label,
    .input-field:not(:placeholder-shown) + label {
      transform: translateY(-1.5rem) scale(0.85);
      color: #9ca3af;
    }
  </style>
</head>
<body class="bg-brand-black text-white antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="absolute top-0 left-0 right-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 md:h-20">
        <a href="index.html" class="text-brand-red text-2xl md:text-3xl font-black tracking-tight">StreamWave</a>
      </div>
    </div>
  </header>

  <!-- Login Section -->
  <main class="flex-1 flex items-center justify-center login-bg px-4 py-24 sm:py-32">
    <div class="w-full max-w-md">
      <div class="bg-black/75 backdrop-blur-sm rounded-lg p-8 md:p-12">
        <h1 class="text-2xl md:text-3xl font-bold mb-6">Enter your info to sign in</h1>
        <p class="text-gray-400 mb-8">Or get started with a new account.</p>

        <form class="space-y-4" onsubmit="event.preventDefault(); handleLogin();">
          <div class="relative">
            <input type="text" id="email" placeholder=" " required
              class="input-field w-full bg-brand-grayDark border border-gray-600 text-white placeholder-transparent px-4 py-4 rounded text-base focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all peer">
            <label for="email"
              class="absolute left-4 top-4 text-gray-400 text-base transition-all pointer-events-none origin-left peer-focus:-translate-y-6 peer-focus:scale-[0.85] peer-focus:text-gray-400 peer-[:not(:placeholder-shown)]:-translate-y-6 peer-[:not(:placeholder-shown)]:scale-[0.85]">
              Email address or mobile number
            </label>
          </div>

          <div class="relative">
            <input type="password" id="password" placeholder=" " required
              class="input-field w-full bg-brand-grayDark border border-gray-600 text-white placeholder-transparent px-4 py-4 rounded text-base focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all peer">
            <label for="password"
              class="absolute left-4 top-4 text-gray-400 text-base transition-all pointer-events-none origin-left peer-focus:-translate-y-6 peer-focus:scale-[0.85] peer-focus:text-gray-400 peer-[:not(:placeholder-shown)]:-translate-y-6 peer-[:not(:placeholder-shown)]:scale-[0.85]">
              Password
            </label>
          </div>

          <button type="submit"
            class="w-full bg-brand-red hover:bg-brand-redHover text-white font-bold text-lg py-3.5 rounded transition-colors mt-2">
            Continue
          </button>
        </form>

        <div class="mt-6 text-center">
          <button id="help-toggle" class="text-gray-400 hover:text-white text-sm transition-colors">
            Get help
          </button>
        </div>

        <div id="help-section" class="help-answer">
          <div class="mt-4 space-y-2 text-sm text-gray-400 bg-brand-grayDark rounded-lg p-4">
            <a href="#" class="block hover:text-white transition-colors underline">Forgot your password?</a>
            <a href="#" class="block hover:text-white transition-colors underline">Trouble signing in?</a>
            <a href="#" class="block hover:text-white transition-colors underline">Contact support</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-10 bg-brand-black border-t border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <p class="text-gray-400 mb-6 text-sm">Questions? <a href="#" class="underline hover:text-white transition-colors">Contact us</a>.</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm text-gray-400">
        <a href="#" class="hover:text-white transition-colors underline">FAQ</a>
        <a href="#" class="hover:text-white transition-colors underline">Help Centre</a>
        <a href="#" class="hover:text-white transition-colors underline">Terms of Use</a>
        <a href="#" class="hover:text-white transition-colors underline">Privacy</a>
      </div>
      <div class="mt-6">
        <div class="relative inline-block">
          <select class="appearance-none bg-black border border-gray-600 text-gray-400 text-sm rounded px-3 py-1.5 pr-8 cursor-pointer hover:border-white transition-colors">
            <option>English</option>
          </select>
          <svg class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email && password) {
        alert('Signing in...');
      }
    }

    const helpToggle = document.getElementById('help-toggle');
    const helpSection = document.getElementById('help-section');
    helpToggle.addEventListener('click', () => {
      helpSection.classList.toggle('open');
      helpToggle.textContent = helpSection.classList.contains('open') ? 'Hide help' : 'Get help';
    });
  </script>
</body>
</html>
