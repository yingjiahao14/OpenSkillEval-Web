<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreamWave</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --bg-card: #1a1a1a;
      --red: #E50914;
      --red-hover: #f40612;
      --white: #fff;
      --gray: #808080;
      --gray-light: #b3b3b3;
      --text: #ffffff;
      --text-secondary: #a0a0a0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }

    /* Header */
    .header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      background: var(--bg);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--red);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      padding: 3rem 2.5rem;
      border-radius: 8px;
    }

    .login-card h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: .5rem;
    }

    .login-card .subtext {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .4rem;
      color: var(--gray-light);
    }

    .form-group input {
      width: 100%;
      padding: .9rem 1rem;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #303030;
      color: var(--white);
    }

    .form-group input:focus {
      outline: 2px solid var(--gray);
      outline-offset: 1px;
    }

    .btn-continue {
      width: 100%;
      background: var(--red);
      color: var(--white);
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 4px;
      margin-top: 1.5rem;
      transition: background .2s;
    }

    .btn-continue:hover { background: var(--red-hover); }

    .get-help {
      margin-top: 1.5rem;
      text-align: center;
    }

    .get-help-toggle {
      background: none;
      color: var(--text-secondary);
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      margin: 0 auto;
      transition: color .2s;
    }

    .get-help-toggle:hover { color: var(--white); }

    .get-help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease, margin-top .3s ease;
      text-align: center;
      font-size: .9rem;
    }

    .get-help-content.open {
      max-height: 200px;
      margin-top: 1rem;
    }

    .get-help-content a {
      color: var(--text-secondary);
      display: block;
      margin: .4rem 0;
      transition: color .2s;
    }

    .get-help-content a:hover { color: var(--white); }

    .get-help-icon { transition: transform .3s; }
    .get-help-toggle.open .get-help-icon { transform: rotate(45deg); }

    /* Footer */
    .footer {
      background: #0a0a0a;
      padding: 2rem;
      border-top: 1px solid #222;
      text-align: center;
    }

    .footer-legal {
      font-size: .75rem;
      color: var(--text-secondary);
      max-width: 400px;
      margin: 0 auto;
    }

    @media (max-width: 500px) {
      .login-card { padding: 2rem 1.5rem; }
      .header { padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="index.html" class="logo">StreamWave</a>
</header>

<!-- Main -->
<main class="main">
  <div class="login-card">
    <h1>Enter your info to sign in</h1>
    <p class="subtext">Or get started with a new account.</p>

    <form id="login-form" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="email">Email address or mobile number</label>
        <input type="text" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="get-help">
      <button class="get-help-toggle" id="get-help-toggle" aria-expanded="false">
        <span class="get-help-icon">+</span> Get help
      </button>
      <div class="get-help-content" id="get-help-content">
        <a href="#">Forgot your password?</a>
        <a href="#">Reset it via email</a>
        <a href="#">Contact Support</a>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <p class="footer-legal">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
</footer>

<script>
  document.getElementById('get-help-toggle').addEventListener('click', function() {
    const content = document.getElementById('get-help-content');
    const isOpen = content.classList.contains('open');
    content.classList.toggle('open');
    this.classList.toggle('open');
    this.setAttribute('aria-expanded', !isOpen);
  });
</script>
</body>
</html>
