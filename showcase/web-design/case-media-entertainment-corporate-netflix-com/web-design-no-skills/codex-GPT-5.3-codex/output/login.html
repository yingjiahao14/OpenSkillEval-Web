<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <style>
    :root {
      --bg: #141414;
      --text: #fff;
      --muted: #b4b4b4;
      --panel: #1d1d1d;
      --line: #333;
      --accent: #e50914;
      --accent-hover: #f10d19;
      --focus: 0 0 0 3px rgba(229, 9, 20, 0.35);
      --container: min(1160px, 92vw);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.78) 56%, rgba(0,0,0,0.9) 100%),
        url("https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=1700&q=70") center/cover fixed no-repeat,
        var(--bg);
    }

    .container { width: var(--container); margin: 0 auto; }

    .topbar {
      padding: 1rem 0;
    }

    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.3px;
      font-size: clamp(1.25rem, 2.2vw, 1.8rem);
      text-decoration: none;
    }

    .lang {
      border: 1px solid #666;
      border-radius: 6px;
      background: rgba(0,0,0,0.5);
      color: var(--text);
      padding: 0.44rem 0.7rem;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 1.2rem 0 2.2rem;
    }

    .login-card {
      width: min(460px, 100%);
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: clamp(1.2rem, 3vw, 2rem);
      box-shadow: 0 18px 48px rgba(0,0,0,.5);
      backdrop-filter: blur(2px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.15;
    }

    .sub {
      margin: 0.55rem 0 1.1rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    form { display: grid; gap: 0.72rem; }

    input {
      min-height: 50px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #141414;
      color: #fff;
      padding: 0.8rem 0.9rem;
      font: inherit;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible, .lang:focus-visible, .help-toggle:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .help {
      margin-top: 1rem;
      border-top: 1px solid #303030;
      padding-top: 0.9rem;
    }

    .help-toggle {
      background: transparent;
      border: 0;
      color: #d2d2d2;
      font: inherit;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    .help-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .help-panel.open { max-height: 140px; }

    footer {
      color: #b9b9b9;
      padding: 1.4rem 0 2.2rem;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 520px) {
      .topbar { padding-top: 0.8rem; }
      .lang { padding: 0.4rem 0.5rem; }
      .login-card { border-radius: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a href="index.html" class="logo" aria-label="StreamWave home">StreamWave</a>
      <select class="lang" aria-label="Select language">
        <option selected>English</option>
      </select>
    </div>
  </header>

  <main>
    <section class="login-card" aria-label="Sign in form">
      <h1>Enter your info to sign in</h1>
      <p class="sub">Or get started with a new account.</p>
      <form id="login-form" action="#" method="post" novalidate>
        <label for="identity" style="position:absolute;left:-9999px;">Email address or mobile number</label>
        <input id="identity" name="identity" placeholder="Email address or mobile number" autocomplete="username" required />
        <label for="password" style="position:absolute;left:-9999px;">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" minlength="4" required />
        <button type="submit">Continue</button>
      </form>

      <div class="help">
        <button class="help-toggle" id="help-toggle" type="button" aria-expanded="false" aria-controls="help-panel">Get help</button>
        <div class="help-panel" id="help-panel">
          <p>Forgot password? Use account recovery from your confirmation email, or contact support for account and billing assistance.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Questions? Contact us.
  </footer>

  <script>
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', (event) => {
      const identity = document.getElementById('identity');
      const password = document.getElementById('password');
      if (!identity.checkValidity()) {
        event.preventDefault();
        identity.reportValidity();
        return;
      }
      if (!password.checkValidity()) {
        event.preventDefault();
        password.reportValidity();
        return;
      }
      event.preventDefault();
    });

    const helpToggle = document.getElementById('help-toggle');
    const helpPanel = document.getElementById('help-panel');

    helpToggle.addEventListener('click', () => {
      const open = helpPanel.classList.toggle('open');
      helpToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  </script>
</body>
</html>
