<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="StreamWave Home">StreamWave</a>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Sign In</h1>
      <form id="login-form" novalidate>
        <label class="sr-only" for="login-identity">Email or mobile number</label>
        <input id="login-identity" name="identity" type="text" placeholder="Email or mobile number" required />

        <label class="sr-only" for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Password" required minlength="6" />

        <button class="full" type="submit">Continue</button>
      </form>

      <button id="help-toggle" class="help-link" aria-expanded="false">Get help</button>
      <div id="help-panel" class="help-panel" hidden>
        <p>Forgot your password? Use password reset to regain account access.</p>
        <p>Need more support? Visit Help Centre for login troubleshooting.</p>
      </div>
    </section>
  </main>

  <footer class="footer login-footer">
    <div class="container">
      <p class="muted">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
