<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent-red: #E50914;
      --accent-red-hover: #f40612;
      --text-primary: #FFFFFF;
      --text-secondary: #b3b3b3;
      --text-muted: #808080;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    .login-header {
      padding: 1.5rem 2rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--accent-red);
    }

    /* Main */
    .login-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .login-form-container {
      width: 100%;
      max-width: 400px;
    }

    .login-form-container h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .login-subtext {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .form-field label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .form-field input {
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-field input:focus {
      border-color: var(--text-primary);
    }

    .btn-continue {
      background: var(--accent-red);
      color: var(--text-primary);
      border: none;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-continue:hover {
      background: var(--accent-red-hover);
    }

    .get-help-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .get-help-toggle::before {
      content: '+';
      font-size: 1.25rem;
      transition: transform 0.2s;
      display: inline-block;
    }

    .get-help-toggle.open::before {
      transform: rotate(45deg);
    }

    .get-help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }

    .get-help-content.open {
      max-height: 200px;
    }

    .get-help-inner {
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 4px;
      margin-top: 0.5rem;
    }

    .get-help-inner a {
      display: block;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0.5rem 0;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .get-help-inner a:hover {
      color: var(--text-primary);
    }

    /* Footer */
    .login-footer {
      padding: 2rem;
      text-align: center;
    }

    .recaptcha-notice {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-header {
        padding: 1rem;
      }

      .logo {
        font-size: 1.5rem;
      }

      .login-main {
        padding: 1rem;
      }

      .login-form-container h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body class="login-page">
  <!-- Header -->
  <header class="login-header">
    <a href="index.html" class="logo">StreamWave</a>
  </header>

  <!-- Login Form -->
  <main class="login-main">
    <div class="login-form-container">
      <h1>Enter your info to sign in</h1>
      <p class="login-subtext">Or <a href="index.html">get started with a new account</a>.</p>

      <form class="login-form" onsubmit="event.preventDefault();">
        <div class="form-field">
          <label for="email">Email address or mobile number</label>
          <input type="text" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <button class="get-help-toggle" id="getHelpToggle">Get help</button>
      <div class="get-help-content" id="getHelpContent">
        <div class="get-help-inner">
          <a href="#">Forgot your password?</a>
          <a href="#">Recover your account</a>
          <a href="#">Contact Support</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="login-footer">
    <p class="recaptcha-notice">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
  </footer>

  <script>
    // Get help toggle
    const getHelpToggle = document.getElementById('getHelpToggle');
    const getHelpContent = document.getElementById('getHelpContent');

    getHelpToggle.addEventListener('click', () => {
      getHelpToggle.classList.toggle('open');
      getHelpContent.classList.toggle('open');
    });
  </script>
</body>
</html>
