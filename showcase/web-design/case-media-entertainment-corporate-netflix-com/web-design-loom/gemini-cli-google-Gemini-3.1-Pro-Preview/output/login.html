<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamWave - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="hero-bg login-bg">
        <div class="hero-overlay"></div>
    </div>
    
    <header class="navbar login-navbar">
        <div class="container-fluid">
            <a href="index.html" class="logo">STREAMWAVE</a>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h1 class="login-title">Enter your info to sign in</h1>
            <p class="login-subtext">Or get started with a new account.</p>
            
            <form class="login-form" id="login-form">
                <div class="input-wrapper">
                    <input type="text" id="login-id" placeholder=" " required>
                    <label for="login-id">Email address or mobile number</label>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="login-password" placeholder=" " required>
                    <label for="login-password">Password</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Continue</button>
            </form>

            <div class="help-section">
                <button class="help-toggle" id="help-toggle" aria-expanded="false">Get help</button>
                <div class="help-content" id="help-content">
                    <p><a href="#">Forgot password?</a></p>
                    <p><a href="#">Find my account</a></p>
                    <p><a href="#">Contact Support</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer login-footer">
        <div class="container">
            <p class="footer-prompt">Questions? Contact us.</p>
            <div class="footer-links">
                <ul class="footer-col">
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Cookie Preferences</a></li>
                </ul>
                <ul class="footer-col">
                    <li><a href="#">Help Centre</a></li>
                    <li><a href="#">Corporate Information</a></li>
                </ul>
                <ul class="footer-col">
                    <li><a href="#">Terms of Use</a></li>
                </ul>
                <ul class="footer-col">
                    <li><a href="#">Privacy</a></li>
                </ul>
            </div>
            <select class="language-select footer-lang" aria-label="Select Language">
                <option value="en">English</option>
            </select>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
