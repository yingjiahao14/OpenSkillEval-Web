<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — StreamWave</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #000;
    color: #fff;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a { color: inherit; }

  /* ── Header ── */
  .header {
    padding: 0 clamp(16px, 4vw, 48px);
    height: 72px;
    display: flex; align-items: center;
  }
  .header-logo {
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #E50914;
    text-decoration: none;
  }

  /* ── Login Form ── */
  .login-main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 40px clamp(16px, 4vw, 24px);
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 40px clamp(24px, 5vw, 40px);
  }
  .login-card h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .login-card .login-sub {
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    margin-bottom: 28px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: none;
  }
  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 16px;
    color: #fff;
    font-family: inherit;
  }
  .form-group input::placeholder { color: rgba(255,255,255,0.4); }
  .form-group input:focus {
    outline: 2px solid #E50914;
    outline-offset: -2px;
    border-color: transparent;
  }
  .btn-continue {
    width: 100%;
    background: #E50914;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-continue:hover { background: #c40812; }
  .btn-continue:active { transform: scale(0.98); }

  /* ── Get Help ── */
  .help-area {
    margin-top: 20px;
    text-align: center;
  }
  .help-toggle {
    background: none; border: none;
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    padding: 8px;
  }
  .help-toggle:hover { color: rgba(255,255,255,0.85); }
  .help-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    text-align: left;
  }
  .help-content.open {
    max-height: 300px;
  }
  .help-content-inner {
    padding: 16px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
  }
  .help-content-inner a {
    color: #E50914;
    display: block;
    padding: 4px 0;
  }
  .help-content-inner a:hover { text-decoration: underline; }

  /* ── Footer ── */
  .login-footer {
    padding: 24px clamp(16px, 4vw, 48px) 32px;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    text-align: center;
  }
  .login-footer a { color: rgba(255,255,255,0.35); }

  @media (max-width: 480px) {
    .login-card { padding: 28px 20px; background: none; border: none; }
    .login-card h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">StreamWave</a>
</header>

<main class="login-main">
  <div class="login-card">
    <h1>Enter your info to sign in</h1>
    <p class="login-sub">Or get started with a new account.</p>

    <form onsubmit="event.preventDefault(); handleLogin(this);" novalidate>
      <div class="form-group">
        <label for="login-email">Email address or mobile number</label>
        <input id="login-email" type="text" placeholder="Email address or mobile number" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="help-area">
      <button class="help-toggle" onclick="toggleHelp()" id="helpBtn" aria-expanded="false">Get help</button>
      <div class="help-content" id="helpContent">
        <div class="help-content-inner">
          <a href="#">Forgot your email or mobile number?</a>
          <a href="#">Forgot your password?</a>
          <a href="#">Can't sign in?</a>
          <a href="#">Account recovery help</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="login-footer">
  <p>This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a></p>
</footer>

<script>
function toggleHelp() {
  const content = document.getElementById('helpContent');
  const btn = document.getElementById('helpBtn');
  const isOpen = content.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen);
}

function handleLogin(form) {
  const email = form.querySelector('#login-email').value.trim();
  const password = form.querySelector('#login-password').value;

  if (!email) {
    alert('Please enter your email address or mobile number.');
    return;
  }
  if (!password) {
    alert('Please enter your password.');
    return;
  }

  alert('Sign-in simulation: credentials submitted for ' + email);
  form.reset();
  document.getElementById('helpContent').classList.remove('open');
  document.getElementById('helpBtn').setAttribute('aria-expanded', 'false');
}
</script>
</body>
</html>
