<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamWave Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#141414; --card:#1d1d1d; --text:#fff; --muted:#b8b8b8; --primary:#e50914; --border:#333; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.82)), url('https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20,20,20,.85);
      backdrop-filter: blur(7px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .logo { color: var(--primary); font-weight: 900; font-size: 1.6rem; text-decoration: none; }
    .lang { min-height: 44px; background: #0f0f0f; color: #fff; border: 1px solid var(--border); border-radius: .45rem; padding: .5rem .65rem; }
    main { flex: 1; display: grid; place-items: center; padding: 1rem; }
    .panel {
      width: min(100%, 430px);
      background: rgba(25,25,25,.94);
      border: 1px solid #2f2f2f;
      border-radius: .85rem;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 .4rem; font-size: clamp(1.45rem, 4.5vw, 2rem); }
    .sub { margin: 0 0 1rem; color: var(--muted); }
    label { display: block; margin-bottom: .4rem; font-weight: 600; }
    input {
      width: 100%;
      min-height: 48px;
      margin-bottom: .95rem;
      border-radius: .5rem;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      padding: .72rem .78rem;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 48px;
      border-radius: .5rem;
      border: 0;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .help-toggle {
      margin-top: 1rem;
      background: transparent;
      border: 0;
      color: #e7e7e7;
      text-decoration: underline;
      padding: 0;
      width: auto;
      min-height: auto;
      font-weight: 600;
    }
    .help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .28s ease;
      color: var(--muted);
      font-size: .94rem;
    }
    .help-content.open { max-height: 140px; margin-top: .65rem; }
    footer { text-align: center; color: #a2a2a2; padding: 1rem; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">StreamWave</a>
    <select class="lang" aria-label="Language selector"><option>English</option></select>
  </header>
  <main>
    <section class="panel" aria-labelledby="signin-title">
      <h1 id="signin-title">Enter your info to sign in</h1>
      <p class="sub">Or get started with a new account.</p>
      <form id="loginForm" novalidate>
        <label for="email">Email address or mobile number</label>
        <input id="email" name="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" minlength="6" />
        <button type="submit">Continue</button>
      </form>
      <button class="help-toggle" id="helpToggle" type="button" aria-expanded="false">Get help</button>
      <div class="help-content" id="helpContent">
        <p>Forgot password? Use the recovery option on the next screen.</p>
        <p>Still stuck? Contact support for account access assistance.</p>
      </div>
    </section>
  </main>
  <footer>This page is protected by Google reCAPTCHA to ensure you're not a bot.</footer>

  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      if (!email.value.trim()) return email.reportValidity();
      if (!password.checkValidity()) return password.reportValidity();
      alert('Sign-in submitted for ' + email.value.trim());
      form.reset();
    });

    const helpToggle = document.getElementById('helpToggle');
    const helpContent = document.getElementById('helpContent');
    helpToggle.addEventListener('click', () => {
      const open = helpContent.classList.toggle('open');
      helpToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  </script>
</body>
</html>
