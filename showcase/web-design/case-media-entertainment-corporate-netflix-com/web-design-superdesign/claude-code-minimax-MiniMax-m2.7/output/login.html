<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent: #E50914;
      --accent-hover: #f40612;
      --text-primary: #FFFFFF;
      --text-secondary: #b3b3b3;
      --text-muted: #808080;
      --border: #2a2a2a;
      --radius: 0.5rem;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    .header {
      padding: 1.5rem 2rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--accent);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, var(--bg-primary) 100%),
        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1920&q=80') center/cover no-repeat;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
    }

    .login-card h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .login-subtext {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: var(--font);
      transition: border-color 200ms ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--text-muted);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .btn-continue {
      width: 100%;
      background: var(--accent);
      color: var(--text-primary);
      border: none;
      padding: 1rem;
      border-radius: var(--radius);
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 100ms ease;
      margin-top: 0.5rem;
    }

    .btn-continue:hover {
      background: var(--accent-hover);
    }

    .btn-continue:active {
      transform: scale(0.98);
    }

    .help-toggle {
      margin-top: 1.5rem;
      text-align: center;
    }

    .help-toggle button {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-family: var(--font);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 150ms ease;
    }

    .help-toggle button:hover {
      color: var(--text-primary);
    }

    .help-toggle svg {
      width: 1rem;
      height: 1rem;
      transition: transform 300ms ease;
    }

    .help-toggle.open svg {
      transform: rotate(45deg);
    }

    .help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 300ms ease, margin 300ms ease;
    }

    .help-toggle.open + .help-content {
      max-height: 200px;
      margin-top: 1rem;
    }

    .help-content-inner {
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius);
      text-align: center;
    }

    .help-content-inner a {
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-decoration: underline;
      transition: color 150ms ease;
    }

    .help-content-inner a:hover {
      color: var(--text-primary);
    }

    /* Footer */
    .footer {
      padding: 2rem;
      text-align: center;
    }

    .footer p {
      color: var(--text-muted);
      font-size: 0.8125rem;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    .footer a:hover {
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (min-width: 768px) {
      .header {
        padding: 2rem 4rem;
      }

      .main {
        padding: 3rem 4rem;
      }

      .login-card {
        padding: 3rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">StreamWave</a>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="login-card">
      <h1>Enter your info to sign in</h1>
      <p class="login-subtext">Or get started with a new account.</p>

      <form class="login-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Email address or mobile number</label>
          <input type="text" id="email" placeholder="Email address or mobile number" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <div class="help-toggle" id="helpToggle">
        <button type="button" aria-expanded="false">
          Get help
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="help-content">
        <div class="help-content-inner">
          <a href="#">Forgot your password?</a><br>
          <a href="#">Recover your account</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a></p>
  </footer>

  <script>
    const helpToggle = document.getElementById('helpToggle');
    const helpBtn = helpToggle.querySelector('button');

    helpToggle.addEventListener('click', () => {
      const isOpen = helpToggle.classList.contains('open');
      helpToggle.classList.toggle('open');
      helpBtn.setAttribute('aria-expanded', !isOpen);
    });
  </script>
</body>
</html>
