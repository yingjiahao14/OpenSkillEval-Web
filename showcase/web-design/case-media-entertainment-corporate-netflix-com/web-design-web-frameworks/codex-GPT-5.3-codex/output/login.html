<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="topbar">
    <a href="index.html" class="logo" aria-label="StreamWave Home">STREAMWAVE</a>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Sign In</h1>
      <form class="login-form" action="#" method="post">
        <label for="login-email" class="sr-only">Email or mobile number</label>
        <input id="login-email" type="text" name="identity" placeholder="Email or mobile number" required />

        <label for="login-password" class="sr-only">Password</label>
        <input id="login-password" type="password" name="password" placeholder="Password" required minlength="4" />

        <button class="btn btn-primary full" type="submit">Continue</button>
      </form>

      <div class="help-wrap">
        <button id="help-toggle" class="help-toggle" aria-expanded="false">Get help</button>
        <div id="help-content" class="help-content" hidden>
          <p>Need support? Try password reset, billing support, or contact StreamWave Help Centre.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer container compact">
    <p>New to StreamWave? <a href="index.html">Get Started</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
