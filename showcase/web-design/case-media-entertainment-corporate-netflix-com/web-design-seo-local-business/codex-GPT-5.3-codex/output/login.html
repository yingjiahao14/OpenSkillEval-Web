<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | StreamWave</title>
  <meta name="description" content="Sign in to StreamWave with your email or mobile number and password.">
  <link rel="canonical" href="https://streamwave.example/login.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://streamwave.example/login.html">
  <meta property="og:title" content="Sign In | StreamWave">
  <meta property="og:description" content="Continue watching your favorite films and series on StreamWave.">
  <meta property="og:image" content="https://streamwave.example/og-cover.jpg">
  <meta name="theme-color" content="#141414">
  <style>
    :root { --bg:#141414; --panel:#1c1c1c; --line:#343434; --text:#fff; --muted:#c4c4c4; --primary:#e50914; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--text); background:
      linear-gradient(to top, #141414 5%, #141414b8 35%, #141414d1 100%),
      radial-gradient(900px 550px at 80% 10%, #e5091430, transparent 60%),
      #111; }
    .top-nav { padding:1rem 0; }
    .container { width:min(92%,1200px); margin:0 auto; }
    .top-inner { display:flex; justify-content:space-between; align-items:center; }
    .logo { color:var(--primary); font-size:1.8rem; font-weight:900; text-decoration:none; }
    .sign-link { color:#fff; text-decoration:none; background:#2a2a2a; border:1px solid #434343; padding:.5rem .85rem; border-radius:.35rem; }
    .wrap { min-height:calc(100vh - 180px); display:grid; place-items:center; padding:1rem 0 2.4rem; }
    .panel { width:min(440px, 100%); background:#0e0e0ee6; border:1px solid var(--line); border-radius:.75rem; padding:1.4rem; }
    h1 { margin:0 0 .35rem; font-size:1.8rem; }
    .sub { margin:0 0 1.1rem; color:var(--muted); }
    .field { margin-bottom:.8rem; }
    label { display:block; margin-bottom:.4rem; font-size:.94rem; color:#ddd; }
    input { width:100%; border:1px solid #555; background:#151515; color:#fff; border-radius:.4rem; padding:.78rem .78rem; min-height:2.8rem; }
    .cta { width:100%; background:var(--primary); color:#fff; border:0; border-radius:.4rem; min-height:2.9rem; font-weight:800; cursor:pointer; margin-top:.25rem; }
    .help-toggle { margin-top:.95rem; background:none; border:0; color:#e3e3e3; text-decoration:underline; cursor:pointer; padding:0; }
    .help-box { max-height:0; overflow:hidden; transition:max-height .28s ease; color:#c8c8c8; }
    .help-box.open { max-height:160px; }
    .help-box p { margin:.65rem 0 0; line-height:1.55; }
    footer { border-top:1px solid #2a2a2a; padding:1.5rem 0 2rem; color:#bdbdbd; font-size:.95rem; }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="container top-inner">
      <a class="logo" href="index.html">StreamWave</a>
      <a class="sign-link" href="index.html">Back</a>
    </div>
  </header>

  <main class="wrap">
    <form class="panel" action="#" method="post">
      <h1>Enter your info to sign in</h1>
      <p class="sub">Or get started with a new account.</p>
      <div class="field">
        <label for="identity">Email address or mobile number</label>
        <input id="identity" name="identity" type="text" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <button class="cta" type="submit">Continue</button>
      <button class="help-toggle" type="button" id="helpToggle">Get help</button>
      <div class="help-box" id="helpBox">
        <p>Forgot your password? Use the account recovery option on the sign-in flow. You can also verify your email or mobile number and try again.</p>
      </div>
    </form>
  </main>

  <footer>
    <div class="container">Questions? Contact us.</div>
  </footer>

  <script>
    const helpToggle = document.getElementById('helpToggle');
    const helpBox = document.getElementById('helpBox');
    helpToggle.addEventListener('click', () => helpBox.classList.toggle('open'));
  </script>
</body>
</html>
