<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Sign In | StreamWave</title>
  <meta name="title" content="Sign In | StreamWave">
  <meta name="description" content="Sign in to your StreamWave account to continue watching unlimited films, series, and more.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.streamwave.com/login">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.streamwave.com/login">
  <meta property="og:title" content="Sign In | StreamWave">
  <meta property="og:description" content="Sign in to your StreamWave account to continue watching unlimited films, series, and more.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="Sign In | StreamWave">
  <meta property="twitter:description" content="Sign in to your StreamWave account.">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E50914'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>S</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #141414;
      --accent: #E50914;
      --accent-hover: #ff0f1f;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.5);
      --border: rgba(255,255,255,0.15);
      --font-heading: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    html {
      font-size: 16px;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────── */
    .header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
      text-decoration: none;
      line-height: 1;
    }

    /* ── Login Form ─────────────────────── */
    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 64px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(20,20,20,0.6);
      border-radius: 8px;
      padding: 48px 40px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .login-card h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .login-subtext {
      color: var(--text-muted);
      font-size: 0.9375rem;
      margin-bottom: 28px;
    }
    .login-subtext a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
    }
    .login-subtext a:hover {
      text-decoration: underline;
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-field input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(20,20,20,0.8);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-field input:focus {
      border-color: #fff;
    }
    .form-field input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .btn-continue {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 4px;
      font-size: 1.0625rem;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-continue:hover {
      background: var(--accent-hover);
    }
    .btn-continue:active {
      transform: scale(0.98);
    }

    /* ── Get Help Toggle ────────────────── */
    .help-section {
      margin-top: 20px;
    }
    .help-trigger {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.9375rem;
      font-family: var(--font-body);
      cursor: pointer;
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .help-trigger:hover {
      color: var(--text-primary);
    }
    .help-trigger .help-arrow {
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.75rem;
    }
    .help-section.open .help-arrow {
      transform: rotate(90deg);
    }
    .help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .help-section.open .help-content {
      max-height: 200px;
    }
    .help-content-inner {
      padding: 12px 0 4px;
    }
    .help-content-inner a {
      display: block;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 6px 0;
      transition: color 0.2s;
    }
    .help-content-inner a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }

    /* ── Footer ─────────────────────────── */
    .footer {
      padding: 32px 32px 48px;
      background: rgba(20,20,20,0.5);
    }
    .footer .container {
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .footer-links a {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-decoration: none;
    }
    .footer-links a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }
    .footer-legal {
      color: var(--text-muted);
      font-size: 0.6875rem;
    }

    /* ── Responsive ─────────────────────── */
    @media (max-width: 600px) {
      .header {
        padding: 20px 16px;
      }
      .header-logo {
        font-size: 1.5rem;
      }
      .login-card {
        padding: 32px 20px;
        background: none;
        border: none;
      }
      .login-main {
        padding: 16px 16px 48px;
      }
      .footer {
        padding: 24px 16px 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="header-logo">StreamWave</a>
  </header>

  <!-- Login Form -->
  <main class="login-main">
    <div class="login-card">
      <h2>Enter your info to sign in</h2>
      <p class="login-subtext">Or <a href="index.html">get started with a new account.</a></p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-field">
          <label for="loginEmail">Email address or mobile number</label>
          <input type="text" id="loginEmail" placeholder="Email or mobile number" required autocomplete="username">
        </div>
        <div class="form-field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <div class="help-section" id="helpSection">
        <button class="help-trigger" id="helpTrigger" aria-expanded="false">
          Get help <span class="help-arrow">›</span>
        </button>
        <div class="help-content">
          <div class="help-content-inner">
            <a href="#">Forgot password?</a>
            <a href="#">Forgot email?</a>
            <a href="#">Need help signing in?</a>
            <a href="#">Contact support</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="#">Terms of Use</a>
        <a href="#">Privacy</a>
        <a href="#">Cookie Preferences</a>
        <a href="#">Contact Us</a>
      </div>
      <p class="footer-legal">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
    </div>
  </footer>

  <script>
    /* ── Help toggle ───────────────────── */
    document.getElementById('helpTrigger').addEventListener('click', function() {
      const section = document.getElementById('helpSection');
      const isOpen = section.classList.toggle('open');
      this.setAttribute('aria-expanded', isOpen);
    });

    /* ── Login form handler ────────────── */
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email) {
        document.getElementById('loginEmail').focus();
        return;
      }
      if (!password) {
        document.getElementById('loginPassword').focus();
        return;
      }

      // Form is valid — in production this would submit to an auth endpoint
      const btn = e.target.querySelector('.btn-continue');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = 'Continue';
        btn.disabled = false;
      }, 1500);
    }
  </script>
</body>
</html>
