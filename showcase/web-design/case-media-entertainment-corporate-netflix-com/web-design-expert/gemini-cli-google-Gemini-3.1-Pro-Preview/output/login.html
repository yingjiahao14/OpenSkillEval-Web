<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StreamWave</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description" content="Sign in to StreamWave">
</head>
<body class="login-body">
  <header class="site-header login-header">
    <div class="container">
      <a href="index.html" class="logo">StreamWave</a>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h1>Enter your info to sign in</h1>
      
      <form class="login-form" action="#" method="post">
        <div class="input-group">
          <input type="text" id="login-email" class="input-field" placeholder=" " required>
          <label for="login-email" class="input-label">Email address or mobile number</label>
        </div>
        
        <div class="input-group">
          <input type="password" id="login-password" class="input-field" placeholder=" " required>
          <label for="login-password" class="input-label">Password</label>
        </div>
        
        <button type="submit" class="btn btn-primary login-btn">Continue</button>
      </form>
      
      <p class="login-subtext">Or get started with a <a href="index.html">new account</a>.</p>
      
      <div class="help-toggle">
        <button class="help-btn">Get help</button>
        <div class="help-content">
          <ul>
            <li><a href="#">Forgot password?</a></li>
            <li><a href="#">Forgot email or phone?</a></li>
            <li><a href="#">Help Center</a></li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer login-footer container">
    <div class="footer-top">
      <p>Questions? Contact us.</p>
    </div>
    
    <div class="footer-links">
      <div class="col">
        <ul>
          <li><a href="#">FAQ</a></li>
          <li><a href="#">Cookie Preferences</a></li>
        </ul>
      </div>
      <div class="col">
        <ul>
          <li><a href="#">Help Centre</a></li>
          <li><a href="#">Corporate Information</a></li>
        </ul>
      </div>
      <div class="col">
        <ul>
          <li><a href="#">Terms of Use</a></li>
        </ul>
      </div>
      <div class="col">
        <ul>
          <li><a href="#">Privacy</a></li>
        </ul>
      </div>
    </div>
    
    <div class="footer-bottom">
      <select class="lang-selector" aria-label="Language">
        <option value="en">English</option>
      </select>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
