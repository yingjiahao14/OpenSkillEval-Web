<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <header class="header">
    <div class="container nav">
      <a class="brand" href="index.html">StreamWave</a>
      <a class="btn btn-ghost" href="index.html">Back</a>
    </div>
  </header>

  <main class="login-wrap">
    <section class="login-card" aria-label="Sign in form">
      <h1>Sign In</h1>
      <form class="login-form" id="loginForm">
        <label for="identifier" class="sr-only" style="position:absolute;left:-9999px;">Email or mobile number</label>
        <input id="identifier" class="input" type="text" placeholder="Email or mobile number" required />
        <label for="password" class="sr-only" style="position:absolute;left:-9999px;">Password</label>
        <input id="password" class="input" type="password" placeholder="Password" required minlength="6" />
        <button class="btn btn-primary" type="submit">Continue</button>
      </form>

      <button id="helpToggle" class="help-toggle" type="button" aria-expanded="false">Get help</button>
      <div id="helpPanel" class="help-panel">
        <p>Having trouble signing in? Try one of these:</p>
        <ul>
          <li>Reset your password via email link</li>
          <li>Check if Caps Lock is on</li>
          <li>Contact support through Help Centre</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>New to StreamWave? <a href="index.html" style="text-decoration:underline;">Create an account.</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
