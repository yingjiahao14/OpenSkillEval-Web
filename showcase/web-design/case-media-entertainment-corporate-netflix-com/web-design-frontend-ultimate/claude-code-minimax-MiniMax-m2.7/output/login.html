<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreamWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #141414;
      --bg-tertiary: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #a1a1a1;
      --accent: #E50914;
      --accent-hover: #ff1a1a;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 9999;
    }

    /* Header */
    header {
      padding: 1.5rem 2rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 2px;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 3rem 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      background: var(--bg-tertiary);
      color: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--text-secondary);
    }

    .btn-continue {
      width: 100%;
      padding: 1rem;
      margin-top: 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-continue:hover {
      background: var(--accent-hover);
    }

    .get-help-toggle {
      margin-top: 1.5rem;
      text-align: center;
    }

    .get-help-toggle button {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }

    .get-help-toggle button:hover {
      color: var(--text-primary);
    }

    .get-help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }

    .get-help-content.active {
      max-height: 300px;
      padding-top: 1rem;
    }

    .get-help-content p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }

    .get-help-content a {
      color: var(--text-secondary);
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    .get-help-content a:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      padding: 2rem;
      text-align: center;
      background: var(--bg-secondary);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    footer p {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .logo {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">STREAMWAVE</a>
  </header>

  <main>
    <div class="login-container">
      <div class="login-card">
        <h1>Enter your info to sign in</h1>
        <p class="login-subtitle">Or get started with a new account.</p>

        <form id="loginForm" onsubmit="event.preventDefault(); alert('Login functionality would be implemented here.');">
          <div class="form-group">
            <label for="email">Email address or mobile number</label>
            <input type="text" id="email" name="email" placeholder="Email address or mobile number" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
          </div>

          <button type="submit" class="btn-continue">Continue</button>
        </form>

        <div class="get-help-toggle">
          <button onclick="toggleHelp()">Get help</button>
          <div class="get-help-content" id="helpContent">
            <p>Forgot your password?</p>
            <a href="#">Reset password</a>
            <p>Issues signing in?</p>
            <a href="#">Contact Customer Support</a>
            <a href="#">Recover your account</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
  </footer>

  <script>
    function toggleHelp() {
      const content = document.getElementById('helpContent');
      content.classList.toggle('active');
    }
  </script>

</body>
</html>
