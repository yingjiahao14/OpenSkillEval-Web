<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <meta name="description" content="Sign in to StreamWave and continue watching your favorite content." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141414;
      --panel: #1a1a1a;
      --text: #fff;
      --muted: #b8b8b8;
      --accent: #e50914;
      --accent-hover: #f51622;
      --border: #2b2b2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(0deg, rgba(20,20,20,.88), rgba(20,20,20,.88)),
        url('https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
    }
    header {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(6px);
    }
    .logo {
      font-family: "Bebas Neue", sans-serif;
      color: var(--accent);
      letter-spacing: .08em;
      font-size: 2rem;
      text-decoration: none;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .panel {
      width: min(460px, 100%);
      background: rgba(17,17,17,.93);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem;
      box-shadow: 0 12px 36px rgba(0,0,0,.45);
    }
    h1 {
      margin: .2rem 0 1rem;
      font-size: clamp(1.7rem, 3.5vw, 2rem);
    }
    .muted { color: var(--muted); margin-bottom: 1.1rem; }
    form { display: grid; gap: .75rem; }
    input {
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #111;
      color: #fff;
      padding: 0 .9rem;
      font-size: 1rem;
    }
    button {
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }

    .help {
      margin-top: 1rem;
      border-top: 1px solid #2a2a2a;
      padding-top: .85rem;
    }
    .help-toggle {
      background: transparent;
      border: 0;
      color: #ffb9bd;
      font-weight: 700;
      padding: 0;
      min-height: auto;
      cursor: pointer;
    }
    .help-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease, margin-top .25s ease;
      color: #d6d6d6;
      margin-top: 0;
      font-size: .95rem;
    }
    .help.open .help-content { max-height: 140px; margin-top: .65rem; }
    footer {
      text-align: center;
      color: #adadad;
      padding: 1rem;
      border-top: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo" aria-label="StreamWave Home">StreamWave</a>
  </header>

  <main>
    <section class="panel" aria-labelledby="signin-title">
      <h1 id="signin-title">Sign In</h1>
      <p class="muted">Use your email or mobile number to continue watching.</p>
      <form onsubmit="event.preventDefault()">
        <input type="text" name="identity" required placeholder="Email or mobile number" aria-label="Email or mobile number" />
        <input type="password" name="password" required placeholder="Password" aria-label="Password" minlength="6" />
        <button type="submit">Continue</button>
      </form>
      <div class="help" id="help">
        <button class="help-toggle" type="button" id="helpToggle">Get help</button>
        <div class="help-content" id="helpContent">
          Forgotten password? Use the account recovery flow from your email. If you still cannot sign in, contact support and include your registered email/mobile for faster help.
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 StreamWave. All rights reserved.</footer>

  <script>
    const help = document.getElementById('help');
    const helpToggle = document.getElementById('helpToggle');
    helpToggle.addEventListener('click', () => {
      help.classList.toggle('open');
    });
  </script>
</body>
</html>
