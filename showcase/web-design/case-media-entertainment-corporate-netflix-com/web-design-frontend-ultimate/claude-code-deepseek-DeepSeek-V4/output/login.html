<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — StreamWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #000000;
  --bg-secondary: #141414;
  --bg-card: #1c1c1c;
  --text-primary: #FFFFFF;
  --text-secondary: #B3B3B3;
  --text-muted: #808080;
  --accent: #E50914;
  --accent-hover: #ff0f1a;
  --accent-glow: rgba(229, 9, 20, 0.3);
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.2);
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --max-width: 1200px;
  --header-height: 72px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
  opacity: 0.025;
  pointer-events: none;
  z-index: 9999;
}

/* ── Header ── */
.header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  padding: 0 40px;
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 2px;
  color: var(--accent);
  text-decoration: none;
  text-transform: uppercase;
}

.back-link {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.2s ease;
}
.back-link:hover { color: var(--text-primary); }

/* ── Main Content ── */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  position: relative;
  z-index: 1;
}

.login-card {
  width: 100%;
  max-width: 420px;
  animation: fadeSlideUp 0.6s ease-out both;
}

.login-card h1 {
  font-family: var(--font-display);
  font-size: 32px;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.login-subtext {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}
.login-subtext a {
  color: var(--text-primary);
  font-weight: 600;
  text-decoration: none;
}
.login-subtext a:hover { text-decoration: underline; }

/* ── Form ── */
.form-group {
  margin-bottom: 16px;
}

.form-input {
  width: 100%;
  padding: 16px 20px;
  font-size: 16px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-body);
  outline: none;
  transition: border-color 0.2s ease;
}
.form-input::placeholder { color: rgba(255, 255, 255, 0.45); }
.form-input:focus { border-color: white; }

.btn-continue {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-body);
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}
.btn-continue:hover { background: var(--accent-hover); box-shadow: 0 0 24px var(--accent-glow); }

.form-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 24px 0;
}
.form-divider::before,
.form-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-light);
}
.form-divider span {
  font-size: 13px;
  color: var(--text-muted);
}

.btn-secondary {
  width: 100%;
  padding: 14px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }

/* ── Get Help ── */
.help-section {
  margin-top: 32px;
}

.help-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  background: none;
  border: none;
  border-top: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 15px;
  cursor: pointer;
  transition: color 0.2s ease;
}
.help-trigger:hover { color: var(--text-primary); }

.help-icon {
  width: 20px;
  height: 20px;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--text-muted);
}
.help-section.open .help-icon { transform: rotate(45deg); }

.help-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.help-section.open .help-content { max-height: 400px; }

.help-inner {
  padding: 0 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.help-link {
  color: var(--text-secondary);
  font-size: 14px;
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-color: rgba(255, 255, 255, 0.2);
  transition: color 0.2s ease;
}
.help-link:hover { color: var(--text-primary); }

.help-note {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── Background atmosphere ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
}
.bg-orb-1 {
  width: 500px; height: 500px;
  background: rgba(229, 9, 20, 0.06);
  top: -200px; right: -100px;
}
.bg-orb-2 {
  width: 400px; height: 400px;
  background: rgba(30, 30, 60, 0.15);
  bottom: -150px; left: -150px;
}

/* ── Footer ── */
.footer {
  padding: 24px 20px;
  max-width: var(--max-width);
  margin: 0 auto;
  width: 100%;
  border-top: 1px solid var(--border);
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.footer-lang select {
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 8px 32px 8px 14px;
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
}
.footer-lang select option { background: #1a1a1a; color: white; }

.footer-legal {
  font-size: 12px;
  color: var(--text-muted);
}

/* ── Animations ── */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-group:nth-child(1) { animation: fadeSlideUp 0.6s ease-out 0.1s both; }
.form-group:nth-child(2) { animation: fadeSlideUp 0.6s ease-out 0.2s both; }
.btn-continue { animation: fadeSlideUp 0.6s ease-out 0.3s both; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .header { padding: 0 16px; }
  .main { padding: 40px 16px; }
  .login-card h1 { font-size: 26px; }
}

@media (max-width: 480px) {
  .footer-inner { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="bg-orb bg-orb-1" aria-hidden="true"></div>
<div class="bg-orb bg-orb-2" aria-hidden="true"></div>

<!-- ── Header ── -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">StreamWave</a>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</header>

<!-- ── Login Form ── -->
<main class="main">
  <div class="login-card">
    <h1>Enter your info to sign in</h1>
    <p class="login-subtext">Or <a href="index.html">get started with a new account.</a></p>

    <form onsubmit="event.preventDefault(); handleLogin(this)">
      <div class="form-group">
        <input type="text" class="form-input" placeholder="Email address or mobile number" required aria-label="Email address or mobile number" autocomplete="email">
      </div>
      <div class="form-group">
        <input type="password" class="form-input" placeholder="Password" required aria-label="Password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="form-divider"><span>OR</span></div>

    <button class="btn-secondary" onclick="alert('Use a one-time code instead')">Use a Sign-In Code</button>

    <div class="help-section" id="helpSection">
      <button class="help-trigger" onclick="toggleHelp()" aria-expanded="false">
        Get help
        <svg class="help-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="3" x2="10" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="help-content">
        <div class="help-inner">
          <a href="#" class="help-link">Forgot password?</a>
          <a href="#" class="help-link">Forgot email?</a>
          <a href="#" class="help-link">Can't sign in?</a>
          <p class="help-note">Need more help? Visit our <a href="#" style="color: var(--text-primary);">Help Centre</a> or <a href="#" style="color: var(--text-primary);">Contact Us</a>.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ── Footer ── -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-lang">
      <select aria-label="Language">
        <option>English</option>
        <option>Español</option>
        <option>Français</option>
        <option>Deutsch</option>
      </select>
    </div>
    <p class="footer-legal">This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#" style="color: var(--text-muted);">Learn more.</a></p>
  </div>
</footer>

<script>
function toggleHelp() {
  const section = document.getElementById('helpSection');
  const trigger = section.querySelector('.help-trigger');
  const isOpen = section.classList.contains('open');

  if (isOpen) {
    section.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  } else {
    section.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
}

function handleLogin(form) {
  const email = form.querySelector('input[type="text"]').value;
  const password = form.querySelector('input[type="password"]').value;

  if (email && password) {
    const btn = form.querySelector('.btn-continue');
    const originalText = btn.textContent;
    btn.textContent = 'Signing in...';
    btn.style.opacity = '0.7';

    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.opacity = '1';
      alert('Sign in demo — no real authentication is performed.');
      form.reset();
    }, 1200);
  }
}
</script>

</body>
</html>
