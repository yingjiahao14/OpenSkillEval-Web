<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StreamWave</title>
  <meta name="description" content="Sign in to your StreamWave account." />
  <style>
    :root {
      --bg: #141414;
      --panel: #1b1b1b;
      --border: #333;
      --text: #fff;
      --muted: #b5b5b5;
      --accent: #e50914;
      --accent-hover: #f6121d;
      --radius: 14px;
      --max-width: 1160px;
      --ease: 220ms cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 15%, rgba(229,9,20,.15), transparent 35%),
        radial-gradient(circle at 84% 65%, rgba(229,9,20,.12), transparent 40%),
        linear-gradient(180deg, #161616, #101010 55%, #131313);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.5;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .container { width: min(100% - 2rem, var(--max-width)); margin-inline: auto; }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      font-weight: 800;
      letter-spacing: .35px;
      text-decoration: none;
      color: #fff;
    }

    .brand-mark {
      width: 14px;
      height: 32px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff3340, #b00008);
      box-shadow: 0 0 20px rgba(229,9,20,.45);
    }

    .panel-wrap {
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3.2rem) 0;
    }

    .panel {
      width: min(100%, 430px);
      background: rgba(20,20,20,.9);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      padding: 1.45rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.48);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: .2rem 0 1rem;
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.12;
    }

    .form-row { display: grid; gap: .38rem; margin-bottom: .9rem; }

    label { font-size: .95rem; color: #f1f1f1; font-weight: 600; }

    input {
      width: 100%;
      min-height: 50px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(0,0,0,.45);
      color: #fff;
      padding: .78rem .88rem;
      font-size: 1rem;
    }

    input::placeholder { color: #9f9f9f; }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: .3rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--ease), transform var(--ease);
    }

    button:hover { background: var(--accent-hover); transform: translateY(-1px); }

    input:focus-visible,
    button:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .help {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: .9rem;
    }

    details {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .72rem .82rem;
      font-weight: 700;
    }

    summary::-webkit-details-marker { display: none; }

    .help-body {
      color: var(--muted);
      padding: 0 .82rem .85rem;
      font-size: .95rem;
    }

    .help-body a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

    footer {
      color: #a8a8a8;
      font-size: .92rem;
      border-top: 1px solid var(--border);
      padding: 1.15rem 0 1.6rem;
    }
  </style>
</head>
<body>
  <header class="container topbar">
    <a href="index.html" class="brand" aria-label="Back to StreamWave home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>StreamWave</span>
    </a>
  </header>

  <main class="panel-wrap container">
    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Sign In</h1>
      <form id="login-form" action="#" method="post" novalidate>
        <div class="form-row">
          <label for="login-identity">Email or mobile number</label>
          <input id="login-identity" name="identity" type="text" autocomplete="username" placeholder="Enter email or mobile" required />
        </div>
        <div class="form-row">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </div>
        <button type="submit">Continue</button>
      </form>

      <div class="help">
        <details id="help-toggle">
          <summary>Get help <span aria-hidden="true">+</span></summary>
          <div class="help-body">
            Forgot password? Reset it in a few minutes. You can also visit the <a href="#">Help Centre</a> or contact support for account access.
          </div>
        </details>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">© 2026 StreamWave</div>
  </footer>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const identity = document.getElementById('login-identity');
      const password = document.getElementById('login-password');

      form.addEventListener('submit', function (event) {
        let valid = true;

        if (!identity.value.trim()) {
          valid = false;
          identity.setCustomValidity('Please enter your email or mobile number.');
        } else {
          identity.setCustomValidity('');
        }

        if (!password.value.trim()) {
          valid = false;
          password.setCustomValidity('Please enter your password.');
        } else {
          password.setCustomValidity('');
        }

        if (!valid) {
          event.preventDefault();
          form.reportValidity();
          return;
        }

        event.preventDefault();
      });
    })();
  </script>
</body>
</html>
