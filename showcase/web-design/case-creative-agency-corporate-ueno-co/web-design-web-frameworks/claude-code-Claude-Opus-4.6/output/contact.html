<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo"><a href="index.html">Volta.</a></div>
    <nav class="desktop-nav">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="mobile-overlay">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="page-content">

    <section class="contact-hero">
      <h1 class="contact-title">Contact</h1>
    </section>

    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
      <a href="#" class="contact-link">Instagram.</a>
      <a href="#" class="contact-link">Twitter.</a>
    </div>

  </main>

  <footer class="site-footer">
    <span class="footer-text">&copy; 2025 Volta Studio</span>
    <span class="footer-text">Function + Feeling</span>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const overlay = document.querySelector('.mobile-overlay');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      overlay.classList.toggle('active');
      document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : '';
    });

    overlay.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  </script>

</body>
</html>
