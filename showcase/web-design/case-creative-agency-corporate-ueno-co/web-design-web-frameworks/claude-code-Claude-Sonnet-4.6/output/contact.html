<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F2ED;
      --near-black: #1A1A1A;
      --mid-gray: #6B6B6B;
      --light-gray: #E8E4DF;
    }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      color: var(--near-black);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAVIGATION ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      background: var(--cream);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    nav.scrolled { border-bottom-color: var(--light-gray); }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-links a.active { opacity: 1; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--near-black);
      transition: all 0.3s ease;
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .mobile-overlay.active { opacity: 1; }
    .mobile-overlay a {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: -0.02em;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .mobile-overlay a:hover { opacity: 1; }

    /* ── CONTACT HERO ── */
    .contact-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 3rem;
      min-height: 100vh;
    }

    .contact-inner {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 18vw, 16rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 5rem;
    }

    /* ── CONTACT LINKS ── */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 400px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-top: 1px solid var(--light-gray);
      text-decoration: none;
      color: var(--near-black);
      transition: opacity 0.2s;
    }
    .contact-link:last-child { border-bottom: 1px solid var(--light-gray); }
    .contact-link:hover { opacity: 0.5; }

    .contact-link-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .contact-link-arrow {
      font-size: 1.25rem;
      opacity: 0.4;
      transition: transform 0.2s, opacity 0.2s;
    }
    .contact-link:hover .contact-link-arrow {
      transform: translate(3px, -3px);
      opacity: 0.8;
    }

    /* ── FOOTER ── */
    footer {
      padding: 2rem 3rem;
      border-top: 1px solid var(--light-gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8125rem;
      color: var(--mid-gray);
    }
    footer a { color: var(--mid-gray); text-decoration: none; }
    footer a:hover { color: var(--near-black); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 1.25rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .mobile-overlay { display: flex; }

      .contact-main { padding: 0 1.5rem; }
      .contact-heading { margin-bottom: 3rem; }
      footer { padding: 2rem 1.5rem; flex-direction: column; gap: 0.75rem; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" id="mobileOverlay" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <a href="index.html" onclick="closeMobileMenu()">Volta.</a>
    <a href="neweno.html" onclick="closeMobileMenu()">Neweno</a>
    <a href="services.html" onclick="closeMobileMenu()">Services</a>
    <a href="clients.html" onclick="closeMobileMenu()">Clients</a>
    <a href="contact.html" onclick="closeMobileMenu()">Contact</a>
  </div>

  <!-- Navigation -->
  <nav id="mainNav">
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Contact Hero -->
  <main class="contact-main">
    <div class="contact-inner">
      <h1 class="contact-heading">Contact</h1>

      <nav class="contact-links" aria-label="Contact links">
        <a href="mailto:hello@voltastudio.com" class="contact-link">
          <span class="contact-link-label">Email.</span>
          <span class="contact-link-arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener noreferrer" class="contact-link">
          <span class="contact-link-label">Instagram.</span>
          <span class="contact-link-arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener noreferrer" class="contact-link">
          <span class="contact-link-label">Twitter.</span>
          <span class="contact-link-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <span>© 2025 Volta Studio</span>
    <span>Reykjavík · Iceland</span>
  </footer>

  <script>
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    const hamburger = document.getElementById('hamburger');
    const overlay = document.getElementById('mobileOverlay');
    let menuOpen = false;

    function openMobileMenu() {
      menuOpen = true;
      overlay.style.display = 'flex';
      requestAnimationFrame(() => overlay.classList.add('active'));
      hamburger.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
      menuOpen = false;
      overlay.classList.remove('active');
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      setTimeout(() => { overlay.style.display = 'none'; }, 350);
    }

    hamburger.addEventListener('click', () => {
      menuOpen ? closeMobileMenu() : openMobileMenu();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOpen) closeMobileMenu();
    });
  </script>
</body>
</html>
