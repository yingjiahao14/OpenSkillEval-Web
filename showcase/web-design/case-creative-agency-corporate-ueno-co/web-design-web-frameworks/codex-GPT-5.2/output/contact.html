<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Volta Studio</title>
    <meta name="description" content="Contact Volta Studio." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/site.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div style="display:none" data-icons-holder></div>

      <header class="site-header" data-site-header>
        <nav class="nav container" aria-label="Primary">
          <a class="brand" href="index.html" aria-label="Volta. Home">Volta.</a>

          <div class="nav-links" role="navigation">
            <a href="neweno.html">Neweno</a>
            <a href="services.html">Services</a>
            <a href="clients.html">Clients</a>
            <a href="contact.html" aria-current="page">Contact</a>
          </div>

          <button
            class="nav-toggle"
            type="button"
            data-menu-toggle
            aria-controls="mobile-menu"
            aria-expanded="false"
            aria-label="Open menu"
            data-icon-open='<svg class="nav-icon" aria-hidden="true"><use href="#icon-menu"></use></svg>'
            data-icon-close='<svg class="nav-icon" aria-hidden="true"><use href="#icon-close"></use></svg>'
          >
            <svg class="nav-icon" aria-hidden="true"><use href="#icon-menu"></use></svg>
          </button>
        </nav>
      </header>

      <div id="mobile-menu" class="overlay" data-menu-overlay aria-hidden="true">
        <div class="overlay-inner">
          <a data-menu-link href="index.html">Home</a>
          <a data-menu-link href="neweno.html">Neweno</a>
          <a data-menu-link href="services.html">Services</a>
          <a data-menu-link href="clients.html">Clients</a>
          <a data-menu-link href="contact.html" aria-current="page">Contact</a>
          <small>Volta Studio — Function + Feeling.</small>
        </div>
      </div>

      <main>
        <section class="contact-hero" aria-label="Contact">
          <div class="container">
            <div class="eyebrow">Volta Studio</div>
            <h1 class="contact-title">Contact</h1>
            <div class="contact-links" aria-label="Contact links">
              <a href="mailto:hello@volta.studio">Email.</a>
              <a href="#" aria-label="Instagram (placeholder)">Instagram.</a>
              <a href="#" aria-label="Twitter (placeholder)">Twitter.</a>
            </div>
          </div>
        </section>

        <footer class="footer">
          <div class="container footer-inner">
            <span>hello@volta.studio</span>
            <span style="display:flex;gap:14px;flex-wrap:wrap">
              <a href="neweno.html">Neweno</a>
              <a href="services.html">Services</a>
              <a href="clients.html">Clients</a>
            </span>
          </div>
        </footer>
      </main>
    </div>

    <script>
      (function(){
        var holder=document.querySelector('[data-icons-holder]');
        if(!holder) return;
        fetch('assets/icons.svg').then(function(r){return r.text()}).then(function(svg){holder.outerHTML=svg;});
      })();
    </script>
  </body>
</html>
