<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav__logo">Volta.</a>
    <div class="nav__links">
      <a href="neweno.html" class="nav__link">Neweno</a>
      <a href="services.html" class="nav__link">Services</a>
      <a href="clients.html" class="nav__link">Clients</a>
      <a href="contact.html" class="nav__link">Contact</a>
    </div>
    <button class="nav__hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Overlay -->
  <div class="nav__overlay">
    <div class="nav__overlay-links">
      <a href="index.html" class="nav__overlay-link">Volta.</a>
      <a href="neweno.html" class="nav__overlay-link">Neweno</a>
      <a href="services.html" class="nav__overlay-link">Services</a>
      <a href="clients.html" class="nav__overlay-link">Clients</a>
      <a href="contact.html" class="nav__overlay-link">Contact</a>
    </div>
  </div>

  <!-- Contact Hero -->
  <section class="contact-hero section">
    <div class="container">
      <h1 class="contact-heading">Contact</h1>
    </div>
  </section>

  <!-- Contact Links -->
  <section class="contact-links section" style="padding-top: 0;">
    <div class="container">
      <div class="contact-links__items">
        <a href="mailto:hello@volta.studio" class="contact-link">Email.</a>
        <a href="https://instagram.com" class="contact-link">Instagram.</a>
        <a href="https://twitter.com" class="contact-link">Twitter.</a>
      </div>
    </div>
  </section>

  <style>
    .contact-hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding-top: 0;
    }

    .contact-heading {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 20vw, 15rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
    }

    .contact-links {
      padding-top: var(--space-3xl);
    }

    .contact-links__items {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
    }

    .contact-link {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .contact-link:hover {
      color: var(--text-primary);
    }
  </style>

  <script>
    // Mobile menu toggle
    const hamburger = document.querySelector('.nav__hamburger');
    const overlay = document.querySelector('.nav__overlay');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      overlay.classList.toggle('active');
      document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : '';
    });

    document.querySelectorAll('.nav__overlay-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
