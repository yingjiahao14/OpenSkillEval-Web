<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="header">
    <a href="index.html" class="logo">Volta<span>.</span></a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Nav Overlay -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Contact -->
  <section class="contact-section">
    <h1 class="contact-heading">Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@volta.studio">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener">Twitter.</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer" style="border-top: none;">
    <p>&copy; 2025 Volta Studio. All rights reserved.</p>
  </footer>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const mobileNav = document.getElementById('mobileNav');
    const header = document.getElementById('header');

    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', !expanded);
      mobileNav.classList.toggle('open');
      document.body.style.overflow = !expanded ? 'hidden' : '';
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
