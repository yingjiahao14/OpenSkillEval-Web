<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <a href="index.html" class="logo" aria-label="Volta Studio homepage">Volta.</a>
    <nav class="nav-desktop" aria-label="Main navigation">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" id="mobileMenu">
    <nav aria-label="Mobile navigation">
      <a href="index.html">Home</a>
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <main>
    <!-- Contact Hero -->
    <section class="contact-hero section container">
      <h1>Contact</h1>
      <div class="contact-links">
        <a href="mailto:hello@voltastudio.com">Email.</a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram.</a>
        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter.</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Volta Studio</p>
  </footer>

  <script>
    (function() {
      var header = document.getElementById('siteHeader');
      var hamburger = document.getElementById('hamburger');
      var mobileMenu = document.getElementById('mobileMenu');
      var body = document.body;

      var scrollTicking = false;
      window.addEventListener('scroll', function() {
        if (!scrollTicking) {
          requestAnimationFrame(function() {
            if (window.scrollY > 10) {
              header.classList.add('scrolled');
            } else {
              header.classList.remove('scrolled');
            }
            scrollTicking = false;
          });
          scrollTicking = true;
        }
      });

      hamburger.addEventListener('click', function() {
        var isOpen = hamburger.classList.toggle('open');
        mobileMenu.classList.toggle('open');
        hamburger.setAttribute('aria-expanded', isOpen);
        body.style.overflow = isOpen ? 'hidden' : '';
      });

      var menuLinks = mobileMenu.querySelectorAll('a');
      for (var i = 0; i < menuLinks.length; i++) {
        menuLinks[i].addEventListener('click', function() {
          hamburger.classList.remove('open');
          mobileMenu.classList.remove('open');
          hamburger.setAttribute('aria-expanded', 'false');
          body.style.overflow = '';
        });
      }
    })();
  </script>
</body>
</html>
