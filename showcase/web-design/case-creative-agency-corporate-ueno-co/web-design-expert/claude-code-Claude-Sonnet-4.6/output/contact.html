<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: oklch(97% 0.008 70);
      --text: oklch(14% 0.01 50);
      --text-muted: oklch(50% 0.01 50);
      --border: oklch(88% 0.01 70);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    nav.desktop-nav {
      display: flex;
      gap: 2.5rem;
    }

    nav.desktop-nav a {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav.desktop-nav a:hover { color: var(--text); }
    nav.desktop-nav a.active { color: var(--text); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 0.25rem;
      background: none;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--text);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-menu.open { opacity: 1; pointer-events: all; }

    .mobile-menu-close {
      position: absolute;
      top: 1.5rem;
      right: 3rem;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text);
      line-height: 1;
    }

    .mobile-menu a {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .mobile-menu a:hover { color: var(--text-muted); }

    /* ── CONTACT HERO ── */
    .contact-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 8rem 3rem 5rem;
      min-height: 100vh;
    }

    .contact-heading {
      font-family: var(--serif);
      font-size: clamp(5rem, 18vw, 20rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      color: var(--text);
      margin-bottom: 4rem;
      /* Bleed slightly left */
      margin-left: -0.04em;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    .contact-link {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3vw, 2.5rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      display: inline-block;
      width: fit-content;
    }

    .contact-link:hover {
      color: var(--text);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      header { padding: 1.25rem 1.5rem; }
      nav.desktop-nav { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }

      .contact-main { padding: 7rem 1.5rem 4rem; }

      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="logo">Volta.</a>
  <nav class="desktop-nav">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
  <button class="hamburger" aria-label="Open menu" id="hamburger">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true">
  <button class="mobile-menu-close" id="menuClose" aria-label="Close menu">&times;</button>
  <a href="index.html">Home</a>
  <a href="neweno.html">Neweno</a>
  <a href="services.html">Services</a>
  <a href="clients.html">Clients</a>
  <a href="contact.html">Contact</a>
</div>

<!-- CONTACT -->
<main class="contact-main">
  <h1 class="contact-heading">Contact.</h1>

  <div class="contact-links">
    <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
    <a href="https://instagram.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Instagram.</a>
    <a href="https://twitter.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Twitter.</a>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <span>Volta Studio</span>
  <span>Function + Feeling</span>
</footer>

<script>
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  const menuClose = document.getElementById('menuClose');

  function openMenu() {
    mobileMenu.classList.add('open');
    document.body.style.overflow = 'hidden';
    menuClose.focus();
  }

  function closeMenu() {
    mobileMenu.classList.remove('open');
    document.body.style.overflow = '';
    hamburger.focus();
  }

  hamburger.addEventListener('click', openMenu);
  menuClose.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && mobileMenu.classList.contains('open')) closeMenu();
  });
</script>
</body>
</html>
