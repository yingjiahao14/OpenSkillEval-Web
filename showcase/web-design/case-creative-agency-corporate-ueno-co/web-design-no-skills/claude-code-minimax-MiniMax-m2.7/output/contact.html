<!DOCTYPE html>
<html lang="en">
<head>

  <title>Contact — Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header" style="background: transparent; position: absolute;">
    <a href="index.html" class="logo">Volta.</a>
    <nav>
      <ul class="desktop-nav">
        <li><a href="neweno.html">Neweno</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Volta.</a>
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>

  <main class="page-content contact-page">
    <section class="contact-hero">

    <section class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', function() {
      this.classList.toggle('active');
      mobileMenu.classList.toggle('active');
      document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
    });
  </script>
