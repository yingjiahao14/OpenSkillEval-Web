<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .contact-main {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px var(--margin);
    }
    .contact-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 18vw, 18rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--text);
      margin: 0 0 80px;
    }
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .contact-links a {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-style: italic;
      font-weight: 400;
      color: var(--text);
      text-decoration: none;
      width: fit-content;
      position: relative;
      transition: color 0.2s;
    }
    .contact-links a::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--text);
      transition: width 0.3s ease;
    }
    .contact-links a:hover { color: #C4785A; }
    .contact-links a:hover::after { width: 100%; background: #C4785A; }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-inner">
      <a href="index.html" class="logo">Volta.</a>
      <ul class="nav-links">
        <li><a href="neweno.html">Neweno</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button class="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <div class="mobile-overlay" id="mobileOverlay">
    <button class="overlay-close" aria-label="Close menu">✕</button>
    <nav class="overlay-nav">
      <a href="index.html">Home</a>
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>

  <main class="contact-main">
    <div class="contact-hero">
      <h1>Contact</h1>
    </div>
    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com" target="_blank" rel="noopener">Twitter.</a>
    </div>
  </main>

  <script src="shared.js"></script>
</body>
</html>
