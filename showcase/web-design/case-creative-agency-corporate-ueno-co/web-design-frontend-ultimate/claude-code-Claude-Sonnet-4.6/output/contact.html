<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F2ED;
      --ink: #1A1A1A;
      --ink-light: #6B6560;
      --accent: #C4704A;
      --cream: #EDE9E2;
      --border: rgba(26,26,26,0.12);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: var(--sans);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a.active { color: var(--accent); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--ink);
      transition: all 0.3s ease;
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mobile-menu.open { opacity: 1; }
    .mobile-menu a {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    .mobile-menu a:hover { color: var(--accent); }

    /* ── CONTACT HERO ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .contact-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 3rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-headline {
      font-family: var(--serif);
      font-size: clamp(5rem, 18vw, 18rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      color: var(--ink);
      margin-bottom: 5vw;
      /* Overflow allowed — the headline IS the design */
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 400px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border);
      text-decoration: none;
      color: var(--ink);
      transition: color 0.2s;
      font-size: 1.125rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .contact-link:last-child {
      border-bottom: 1px solid var(--border);
    }

    .contact-link:hover {
      color: var(--accent);
    }

    .contact-link:hover .link-arrow {
      transform: translate(3px, -3px);
    }

    .link-arrow {
      font-size: 1rem;
      transition: transform 0.2s ease;
      opacity: 0.5;
    }

    /* ── FOOTER ── */
    .footer-strip {
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-strip p { font-size: 0.75rem; color: var(--ink-light); letter-spacing: 0.04em; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      nav { padding: 1.25rem 2rem; }
      .contact-stage { padding-left: 2rem; padding-right: 2rem; }
      .footer-strip { padding: 1.75rem 2rem; }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
      nav { padding: 1.25rem 1.5rem; }
      .contact-stage { padding: 100px 1.5rem 3rem; }
      .contact-headline { font-size: clamp(4rem, 22vw, 8rem); margin-bottom: 2.5rem; }
      .footer-strip { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }

    @media (max-width: 480px) {
      .contact-headline { font-size: clamp(3.5rem, 24vw, 6rem); }
      .contact-link { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Navigation">
    <a href="index.html" onclick="closeMenu()">Volta.</a>
    <a href="neweno.html" onclick="closeMenu()">Neweno</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="clients.html" onclick="closeMenu()">Clients</a>
    <a href="contact.html" onclick="closeMenu()">Contact</a>
  </div>

  <nav>
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <div class="contact-stage">
      <h1 class="contact-headline">Contact</h1>
      <nav class="contact-links" aria-label="Contact links">
        <a href="mailto:hello@volta.studio" class="contact-link">
          <span>Email.</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://instagram.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">
          <span>Instagram.</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://twitter.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">
          <span>Twitter.</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </div>
  </main>

  <footer class="footer-strip">
    <p>© 2025 Volta Studio</p>
    <p>Function + Feeling</p>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      mobileMenu.style.display = 'flex';
      requestAnimationFrame(() => mobileMenu.classList.add('open'));
      hamburger.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menuOpen = false;
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      setTimeout(() => { if (!menuOpen) mobileMenu.style.display = 'none'; }, 300);
    }

    hamburger.addEventListener('click', () => { if (menuOpen) closeMenu(); else openMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menuOpen) closeMenu(); });
  </script>
</body>
</html>
