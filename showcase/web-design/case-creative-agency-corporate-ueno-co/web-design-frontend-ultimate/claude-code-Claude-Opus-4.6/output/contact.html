<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <meta name="description" content="Get in touch with Volta Studio.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="logo">Volta.</a>
    <nav class="desktop-nav">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger" aria-label="Toggle navigation menu" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile overlay -->
  <div class="mobile-overlay" id="mobileOverlay">
    <a href="index.html" onclick="toggleMenu()">Home</a>
    <a href="neweno.html" onclick="toggleMenu()">Neweno</a>
    <a href="services.html" onclick="toggleMenu()">Services</a>
    <a href="clients.html" onclick="toggleMenu()">Clients</a>
    <a href="contact.html" onclick="toggleMenu()">Contact</a>
  </div>

  <!-- Contact Hero -->
  <main class="contact-hero">
    <h1 class="contact-title fade-in">Contact</h1>
    <nav class="contact-links fade-in fade-in-delay-1">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="#">Instagram.</a>
      <a href="#">Twitter.</a>
    </nav>
  </main>

  <script>
    function toggleMenu() {
      document.querySelector('.hamburger').classList.toggle('active');
      document.getElementById('mobileOverlay').classList.toggle('active');
      document.body.style.overflow = document.getElementById('mobileOverlay').classList.contains('active') ? 'hidden' : '';
    }
  </script>

</body>
</html>
