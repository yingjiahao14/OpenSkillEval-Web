<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-cream: #F5F2ED;
      --text-near-black: #1A1A1A;
      --accent-terracotta: #C4785A;
      --accent-sage: #8A9A7B;
      --accent-sand: #D4C5B0;
      --white: #FDFCFA;
      --gray-light: #E8E4DD;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-near-black);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      line-height: 1.15;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-cream);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      gap: 2.5rem;
    }

    nav a {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 200;
      background: none;
      border: none;
      padding: 0.5rem;
    }

    .hamburger span {
      width: 24px;
      height: 1.5px;
      background: var(--text-near-black);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(4px, 4px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(4px, -4px);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-cream);
      z-index: 150;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .mobile-menu.active {
      opacity: 1;
      pointer-events: all;
    }

    .mobile-menu a {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 500;
    }

    /* Contact Hero */
    .contact-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 8rem 3rem 4rem;
    }

    .contact-hero h1 {
      font-size: clamp(4rem, 15vw, 12rem);
      letter-spacing: -0.05em;
      line-height: 0.9;
      margin-bottom: 4rem;
    }

    /* Contact Links */
    .contact-links {
      display: flex;
      gap: 3rem;
      justify-content: center;
    }

    .contact-links a {
      font-size: 1.125rem;
      font-weight: 400;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .contact-links a:hover {
      opacity: 1;
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 3rem;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.5;
      background: var(--bg-cream);
    }

    @media (max-width: 768px) {
      header {
        padding: 1.25rem 1.5rem;
      }

      nav {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .mobile-menu {
        display: flex;
      }

      .contact-hero {
        padding: 6rem 1.5rem 3rem;
        min-height: auto;
        padding-top: 8rem;
        justify-content: flex-start;
        text-align: left;
      }

      .contact-hero h1 {
        font-size: clamp(2.5rem, 12vw, 4rem);
        margin-bottom: 3rem;
      }

      .contact-links {
        flex-direction: column;
        gap: 1.5rem;
        align-items: flex-start;
      }

      .contact-links a {
        font-size: 1rem;
      }

      footer {
        padding: 1.5rem;
        position: relative;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <a href="index.html" class="logo">Volta.</a>
    <nav>
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
  </div>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <h1>Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@volta.studio">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener noreferrer">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener noreferrer">Twitter.</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 Volta Studio. All rights reserved.
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('active');
      document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
    });
  </script>
</body>
</html>
