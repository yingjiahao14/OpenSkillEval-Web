<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Volta Studio</title>
  <meta name="title" content="Contact | Volta Studio">
  <meta name="description" content="Get in touch with Volta Studio. Reach out via email or follow us on Instagram and Twitter.">

  <link rel="canonical" href="https://voltastudio.com/contact">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://voltastudio.com/contact">
  <meta property="og:title" content="Contact | Volta Studio">
  <meta property="og:description" content="Get in touch with Volta Studio. Reach out via email or follow us on Instagram and Twitter.">
  <meta property="og:image" content="https://voltastudio.com/og-image.jpg">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://voltastudio.com/contact">
  <meta property="twitter:title" content="Contact | Volta Studio">
  <meta property="twitter:description" content="Get in touch with Volta Studio. Reach out via email or follow us on Instagram and Twitter.">
  <meta property="twitter:image" content="https://voltastudio.com/og-image.jpg">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F5F2ED;
      --text: #1A1A1A;
      --text-muted: #6B6560;
      --accent: #C46B4A;
      --border: #E5E0D8;
      --overlay-bg: #F0EDE8;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .logo:hover { opacity: 0.5; }

    nav.desktop-nav ul {
      list-style: none;
      display: flex;
      gap: 2.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    nav a:hover { opacity: 0.5; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 200;
      background: none;
      border: none;
      padding: 4px;
      width: 36px;
    }

    .hamburger span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: var(--text);
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .hamburger.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .mobile-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-overlay nav ul {
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-overlay nav a {
      font-size: 2rem;
      font-family: 'Playfair Display', serif;
      text-transform: none;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Contact page */
    .contact-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6rem 3rem;
    }

    .contact-page h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 12vw, 10rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.03em;
      margin-bottom: 3rem;
    }

    .contact-links {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    .contact-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 1.125rem;
      font-weight: 400;
      transition: color 0.3s ease;
    }

    .contact-links a:hover {
      color: var(--accent);
    }

    footer {
      padding: 2rem 3rem 3rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      header {
        padding: 1.25rem 1.5rem;
      }

      nav.desktop-nav { display: none; }
      .hamburger { display: flex; }

      .contact-page {
        padding: 7rem 1.5rem 4rem;
        justify-content: flex-start;
      }

      .contact-page h1 {
        font-size: clamp(2.75rem, 14vw, 5rem);
        margin-bottom: 2rem;
      }

      .contact-links {
        flex-direction: column;
        gap: 1rem;
      }

      .contact-links a {
        font-size: 1.25rem;
      }

      footer {
        padding: 1.5rem 1.5rem 2.5rem;
      }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Volta.</a>
  <nav class="desktop-nav">
    <ul>
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <button class="hamburger" id="menuToggle" aria-label="Toggle navigation menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div class="mobile-overlay" id="mobileOverlay">
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</div>

<main>
  <section class="contact-page">
    <h1>Contact</h1>
    <ul class="contact-links">
      <li><a href="mailto:hello@voltastudio.com">Email.</a></li>
      <li><a href="https://instagram.com/voltastudio" target="_blank" rel="noopener">Instagram.</a></li>
      <li><a href="https://twitter.com/voltastudio" target="_blank" rel="noopener">Twitter.</a></li>
    </ul>
  </section>
</main>

<footer>
  <p>&copy; 2025 Volta Studio</p>
</footer>

<script>
  (function() {
    var toggle = document.getElementById('menuToggle');
    var overlay = document.getElementById('mobileOverlay');
    var links = overlay.querySelectorAll('a');

    function close() {
      toggle.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    toggle.addEventListener('click', function() {
      if (toggle.classList.contains('active')) {
        close();
      } else {
        toggle.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    });

    links.forEach(function(link) { link.addEventListener('click', close); });
  })();
</script>

</body>
</html>
