<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Contact | Volta Studio</title>
  <meta name="title" content="Contact | Volta Studio">
  <meta name="description" content="Get in touch with Volta Studio for strategic design and innovation partnerships.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://voltastudio.com/contact.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://voltastudio.com/contact.html">
  <meta property="og:title" content="Contact | Volta Studio">
  <meta property="og:description" content="Get in touch with Volta Studio for strategic design and innovation partnerships.">
  <meta property="og:image" content="https://voltastudio.com/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://voltastudio.com/contact.html">
  <meta property="twitter:title" content="Contact | Volta Studio">
  <meta property="twitter:description" content="Get in touch with Volta Studio for strategic design and innovation partnerships.">
  <meta property="twitter:image" content="https://voltastudio.com/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay">
    <button class="close-btn" aria-label="Close menu">&times;</button>
    <nav>
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <!-- Contact -->
  <section class="contact-section">
    <h1 class="contact-heading">Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener">Twitter.</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">&copy; 2025 Volta Studio</footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const overlay = document.querySelector('.mobile-overlay');
    const closeBtn = document.querySelector('.close-btn');

    hamburger.addEventListener('click', () => {
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    });

    overlay.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
