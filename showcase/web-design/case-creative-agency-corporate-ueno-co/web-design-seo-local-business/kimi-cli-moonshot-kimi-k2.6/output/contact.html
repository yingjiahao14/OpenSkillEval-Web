<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Contact — Volta Studio</title>
  <meta name="title" content="Contact — Volta Studio">
  <meta name="description" content="Get in touch with Volta Studio. Email, Instagram, and Twitter.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://voltastudio.com/contact.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://voltastudio.com/contact.html">
  <meta property="og:title" content="Contact — Volta Studio">
  <meta property="og:description" content="Get in touch with Volta Studio. Email, Instagram, and Twitter.">
  <meta property="og:image" content="https://voltastudio.com/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://voltastudio.com/contact.html">
  <meta property="twitter:title" content="Contact — Volta Studio">
  <meta property="twitter:description" content="Get in touch with Volta Studio. Email, Instagram, and Twitter.">
  <meta property="twitter:image" content="https://voltastudio.com/og-image.jpg">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <a href="index.html" class="logo">Volta.</a>
    <nav class="nav-desktop">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <h1 class="display-xl contact-title">Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener">Twitter.</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span>&copy; 2025 Volta Studio</span>
    <span>Reykjavík &middot; Worldwide</span>
  </footer>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      mobileMenu.classList.toggle('active');
      document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      });
    });

    // Header scroll state
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });
  </script>

</body>
</html>
