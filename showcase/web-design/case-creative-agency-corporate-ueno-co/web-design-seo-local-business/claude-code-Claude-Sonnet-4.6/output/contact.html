<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Volta Studio</title>
  <meta name="title" content="Contact | Volta Studio">
  <meta name="description" content="Get in touch with Volta Studio. Reach us by email or find us on Instagram and Twitter. We work with a select number of enterprise clients.">
  <link rel="canonical" href="https://www.voltastudio.com/contact.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.voltastudio.com/contact.html">
  <meta property="og:title" content="Contact | Volta Studio">
  <meta property="og:description" content="Get in touch with Volta Studio. We work with a select number of enterprise clients.">
  <meta property="og:image" content="https://www.voltastudio.com/og-image.jpg">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.voltastudio.com/contact.html">
  <meta property="twitter:title" content="Contact | Volta Studio">
  <meta property="twitter:description" content="Get in touch with Volta Studio.">
  <meta property="twitter:image" content="https://www.voltastudio.com/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F2ED;
      --near-black: #1A1A1A;
      --warm-mid: #8A8480;
      --warm-accent: #B8956A;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--cream);
      color: var(--near-black);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      background: rgba(245, 242, 237, 0.92);
      backdrop-filter: blur(8px);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--near-black);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--warm-accent); }
    .nav-links a.active { color: var(--warm-accent); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--near-black);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hamburger.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .mobile-overlay.open { display: flex; }

    .mobile-overlay a {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
      transition: color 0.2s;
    }

    .mobile-overlay a:hover { color: var(--warm-accent); }

    /* ── CONTACT HERO ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 120px 48px 80px;
      min-height: 100vh;
    }

    .contact-heading {
      font-family: var(--serif);
      font-size: clamp(5rem, 16vw, 18rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      color: var(--near-black);
      margin-bottom: 80px;
      user-select: none;
    }

    /* ── CONTACT LINKS ── */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .contact-link {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 400;
      font-style: italic;
      color: var(--near-black);
      text-decoration: none;
      transition: color 0.2s;
      line-height: 1.5;
      display: inline-block;
    }

    .contact-link:hover { color: var(--warm-accent); }

    /* ── FOOTER ── */
    footer {
      padding: 32px 48px;
      border-top: 1px solid rgba(26, 26, 26, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--warm-mid);
      letter-spacing: 0.04em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }

      main { padding: 100px 24px 60px; }

      footer { padding: 32px 24px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="mobile-overlay" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <a href="index.html" onclick="closeMenu()">Home</a>
    <a href="neweno.html" onclick="closeMenu()">Neweno</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="clients.html" onclick="closeMenu()">Clients</a>
    <a href="contact.html" onclick="closeMenu()">Contact</a>
  </div>

  <nav role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileMenu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main>
    <h1 class="contact-heading">Contact</h1>

    <nav class="contact-links" aria-label="Contact links">
      <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
      <a href="https://www.instagram.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Instagram.</a>
      <a href="https://www.twitter.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Twitter.</a>
    </nav>
  </main>

  <footer>
    <a href="index.html" class="footer-logo">Volta.</a>
    <span class="footer-copy">&copy; 2025 Volta Studio</span>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      hamburger.classList.toggle('active', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    function closeMenu() {
      mobileMenu.classList.remove('open');
      hamburger.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
  </script>

</body>
</html>
