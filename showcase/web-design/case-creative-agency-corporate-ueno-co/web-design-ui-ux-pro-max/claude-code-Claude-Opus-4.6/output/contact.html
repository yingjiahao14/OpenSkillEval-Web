<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volta Studio — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <nav class="nav">
      <a href="index.html" class="nav-logo">Volta.</a>
      <div class="nav-links">
        <a href="neweno.html">Neweno</a>
        <a href="services.html">Services</a>
        <a href="clients.html">Clients</a>
        <a href="contact.html">Contact</a>
      </div>
      <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </div>

  <main>
    <section class="contact-hero">
      <h1 class="contact-title">Contact</h1>
    </section>

    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="#">Instagram.</a>
      <a href="#">Twitter.</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2025 Volta Studio</p>
      <p>Function + Feeling</p>
    </div>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', function() {
      const isOpen = mobileMenu.classList.toggle('is-open');
      hamburger.classList.toggle('is-active');
      hamburger.setAttribute('aria-expanded', isOpen);
      document.body.classList.toggle('menu-open');
    });
  </script>

</body>
</html>
