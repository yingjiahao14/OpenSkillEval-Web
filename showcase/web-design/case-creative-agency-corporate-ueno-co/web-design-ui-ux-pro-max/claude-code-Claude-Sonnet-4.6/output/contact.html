<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F2ED;
      --near-black: #1A1A1A;
      --mid: #6B6560;
      --terracotta: #C4785A;
      --warm-line: #E0DAD2;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--near-black);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 28px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cream);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a {
      font-size: 14px;
      font-weight: 400;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--mid); }
    .nav-links a.active { color: var(--mid); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--near-black);
      transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .mobile-overlay.open { opacity: 1; pointer-events: all; }
    .mobile-overlay a {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 700;
      color: var(--near-black);
      text-decoration: none;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    .mobile-overlay a:hover { color: var(--mid); }

    /* CONTACT HERO */
    .contact-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 48px 80px;
    }

    .contact-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(80px, 16vw, 220px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      color: var(--near-black);
      margin-bottom: 80px;
    }

    /* CONTACT LINKS */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 3.5vw, 44px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--near-black);
      text-decoration: none;
      padding: 20px 0;
      border-top: 1px solid var(--warm-line);
      transition: color 0.2s;
      position: relative;
    }
    .contact-link:last-child { border-bottom: 1px solid var(--warm-line); }

    .contact-link:hover { color: var(--terracotta); }

    .contact-link-arrow {
      margin-left: auto;
      font-size: 0.65em;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .contact-link:hover .contact-link-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* FOOTER */
    footer {
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--warm-line);
    }
    footer p { font-size: 13px; color: var(--mid); }

    @media (max-width: 768px) {
      nav { padding: 20px 24px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }

      .contact-hero {
        padding: 120px 24px 60px;
      }

      .contact-hero h1 { margin-bottom: 60px; }

      footer { padding: 28px 24px; flex-direction: column; gap: 10px; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <a href="index.html" onclick="closeMenu()">Volta.</a>
    <a href="neweno.html" onclick="closeMenu()">Neweno</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="clients.html" onclick="closeMenu()">Clients</a>
    <a href="contact.html" onclick="closeMenu()">Contact</a>
  </div>

  <nav id="mainNav">
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileOverlay">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main class="contact-hero" aria-labelledby="contact-heading">
    <h1 id="contact-heading">Contact.</h1>
    <nav class="contact-links" aria-label="Contact links">
      <a class="contact-link" href="mailto:hello@voltastudio.com">
        Email.
        <span class="contact-link-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="contact-link" href="https://instagram.com/voltastudio" target="_blank" rel="noopener noreferrer">
        Instagram.
        <span class="contact-link-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="contact-link" href="https://twitter.com/voltastudio" target="_blank" rel="noopener noreferrer">
        Twitter.
        <span class="contact-link-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>

  <footer>
    <p>© 2025 Volta Studio</p>
    <p style="font-size:13px;color:var(--mid);">Reykjavík · Global</p>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const overlay = document.getElementById('mobileOverlay');
    let menuOpen = false;

    function closeMenu() {
      menuOpen = false;
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', () => {
      if (menuOpen) {
        closeMenu();
      } else {
        menuOpen = true;
        hamburger.classList.add('open');
        hamburger.setAttribute('aria-expanded', 'true');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOpen) closeMenu();
    });
  </script>
</body>
</html>
