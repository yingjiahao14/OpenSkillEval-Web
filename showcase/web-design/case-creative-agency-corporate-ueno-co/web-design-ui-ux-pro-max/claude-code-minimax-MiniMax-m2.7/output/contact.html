<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Contact page ── */

    .contact-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-16) var(--gutter) var(--space-12);
    }

    .contact-heading {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 18vw, 16rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: var(--space-12);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding-top: var(--space-8);
      border-top: 1px solid var(--cream);
    }

    .contact-links a {
      font-family: var(--font-body);
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      transition: color 0.25s var(--ease-out);
      max-width: none;
    }

    .contact-links a::after {
      content: '→';
      font-size: 0.85em;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
    }

    .contact-links a:hover {
      color: var(--ink);
    }

    .contact-links a:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    @media (max-width: 768px) {
      .contact-page {
        justify-content: flex-end;
        padding-top: var(--space-12);
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="logo">Volta.</a>
    <nav class="nav-desktop" aria-label="Primary navigation">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Mobile overlay -->
  <div class="mobile-overlay" id="mobileOverlay" role="dialog" aria-modal="true">
    <a href="index.html">Volta.</a>
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </div>

  <main class="contact-page">
    <h1 class="contact-heading">Contact.</h1>
    <nav class="contact-links" aria-label="Contact links">
      <a href="mailto:hello@volta.studio">Email.</a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram.</a>
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter.</a>
    </nav>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Volta Studio. All rights reserved.</p>
    <p>Reykjav&iacute;k, Iceland</p>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const overlay   = document.getElementById('mobileOverlay');

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('open');
      overlay.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    overlay.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        overlay.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) {
        hamburger.classList.remove('open');
        overlay.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      }
    });
  </script>
</body>
</html>
