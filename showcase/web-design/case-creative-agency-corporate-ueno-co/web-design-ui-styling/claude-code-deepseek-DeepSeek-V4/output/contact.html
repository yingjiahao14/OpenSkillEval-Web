<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            cream: '#F5F2ED',
            ink: '#1A1A1A',
            warm: '#C2784A',
          }
        }
      }
    }
  </script>
  <style>
    .menu-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .menu-link {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .menu-overlay.open .menu-link {
      opacity: 1;
      transform: translateY(0);
    }
    .menu-overlay .menu-link {
      opacity: 0;
      transform: translateY(10px);
    }
    .menu-overlay.open .menu-link:nth-child(1) { transition-delay: 0.05s; }
    .menu-overlay.open .menu-link:nth-child(2) { transition-delay: 0.1s; }
    .menu-overlay.open .menu-link:nth-child(3) { transition-delay: 0.15s; }
    .menu-overlay.open .menu-link:nth-child(4) { transition-delay: 0.2s; }
    .hamburger-line {
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }
    .hamburger.open .hamburger-line:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .hamburger.open .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .hamburger.open .hamburger-line:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }
    .contact-link {
      transition: color 0.3s ease, opacity 0.3s ease;
    }
    .contact-link:hover {
      color: #C2784A;
    }
  </style>
</head>
<body class="bg-cream text-ink font-sans antialiased">

  <!-- Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-cream/90 backdrop-blur-sm">
    <div class="max-w-[1440px] mx-auto px-6 md:px-10 lg:px-16">
      <div class="flex items-center justify-between h-20 md:h-24">
        <a href="index.html" class="font-serif text-2xl md:text-3xl font-bold text-ink hover:text-warm transition-colors">Volta.</a>
        <nav class="hidden md:flex items-center gap-8 lg:gap-12">
          <a href="neweno.html" class="text-sm font-medium text-ink/70 hover:text-ink transition-colors tracking-wide uppercase">Neweno</a>
          <a href="services.html" class="text-sm font-medium text-ink/70 hover:text-ink transition-colors tracking-wide uppercase">Services</a>
          <a href="clients.html" class="text-sm font-medium text-ink/70 hover:text-ink transition-colors tracking-wide uppercase">Clients</a>
          <a href="contact.html" class="text-sm font-medium text-warm transition-colors tracking-wide uppercase">Contact</a>
        </nav>
        <button id="hamburger" class="hamburger md:hidden flex flex-col gap-[5px] w-7 h-5 justify-center relative z-[60]" aria-label="Toggle menu" onclick="toggleMenu()">
          <span class="hamburger-line block h-[1.5px] w-7 bg-ink"></span>
          <span class="hamburger-line block h-[1.5px] w-7 bg-ink"></span>
          <span class="hamburger-line block h-[1.5px] w-7 bg-ink"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div id="menu-overlay" class="menu-overlay fixed inset-0 z-40 bg-cream flex items-center justify-center">
    <nav class="flex flex-col items-center gap-8">
      <a href="neweno.html" class="menu-link font-serif text-4xl md:text-5xl text-ink hover:text-warm transition-colors" onclick="closeMenu()">Neweno</a>
      <a href="services.html" class="menu-link font-serif text-4xl md:text-5xl text-ink hover:text-warm transition-colors" onclick="closeMenu()">Services</a>
      <a href="clients.html" class="menu-link font-serif text-4xl md:text-5xl text-ink hover:text-warm transition-colors" onclick="closeMenu()">Clients</a>
      <a href="contact.html" class="menu-link font-serif text-4xl md:text-5xl text-warm" onclick="closeMenu()">Contact</a>
    </nav>
  </div>

  <!-- Contact Hero -->
  <section class="min-h-screen flex flex-col justify-center pt-20 md:pt-24 px-6 md:px-10 lg:px-16">
    <div class="max-w-[1440px] mx-auto w-full">
      <h1 class="font-serif text-[14vw] md:text-[16vw] lg:text-[18vw] font-bold leading-[0.85] text-ink tracking-tight">
        Contact
      </h1>
    </div>
  </section>

  <!-- Contact Links -->
  <section class="pb-20 md:pb-32 px-6 md:px-10 lg:px-16">
    <div class="max-w-[1440px] mx-auto">
      <div class="flex flex-col items-start gap-6 md:gap-8">
        <a href="mailto:hello@voltastudio.com" class="contact-link font-serif text-3xl sm:text-4xl md:text-5xl text-ink/70 hover:text-warm transition-colors">
          Email.
        </a>
        <a href="https://instagram.com" class="contact-link font-serif text-3xl sm:text-4xl md:text-5xl text-ink/70 hover:text-warm transition-colors">
          Instagram.
        </a>
        <a href="https://twitter.com" class="contact-link font-serif text-3xl sm:text-4xl md:text-5xl text-ink/70 hover:text-warm transition-colors">
          Twitter.
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-ink/10 px-6 md:px-10 lg:px-16 py-8 md:py-10">
    <div class="max-w-[1440px] mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <a href="index.html" class="font-serif text-lg font-bold text-ink hover:text-warm transition-colors">Volta.</a>
      <span class="text-xs text-ink/40">&copy; 2025 Volta Studio</span>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      const overlay = document.getElementById('menu-overlay');
      const hamburger = document.getElementById('hamburger');
      const isOpen = overlay.classList.contains('open');
      if (isOpen) {
        overlay.classList.remove('open');
        hamburger.classList.remove('open');
        document.body.style.overflow = '';
      } else {
        overlay.classList.add('open');
        hamburger.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    }
    function closeMenu() {
      document.getElementById('menu-overlay').classList.remove('open');
      document.getElementById('hamburger').classList.remove('open');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
