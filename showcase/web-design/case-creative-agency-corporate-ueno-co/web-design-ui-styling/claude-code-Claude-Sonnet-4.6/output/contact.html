<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F2ED;
      --ink: #1A1A1A;
      --ink-light: #3A3A3A;
      --ink-faint: #9A9A9A;
      --accent-terracotta: #C4714A;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      background: var(--cream);
      border-bottom: 1px solid rgba(26,26,26,0.08);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--accent-terracotta); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
      background: none;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--ink);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--ink);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu-close {
      position: absolute;
      top: 1.5rem; right: 2rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 2rem;
      color: var(--cream);
      line-height: 1;
    }

    .mobile-menu a {
      font-family: var(--serif);
      font-size: 3rem;
      font-weight: 700;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }

    .mobile-menu a:hover { color: var(--accent-terracotta); }

    /* ── CONTACT HERO ── */
    .contact-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 7rem 3rem 4rem;
    }

    .contact-heading {
      font-family: var(--serif);
      font-size: clamp(5rem, 18vw, 18rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.9;
      color: var(--ink);
      margin-bottom: 5rem;
    }

    /* ── CONTACT LINKS ── */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid rgba(26,26,26,0.12);
      max-width: 400px;
    }

    .contact-link {
      display: block;
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 700;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      padding: 1.3rem 0;
      border-bottom: 1px solid rgba(26,26,26,0.12);
      letter-spacing: -0.02em;
      transition: color 0.2s, padding-left 0.25s;
    }

    .contact-link:hover {
      color: var(--accent-terracotta);
      padding-left: 0.75rem;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(26,26,26,0.1);
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }

    .footer-note {
      font-size: 0.75rem;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 1.25rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .contact-hero { padding: 8rem 1.5rem 4rem; }
      .contact-heading { margin-bottom: 3.5rem; }
      footer { padding: 2rem 1.5rem; flex-direction: column; gap: 0.75rem; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" aria-label="Open menu" onclick="openMenu()">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Mobile Overlay -->
  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" aria-label="Close menu" onclick="closeMenu()">×</button>
    <a href="neweno.html" onclick="closeMenu()">Neweno</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="clients.html" onclick="closeMenu()">Clients</a>
    <a href="contact.html" onclick="closeMenu()">Contact</a>
  </div>

  <!-- Contact Hero -->
  <main class="contact-hero">
    <h1 class="contact-heading">Contact</h1>

    <nav class="contact-links" aria-label="Contact links">
      <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
      <a href="https://instagram.com/voltastudio" class="contact-link" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com/voltastudio" class="contact-link" target="_blank" rel="noopener">Twitter.</a>
    </nav>
  </main>

  <!-- Footer -->
  <footer>
    <a href="index.html" class="footer-logo">Volta.</a>
    <span class="footer-note">Function + Feeling — Est. 2014, Reykjavík</span>
  </footer>

  <script>
    function openMenu() {
      document.getElementById('mobileMenu').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      document.getElementById('mobileMenu').classList.remove('open');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
