<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Volta Studio</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

    
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            bg: '#F5F2ED',
            text: '#1A1A1A',
            accent: '#C4A484', /* warm tone placeholder */
          }
        },
        fontFamily: {
          serif: ['"Playfair Display"', 'serif'],
          sans: ['Inter', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #F5F2ED;
    color: #1A1A1A;
    overflow-x: hidden;
  }
  
  /* Marquee animation */
  @keyframes marquee {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-25%); }
  }
  @keyframes marquee-reverse {
    0% { transform: translateX(-25%); }
    100% { transform: translateX(0%); }
  }
  .animate-marquee {
    display: inline-block;
    white-space: nowrap;
    animation: marquee 20s linear infinite;
    will-change: transform;
  }
  .animate-marquee-reverse {
    display: inline-block;
    white-space: nowrap;
    animation: marquee-reverse 20s linear infinite;
    will-change: transform;
  }
  .marquee-container {
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    width: 100vw;
    margin-left: calc(-50vw + 50%);
  }

  /* Hamburger menu logic */
  #mobile-menu {
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
  #mobile-menu.open {
    display: flex;
    opacity: 1;
  }
</style>

</head>
<body class="font-sans antialiased flex flex-col min-h-screen">
    
    <header class="py-8 px-6 md:px-12 flex items-center justify-between z-50 relative">
      <nav class="hidden md:flex items-center w-full">
        <a href="index.html" class="font-serif font-bold text-xl tracking-tight mr-auto hover:opacity-70 transition-opacity">Volta.</a><a href="neweno.html" class="font-sans text-sm tracking-wide uppercase hover:opacity-70 transition-opacity ml-8">Neweno</a><a href="services.html" class="font-sans text-sm tracking-wide uppercase hover:opacity-70 transition-opacity ml-8">Services</a><a href="clients.html" class="font-sans text-sm tracking-wide uppercase hover:opacity-70 transition-opacity ml-8">Clients</a><a href="contact.html" class="font-sans text-sm tracking-wide uppercase hover:opacity-70 transition-opacity ml-8 opacity-50">Contact</a>
      </nav>
      
      <!-- Mobile Header -->
      <div class="md:hidden flex items-center justify-between w-full relative z-50">
        <a href="index.html" class="font-serif font-bold text-xl tracking-tight relative z-50">Volta.</a>
        <button onclick="toggleMobileMenu()" class="p-2 relative z-50" aria-label="Toggle menu">
          <svg id="hamburger-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Full-screen Mobile Menu -->
      <div id="mobile-menu" class="fixed inset-0 bg-brand-bg z-40 flex-col items-center justify-center hidden">
        <a href="index.html" class="font-serif text-5xl mb-6 hover:opacity-70 transition-opacity">Volta.</a><a href="neweno.html" class="font-serif text-5xl mb-6 hover:opacity-70 transition-opacity">Neweno</a><a href="services.html" class="font-serif text-5xl mb-6 hover:opacity-70 transition-opacity">Services</a><a href="clients.html" class="font-serif text-5xl mb-6 hover:opacity-70 transition-opacity">Clients</a><a href="contact.html" class="font-serif text-5xl mb-6 hover:opacity-70 transition-opacity opacity-50">Contact</a>
      </div>
    </header>
    
    <main class="flex-grow">
        
<div class="px-6 md:px-12 max-w-5xl mx-auto py-32 md:py-48 flex flex-col items-center justify-center text-center">
  <h1 class="font-serif text-7xl md:text-9xl lg:text-[12rem] tracking-tighter mb-16 md:mb-24 hover:scale-105 transition-transform duration-500 cursor-default">Contact</h1>
  
  <div class="flex flex-col md:flex-row gap-8 md:gap-16 font-sans text-xl tracking-widest">
    <a href="#" class="hover:opacity-50 transition-opacity">Email.</a>
    <a href="#" class="hover:opacity-50 transition-opacity">Instagram.</a>
    <a href="#" class="hover:opacity-50 transition-opacity">Twitter.</a>
  </div>
</div>

    </main>
    <footer class="py-12 px-6 md:px-12 text-center text-sm opacity-50 mt-20">
        &copy; 2025 Volta Studio.
    </footer>
    
<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const isClosed = menu.style.display === 'none' || menu.style.display === '';
    if (isClosed) {
      menu.style.display = 'flex';
      setTimeout(() => menu.style.opacity = '1', 10);
      document.body.style.overflow = 'hidden';
      // Switch icon to X
      document.getElementById('hamburger-icon').innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
    } else {
      menu.style.opacity = '0';
      setTimeout(() => menu.style.display = 'none', 300);
      document.body.style.overflow = 'auto';
      // Switch back to hamburger
      document.getElementById('hamburger-icon').innerHTML = '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>';
    }
  }
  lucide.createIcons();
</script>

</body>
</html>
