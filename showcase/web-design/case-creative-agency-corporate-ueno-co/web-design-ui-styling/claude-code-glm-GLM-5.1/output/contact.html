<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="site-logo">Volta.</a>
    <nav class="nav-desktop">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="hamburger" aria-label="Toggle menu" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <h1 class="contact-title">Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="#">Instagram.</a>
      <a href="#">Twitter.</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <span>&copy; 2025 Volta Studio</span>
    <span>Reykjav&iacute;k, Iceland</span>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      const hamburger = document.querySelector('.hamburger');
      menu.classList.toggle('is-open');
      hamburger.classList.toggle('is-open');
      document.body.style.overflow = menu.classList.contains('is-open') ? 'hidden' : '';
    }

    document.querySelectorAll('.mobile-overlay a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.remove('is-open');
        document.querySelector('.hamburger').classList.remove('is-open');
        document.body.style.overflow = '';
      });
    });
  </script>

</body>
</html>
