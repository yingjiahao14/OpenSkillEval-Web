<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-md);
      padding-top: calc(var(--space-3xl) + 2rem);
    }
    .contact-page h1 {
      font-size: clamp(4rem, 18vw, 14rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: var(--space-xl);
    }
    .contact-page .contact-links {
      gap: var(--space-md);
    }
    .contact-page .contact-links a {
      font-size: clamp(1.25rem, 2.5vw, 2rem);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="logo">Volta.</a>
    <nav class="nav-desktop" aria-label="Main navigation">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Navigation Overlay -->
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="contact-page">
    <h1 class="heading-display">Contact</h1>
    <div class="contact-links">
      <a href="mailto:hello@volta.studio">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener noreferrer">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener noreferrer">Twitter.</a>
    </div>
  </main>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const mobileNav = document.getElementById('mobile-nav');

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', !expanded);
      mobileNav.classList.toggle('open');
      document.body.style.overflow = !expanded ? 'hidden' : '';
    });

    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        toggle.setAttribute('aria-expanded', 'false');
        mobileNav.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
