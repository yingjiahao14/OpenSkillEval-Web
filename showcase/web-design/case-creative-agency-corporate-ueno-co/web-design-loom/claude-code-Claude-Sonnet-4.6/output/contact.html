<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F2ED;
      --ink: #1A1A1A;
      --ink-light: #5A5550;
      --accent-terracotta: #C4785A;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--sans);
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 0.45; }
    .nav-links a.active { opacity: 0.45; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--ink);
      transition: transform 0.3s, opacity 0.3s;
      transform-origin: center;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .mobile-overlay.open { opacity: 1; pointer-events: all; }

    .mobile-nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .mobile-nav-links a {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .mobile-nav-links a:hover { opacity: 0.45; }

    /* ── CONTACT HERO ── */
    .contact-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 3rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-hero h1 {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(5rem, 18vw, 18rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    /* ── CONTACT LINKS ── */
    .contact-links {
      padding: 4rem 3rem 6rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-links ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .contact-links li {
      border-top: 1px solid rgba(26,26,26,0.12);
    }

    .contact-links li:last-child {
      border-bottom: 1px solid rgba(26,26,26,0.12);
    }

    .contact-links a {
      display: block;
      padding: 1.5rem 0;
      font-family: var(--serif);
      font-size: clamp(1.5rem, 3.5vw, 2.75rem);
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s, padding-left 0.2s;
    }

    .contact-links a:hover {
      color: var(--accent-terracotta);
      padding-left: 0.5rem;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(26,26,26,0.12);
      padding: 2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    footer p { font-size: 0.8rem; color: var(--ink-light); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 1.25rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: flex; }

      .contact-hero { padding: 7rem 1.5rem 2rem; }
      .contact-links { padding: 2rem 1.5rem 5rem; }
      footer { flex-direction: column; gap: 0.75rem; padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-overlay" id="mobileOverlay" role="dialog" aria-modal="true">
    <ul class="mobile-nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>

  <section class="contact-hero">
    <h1>Contact.</h1>
  </section>

  <section class="contact-links">
    <ul>
      <li><a href="mailto:hello@voltastudio.com">Email.</a></li>
      <li><a href="https://instagram.com" target="_blank" rel="noopener">Instagram.</a></li>
      <li><a href="https://twitter.com" target="_blank" rel="noopener">Twitter.</a></li>
    </ul>
  </section>

  <footer>
    <p>Volta Studio — Founded in Reykjavík, 2014. Reopened 2025.</p>
    <p>Function + Feeling.</p>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const overlay = document.getElementById('mobileOverlay');

    hamburger.addEventListener('click', () => {
      const isOpen = overlay.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    overlay.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        overlay.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
