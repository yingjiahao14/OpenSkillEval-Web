<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="logo"><a href="index.html">Volta.</a></div>
    <nav class="desktop-nav">
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="mobile-overlay">
    <a href="index.html">Home</a>
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <section class="contact-hero">
      <h1>Contact</h1>
      <div class="contact-links">
        <a href="mailto:hello@voltastudio.com">Email.</a>
        <a href="https://instagram.com" target="_blank" rel="noopener">Instagram.</a>
        <a href="https://twitter.com" target="_blank" rel="noopener">Twitter.</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">Volta.</div>
    <div class="footer-right">&copy; 2025 Volta Studio</div>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const overlay = document.querySelector('.mobile-overlay');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      overlay.classList.toggle('active');
      document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : '';
    });

    overlay.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  </script>

</body>
</html>
