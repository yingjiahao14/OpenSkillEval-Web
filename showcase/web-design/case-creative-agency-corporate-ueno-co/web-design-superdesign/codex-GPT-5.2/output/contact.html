<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Volta Studio</title>
    <meta name="description" content="Contact Volta Studio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="content">
      <section class="container contact">
        <div>
          <div class="eyebrow">Say hello</div>
          <h1>Contact</h1>
        </div>

        <div class="contact-links" aria-label="Contact links">
          <a href="mailto:hello@voltastudio.example">Email.</a>
          <a href="#" aria-label="Instagram (placeholder link)">Instagram.</a>
          <a href="#" aria-label="Twitter (placeholder link)">Twitter.</a>
        </div>

        <div style="max-width: 62ch; color: var(--muted); line-height: 1.7;">
          We take on a small number of partnerships each year. If you’re an enterprise team with an ambitious idea,
          send a note — a few sentences is plenty.
        </div>
      </section>

      <footer class="footer">
        <div class="container">
          <div class="cols">
            <div>Volta Studio</div>
            <div style="justify-self: end; color: var(--muted);">Function + Feeling.</div>
          </div>
        </div>
      </footer>
    </main>

    <script src="assets/partials.js"></script>
    <script>
      (function(){
        var slot = document.getElementById('site-header');
        if(slot && window.VoltaPartials) slot.innerHTML = window.VoltaPartials.header({ current: 'contact' });
      })();
    </script>
    <script src="assets/site.js"></script>
  </body>
</html>
