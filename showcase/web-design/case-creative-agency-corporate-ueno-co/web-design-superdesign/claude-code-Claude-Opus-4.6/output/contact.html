<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <meta name="description" content="Get in touch with Volta Studio.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Overlay Menu -->
  <div class="mobile-overlay" role="dialog" aria-label="Mobile menu">
    <a href="index.html">Home</a>
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </div>

  <main class="page-content">
    <section class="contact-section">
      <h1 class="contact-heading animate-in">Contact.</h1>
      <div class="contact-links animate-in animate-in-delay-1">
        <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
        <a href="#" class="contact-link" aria-label="Volta Studio on Instagram">Instagram.</a>
        <a href="#" class="contact-link" aria-label="Volta Studio on Twitter">Twitter.</a>
      </div>
    </section>
  </main>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const overlay = document.querySelector('.mobile-overlay');

    hamburger.addEventListener('click', function () {
      const isActive = this.classList.toggle('is-active');
      overlay.classList.toggle('is-open');
      this.setAttribute('aria-expanded', isActive);
      document.body.style.overflow = isActive ? 'hidden' : '';
    });

    overlay.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        hamburger.classList.remove('is-active');
        overlay.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      });
    });
  </script>

</body>
</html>
