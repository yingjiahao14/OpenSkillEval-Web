<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="../vendor/css/flowbite.min.css" rel="stylesheet">
    <script src="../vendor/js/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F5F2ED',
                        foreground: '#1A1A1A',
                        terracotta: '#E2725B',
                        sage: '#8A9A86',
                        sand: '#D8C3A5'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.background'); color: theme('colors.foreground'); }
        #mobile-menu { transition: opacity 0.4s ease-out, visibility 0.4s ease-out; }
        .marquee-wrapper { display: flex; overflow: hidden; user-select: none; gap: 2rem; }
        .marquee-content { flex-shrink: 0; display: flex; justify-content: space-around; min-width: 100%; gap: 2rem; animation: scroll-left 30s linear infinite; }
        .marquee-content.reverse { animation: scroll-right 30s linear infinite; }
        @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(calc(-100% - 2rem)); } }
        @keyframes scroll-right { from { transform: translateX(calc(-100% - 2rem)); } to { transform: translateX(0); } }
    </style>
</head>
<body class="bg-background text-foreground font-sans antialiased flex flex-col min-h-screen">
    <header class="absolute w-full top-0 z-50 p-6 md:px-12 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-serif font-bold tracking-tight z-50">Volta.</a>
        <nav class="hidden md:flex gap-8 font-medium text-sm z-50">
            <a href="neweno.html" class="hover:opacity-60 transition-opacity">Neweno</a>
            <a href="services.html" class="hover:opacity-60 transition-opacity">Services</a>
            <a href="clients.html" class="hover:opacity-60 transition-opacity">Clients</a>
            <a href="contact.html" class="hover:opacity-60 transition-opacity">Contact</a>
        </nav>
        <button id="menu-toggle" class="md:hidden z-50 p-2 focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6" id="menu-icon"></i>
        </button>
    </header>

    <div id="mobile-menu" class="fixed inset-0 bg-background z-40 flex flex-col justify-center items-center opacity-0 invisible">
        <nav class="flex flex-col gap-8 text-center text-4xl font-serif">
            <a href="index.html" class="hover:italic transition-all">Home</a>
            <a href="neweno.html" class="hover:italic transition-all">Neweno</a>
            <a href="services.html" class="hover:italic transition-all">Services</a>
            <a href="clients.html" class="hover:italic transition-all">Clients</a>
            <a href="contact.html" class="hover:italic transition-all">Contact</a>
        </nav>
    </div>

    <main class="flex-grow pt-40 pb-24 w-full flex flex-col justify-center h-full my-auto min-h-[70vh]">
        <div class="px-6 md:px-12 max-w-screen-2xl mx-auto w-full text-center">
            <h1 class="font-serif text-[18vw] leading-none mb-16 tracking-tighter hover:italic transition-all duration-500 cursor-default select-none">Contact</h1>
            
            <div class="flex flex-col md:flex-row justify-center items-center gap-12 text-2xl md:text-3xl font-light">
                <a href="#" class="hover:text-terracotta transition-colors relative group">
                    Email.
                    <span class="absolute -bottom-2 left-0 w-0 h-[1px] bg-terracotta transition-all group-hover:w-full"></span>
                </a>
                <a href="#" class="hover:text-sage transition-colors relative group">
                    Instagram.
                    <span class="absolute -bottom-2 left-0 w-0 h-[1px] bg-sage transition-all group-hover:w-full"></span>
                </a>
                <a href="#" class="hover:text-sand transition-colors relative group">
                    Twitter.
                    <span class="absolute -bottom-2 left-0 w-0 h-[1px] bg-sand transition-all group-hover:w-full"></span>
                </a>
            </div>
        </div>
    </main>

    <footer class="py-12 px-6 md:px-12 border-t border-foreground/10 text-sm font-medium flex flex-col md:flex-row justify-between items-center gap-4 mt-auto">
        <div>&copy; 2025 Volta Studio.</div>
        <div class="flex gap-6">
            <a href="#" class="hover:opacity-60">Instagram</a>
            <a href="#" class="hover:opacity-60">Twitter</a>
        </div>
    </footer>

    <script src="../vendor/js/flowbite.min.js"></script>
    <script src="../vendor/js/lucide.min.js"></script>
    <script>
        lucide.createIcons();
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuIcon = document.getElementById('menu-icon');
        let menuOpen = false;
        menuToggle.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if (menuOpen) {
                mobileMenu.classList.remove('opacity-0', 'invisible');
                mobileMenu.classList.add('opacity-100', 'visible');
                menuIcon.setAttribute('data-lucide', 'x');
                lucide.createIcons();
                document.body.style.overflow = 'hidden';
            } else {
                mobileMenu.classList.add('opacity-0', 'invisible');
                mobileMenu.classList.remove('opacity-100', 'visible');
                menuIcon.setAttribute('data-lucide', 'menu');
                lucide.createIcons();
                document.body.style.overflow = '';
            }
        });
    </script>
</body>
</html>
