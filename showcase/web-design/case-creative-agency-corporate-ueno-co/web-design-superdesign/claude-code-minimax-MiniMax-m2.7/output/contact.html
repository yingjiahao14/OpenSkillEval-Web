<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="index.html" class="logo">Volta.</a>
  <nav class="nav-desktop">
    <a href="neweno.html">Neweno</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>
  <button class="nav-mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<nav class="nav-overlay" id="navOverlay">
  <a href="index.html">Home</a>
  <a href="neweno.html">Neweno</a>
  <a href="services.html">Services</a>
  <a href="clients.html">Clients</a>
  <a href="contact.html">Contact</a>
</nav>

<main>
  <section class="contact-page container">
    <div class="contact-hero">
      <h1>Contact</h1>
    </div>
    <div class="contact-links">
      <a href="mailto:hello@voltastudio.com">Email.</a>
      <a href="https://instagram.com/voltastudio" target="_blank" rel="noopener">Instagram.</a>
      <a href="https://twitter.com/voltastudio" target="_blank" rel="noopener">Twitter.</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2025 Volta Studio</span>
      <span> Reykjavík, Iceland</span>
    </div>
  </footer>
</main>

<script>
  const header = document.getElementById('siteHeader');
  const toggle = document.getElementById('mobileToggle');
  const overlay = document.getElementById('navOverlay');

  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 50);
  });

  toggle.addEventListener('click', () => {
    toggle.classList.toggle('active');
    overlay.classList.toggle('active');
    document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : '';
  });
</script>
</body>
</html>
