<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · Volta Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Volta.</a>
    <nav>
      <ul class="nav-links">
        <li><a href="neweno.html">Neweno</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button class="hamburger" aria-label="Toggle menu" onclick="document.querySelector('.mobile-overlay').classList.toggle('active');this.classList.toggle('active')">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <div class="mobile-overlay">
    <nav>
      <a href="index.html">Home</a>
      <a href="neweno.html">Neweno</a>
      <a href="services.html">Services</a>
      <a href="clients.html">Clients</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <main class="page-content">
    <section class="contact-section">
      <h1>Contact</h1>
      <div class="contact-links">
        <a href="mailto:hello@voltastudio.com">Email.</a>
        <a href="https://instagram.com" target="_blank" rel="noopener">Instagram.</a>
        <a href="https://twitter.com" target="_blank" rel="noopener">Twitter.</a>
      </div>
    </section>
  </main>

  <script>
    document.querySelector('.mobile-overlay').addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.remove('active');
        document.querySelector('.hamburger').classList.remove('active');
      }
    });
    document.querySelectorAll('.mobile-overlay a').forEach(function(link) {
      link.addEventListener('click', function() {
        document.querySelector('.mobile-overlay').classList.remove('active');
        document.querySelector('.hamburger').classList.remove('active');
      });
    });
  </script>
</body>
</html>
