<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Volta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F2ED;
      --ink: #1A1A1A;
      --ink-muted: #6B6660;
      --accent-terra: #C17A5B;
      --border: #E0DDD8;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 180ms ease;
    }

    .nav-links a.active { color: var(--accent-terra); }
    .nav-links a:hover { color: var(--accent-terra); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: var(--ink);
      transition: all 220ms ease;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      opacity: 0;
      transition: opacity 280ms ease;
    }

    .mobile-overlay.open { display: flex; opacity: 1; }

    .mobile-overlay a {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      transition: color 180ms ease;
    }

    .mobile-overlay a:hover { color: var(--accent-terra); }

    /* ── CONTACT HERO ── */
    .contact-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 6rem 3rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-heading {
      font-family: var(--serif);
      font-size: clamp(5rem, 18vw, 16rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin-bottom: 4rem;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .contact-link {
      font-family: var(--serif);
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 400;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      transition: color 200ms ease;
      line-height: 1.6;
      display: inline-block;
    }

    .contact-link:hover { color: var(--accent-terra); }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    footer span {
      font-size: 0.78rem;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }

    @media (max-width: 768px) {
      nav { padding: 1.1rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: flex; }

      .contact-main { padding: 3rem 1.5rem; }
      .contact-heading { margin-bottom: 2.5rem; }

      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay">
    <a href="index.html" onclick="closeMenu()">Volta.</a>
    <a href="neweno.html" onclick="closeMenu()">Neweno</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="clients.html" onclick="closeMenu()">Clients</a>
    <a href="contact.html" onclick="closeMenu()">Contact</a>
  </div>

  <nav>
    <a href="index.html" class="nav-logo">Volta.</a>
    <ul class="nav-links">
      <li><a href="neweno.html">Neweno</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="contact-main">
    <h1 class="contact-heading">Contact</h1>
    <nav class="contact-links" aria-label="Contact links">
      <a href="mailto:hello@voltastudio.com" class="contact-link">Email.</a>
      <a href="https://instagram.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Instagram.</a>
      <a href="https://twitter.com/voltastudio" class="contact-link" target="_blank" rel="noopener noreferrer">Twitter.</a>
    </nav>
  </main>

  <footer>
    <span>© 2025 Volta Studio</span>
    <span>Function + Feeling</span>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const overlay = document.getElementById('mobileOverlay');

    hamburger.addEventListener('click', () => {
      const isOpen = overlay.classList.contains('open');
      if (isOpen) { closeMenu(); } else {
        overlay.classList.add('open');
        hamburger.classList.add('open');
        hamburger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      }
    });

    function closeMenu() {
      overlay.classList.remove('open');
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  </script>

</body>
</html>
