<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>MedBook — Search Results</title>
    <meta name="description" content="MedBook search results (demo)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0b1220;
        --muted: #556070;
        --border: rgba(15, 23, 42, 0.12);
        --primary: #0066ff;
        --cta: #0ea5a4;
        --ring: rgba(0, 102, 255, 0.25);
        --radius: 16px;
        --container: 1040px;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(1000px 420px at 50% -120px, rgba(0, 102, 255, 0.14), transparent 60%),
          #ffffff;
        color: var(--fg);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.70);
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }

      .container {
        width: min(var(--container), calc(100% - 48px));
        margin: 0 auto;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .brand-badge {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, #3dd6d0 100%);
        box-shadow: 0 16px 40px rgba(0, 102, 255, 0.22);
        display: grid;
        place-items: center;
        color: white;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.86);
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      .btn-primary {
        border-color: rgba(0, 102, 255, 0.25);
        background: linear-gradient(135deg, var(--primary) 0%, #1f8bff 60%, #3dd6d0 140%);
        color: white;
      }

      main {
        padding: 34px 0 60px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 3vw, 34px);
        letter-spacing: -0.03em;
      }

      .sub {
        margin: 10px 0 0;
        color: rgba(11, 18, 32, 0.64);
      }

      .panel {
        margin-top: 18px;
        border-radius: 22px;
        border: 1px solid rgba(15, 23, 42, 0.10);
        background: rgba(255, 255, 255, 0.90);
        box-shadow: 0 22px 60px rgba(2, 6, 23, 0.10);
        overflow: hidden;
      }

      .panel-top {
        padding: 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .pill {
        border-radius: 999px;
        padding: 8px 10px;
        font-weight: 900;
        font-size: 12px;
        border: 1px solid rgba(14, 165, 164, 0.28);
        background: rgba(14, 165, 164, 0.10);
        color: rgba(11, 125, 123, 0.98);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 16px;
      }

      .card {
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.10);
        background: rgba(246, 248, 252, 0.72);
        padding: 14px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .name {
        font-weight: 900;
        letter-spacing: -0.01em;
      }

      .meta {
        margin-top: 6px;
        color: rgba(11, 18, 32, 0.62);
        font-size: 13px;
      }

      .stars {
        color: #f59e0b;
        font-weight: 900;
        font-size: 12px;
      }

      @media (max-width: 740px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="nav">
          <a class="brand" href="index.html#top" aria-label="Back to MedBook home">
            <span class="brand-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
                <path
                  d="M12 2.75c-4.95 0-8.97 4.02-8.97 8.98 0 6.24 6.82 10.9 8.44 11.93a.95.95 0 0 0 1.06 0c1.62-1.03 8.44-5.69 8.44-11.93C20.97 6.77 16.95 2.75 12 2.75Z"
                  fill="currentColor"
                  opacity="0.95"
                />
                <path
                  d="M12 7.2c.5 0 .9.4.9.9v2.9h2.9c.5 0 .9.4.9.9s-.4.9-.9.9h-2.9v2.9c0 .5-.4.9-.9.9s-.9-.4-.9-.9v-2.9H8.2c-.5 0-.9-.4-.9-.9s.4-.9.9-.9h2.9V8.1c0-.5.4-.9.9-.9Z"
                  fill="#fff"
                />
              </svg>
            </span>
            <span>MedBook</span>
          </a>
          <a class="btn btn-primary" href="index.html#search">New search</a>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <h1 id="title">Search results</h1>
        <p class="sub" id="subtitle">Demo results based on your filters.</p>

        <div class="panel" aria-label="Search results">
          <div class="panel-top">
            <div class="row" style="width: 100%">
              <div>
                <strong id="summary">Showing providers</strong>
                <div class="meta" id="filters"></div>
              </div>
              <span class="pill">Instant booking</span>
            </div>
          </div>
          <div class="grid" id="results"></div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q') || '';
        const specialty = params.get('specialty') || '';
        const loc = params.get('loc') || '';
        const ins = params.get('ins') || '';

        const filters = [];
        if (q) filters.push(`Query: ${q}`);
        if (specialty) filters.push(`Specialty: ${specialty}`);
        if (loc) filters.push(`Location: ${loc}`);
        if (ins) filters.push(`Insurance: ${ins}`);

        document.getElementById('title').textContent = specialty ? `${specialty} near you` : 'Search results';
        document.getElementById('filters').textContent = filters.length ? filters.join(' • ') : 'No filters applied.';

        const demo = [
          { name: 'Dr. Sarah Chen', meta: 'Dermatology • 4.9 ★ • 2.1 mi', slot: 'Today 2:30 PM' },
          { name: 'Dr. Michael Rivera', meta: 'Primary Care • 4.8 ★ • 1.6 mi', slot: 'Tomorrow 9:15 AM' },
          { name: 'Dr. Aisha Patel', meta: 'Dentistry • 4.9 ★ • 3.4 mi', slot: 'Fri 10:30 AM' },
          { name: 'Dr. Emily Nguyen', meta: 'Eye Care • 4.7 ★ • 2.9 mi', slot: 'Today 4:40 PM' },
        ];

        const results = document.getElementById('results');
        results.innerHTML = '';
        demo.forEach((d) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="row">
              <div class="name">${escapeHtml(d.name)}</div>
              <div class="stars">★★★★★</div>
            </div>
            <div class="meta">${escapeHtml(d.meta)}</div>
            <div class="row" style="margin-top: 10px">
              <span class="pill" style="border-color: rgba(0,102,255,.22); background: rgba(0,102,255,.10); color: rgba(0,102,255,.92)">${escapeHtml(d.slot)}</span>
              <a class="btn" href="index.html#search">Book</a>
            </div>
          `;
          results.appendChild(card);
        });

        function escapeHtml(str) {
          return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
        }
      })();
    </script>
  </body>
</html>
