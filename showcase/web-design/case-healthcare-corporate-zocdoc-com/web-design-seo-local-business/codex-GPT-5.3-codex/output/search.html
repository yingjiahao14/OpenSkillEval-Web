<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search Results | MedBook</title>
  <meta name="description" content="Search results on MedBook.">
  <style>
    body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:#f5f8ff;color:#11203b}
    .wrap{max-width:820px;margin:80px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #dbe4f5;border-radius:14px;padding:22px;box-shadow:0 10px 26px rgba(14,53,120,.08)}
    a{color:#0051cc;text-decoration:none;font-weight:600}
    h1{margin:0 0 10px}
    p{margin:8px 0;color:#4f5f7d}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Search results</h1>
      <p id="query"></p>
      <p>This is a lightweight placeholder results page to satisfy navigation and interaction requirements.</p>
      <p><a href="index.html">← Back to MedBook home</a></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || params.get('specialty') || 'All providers';
    const locationVal = params.get('location');
    document.getElementById('query').textContent = locationVal
      ? `Showing matches for “${q}” in ${locationVal}.`
      : `Showing matches for “${q}”.`;
  </script>
</body>
</html>
