<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results — MedBook</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: var(--surface-2);
      }
      .results-shell {
        padding: 28px 0 56px;
      }
      .results {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow-md);
        padding: 18px;
      }
      .crumbs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        color: rgba(11, 18, 32, 0.7);
        font-weight: 700;
        font-size: 14px;
      }
      .crumbs a {
        color: rgba(0, 82, 204, 1);
      }
      .results h1 {
        font-size: clamp(26px, 3vw, 38px);
        margin: 10px 0 6px;
      }
      .chips {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip2 {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(244, 247, 251, 0.85);
        font-weight: 900;
        color: rgba(11, 18, 32, 0.75);
        font-size: 13px;
      }
      .grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .provider {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 18px;
        padding: 14px;
        box-shadow: var(--shadow-sm);
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 16px;
        background: radial-gradient(
            140px 60px at 30% 10%,
            rgba(0, 102, 255, 0.18),
            transparent 60%
          ),
          rgba(19, 184, 166, 0.12);
        border: 1px solid rgba(15, 30, 50, 0.12);
        display: grid;
        place-items: center;
        font-weight: 900;
        color: rgba(0, 82, 204, 1);
      }
      .p-title {
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .p-sub {
        color: rgba(11, 18, 32, 0.65);
        font-size: 14px;
        margin-top: 2px;
      }
      .p-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .pill3 {
        font-size: 12px;
        font-weight: 900;
        border-radius: 999px;
        padding: 4px 8px;
        background: rgba(0, 102, 255, 0.09);
        border: 1px solid rgba(0, 102, 255, 0.18);
        color: rgba(0, 82, 204, 1);
      }
      .cta-row {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html#top" aria-label="MedBook home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
              <path
                d="M12 2.2c-3.8 0-6.9 3-6.9 6.8 0 6 6.9 12.8 6.9 12.8S18.9 15 18.9 9c0-3.8-3.1-6.8-6.9-6.8Zm0 9.3a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"
              />
            </svg>
          </span>
          <span class="brand-name">MedBook</span>
        </a>

        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="index.html#search">Search</a>
          <a class="nav-link" href="index.html#specialties">Specialties</a>
          <a class="btn btn-primary btn-sm" href="index.html#signup">Sign Up</a>
        </nav>
      </div>
    </header>

    <main class="results-shell">
      <div class="container">
        <div class="results">
          <div class="crumbs">
            <a href="index.html#search">← Back to search</a>
            <span aria-hidden="true">•</span>
            <span>Preview results</span>
          </div>
          <h1 id="title">Search results</h1>
          <p class="muted" id="subtitle">Showing a demo preview (landing-page prototype).</p>

          <div class="chips" id="chips" aria-label="Active filters"></div>

          <div class="grid" id="grid" aria-label="Provider results"></div>

          <div class="cta-row">
            <a class="btn btn-primary" href="index.html#search">Refine search</a>
            <a class="btn btn-ghost" href="index.html#testimonials">Read patient reviews</a>
          </div>
        </div>
      </div>
    </main>

    <script>
      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const params = new URLSearchParams(window.location.search);
      const q = params.get("q") || "";
      const loc = params.get("loc") || "";
      const ins = params.get("ins") || "";
      const specialty = params.get("specialty") || "";

      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const chips = document.getElementById("chips");
      const grid = document.getElementById("grid");

      const headline = specialty || q || "Search results";
      title.textContent = `Results for ${headline}`;
      subtitle.textContent =
        loc || ins
          ? `Near ${loc || "your area"}${ins ? ` • Insurance: ${ins}` : ""}`
          : "Showing a demo preview (landing-page prototype).";

      const filters = [
        specialty ? ["Specialty", specialty] : null,
        q ? ["Query", q] : null,
        loc ? ["Location", loc] : null,
        ins ? ["Insurance", ins] : null,
      ].filter(Boolean);

      chips.innerHTML = filters
        .map(([k, v]) => `<span class="chip2">${escapeHtml(k)}: ${escapeHtml(v)}</span>`)
        .join("");

      const demoProviders = [
        {
          name: "Dr. Sarah Chen",
          role: specialty || "Dermatologist",
          meta: "4.9 ★ • 1.2k reviews",
          next: "Today 3:30 PM",
        },
        {
          name: "Dr. Miguel Alvarez",
          role: specialty || "Primary Care",
          meta: "4.8 ★ • 980 reviews",
          next: "Tomorrow 9:00 AM",
        },
        {
          name: "Dr. Priya Kapoor",
          role: specialty || "Dentist",
          meta: "4.9 ★ • 760 reviews",
          next: "Today 5:00 PM",
        },
        {
          name: "City Health Clinic",
          role: specialty || "Primary Care",
          meta: "4.7 ★ • 2.4k reviews",
          next: "Next-day available",
        },
      ];

      grid.innerHTML = demoProviders
        .map((p) => {
          const initials = p.name
            .split(" ")
            .slice(0, 2)
            .map((s) => s[0])
            .join("");
          return `
            <div class="provider">
              <div class="avatar" aria-hidden="true">${escapeHtml(initials)}</div>
              <div>
                <div class="p-title">${escapeHtml(p.name)}</div>
                <div class="p-sub">${escapeHtml(p.role)} • ${escapeHtml(p.meta)}</div>
                <div class="p-row">
                  <span class="pill3">Next: ${escapeHtml(p.next)}</span>
                  <span class="pill3">Instant confirmation</span>
                </div>
              </div>
            </div>
          `;
        })
        .join("");
    </script>
  </body>
</html>
