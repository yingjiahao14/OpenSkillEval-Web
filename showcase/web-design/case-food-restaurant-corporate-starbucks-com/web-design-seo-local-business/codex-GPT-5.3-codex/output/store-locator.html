<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Locator | GreenBean Coffee</title>
  <meta name="description" content="Find nearby GreenBean locations with responsive search, filters, and pickup or delivery options.">
  <link rel="canonical" href="https://www.greenbeancoffee.com/store-locator.html">
  <link rel="stylesheet" href="styles.css"><script defer src="app.js"></script>
</head>
<body>
<header class="header"><nav class="nav container"><a href="index.html" class="logo">GreenBean <span>Coffee</span></a><div class="nav-links"><a href="menu.html">Menu</a><a href="rewards.html">Rewards</a><a href="gift.html">Gift Cards</a><a href="store-locator.html" class="active">Find a store</a><a href="#" class="btn btn-primary">Order now</a></div></nav></header>
<main class="section"><div class="container"><h1>Find a GreenBean Near You</h1><p>Search by city or neighborhood and choose pickup or delivery.</p>
<section class="card" style="padding:16px;margin-top:14px;">
  <div class="grid-2">
    <div>
      <label for="storeSearch" class="small">Search location</label>
      <input id="storeSearch" class="input" type="text" placeholder="Enter city or neighborhood">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div style="display:flex;align-items:end;gap:8px;">
      <button class="pill active" data-order-type="pickup">Pickup</button>
      <button class="pill" data-order-type="delivery">Delivery</button>
      <button id="filterToggle" class="btn btn-secondary">Filter</button>
    </div>
  </div>
  <div id="filterPanel" class="filter-panel">
    <label class="small">Open now</label>
    <select><option>Any time</option><option>Open now</option><option>Open late</option></select>
  </div>
</section>
<div class="locator-grid" style="margin-top:16px;">
  <section class="card map"><p id="mapLabel" class="small">Map updates with search results.</p></section>
  <section class="card" id="storeResults" aria-live="polite"></section>
</div>
</div></main>
<footer class="footer"><div class="container"><p class="small">© 2026 GreenBean Coffee</p></div></footer>
</body>
</html>
