<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Locator | GreenBean Coffee</title>
  <meta name="title" content="Store Locator | GreenBean Coffee">
  <meta name="description" content="Find a GreenBean Coffee location near you. Search by city, zip code, or address.">
  <link rel="canonical" href="https://www.greenbeancoffee.com.au/store-locator.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.greenbeancoffee.com.au/store-locator.html">
  <meta property="og:title" content="Store Locator | GreenBean Coffee">
  <meta property="og:description" content="Find a GreenBean Coffee location near you. Search by city, zip code, or address.">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Find a GreenBean Coffee Store",
    "description": "Find a GreenBean Coffee location near you. Search by city, zip code, or address."
  }
  </script>
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">☕ <span>GreenBean</span></a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
        <a href="rewards.html">Rewards</a>
        <a href="gift.html">Gift Cards</a>
        <a href="store-locator.html" class="active">Find a store</a>
      </nav>
      <div class="nav-actions">
        <a href="#" class="btn btn-outline">Sign in</a>
        <a href="#" class="btn btn-primary">Join now</a>
      </div>
      <button class="mobile-menu-btn">☰</button>
    </div>
  </header>

  <main class="locator-layout">
    <div class="locator-sidebar">
      <div class="locator-search">
        <h2 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Find a store</h2>
        <div class="search-controls">
          <input type="text" id="store-search" class="search-input" placeholder="City, zip code, or address" autocomplete="off">
          <button id="filter-btn" class="btn btn-outline" style="padding: 0.75rem;">Filter</button>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-type="pickup">Pickup</button>
          <button class="toggle-btn" data-type="delivery">Delivery</button>
        </div>
      </div>
      <div class="store-list" id="store-results-list">
        <!-- JS populates this -->
      </div>
    </div>
    
    <div class="locator-map">
      <div style="text-align: center; color: var(--text-muted);">
        <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">📍</span>
        <p>Interactive Map View</p>
        <p style="font-size: 0.9rem;">(Google Maps placeholder)</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
