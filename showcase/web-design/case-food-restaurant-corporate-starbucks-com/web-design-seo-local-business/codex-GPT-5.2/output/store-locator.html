<!doctype html>
<html lang="en">
  <head id="seo-head"></head>
  <body>
    <div id="site-nav"></div>
    <main id="main" class="container" tabindex="-1">
      <section class="section">
        <article class="card" style="overflow: visible;">
          <div class="card-inner">
            <h1 style="margin: 0 0 6px; font-family: ui-rounded, 'DM Sans', Inter, system-ui, sans-serif; letter-spacing: -0.03em;">
              Find a store
            </h1>
            <p style="margin: 0;">Search by city, zip code, or address. Use filters and pickup/delivery toggles to refine results.</p>
          </div>
        </article>
      </section>

      <section class="section">
        <div class="locator" data-ui="store-locator">
          <article class="card controls">
            <div class="control-row" aria-label="Order type">
              <div class="pill" style="padding: 6px 10px;">Order type</div>
              <div data-ui="locator-order-toggle" style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-small btn-primary" type="button" data-value="pickup" aria-pressed="true">Pickup</button>
                <button class="btn btn-small btn-ghost" type="button" data-value="delivery" aria-pressed="false">Delivery</button>
              </div>
            </div>

            <div style="margin-top: 12px;">
              <label for="loc" style="font-weight: 800; letter-spacing: -0.01em;">Search</label>
              <input
                id="loc"
                class="input"
                data-ui="locator-input"
                type="text"
                placeholder="Type a city, zip code, or address"
                autocomplete="off"
              />
              <div class="suggestions" data-ui="locator-suggestions" aria-label="Search suggestions"></div>
            </div>

            <div style="margin-top: 12px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <button class="btn" type="button" data-action="locator-filter-toggle" aria-expanded="false">Filter</button>
              <a class="btn btn-primary" href="#">Start an order</a>
            </div>

            <div class="filters" data-ui="locator-filters" aria-label="Filters">
              <label><input type="checkbox" name="driveThru" /> Drive‑thru</label>
              <label><input type="checkbox" name="mobileOrder" /> Mobile ordering</label>
            </div>

            <div style="margin-top: 14px;" class="pill" data-ui="map-label">Showing store pins near your area.</div>
          </article>

          <article class="map" aria-label="Map view">
            <div style="position:absolute; left: 16px; top: 16px;" class="pill">Google Maps (placeholder)</div>
          </article>
        </div>
      </section>

      <section class="section">
        <article class="card results">
          <div class="card-inner" style="padding-bottom: 0;">
            <h2 style="margin: 0 0 6px;">Nearby stores</h2>
            <p style="margin: 0;">Results update as you type, toggle pickup/delivery, or refine filters.</p>
          </div>
          <div class="card-inner" data-ui="locator-results"></div>
        </article>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/shared.js"></script>
    <script>
      const businessName = 'GreenBean Coffee';
      const siteUrl = 'https://www.greenbeancoffee.example';
      const page = {
        title: 'Find a store',
        description:
          'Use the GreenBean store locator to find nearby coffeehouses. Search locations, toggle pickup or delivery, and filter by features like drive‑thru or mobile ordering.',
        canonical: siteUrl + '/store-locator',
      };

      const jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'Restaurant',
        name: businessName,
        '@id': siteUrl + '/#organization',
        url: siteUrl + '/',
        image: siteUrl + '/assets/og-image.jpg',
      };

      document.getElementById('seo-head').innerHTML = buildSeoHead({
        pageTitle: page.title,
        businessName,
        metaDescription: page.description,
        canonicalUrl: page.canonical,
        ogImageUrl: siteUrl + '/assets/og-image.jpg',
        geoRegion: 'US-WA',
        city: 'Seattle',
        latitude: '47.608',
        longitude: '-122.335',
        jsonLd,
      });
      document.getElementById('site-nav').innerHTML = navHtml('store');
      document.getElementById('site-footer').innerHTML = footerHtml();
    </script>
    <script src="assets/site.js"></script>
  </body>
</html>
