<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Store Locator | GreenBean Coffee</title><link rel="stylesheet" href="assets/styles.css"/></head><body>
<header class="topbar"><div class="container nav"><a class="logo" href="index.html"><span class="logo-badge">☕</span> GreenBean Coffee</a><nav class="nav-links"><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="rewards.html">Rewards</a><a href="store-locator.html" class="active">Find a store</a></nav></div></header>
<main class="section"><div class="container locator-layout">
  <section class="card" style="padding:1rem">
    <h1>Find a Store</h1>
    <input id="storeSearch" class="input" placeholder="Search city or ZIP code" aria-label="Search stores"/>
    <div id="searchSuggestions" class="suggestions" aria-label="Suggestions"></div>
    <div style="margin:1rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem">
      <button id="filterBtn" class="btn btn-ghost">Filter</button>
      <div id="orderToggle" class="pill-toggle"><button class="active" data-mode="Pickup">Pickup</button><button data-mode="Delivery">Delivery</button></div>
    </div>
    <div id="filterPanel" class="card" style="padding:.8rem" hidden><label><input type="checkbox" checked/> Open now</label><br/><label><input type="checkbox"/> Drive-thru</label><br/><label><input type="checkbox"/> Mobile order ahead</label></div>
    <h3 id="resultsTitle" style="margin-top:1rem">Showing stores near "Seattle"</h3>
    <div class="card" style="padding:.8rem;margin:.6rem 0"><strong>GreenBean Reserve Capitol Hill</strong><br/><small>0.4 mi · 7:00 AM–8:00 PM · <span id="orderTypeBadge">Pickup</span></small></div>
    <div class="card" style="padding:.8rem;margin:.6rem 0"><strong>GreenBean Fremont</strong><br/><small>1.2 mi · 6:00 AM–7:30 PM · <span>Pickup</span></small></div>
    <div class="card" style="padding:.8rem;margin:.6rem 0"><strong>GreenBean South Lake Union</strong><br/><small>2.1 mi · 6:30 AM–9:00 PM · <span>Delivery</span></small></div>
  </section>
  <section class="card" style="overflow:hidden">
    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=1400&h=1000&fit=crop" alt="Map placeholder for store locations" style="width:100%;height:100%;min-height:620px;object-fit:cover"/>
  </section>
</div></main>
<footer class="footer"><div class="container" style="padding:1rem 0;color:var(--muted)">© 2026 GreenBean Coffee</div></footer>
<script src="assets/app.js"></script></body></html>
