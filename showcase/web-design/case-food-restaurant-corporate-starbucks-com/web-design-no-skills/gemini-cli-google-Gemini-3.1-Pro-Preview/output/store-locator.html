<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenBean Coffee | Store Locator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="height: 100vh; display: flex; flex-direction: column;">

  <header class="global-header">
    <div class="header-left">
      <a href="index.html" class="logo">GreenBean</a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
        <a href="rewards.html">Rewards</a>
        <a href="gift.html">Gift Cards</a>
        <a href="store-locator.html">Find a store</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="account-links">
        <a href="#">Sign in</a>
        <a href="#" class="btn btn-outline">Join now</a>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div class="store-locator-layout">
      
      <!-- Store Sidebar -->
      <aside class="store-sidebar">
        
        <div class="search-controls">
          <div class="search-input-wrapper">
            <input type="text" id="store-search" placeholder="Find a store (e.g. Seattle, WA)">
            <button class="btn btn-outline" style="padding: 10px 15px;" aria-label="Filter">Filter</button>
          </div>
          <div class="order-toggles">
            <label style="cursor: pointer;">
              <input type="radio" name="orderType" value="pickup" checked> Pickup
            </label>
            <label style="cursor: pointer;">
              <input type="radio" name="orderType" value="delivery"> Delivery
            </label>
          </div>
        </div>

        <!-- Search Results -->
        <div id="store-list" class="store-list">
          <p style="color: var(--text-light); text-align: center; margin-top: 20px;">Type a location to see nearby stores.</p>
        </div>

      </aside>

      <!-- Map View -->
      <div class="store-map">
        <div style="text-align: center; color: var(--text-light);">
          <div style="font-size: 3rem; margin-bottom: 10px;">🗺️</div>
          <p>Interactive Map View</p>
          <p style="font-size: 0.85rem;">(Google Maps placeholder)</p>
        </div>
      </div>

    </div>
  </main>

  <footer class="global-footer" style="border-top: none; padding: 20px 40px;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; text-align: center;">
      <p>© 2026 GreenBean Coffee Company. All rights reserved.</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
