<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h1>Log in.</h1>
          <p>Find inspiration and showcase your creative work.</p>
        </div>

        <div class="social-login">
          <button class="social-btn social-btn-facebook">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Log in with Facebook
          </button>

          <button class="social-btn social-btn-apple">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.66-.79-3.31-.79-1.64 0-2.05.79-3.33.79-1.32.02-2.18-1.21-3.04-2.41-1.66-2.28-2.81-5.37-2.81-8.69 0-4.03 2.47-6.53 6.41-6.53 1.76 0 3.22.76 4.34 1.8.93.88 1.66 2.15 1.8 4.01-.03.16-.04.32-.04.48-.01 2.19.59 2.75 2.64 3.22.36.09.69.05.99-.06.19-.06.4-.17.6-.29 1.12-1.13 1.77-2.85 1.77-4.66 0-2.82-1.66-4.83-4.5-4.83-2.84 0-4.66 1.87-4.66 4.77 0 2.27 1.38 4.13 1.38 4.13.93.94 2.59 1.86 3.89 3.4.79.94 1.39 1.99 1.39 3.44 0 2.81-1.97 5.26-5.04 5.26-3.02 0-5.24-2.03-5.24-5.25 0-1.74.71-3.51 1.92-4.69.78-.76 2.17-2.18 2.17-3.42 0-.84-.38-1.41-1.35-2.35-.75-.72-2.19-1.68-3.45-2.68-.95-.75-1.54-1.63-1.54-2.93 0-1.93 1.56-3.73 3.93-3.73 1.32 0 2.53.51 3.47 1.47 1.09 1.12 1.64 2.65 1.64 3.97 0 1.45-.61 2.79-1.64 3.91-.62.67-1.77 1.73-2.54 2.45-.3.28-.34.45-.25.74.14.45.56.94.94 1.45z"/>
            </svg>
            Sign in with Apple
          </button>
        </div>

        <div class="divider">Or log in with email</div>

        <form class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <a href="#" class="forgot-link">Forgot your password?</a>

          <button type="submit" class="login-submit">Log in</button>
        </form>

        <div class="login-footer">
          Don't have an account? <a href="plus.html">Join for Free</a>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
