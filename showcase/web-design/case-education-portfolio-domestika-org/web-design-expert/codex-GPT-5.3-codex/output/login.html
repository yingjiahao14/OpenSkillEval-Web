<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CreativeHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="login">
  <main class="auth-wrap">
    <form class="auth-card">
      <a href="index.html" class="logo">Creative<span>Hub</span></a>
      <h1>Welcome back</h1>
      <label>Email<input type="email" placeholder="you@example.com" required></label>
      <label>Password
        <div class="password-wrap">
          <input id="passwordInput" type="password" placeholder="••••••••" required>
          <button type="button" id="passwordToggle" aria-label="Toggle password">👁</button>
        </div>
      </label>
      <button class="btn btn-primary" type="submit">Log in</button>
      <p class="muted">New here? <a href="plus.html">Try Plus</a></p>
    </form>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
