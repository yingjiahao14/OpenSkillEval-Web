<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreativeHub Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="plus">
  <header class="site-header">
    <a href="index.html" class="logo">Creative<span>Hub</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="projects.html">Projects</a>
      <a href="plus.html" class="active">Plus</a>
      <a href="login.html">Log in</a>
    </nav>
    <a class="btn btn-primary" href="plus.html">Go Plus</a>
  </header>

  <main class="section">
    <h1>CreativeHub Plus</h1>
    <p>Unlock +1,000 courses FREE, weekly new releases, and annual credits.</p>

    <div class="pricing-toggle" id="pricingToggle">
      <button data-billing="yearly" class="active">Yearly</button>
      <button data-billing="monthly">Monthly</button>
    </div>

    <div class="pricing-card" id="pricingCard"></div>

    <section class="section">
      <div class="section-head">
        <h2>Popular Plus Courses</h2>
        <div class="carousel-nav">
          <button class="icon-btn" data-carousel="pluscourses" data-dir="prev">←</button>
          <button class="icon-btn" data-carousel="pluscourses" data-dir="next">→</button>
        </div>
      </div>
      <div class="carousel" data-carousel-track="pluscourses"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Member Stories</h2>
        <div class="carousel-nav">
          <button class="icon-btn" data-carousel="stories" data-dir="prev">←</button>
          <button class="icon-btn" data-carousel="stories" data-dir="next">→</button>
        </div>
      </div>
      <div class="carousel" data-carousel-track="stories"></div>
    </section>

    <section class="section faq">
      <h2>Plus FAQ</h2>
      <div id="faqList"></div>
    </section>
  </main>

  <footer class="site-footer" id="footerAccordion">
    <div class="footer-group" data-footer-group><button class="footer-title">Membership</button><div class="footer-links"><a href="#">Benefits</a><a href="#">Credits</a><a href="#">Certificates</a></div></div>
    <div class="footer-group" data-footer-group><button class="footer-title">Company</button><div class="footer-links"><a href="courses.html">Courses</a><a href="projects.html">Projects</a></div></div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
