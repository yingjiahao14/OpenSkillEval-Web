<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container">
    <header class="header">
      <div class="container header-inner" style="justify-content: center;">
        <a href="index.html" class="logo">Creative<span>Hub</span></a>
      </div>
    </header>

    <main class="login-content">
      <div class="login-card">
        <div style="text-align: center; margin-bottom: 32px;">
          <h1 style="font-size: 2rem; margin-bottom: 8px;">Log in.</h1>
          <p>Find inspiration and showcase your creative work.</p>
        </div>

        <div class="social-login">
          <button class="btn-social">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Log in with Facebook
          </button>
          <button class="btn-social">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.62-1.454 3.608-2.908 1.155-1.705 1.63-3.344 1.644-3.435-.034-.016-3.197-1.226-3.224-4.852-.022-3.037 2.47-4.49 2.585-4.56-1.428-2.09-3.626-2.368-4.41-2.42-1.97-.183-3.866 1.173-4.864 1.173zM14.93 4.144c.854-1.026 1.426-2.457 1.267-3.882-1.225.05-2.716.816-3.593 1.86-.79.914-1.472 2.388-1.291 3.784 1.378.106 2.766-.734 3.617-1.762z"/></svg>
            Sign in with Apple
          </button>
        </div>

        <div class="divider">Or log in with email</div>

        <form action="#" method="POST">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <div class="form-group" style="text-align: right;">
            <a href="#" style="font-size: 0.875rem; color: var(--brand-primary); font-weight: 500;">Forgot your password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; padding: 14px;">Log in</button>
        </form>

        <div style="text-align: center; margin-top: 32px; font-size: 0.95rem;">
          Don't have an account? <a href="plus.html" style="color: var(--brand-primary); font-weight: 600;">Join for Free</a>
        </div>
      </div>
    </main>

    <footer class="footer" style="padding: 40px 0; border-top: 1px solid oklch(30% 0 0);">
      <div class="container text-center" style="font-size: 0.875rem; color: oklch(60% 0 0);">
        &copy; 2026 CreativeHub. All rights reserved.
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
