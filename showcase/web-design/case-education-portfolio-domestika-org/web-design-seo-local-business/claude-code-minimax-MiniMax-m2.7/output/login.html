<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <meta name="description" content="Log in to your CreativeHub account and access thousands of creative courses.">
  <meta property="og:title" content="Log in — CreativeHub">
  <meta property="og:description" content="Access your CreativeHub account and continue learning.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://creativehub.com/login">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F02D00'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial' font-weight='900' font-size='20' fill='white'%3ECH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <a href="index.html" style="display: block; margin-bottom: 24px; text-align: center;">
        <span class="logo" style="font-size: 28px;">Creative<span>Hub</span></span>
      </a>

      <h1 class="login-title">Log in.</h1>
      <p class="login-subtitle">Find inspiration and showcase your creative work.</p>

      <!-- Social Login -->
      <div class="social-login">
        <button class="social-btn facebook" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Log in with Facebook
        </button>
        <button class="social-btn apple" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.54.12 2.83.83 3.44 1.01-1.2 1.38-1.38 3.22-.98 5.01.26 1.18.93 2.44.82 3.39-.12 1.08-.82 1.86-1.93 1.81-1.74-.06-2.78-1.37-3.47-2.82zm-6.92-3.97c.34-1.23 1.52-3.49 2.58-3.49.17 0 .57.1 1.16.58-.91.5-2.08 2.19-1.94 3.72.31.08.61-.18.79-.55-.29-.28-.39-.74-.57-1.26z"/></svg>
          Sign in with Apple
        </button>
      </div>

      <div class="divider">Or</div>

      <!-- Email Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot-link">Forgot your password?</a>

        <button type="submit" class="login-btn">Log in</button>
      </form>

      <p class="login-footer">
        Don't have an account? <a href="plus.html">Join for Free</a>
      </p>
    </div>
  </div>

  <script>
    // Password visibility toggle
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    // Form submission
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Basic validation
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }

      // In a real app, this would send to a backend
      // For demo, just show success
      alert('Login successful! (Demo only - no actual authentication)');

      // Reset form
      document.getElementById('loginForm').reset();
    }
  </script>
</body>
</html>
