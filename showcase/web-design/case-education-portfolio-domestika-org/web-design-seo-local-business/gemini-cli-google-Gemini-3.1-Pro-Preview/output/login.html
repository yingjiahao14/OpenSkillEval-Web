<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | CreativeHub</title>
  <meta name="title" content="Log in | CreativeHub">
  <meta name="description" content="Log in to CreativeHub to find inspiration and showcase your creative work.">
  <link rel="canonical" href="https://www.creativehub.com.au/login.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.creativehub.com.au/login.html">
  <meta property="og:title" content="Log in | CreativeHub">
  <meta property="og:description" content="Log in to CreativeHub to find inspiration and showcase your creative work.">
  <meta property="og:image" content="https://www.creativehub.com.au/og-image.jpg">
  <meta name="geo.region" content="AU-NSW">
  <meta name="geo.placename" content="Pyrmont">
  <meta name="geo.position" content="-33.8688;151.2093">
  <meta name="ICBM" content="-33.8688, 151.2093">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--gray-50);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-container {
      background: var(--light);
      padding: 48px 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .social-btn {
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid var(--gray-300);
      background: var(--light);
      color: var(--dark);
    }
    .social-btn:hover {
      background: var(--gray-50);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--gray-800);
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--gray-200);
    }
    .divider:not(:empty)::before { margin-right: 16px; }
    .divider:not(:empty)::after { margin-left: 16px; }
    
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      font-size: 16px;
      transition: border-color var(--transition);
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .password-wrap {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--gray-800);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="index.html" class="brand-logo" style="display: block; margin-bottom: 32px;">Creative<span>Hub</span></a>
    <h1 class="h2" style="margin-bottom: 8px;">Log in.</h1>
    <p style="color: var(--gray-800); margin-bottom: 32px;">Find inspiration and showcase your creative work.</p>

    <button class="btn social-btn">
      <span style="color: #1877F2; font-size: 20px; font-weight: bold;">f</span> Log in with Facebook
    </button>
    <button class="btn social-btn">
      <span style="font-size: 20px;"></span> Sign in with Apple
    </button>

    <div class="divider">or log in with email</div>

    <form onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="password-input">Password</label>
        <div class="password-wrap">
          <input type="password" id="password-input" class="form-control" placeholder="••••••••" required>
          <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <div class="flex justify-between items-center" style="margin-bottom: 24px; font-size: 14px;">
        <label class="flex items-center gap-2" style="cursor: pointer;">
          <input type="checkbox" style="width: 16px; height: 16px; cursor: pointer;"> Remember me
        </label>
        <a href="#" style="color: var(--primary); font-weight: 600;">Forgot your password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 24px;">Log in</button>

      <div style="font-size: 15px;">
        Don't have an account? <a href="plus.html" style="color: var(--primary); font-weight: 700;">Join for Free</a>
      </div>
    </form>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
