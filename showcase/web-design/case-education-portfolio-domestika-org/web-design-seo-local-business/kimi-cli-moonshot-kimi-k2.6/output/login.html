<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <meta name="title" content="Log in — CreativeHub">
  <meta name="description" content="Log in to CreativeHub to access your courses, projects, and community.">
  <link rel="canonical" href="https://creativehub.com/login">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://creativehub.com/login">
  <meta property="og:title" content="Log in — CreativeHub">
  <meta property="og:description" content="Log in to CreativeHub to access your courses, projects, and community.">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://creativehub.com/login">
  <meta property="twitter:title" content="Log in — CreativeHub">
  <meta property="twitter:description" content="Log in to CreativeHub to access your courses, projects, and community.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23F02D00'/%3E%3Ctext x='50' y='68' font-size='52' fill='white' text-anchor='middle' font-family='system-ui'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-visual">
      <div>
        <span class="badge badge-primary" style="margin-bottom:16px;display:inline-block">CREATIVEHUB</span>
        <h1 class="h1" style="font-size:2.6rem;margin-bottom:12px">Log in.</h1>
        <p style="opacity:0.8;font-size:1.05rem;max-width:420px">Find inspiration and showcase your creative work.</p>
      </div>
    </div>
    <div class="login-form-area">
      <div class="login-box">
        <h2 class="h2" style="margin-bottom:6px">Welcome back</h2>
        <p class="text-muted" style="margin-bottom:22px">Sign in to continue your creative journey.</p>

        <button class="social-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Log in with Facebook
        </button>
        <button class="social-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.22 7.13-.57 1.5-1.31 2.99-2.27 4.08zm-5.85-15.1c.07-2.04 1.76-3.79 3.78-3.94.29 2.32-1.93 4.48-3.78 3.94z"/></svg>
          Sign in with Apple
        </button>

        <div class="divider">or log in with email</div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Enter your password" required>
              <button type="button" class="toggle" id="togglePw" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>
          <div class="flex items-center justify-between mt-3" style="margin-bottom:18px">
            <label class="flex items-center gap-2 text-sm text-muted" style="cursor:pointer">
              <input type="checkbox" style="width:16px;height:16px"> Remember me
            </label>
            <a href="#" class="text-sm" style="color:var(--primary);font-weight:600">Forgot your password?</a>
          </div>
          <button type="submit" class="btn btn-dark" style="width:100%;padding:12px">Log in</button>
        </form>

        <p class="text-center text-muted text-sm mt-4">Don't have an account? <a href="plus.html" style="color:var(--primary);font-weight:700">Join for Free</a></p>
      </div>
    </div>
  </div>

  <script>
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const type = pwInput.type === 'password' ? 'text' : 'password';
      pwInput.type = type;
      togglePw.textContent = type === 'password' ? '👁' : '🙈';
    });

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;
      if (!email || !password) {
        alert('Please enter both email and password.');
        return;
      }
      alert('Logging in... (demo)');
    });
  </script>
</body>
</html>
