<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="logo">Creative<span>Hub</span></a>
        <nav>
          <ul class="nav-links">
            <li><a href="courses.html">Courses</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="plus.html">Plus</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <div class="search-box">
            <i class="ri-search-line"></i>
            <input type="text" placeholder="Search for courses">
          </div>
          <a href="login.html" class="btn btn-outline" style="color: var(--primary); border-color: var(--primary);">Log in</a>
          <a href="plus.html" class="btn btn-primary">Join for Free</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>Log in.</h1>
        <p>Find inspiration and showcase your creative work.</p>
      </div>

      <div class="social-login">
        <button class="social-btn facebook">
          <i class="ri-facebook-circle-fill"></i>
          Log in with Facebook
        </button>
        <button class="social-btn apple">
          <i class="ri-apple-fill"></i>
          Sign in with Apple
        </button>
      </div>

      <div class="divider">Or</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <span class="password-toggle" onclick="togglePassword()">
              <i class="ri-eye-off-line" id="eyeIcon"></i>
            </span>
          </div>
          <a href="#" class="forgot-link">Forgot your password?</a>
        </div>

        <button type="submit" class="login-submit">Log in</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="plus.html">Join for Free</a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('ri-eye-off-line');
        eyeIcon.classList.add('ri-eye-line');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('ri-eye-line');
        eyeIcon.classList.add('ri-eye-off-line');
      }
    }

    // Form submission
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Basic validation
      if (email && password) {
        // In a real app, this would send to a server
        alert('Login functionality would submit credentials to the server.\nEmail: ' + email);
      }
    }
  </script>
</body>
</html>
