<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-page">
    <!-- Visual Side -->
    <div class="login-visual">
      <div class="login-visual-content">
        <a href="index.html" class="logo" style="color:#fff;margin-bottom:40px;display:inline-block;">CreativeHub</a>
        <h2>Log in.</h2>
        <p>Find inspiration and showcase your creative work. Join millions of creatives learning, sharing, and growing together.</p>
      </div>
    </div>

    <!-- Form Side -->
    <div class="login-form-wrap">
      <h1>Log in.</h1>
      <p class="subtitle">Find inspiration and showcase your creative work.</p>

      <div class="social-login">
        <button class="social-btn">
          <i class="ri-facebook-circle-fill" style="color:#1877f2;font-size:1.25rem;"></i>
          Log in with Facebook
        </button>
        <button class="social-btn">
          <i class="ri-apple-fill" style="font-size:1.25rem;"></i>
          Sign in with Apple
        </button>
      </div>

      <div class="divider">Or log in with email</div>

      <form id="login-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>
        <div class="form-actions">
          <label style="display:flex;align-items:center;gap:8px;font-size:0.8125rem;color:#525252;cursor:pointer;">
            <input type="checkbox" style="width:16px;height:16px;"> Remember me
          </label>
          <a href="#">Forgot your password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Log in</button>
      </form>

      <p class="login-footer">
        Don't have an account? <a href="plus.html">Join for Free</a>
      </p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
