<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray">

  <!-- Header (Simplified for Login) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Creative<span>Hub</span></a>
    </div>
  </header>

  <!-- Login Form -->
  <main class="container">
    <div class="login-container" style="background: white;">
      <h1>Log in.</h1>
      <p>Find inspiration and showcase your creative work.</p>

      <div class="social-login">
        <button class="btn-social facebook">Log in with Facebook</button>
        <button class="btn-social apple">Sign in with Apple</button>
      </div>

      <div class="divider">Or log in with email</div>

      <form action="#" method="POST" id="login-form">
        <div class="form-group">
          <label for="email" class="sr-only" style="display:none;">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="form-group">
          <label for="password" class="sr-only" style="display:none;">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <button type="button" class="password-toggle" id="toggle-password">Show</button>
        </div>
        <button type="submit" class="btn btn-primary btn-submit">Log in</button>
      </form>

      <div class="login-links">
        <a href="#">Forgot your password?</a>
        <span style="color: var(--color-gray-600);">Don't have an account? <a href="plus.html" style="display: inline;">Join for Free</a></span>
      </div>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
