<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-page">
    <!-- Login Panel -->
    <div class="login-panel">
      <a href="index.html" class="logo" style="margin-bottom:2rem;font-size:1.75rem;">Creative<span>Hub</span></a>
      <h1>Log in.</h1>
      <p class="subtitle">Find inspiration and showcase your creative work.</p>

      <div class="social-login">
        <button class="social-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Log in with Facebook
        </button>
        <button class="social-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Sign in with Apple
        </button>
      </div>

      <div class="divider">Or log in with email</div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Log in</button>
      </form>

      <div class="form-footer">
        <a href="#">Forgot your password?</a>
      </div>

      <p class="signup-prompt">Don't have an account? <a href="plus.html">Join for Free</a></p>
    </div>

    <!-- Visual Panel -->
    <div class="login-visual">
      <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1200&h=900&fit=crop" alt="Creative workspace">
      <div class="visual-text">
        <h2>The largest creative learning community</h2>
        <p>Join millions of creatives learning from world-class professionals.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }
      // Simulate login
      alert('Login successful! Welcome back to CreativeHub.');
    });
  </script>
</body>
</html>
