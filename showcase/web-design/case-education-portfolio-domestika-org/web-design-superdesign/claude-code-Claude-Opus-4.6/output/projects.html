<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎨</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Creative<span>Hub</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="plus.html">Plus</a>
      </nav>
      <div class="header-actions">
        <button class="search-btn" aria-label="Search courses">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search courses</span>
        </button>
        <a href="login.html" class="btn-login">Log in</a>
        <a href="plus.html" class="btn-join">Join for Free</a>
        <button class="mobile-menu-btn" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="projects-header">
      <h1>Community Projects</h1>
      <p class="section-subtitle">Discover inspiring work from our creative community</p>
    </div>

    <div class="filter-bar" id="projectFilters">
      <select id="sortSelect" aria-label="Sort projects">
        <option value="featured">Featured</option>
        <option value="most-liked">Most liked</option>
        <option value="most-comments">Most comments</option>
        <option value="most-viewed">Most viewed</option>
        <option value="most-recent">Most recent</option>
      </select>
      <select id="timeFilter" aria-label="Filter by time">
        <option value="all">All time</option>
        <option value="week">This week</option>
        <option value="month">This month</option>
        <option value="year">This year</option>
      </select>
      <select id="fieldFilter" aria-label="Filter by creative field">
        <option value="all">All creative fields</option>
        <option value="illustration">Illustration</option>
        <option value="photography">Photography</option>
        <option value="graphic-design">Graphic Design</option>
        <option value="watercolor">Watercolor Painting</option>
        <option value="embroidery">Embroidery</option>
        <option value="2d-animation">2D Animation</option>
        <option value="3d">3D</option>
        <option value="crafts">Crafts</option>
      </select>
    </div>

    <div class="masonry-grid" id="projectsGallery"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span class="copyright">&copy; 2026 CreativeHub. All rights reserved.</span>
        <div class="legal">
          <a href="#">Terms of use</a>
          <a href="#">Privacy Policy</a>
          <a href="#">Cookies Policy</a>
          <a href="#">Accessibility Statement</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
