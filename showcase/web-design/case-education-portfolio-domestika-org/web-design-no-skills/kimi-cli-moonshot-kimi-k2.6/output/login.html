<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .login-visual {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .login-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
    }
    .login-visual-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 48px;
      color: #fff;
    }
    .login-visual-overlay .logo { color: #fff; margin-bottom: 18px; }
    .login-visual-overlay h2 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      max-width: 380px;
    }

    .login-form-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }
    .login-form-box {
      width: 100%;
      max-width: 400px;
    }
    .login-form-box h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .login-form-box .subtitle {
      font-size: 15px;
      color: var(--gray-500);
      margin-bottom: 28px;
    }

    .social-btn {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      border: 1.5px solid var(--gray-300);
      background: #fff;
      transition: all var(--transition);
    }
    .social-btn:hover { background: var(--gray-50); border-color: var(--dark); }
    .social-btn.facebook { background: #1877F2; color: #fff; border-color: #1877F2; }
    .social-btn.facebook:hover { background: #166fe5; }
    .social-btn.apple { background: #000; color: #fff; border-color: #000; }
    .social-btn.apple:hover { background: #222; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: 13px;
      color: var(--gray-400);
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .field-group { margin-bottom: 16px; }
    .field-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--gray-700);
    }
    .field-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition);
    }
    .field-group input:focus { border-color: var(--dark); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .toggle-password:hover { color: var(--dark); background: var(--gray-100); }

    .login-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .login-actions a {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }
    .login-actions a:hover { text-decoration: underline; }

    .btn-full { width: 100%; padding: 12px; font-size: 15px; }

    .signup-prompt {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--gray-500);
    }
    .signup-prompt a {
      font-weight: 700;
      color: var(--dark);
    }

    @media (max-width: 900px) {
      .login-page { grid-template-columns: 1fr; }
      .login-visual { display: none; }
      .login-form-wrap { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-visual">
      <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1200&q=80" alt="">
      <div class="login-visual-overlay">
        <a href="index.html" class="logo"><span class="logo-mark">CH</span>CreativeHub</a>
        <h2>Find inspiration and showcase your creative work.</h2>
      </div>
    </div>
    <div class="login-form-wrap">
      <div class="login-form-box">
        <h1>Log in.</h1>
        <p class="subtitle">Find inspiration and showcase your creative work.</p>

        <button class="social-btn facebook">Log in with Facebook</button>
        <button class="social-btn apple">Sign in with Apple</button>

        <div class="divider">Or log in with email</div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">👁</button>
            </div>
          </div>
          <div class="login-actions">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-600);cursor:pointer;">
              <input type="checkbox" style="width:16px;height:16px;"> Remember me
            </label>
            <a href="#">Forgot your password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Log in</button>
        </form>

        <p class="signup-prompt">Don't have an account? <a href="plus.html">Join for Free</a></p>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      toggleBtn.textContent = isPassword ? '🙈' : '👁';
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    // Form validation
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = pwdInput.value;
      if (!email || !password) {
        alert('Please enter both email and password.');
        return;
      }
      // Simulate success
      alert('Logging in… (demo)');
    });
  </script>
</body>
</html>
