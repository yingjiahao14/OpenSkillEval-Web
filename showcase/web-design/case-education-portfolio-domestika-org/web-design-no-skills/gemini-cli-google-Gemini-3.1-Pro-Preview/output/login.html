<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | CreativeHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-page">
    <div class="login-container">
      <div class="login-form">
        <a href="index.html" class="logo text-primary mb-8" style="display:inline-block">CreativeHub</a>
        
        <h1 class="text-3xl font-bold mb-2">Log in.</h1>
        <p class="text-gray mb-8">Find inspiration and showcase your creative work.</p>
        
        <div class="social-login">
          <button class="btn btn-social" style="width:100%">
            <span style="margin-right:8px; color:#1877F2">f</span> Log in with Facebook
          </button>
          <button class="btn btn-social" style="width:100%">
            <span style="margin-right:8px">🍎</span> Sign in with Apple
          </button>
        </div>
        
        <div class="divider">Or log in with email</div>
        
        <form action="#" method="POST">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>
          
          <div class="flex justify-between items-center mb-6">
            <a href="#" class="text-sm text-primary font-bold">Forgot your password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width:100%">Log in</button>
        </form>
        
        <p class="text-center mt-8">
          Don't have an account? <a href="plus.html" class="text-primary font-bold">Join for Free</a>
        </p>
      </div>
    </div>
    <div class="login-image"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
