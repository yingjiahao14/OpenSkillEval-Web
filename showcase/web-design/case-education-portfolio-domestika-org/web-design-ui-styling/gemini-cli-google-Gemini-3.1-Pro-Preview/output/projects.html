<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - CreativeHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#F02D00', dark: '#171717' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="font-sans text-dark bg-gray-50 antialiased">
  <!-- Main Header -->
  <header class="border-b border-gray-200 sticky top-0 bg-white z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-6">
      <div class="flex items-center gap-8">
        <a href="index.html" class="text-xl font-bold tracking-tight text-brand">CreativeHub</a>
        <nav class="hidden md:flex gap-6 font-medium text-sm">
          <a href="courses.html" class="hover:text-brand transition-colors">Courses</a>
          <a href="projects.html" class="text-brand transition-colors">Projects</a>
          <a href="plus.html" class="hover:text-brand transition-colors">Plus</a>
        </nav>
      </div>
      <div class="flex-1 max-w-md hidden lg:block">
        <div class="relative">
          <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" placeholder="Search for projects" class="w-full bg-gray-100 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a href="login.html" class="text-sm font-medium hover:text-brand transition-colors">Log in</a>
        <a href="plus.html" class="text-sm font-medium bg-dark text-white px-4 py-2 rounded-full hover:bg-gray-800 transition-colors whitespace-nowrap">Join for Free</a>
      </div>
    </div>
  </header>

  <main x-data="{
    activeSort: 'Featured',
    activeTime: 'All time',
    activeField: 'All areas',
    projects: [
      { title: 'The Heart of the Street', author: '@fcleroux', likes: 1, views: 11, height: 'h-64', bg: 'bg-red-200' },
      { title: 'Bird Among the Flowers', author: '@marina_papercuts', likes: 4, views: 70, height: 'h-80', bg: 'bg-blue-200' },
      { title: 'Wonder Woman', author: '@gatol26', likes: 11, views: 252, height: 'h-72', bg: 'bg-yellow-200' },
      { title: 'Floral Shadow Box', author: '@marina_papercuts', likes: 44, views: 232, height: 'h-96', bg: 'bg-green-200' },
      { title: 'HER: The Presence of Absence', author: '@dansdervani_', likes: 7, views: '51.1K', height: 'h-80', badge: 'Winner', bg: 'bg-purple-200' },
      { title: 'Cyberpunk Cityscape', author: '@neon_dreams', likes: 124, views: '1.2K', height: 'h-64', bg: 'bg-pink-200' },
      { title: 'Minimalist Brand Identity', author: '@studio_zero', likes: 89, views: 450, height: 'h-72', bg: 'bg-indigo-200' },
      { title: 'Hand Lettering Quotes', author: '@ink_and_paper', likes: 56, views: 320, height: 'h-80', bg: 'bg-teal-200' }
    ],
    get sortedProjects() {
      // Simple mock sorting based on activeSort
      let sorted = [...this.projects];
      if (this.activeSort === 'Most liked') sorted.sort((a,b) => b.likes - a.likes);
      else if (this.activeSort === 'Most viewed') sorted.sort((a,b) => (typeof b.views === 'number' ? b.views : parseFloat(b.views)*1000) - (typeof a.views === 'number' ? a.views : parseFloat(a.views)*1000));
      return sorted;
    }
  }">
    
    <!-- Hero / Title -->
    <section class="bg-white border-b border-gray-200 py-12">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Community Projects</h1>
        <p class="text-xl text-gray-600 max-w-2xl mx-auto">Get inspired by the amazing work created by our community of millions of creatives.</p>
      </div>
    </section>

    <!-- Filters -->
    <section class="bg-white border-b border-gray-200 sticky top-16 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto hide-scrollbar pb-1">
          <template x-for="sort in ['Featured', 'Most liked', 'Most comments', 'Most viewed', 'Most recent']">
            <button @click="activeSort = sort" :class="{'bg-dark text-white': activeSort === sort, 'bg-gray-100 text-gray-700 hover:bg-gray-200': activeSort !== sort}" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors" x-text="sort"></button>
          </template>
        </div>
        
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
          <select x-model="activeField" class="bg-gray-100 border-none text-sm rounded-full py-1.5 px-4 focus:ring-2 focus:ring-brand outline-none cursor-pointer">
            <option>All areas</option>
            <option>Illustration</option>
            <option>Photography</option>
            <option>Graphic Design</option>
            <option>3D Animation</option>
          </select>
          <select x-model="activeTime" class="bg-gray-100 border-none text-sm rounded-full py-1.5 px-4 focus:ring-2 focus:ring-brand outline-none cursor-pointer">
            <option>All time</option>
            <option>This year</option>
            <option>This month</option>
            <option>This week</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Gallery -->
    <section class="max-w-7xl mx-auto px-4 py-8">
      <div class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-6 space-y-6">
        <template x-for="project in sortedProjects" :key="project.title + activeSort">
          <div class="break-inside-avoid group cursor-pointer relative bg-white rounded-xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col">
            <!-- Image placeholder -->
            <div :class="project.height + ' ' + project.bg" class="w-full relative overflow-hidden">
              <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
              <div x-show="project.badge" class="absolute top-3 left-3 bg-yellow-400 text-dark text-xs font-bold px-2 py-1 rounded shadow-sm" x-text="project.badge"></div>
            </div>
            
            <div class="p-4 flex-1 flex flex-col">
              <h3 class="font-bold text-gray-900 mb-1 group-hover:text-brand transition-colors line-clamp-1" x-text="project.title"></h3>
              <p class="text-sm text-gray-500 mb-4" x-text="project.author"></p>
              <div class="flex justify-between items-center text-gray-400 text-sm mt-auto pt-2 border-t border-gray-100">
                <div class="flex items-center gap-1.5 hover:text-red-500 transition-colors">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                  <span x-text="project.likes"></span>
                </div>
                <div class="flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                  <span x-text="project.views"></span>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Load more -->
      <div class="mt-12 text-center">
        <button class="bg-white border border-gray-300 hover:border-gray-900 text-dark font-medium py-2.5 px-8 rounded-full transition-colors shadow-sm">Load more projects</button>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-gray-300 py-16 border-t border-gray-800">
    <div class="max-w-7xl mx-auto px-4 text-sm text-center">
      <div class="flex flex-wrap justify-center gap-6 mb-6">
        <span class="font-bold text-white">CreativeHub</span>
        <a href="#" class="hover:text-white transition-colors">Courses</a>
        <a href="#" class="hover:text-white transition-colors">Terms of use</a>
        <a href="#" class="hover:text-white transition-colors">Privacy Policy</a>
      </div>
      <p class="text-gray-500">© 2026 CreativeHub. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
