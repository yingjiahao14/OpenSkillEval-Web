<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CreativeHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { red: '#F02D00', dark: '#171717', light: '#F8F8F8' },
            accent: { teal: '#00C9A7', green: '#00E5A0' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md mx-4">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="text-3xl font-black tracking-tight">Creative<span class="text-brand-red">Hub</span></a>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-black mb-2">Log in.</h1>
        <p class="text-gray-500">Find inspiration and showcase your creative work.</p>
      </div>

      <!-- Social Login -->
      <div class="space-y-3 mb-6">
        <button class="w-full flex items-center justify-center gap-3 bg-[#1877F2] text-white font-semibold py-3.5 rounded-full hover:bg-[#166FE5] transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Log in with Facebook
        </button>
        <button class="w-full flex items-center justify-center gap-3 bg-black text-white font-semibold py-3.5 rounded-full hover:bg-gray-800 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Sign in with Apple
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-4 mb-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-gray-400 text-sm">Or</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Email Form -->
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="email">Email</label>
          <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red transition" placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="password">Password</label>
          <div class="relative">
            <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red transition pr-12" placeholder="Enter your password">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
            </button>
          </div>
        </div>
        <div class="text-right">
          <a href="#" class="text-sm text-brand-red hover:underline">Forgot your password?</a>
        </div>
        <button type="submit" class="w-full bg-brand-red text-white font-bold py-3.5 rounded-full hover:bg-red-600 transition">Log in</button>
      </form>

      <!-- Sign up link -->
      <div class="text-center mt-6">
        <p class="text-gray-500 text-sm">Don't have an account? <a href="plus.html" class="text-brand-red font-semibold hover:underline">Join for Free</a></p>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8 text-gray-400 text-sm">
      <a href="#" class="hover:text-gray-600">Terms</a>
      <span class="mx-2">•</span>
      <a href="#" class="hover:text-gray-600">Privacy</a>
      <span class="mx-2">•</span>
      <a href="#" class="hover:text-gray-600">Cookies</a>
    </div>
  </div>

  <script>
    let passwordVisible = false;

    function togglePassword() {
      passwordVisible = !passwordVisible;
      const input = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      if (passwordVisible) {
        input.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        input.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      // In a real app, this would submit to a server
      alert('Login functionality would submit: ' + email);
    }
  </script>
</body>
</html>
