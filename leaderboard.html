<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">OpenSkillEval</a>

    </button>

<main class="container" style="padding-top:100px;padding-bottom:80px">
  <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Home</a>
  <h1 class="page-title">Leaderboard</h1>
  <p class="section-subtitle">Compare model performance across all task categories</p>

  <!-- Mode toggle -->
  <div class="table-controls">
    <button class="toggle active" data-mode="all">All</button>
    <button class="toggle" data-mode="force-using">With Skills</button>
    <button class="toggle" data-mode="no-skill">Without Skills</button>
  </div>

  <div style="overflow-x:auto">
    <table class="leaderboard-table" id="leaderboard">
      <thead><tr id="lb-head"></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>

  <!-- Resource Consumption (Tokens / Cost) -->
  <div class="resource-header">
    <h2 class="page-title" style="margin-top:64px;margin-bottom:0">Resource Consumption</h2>
    <div class="resource-controls" role="tablist" aria-label="Resource view">
      <button class="resource-toggle active" data-resource-mode="tokens" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="9"/><path d="M9 9.5h6M9 12h6M9 14.5h4"/></svg>
        Tokens
      </button>
      <button class="resource-toggle" data-resource-mode="cost" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Cost
      </button>
    </div>
  </div>
  <p class="section-subtitle" id="resource-subtitle" style="max-width:none">Average total tokens per agent (prompt + completion + cache) — one chart per task</p>
  <div id="tokens-charts"></div>
</main>
